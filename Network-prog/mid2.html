  <script>
    const originalDriveLink = "https://drive.google.com/file/d/1_XHo11gsPRwg-tCOWfmAcUSssI_wVN72/view";

    const examSections = [
      {
        title: "Problem I: Multiple Choice Questions [20 points]",
        context: "Select one choice only for each of the following (Answers 1-5, 7-12, 14-16, 18-20 are from the paper's table; 6, 13, and 17 are verified independently):",
        subQuestions: [
          {
            id: "mcq_1",
            type: "single",
            text: "1. For Client and server communicating on the same Ethernet using TCP, the protocol stack within the kernel includes:",
            opts: [
              "A. Application protocol only",
              "B. TCP protocol only",
              "C. IP protocol only",
              "D. TCP and IP protocols",
              "E. Application, TCP, and IP protocols"
            ],
            ans: 3, // D
            dispAnswer: "D. TCP and IP protocols",
            exp: "من جدول الإجابات المعتمد بالورقة (D). بروتوكولات TCP و IP تقع داخل النواة (Kernel)، بينما بروتوكول التطبيق يعمل في فضاء المستخدم (User space).",
            img: ""
          },
          {
            id: "mcq_2",
            type: "single",
            text: "2. Which of the following socket functions when called will cause the TCP client to send SYN segment to TCP server?",
            opts: [
              "A. socket",
              "B. bind",
              "C. connect",
              "D. accept",
              "E. close"
            ],
            ans: 2, // C
            dispAnswer: "C. connect",
            exp: "من جدول الإجابات المعتمد بالورقة (C). استدعاء connect عند العميل يطلق المصافحة الثلاثية بإرسال حزمة SYN.",
            img: ""
          },
          {
            id: "mcq_3",
            type: "single",
            text: "3. The function accept returns successfully when:",
            opts: [
              "A. ACK segment is received from client",
              "B. There is an entry in completed connection queue",
              "C. Three-way handshake is done, and the connection is established",
              "D. All of given choices",
              "E. None of given choices"
            ],
            ans: 3, // D
            dispAnswer: "D. All of given choices",
            exp: "من جدول الإجابات المعتمد بالورقة (D).",
            img: ""
          },
          {
            id: "mcq_4",
            type: "single",
            text: "4. Calling the function: socket (AF_INET6, SOCK_STREAM, 0); and returns successfully will create:",
            opts: [
              "A. TCP socket over IPv4",
              "B. TCP socket over IPv6",
              "C. UDP socket over IPv4",
              "D. UDP socket over IPv6",
              "E. Raw socket"
            ],
            ans: 1, // B
            dispAnswer: "B. TCP socket over IPv6",
            exp: "من جدول الإجابات المعتمد بالورقة (B). AF_INET6 تشير إلى IPv6 و SOCK_STREAM تشير إلى TCP.",
            img: ""
          },
          {
            id: "mcq_5",
            type: "single",
            text: "5. Assume we declare a variable of IPv4 socket address structure as follow:\nstruct sockaddr_in server;\nthe correct statement to pass the variable server as second parameter to the function connect is:",
            opts: [
              "A. (struct sockaddr_in*) &server",
              "B. (struct sockaddr_in *) server",
              "C. (struct sockaddr *) server",
              "D. (struct sockaddr *) &server",
              "E. &server"
            ],
            ans: 3, // D
            dispAnswer: "D. (struct sockaddr *) &server",
            exp: "من جدول الإجابات المعتمد بالورقة (D). تتطلب الدالة مؤشراً للعنوان بعد تحويله إلى النوع العام (struct sockaddr *).",
            img: ""
          },
          {
            id: "mcq_6",
            type: "single",
            text: "6. Assume we declare a variable of IPv4 socket address structure as follow:\nstruct sockaddr_in server;\nThe correct statement to fill IP address given by the first argument in the variable server is:",
            opts: [
              "A. inet_pton (AF_INET, argv[1], &server.sin_addr);",
              "B. inet_pton (AF_INET, argv[1], server.sin_addr);",
              "C. server.sin_addr = inet_pton (AF_INET, argv[1]);",
              "D. sin_addr = inet_pton (AF_INET, argv[1]);",
              "E. inet_pton (AF_INET, argv[1], sin_addr);"
            ],
            ans: 0, // A
            dispAnswer: "A. inet_pton (AF_INET, argv[1], &server.sin_addr);",
            exp: "تم حل السؤال: دالة inet_pton تتطلب مؤشراً لمكان التخزين كمعامل ثالث (void *addrptr)، وهو عنوان sin_addr داخل هيكل server.",
            img: ""
          },
          {
            id: "mcq_7",
            type: "single",
            text: "7. The end that remains in TIME_WAIT state is:",
            opts: [
              "A. The end that initiate the connection",
              "B. The end that initiate the termination",
              "C. The end that performs the passive close",
              "D. The end that performs the passive open",
              "E. The end that transmit the final FIN segment"
            ],
            ans: 1, // B
            dispAnswer: "B. The end that initiate the termination",
            exp: "من جدول الإجابات المعتمد بالورقة (B). الطرف الذي يبدأ الإغلاق (Active close) هو من يدخل حالة TIME_WAIT.",
            img: ""
          },
          {
            id: "mcq_8",
            type: "single",
            text: "8. If the server's response to the client's SYN is a reset (RST), the error returned to client is:",
            opts: [
              "A. EHOSTUNREACH or ENETUNREACH",
              "B. ETIMEDOUT",
              "C. EREUSEADDR",
              "D. EADDRINUSE",
              "E. ECONNREFUSED"
            ],
            ans: 4, // E
            dispAnswer: "E. ECONNREFUSED",
            exp: "من جدول الإجابات المعتمد بالورقة (E). إرجاع RST رداً على SYN يعني رفض الاتصال وإرجاع خطأ Connection refused.",
            img: ""
          },
          {
            id: "mcq_9",
            type: "single",
            text: "9. If a server does not bind, the kernel chooses an ephemeral port # once:",
            opts: [
              "A. First data received from client",
              "B. Listen is called",
              "C. Accept is called",
              "D. The socket is connected",
              "E. Server must bind"
            ],
            ans: 1, // B
            dispAnswer: "B. Listen is called",
            exp: "من جدول الإجابات المعتمد بالورقة (B). إذا لم يقم الخادم بعمل bind، تخصص النواة منفذاً مؤقتاً عند استدعاء listen.",
            img: ""
          },
          {
            id: "mcq_10",
            type: "single",
            text: "10. If the Incomplete connection queue is full and a new SYN is received, TCP server will:",
            opts: [
              "A. Send RST",
              "B. Ignore received SYN",
              "C. Create a new entry on the complete connection queue",
              "D. Send ACK",
              "E. C and D"
            ],
            ans: 1, // B
            dispAnswer: "B. Ignore received SYN",
            exp: "من جدول الإجابات المعتمد بالورقة (B). يتجاهل الخادم حزمة SYN لإتاحة فرصة لإعادة الإرسال عند توفر مساحة.",
            img: ""
          },
          {
            id: "mcq_11",
            type: "single",
            text: "11. If the server code contains the statement:\nlocaladdr.sin_addr.s_addr = htonl (INADDR_ANY);\nThis means:",
            opts: [
              "A. Letting the kernel chooses any IP address on the host when the server binds",
              "B. Letting the kernel chooses any IP address on the network when the server binds",
              "C. Letting the kernel chooses any IP address on the host when the server does not bind",
              "D. Letting the kernel chooses any IP address on the network when the server does not bind",
              "E. The server binds with specific IP address"
            ],
            ans: 0, // A
            dispAnswer: "A. Letting the kernel chooses any IP address on the host when the server binds",
            exp: "من جدول الإجابات المعتمد بالورقة (A). INADDR_ANY تسمح بالربط مع أي واجهة شبكة على الجهاز المضيف.",
            img: ""
          },
          {
            id: "mcq_12",
            type: "single",
            text: "12. Consider the following piece of code:\nlen = sizeof(sockaddr);\ngetsockname (sockfd, (struct sockaddr*) &addr, &len);\nTo print the port# assigned to sockfd, we use:",
            opts: [
              "A. printf (\"port %d\\n\", ntohs(addr.sin_port));",
              "B. printf (\"port %d\\n\", htons(addr.sin_port));",
              "C. printf (\"port %d\\n\", addr.sin_port);",
              "D. printf (\"port %d\\n\", ntohs(sin_port));",
              "E. printf (\"port %d\\n\", htons(sin_port));"
            ],
            ans: 0, // A
            dispAnswer: "A. printf (\"port %d\\n\", ntohs(addr.sin_port));",
            exp: "من جدول الإجابات المعتمد بالورقة (A). المنفذ مخزن بترتيب الشبكة ويجب تحويله إلى ترتيب المضيف باستخدام ntohs.",
            img: ""
          },
          {
            id: "mcq_13",
            type: "single",
            text: "13. Which of the following is true about Socket API?",
            opts: [
              "A. Makes the services of the protocol stack available to the application",
              "B. Uses the services of underlying protocols to transport the user message",
              "C. Makes the services of Internet protocol available to transport protocols",
              "D. Both A and B",
              "E. All of given choices"
            ],
            ans: 3, // D
            dispAnswer: "D. Both A and B",
            exp: "تم حل السؤال: واجهة Socket تربط التطبيق بطبقة النقل (A و B صحيحتان، بينما C غير صحيحة لأن مكدس بروتوكولات النواة يربط النقل بالإنترنت داخلياً).",
            img: ""
          },
          {
            id: "mcq_14",
            type: "single",
            text: `14. Consider the following piece of code from TCP concurrent server:
<pre class="code-block">for(;;){
  len = sizeof(cliaddr);
  s2 = accept (s1, (struct sockaddr *) &cliaddr, &len);
  if ((pid = fork()) == 0) {
    statement#1
    do_task (s2);
    exit(0);
  }
  else {
    statement#2
  }
}</pre>
statement#1 and statement#2 can be replaced correctly and respectively by:`,
            opts: [
              "A. close(s1); and close (s2);",
              "B. close(s2); and close (s1);",
              "C. close(s1); and close (s1);",
              "D. close(s2); and close (s2);",
              "E. All given choices are wrong"
            ],
            ans: 0, // A
            dispAnswer: "A. close(s1); and close (s2);",
            exp: "من جدول الإجابات المعتمد بالورقة (A). يغلق الابن مقبس الاستماع (s1)، بينما يغلق الأب مقبس الاتصال المتصل (s2).",
            img: ""
          },
          {
            id: "mcq_15",
            type: "single",
            text: "15. If parent process wants to prevent all its terminated child processes to become zombies and not to block if there is no terminated child process, the parent should:",
            opts: [
              "A. call wait function inside signal handler for SIGCHLD signal",
              "B. call wait function within a loop inside signal handler for SIGCHLD signal",
              "C. call waitpid function inside signal handler for SIGCHLD signal",
              "D. call waitpid function within a loop inside signal handler for SIGCHLD signal",
              "E. All given choices are true"
            ],
            ans: 3, // D
            dispAnswer: "D. call waitpid function within a loop inside signal handler for SIGCHLD signal",
            exp: "من جدول الإجابات المعتمد بالورقة (D). استخدام waitpid مع WNOHANG داخل حلقة يمنع الحظر وحالات الـ Zombie معاً.",
            img: ""
          },
          {
            id: "mcq_16",
            type: "single",
            text: "16. Kernel sends SIGPIPE signal to process when:",
            opts: [
              "A. A process reads from a socket that has received FIN",
              "B. A process reads from a socket that has received RST",
              "C. A process writes to a socket that has received FIN",
              "D. A process writes to a socket that has received RST",
              "E. All given choices are wrong"
            ],

    let userScores = {};

    function initQuiz() {
      const driveBtn = document.getElementById('drive-link-btn');
      if (driveBtn) {
        if (originalDriveLink && originalDriveLink.trim() !== "") {
          driveBtn.href = originalDriveLink;
          driveBtn.style.display = "inline-flex";
        } else {
          driveBtn.style.display = "none";
        }
      }

      const list = document.getElementById('quiz-list');
      list.innerHTML = '';

      examSections.forEach((section) => {
        const card = document.createElement('div');
        card.className = 'q-card';

        let subQuestionsHtml = '';
        section.subQuestions.forEach((sub) => {
          if (sub.type === "info") {
            subQuestionsHtml += `
              <div class="sub-question-card ltr-content" id="card-${sub.id}">
                ${sub.text}
              </div>
            `;
            return;
          }

          let interactionHtml = '';

          if (sub.type === "single") {
            const optsHtml = sub.opts.map((opt, i) => `
              <div class="option-item" id="opt-${sub.id}-${i}" onclick="selectSingleOption('${sub.id}', ${i})">
                <div class="opt-indicator"></div>
                <div>${opt}</div>
              </div>
            `).join('');

            interactionHtml = `
              <div class="options-container" id="opts-box-${sub.id}">${optsHtml}</div>
              <div class="answer-input-row">
                <button class="btn-reset-q" id="reset-btn-${sub.id}" onclick="resetSubQuestion('${sub.id}')">إعادة السؤال ↻</button>
                <button class="btn-action" onclick="toggleSolution('${sub.id}')">
                  <span>💡</span> عرض الحل
                </button>
              </div>
              <div class="solution-box" id="sol-${sub.id}">
                <div><strong>الإجابة النموذجية:</strong> ${sub.dispAnswer}</div>
                <div style="margin-top: 6px; font-size: 0.9rem; line-height: 1.6;">${sub.exp}</div>
              </div>
            `;
          }

          subQuestionsHtml += `
            <div class="sub-question-card ltr-content" id="card-${sub.id}">
              <div class="sub-q-header">${sub.text}</div>
              ${interactionHtml}
            </div>
          `;
        });

        card.innerHTML = `
          <div class="ltr-content">
            <div class="parent-q-title">${section.title}</div>
            <div class="parent-q-desc">${section.context}</div>
          </div>
          <div class="sub-list">${subQuestionsHtml}</div>
        `;

        list.appendChild(card);
      });

      calculateScore();
    }

    function findSubQuestion(subId) {
      for (const sec of examSections) {
        const found = sec.subQuestions.find(s => s.id === subId);
        if (found) return found;
      }
      return null;
    }

    function selectSingleOption(subId, optIdx) {
      const sub = findSubQuestion(subId);
      const optsBox = document.getElementById(`opts-box-${subId}`);
      const resetBtn = document.getElementById(`reset-btn-${subId}`);
      if (!sub || !optsBox) return;

      optsBox.classList.add('locked');

      const picked = document.getElementById(`opt-${subId}-${optIdx}`);
      if (optIdx === sub.ans) {
        if (picked) picked.classList.add('correct');
        userScores[subId] = true;
      } else {
        if (picked) picked.classList.add('wrong');
        delete userScores[subId];
      }

      if (resetBtn) resetBtn.style.display = 'inline-flex';

      calculateScore();
    }

    function resetSubQuestion(subId) {
      const sub = findSubQuestion(subId);
      if (!sub) return;

      delete userScores[subId];

      const optsBox = document.getElementById(`opts-box-${subId}`);
      if (optsBox) {
        optsBox.classList.remove('locked');
      }

      sub.opts.forEach((_, i) => {
        const el = document.getElementById(`opt-${subId}-${i}`);
        if (el) el.className = 'option-item';
      });

      const resetBtn = document.getElementById(`reset-btn-${subId}`);
      if (resetBtn) resetBtn.style.display = 'none';

      const sol = document.getElementById(`sol-${subId}`);
      if (sol) sol.classList.remove('show');

      calculateScore();
    }

    function calculateScore() {
      let total = 0;
      let score = 0;
      examSections.forEach(sec => {
        sec.subQuestions.forEach(sub => {
          if (sub.type === "single") {
            total++;
            if (userScores[sub.id]) score++;
          }
        });
      });

      const pct = total > 0 ? Math.round((score / total) * 100) : 0;
      const scoreEl = document.getElementById('score');
      if (scoreEl) {
        scoreEl.innerText = `${score} / ${total} (${pct}%)`;
      }
    }

    function toggleSolution(subId) {
      const sol = document.getElementById(`sol-${subId}`);
      if (sol) sol.classList.toggle('show');
    }

    let allShown = false;
    function toggleAllSolutions() {
      allShown = !allShown;
      examSections.forEach(sec => {
        sec.subQuestions.forEach(sub => {
          const sol = document.getElementById(`sol-${sub.id}`);
          if (sol) {
            if (allShown) sol.classList.add('show');
            else sol.classList.remove('show');
          }
        });
      });
    }

    function resetQuiz() {
      userScores = {};
      initQuiz();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    initQuiz();
  </script>
