  <script>
    const originalDriveLink = "https://drive.google.com/file/d/1gMe_HXNMiKQ8qYV7cHbdOYTFAMU7TJ9g/view";

    const examSections = [
      {
        title: "Section 1: Socket API Lifecycle, Setup & Architecture",
        context: "Questions on basic socket creation, address binding, and lifecycle primitives:",
        subQuestions: [
          {
            id: "dr_q1",
            type: "single",
            text: "The first function called when developing a networked application whether a client or a server is:",
            opts: [
              "a. None of the given answers",
              "b. unp.h",
              "c. bind",
              "d. accept",
              "e. socket"
            ],
            ans: 4, // e
            dispAnswer: "e. socket",
            exp: "سواء كان البرنامج خادماً أم عميلاً، أول خطوة برمجية في نظام المقابس هي إنشاء واصف المقبس عبر دالة socket()[cite: 24].",
            img: ""
          },
          {
            id: "dr_q2",
            type: "single",
            text: "A passive open is performed by:",
            opts: [
              "a. None of the given choices",
              "b. A server using socket, bind, listen system calls",
              "c. A client using the socket, connect system calls",
              "d. A client using the socket, bind, connect system calls",
              "e. A server using socket, bind, accept system calls"
            ],
            ans: 1, // b
            dispAnswer: "b. A server using socket, bind, listen system calls",
            exp: "الفتح السلبي (Passive open) خاص بالخادم ويتم باستدعاء listen لتحويل المقبس من Active إلى Passive بانتظار اتصالات العملاء[cite: 24].",
            img: ""
          },
          {
            id: "dr_q3",
            type: "single",
            text: "The system call that generates a SYN packet is:",
            opts: [
              "a. socket",
              "b. listen",
              "c. connect",
              "d. accept",
              "e. bind"
            ],
            ans: 2, // c
            dispAnswer: "c. connect",
            exp: "دالة connect() عند العميل هي المسؤولة عن إرسال حزمة SYN لبدء المصافحة الثلاثية (Three-way handshake)[cite: 24].",
            img: ""
          },
          {
            id: "dr_q4",
            type: "single",
            text: "Which of the following is performed by a listen() function:",
            opts: [
              "a. Converts an unconnected socket into an active socket",
              "b. Assigns a local protocol address to a socket",
              "c. Converts an unconnected socket into a passive socket",
              "d. Returns the next completed connection from the front of the completed connection queue"
            ],
            ans: 2, // c
            dispAnswer: "c. Converts an unconnected socket into a passive socket",
            exp: "وظيفة listen() الأساسية هي تحويل المقبس غير المتصل إلى مقبس استماع سلبي (Passive socket) وتحديد سعة طوابير الانتظار[cite: 24].",
            img: ""
          },
          {
            id: "dr_q5",
            type: "single",
            text: "The normal steps (order) for any TCP server to prepare what we call the listening descriptor:",
            opts: [
              "a. listen, bind, accept",
              "b. socket, bind, and listen",
              "c. bind, socket, and listen",
              "d. socket, accept, and listen"
            ],
            ans: 1, // b
            dispAnswer: "b. socket, bind, and listen",
            exp: "الترتيب القياسي لتحضير مقبس الاستماع في خادم TCP هو: إنشاء المقبس socket()، ثم ربطه bind()، ثم تفعيل الاستماع listen()[cite: 24].",
            img: ""
          },
          {
            id: "dr_q6",
            type: "single",
            text: "Before calling connect() at the server side:",
            opts: [
              "a. You must call bind function",
              "b. None of the given choices is true",
              "c. You must call socket function",
              "d. You must call socket and bind functions"
            ],
            ans: 1, // b
            dispAnswer: "b. None of the given choices is true",
            exp: "الخادم لا يستدعي دالة connect() أصلاً، بل يستدعي accept() لاستقبال الاتصال؛ connect() تستدعى حصراً من جهة العميل[cite: 24].",
            img: ""
          },
          {
            id: "dr_q7",
            type: "single",
            text: "If you start a TCP server without starting the client, then:",
            opts: [
              "a. The server will silently terminate",
              "b. The server will block waiting for the client request",
              "c. You can't start a server before starting the client",
              "d. None of the given choices",
              "e. The server will terminate immediately with an error message"
            ],
            ans: 1, // b
            dispAnswer: "b. The server will block waiting for the client request",
            exp: "الخادم بطبيعته يبدأ أولاً ويدخل في وضع الحظر (Blocking) داخل accept بانتظار اتصال العميل[cite: 24].",
            img: ""
          },
          {
            id: "dr_q8",
            type: "single",
            text: "Which of the following statements is/are FALSE with regard to bind():",
            opts: [
              "a. At the server side, you can specify the IP address and leave it to the kernel to specify the port",
              "b. Must be called at the server side",
              "c. None of the given choices",
              "d. Bind assigns a local protocol address to a socket",
              "e. Calling bind() is optional at the client side"
            ],
            ans: 1, // b
            dispAnswer: "b. Must be called at the server side",
            exp: "العبارة الخاطئة هي b، لأن استدعاء bind ليس إلزامياً إجبارياً على الخادم برمجياً؛ فإذا استدعى الخادم listen() دون bind تقوم النواة باختيار منفذ عشوائي (Ephemeral port)[cite: 24].",
            img: ""
          },
          {
            id: "dr_q9",
            type: "single",
            text: "In a TCP server, the client protocol address is returned by _____ while in normal UDP it is returned by _____:",
            opts: [
              "a. listen(), accept()",
              "b. accept(), recvfrom()",
              "c. listen(), recvfrom()",
              "d. bind(), recvfrom()",
              "e. recvfrom(), accept()"
            ],
            ans: 1, // b
            dispAnswer: "b. accept(), recvfrom()",
            exp: "في TCP تُرجع دالة accept عنوان العميل في وسيط cliaddr، بينما في UDP تُرجع دالة recvfrom عنوان المرسل في وسيط from[cite: 24].",
            img: ""
          },
          {
            id: "dr_q10",
            type: "single",
            text: "What is the correct setup for a client after which you bind to a specific local address and user-selected port? Assume required variables are correctly defined:",
            opts: [
              "a. client.sin_addr.s_addr = htonl(INADDR_ANY); client.sin_port = htons(0);",
              "b. client.sin_addr.s_addr = inet_addr(ip_address); client.sin_port = htons(0);",
              "c. None of the given choices",
              "d. client.sin_addr.s_addr = htonl(INADDR_ANY); client.sin_port = htons(PORT);",
              "e. client.sin_addr.s_addr = inet_addr(ip_address); client.sin_port = htons(PORT);"
            ],
            ans: 4, // e
            dispAnswer: "e. client.sin_addr.s_addr = inet_addr(ip_address); client.sin_port = htons(PORT);",
            exp: "لتحديد عنوان محلي معين (specific address) نستخدم inet_addr(ip_address)، ولتحديد منفذ مخصص (user-selected port) نمرر PORT إلى htons()[cite: 24].",
            img: ""
          },
          {
            id: "dr_q11",
            type: "single",
            text: "One of the following is NOT a valid socket type for the socket() function:",
            opts: [
              "a. SOCK_DGRAM",
              "b. SOCK_STREAM",
              "c. SOCK_RAW",
              "d. SOCK_P"
            ],
            ans: 3, // d
            dispAnswer: "d. SOCK_P",
            exp: "الأنواع القياسية هي SOCK_STREAM و SOCK_DGRAM و SOCK_RAW و SOCK_SEQPACKET. لا يوجد نوع يسمى SOCK_P[cite: 24].",
            img: ""
          },
          {
            id: "dr_q12",
            type: "single",
            text: "Which of the following is a valid socket type for designing a client:",
            opts: [
              "a. SOCK_RAW",
              "b. SOCK_STREAM",
              "c. SOCK_DGRAM and SOCK_STREAM",
              "d. All of the given choices",
              "e. SOCK_DGRAM"
            ],
            ans: 3, // d
            dispAnswer: "d. All of the given choices",
            exp: "يمكن للعميل استخدام مقبس تدفقي SOCK_STREAM (مثل عميل ويب TCP)، أو حزمي SOCK_DGRAM (مثل عميل DNS)، أو مقبس خام SOCK_RAW (مثل برامج ping و traceroute)[cite: 24].",
            img: ""
          }
        ]
      },
      {
        title: "Section 2: Socket Options, Flags & I/O Multiplexing",
        context: "Questions on select(), fcntl, buffer flags, and socket options:",
        subQuestions: [
          {
            id: "dr_q13",
            type: "single",
            text: "The following options are only supported by TCP, except:",
            opts: [
              "a. SO_KEEPALIVE",
              "b. None of the given choices",
              "c. SO_BROADCAST",
              "d. SO_LINGER",
              "e. SO_DEBUG"
            ],
            ans: 2, // c
            dispAnswer: "c. SO_BROADCAST",
            exp: "البث العام (Broadcast) غير مدعوم بتاتاً في بروتوكول TCP؛ خيار SO_BROADCAST مخصص حصراً لمقابس UDP الحزمية[cite: 24].",
            img: ""
          },
          {
            id: "dr_q14",
            type: "single",
            text: "When using select() with nonblocking connect(), and the connection completes successfully:",
            opts: [
              "a. the descriptor becomes readable",
              "b. The descriptor becomes readable and writable",
              "c. The descriptor becomes writable",
              "d. The descriptor becomes readable or writable"
            ],
            ans: 2, // c
            dispAnswer: "c. The descriptor becomes writable",
            exp: "حسب معيار POSIX و Stevens: عند نجاح الاتصال غير المحظور يصبح الواصف قابلاً للكتابة فقط (writable). أما إذا فشل الاتصال، يصبح قابلاً للقراءة والكتابة معاً[cite: 24].",
            img: ""
          },
          {
            id: "dr_q15",
            type: "single",
            text: "If connect() is called for a nonblocking TCP socket, then:",
            opts: [
              "a. The connection might be established immediately if the client and server are on the same host",
              "b. None of the given choices",
              "c. The connection cannot be established immediately in all cases",
              "d. it will always blocks the calling process for at least the RTT to the server",
              "e. connect() cannot be called on a nonblocking TCP socket"
            ],
            ans: 0, // a
            dispAnswer: "a. The connection might be established immediately if the client and server are on the same host",
            exp: "إذا كان العميل والخادم يعملان على نفس الجهاز المضيف (Localhost)، فإن المصافحة قد تكتمل فوراً دون إرجاع خطأ EINPROGRESS[cite: 24].",
            img: ""
          },
          {
            id: "dr_q16",
            type: "single",
            text: "Calling the macro FD_SET(int fd, fd_set *fdset):",
            opts: [
              "a. Clears all bits in fdset",
              "b. Checks whether the bit for fd in fdset is set or not",
              "c. Turns on the bit for fd in fdset",
              "d. Turns off the bit for fd in fdset",
              "e. None of the given choices"
            ],
            ans: 2, // c
            dispAnswer: "c. Turns on the bit for fd in fdset",
            exp: "الماكرو FD_SET يقوم بتفعيل (تشغيل) البت الممثل للواصف fd داخل المجموعة fdset[cite: 24].",
            img: ""
          },
          {
            id: "dr_q17",
            type: "single",
            text: "How come select() says there is data, but read() returns zero?",
            opts: [
              "a. You forget to use the FD_ISSET() macro in your code",
              "b. The other peer has closed the connection",
              "c. This can't happen",
              "d. You are using a non-blocking connect()"
            ],
            ans: 1, // b
            dispAnswer: "b. The other peer has closed the connection",
            exp: "وصول حزمة FIN (إغلاق الطرف الآخر للاتصال) يعتبر حدث قراءة (Read event/EOF)، واستدعاء read() حينها يُرجع 0[cite: 24].",
            img: ""
          },
          {
            id: "dr_q18",
            type: "single",
            text: "Assume you are calling recvfrom() inside a loop to read some server's response and you want to place a timeout on that operation. Which technique is used so that you need only to set it once:",
            opts: [
              "a. Use select with its built-in timeout",
              "b. All of the given choices",
              "c. Use the SO_RCVTIMEO and SO_SNDTIMEO socket options",
              "d. Call alarm() with the required amount of time"
            ],

    let userScores = {};

    function initQuiz() {
      const driveBtn = document.getElementById('drive-link-btn');
      if (driveBtn) {
        if (originalDriveLink && originalDriveLink.trim() !== "") {
          driveBtn.href = originalDriveLink;
          driveBtn.style.display = "inline-flex";
        } else {
          driveBtn.style.display = "none";
        }
      }

      const list = document.getElementById('quiz-list');
      list.innerHTML = '';

      examSections.forEach((section) => {
        const card = document.createElement('div');
        card.className = 'q-card';

        let subQuestionsHtml = '';
        section.subQuestions.forEach((sub) => {
          const optsHtml = sub.opts.map((opt, i) => `
            <div class="option-item" id="opt-${sub.id}-${i}" onclick="selectSingleOption('${sub.id}', ${i})">
              <div class="opt-indicator"></div>
              <div>${opt}</div>
            </div>
          `).join('');

          subQuestionsHtml += `
            <div class="sub-question-card ltr-content" id="card-${sub.id}">
              <div class="sub-q-header">${sub.text}</div>
              <div class="options-container" id="opts-box-${sub.id}">${optsHtml}</div>
              <div class="answer-input-row">
                <button class="btn-reset-q" id="reset-btn-${sub.id}" onclick="resetSubQuestion('${sub.id}')">إعادة السؤال ↻</button>
                <button class="btn-action" onclick="toggleSolution('${sub.id}')">
                  <span>💡</span> عرض الحل
                </button>
              </div>
              <div class="solution-box" id="sol-${sub.id}">
                <div><strong>الإجابة النموذجية:</strong> ${sub.dispAnswer}</div>
                <div style="margin-top: 6px; font-size: 0.9rem; line-height: 1.6;">${sub.exp}</div>
              </div>
            </div>
          `;
        });

        card.innerHTML = `
          <div class="ltr-content">
            <div class="parent-q-title">${section.title}</div>
            <div class="parent-q-desc">${section.context}</div>
          </div>
          <div class="sub-list">${subQuestionsHtml}</div>
        `;

        list.appendChild(card);
      });

      calculateScore();
    }

    function findSubQuestion(subId) {
      for (const sec of examSections) {
        const found = sec.subQuestions.find(s => s.id === subId);
        if (found) return found;
      }
      return null;
    }

    function selectSingleOption(subId, optIdx) {
      const sub = findSubQuestion(subId);
      const optsBox = document.getElementById(`opts-box-${subId}`);
      const resetBtn = document.getElementById(`reset-btn-${subId}`);
      if (!sub || !optsBox) return;

      optsBox.classList.add('locked');

      const picked = document.getElementById(`opt-${subId}-${optIdx}`);
      if (optIdx === sub.ans) {
        if (picked) picked.classList.add('correct');
        userScores[subId] = true;
      } else {
        if (picked) picked.classList.add('wrong');
        delete userScores[subId];
      }

      if (resetBtn) resetBtn.style.display = 'inline-flex';

      calculateScore();
    }

    function resetSubQuestion(subId) {
      const sub = findSubQuestion(subId);
      if (!sub) return;

      delete userScores[subId];

      const optsBox = document.getElementById(`opts-box-${subId}`);
      if (optsBox) {
        optsBox.classList.remove('locked');
      }

      sub.opts.forEach((_, i) => {
        const el = document.getElementById(`opt-${subId}-${i}`);
        if (el) el.className = 'option-item';
      });

      const resetBtn = document.getElementById(`reset-btn-${subId}`);
      if (resetBtn) resetBtn.style.display = 'none';

      const sol = document.getElementById(`sol-${subId}`);
      if (sol) sol.classList.remove('show');

      calculateScore();
    }

    function calculateScore() {
      let total = 0;
      let score = 0;
      examSections.forEach(sec => {
        sec.subQuestions.forEach(sub => {
          total++;
          if (userScores[sub.id]) score++;
        });
      });

      const pct = total > 0 ? Math.round((score / total) * 100) : 0;
      const scoreEl = document.getElementById('score');
      if (scoreEl) {
        scoreEl.innerText = `${score} / ${total} (${pct}%)`;
      }
    }

    function toggleSolution(subId) {
      const sol = document.getElementById(`sol-${subId}`);
      if (sol) sol.classList.toggle('show');
    }

    let allShown = false;
    function toggleAllSolutions() {
      allShown = !allShown;
      examSections.forEach(sec => {
        sec.subQuestions.forEach(sub => {
          const sol = document.getElementById(`sol-${sub.id}`);
          if (sol) {
            if (allShown) sol.classList.add('show');
            else sol.classList.remove('show');
          }
        });
      });
    }

    function resetQuiz() {
      userScores = {};
      initQuiz();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    initQuiz();
  </script>
  <script src="../transition.js"></script>
</body>
</html>
