  <style>
    .bottom-nav-bar {
      display: flex;
      justify-content: center;

      font-size: 0.95rem;

      background: var(--apple-surface-hover);
      border-color: rgba(255, 255, 255, 0.25);

      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);

    .btn-bottom-action:active {
      transform: scale(0.96);

    .ltr-content {

    .parent-q-title {

      color: var(--apple-blue, #0a84ff);
      margin-bottom: 8px;
      border-bottom: 1px dashed var(--apple-border);
      padding-bottom: 8px;
    }
    .parent-q-desc {
      font-size: 0.98rem;
      line-height: 1.7;
      color: var(--text-secondary);
      margin-bottom: 18px;
    }
    .sub-question-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--apple-border);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 18px;
    }
    .sub-q-header {
      font-weight: 700;
      font-size: 1.02rem;
      margin-bottom: 14px;
      color: var(--text-primary);
      line-height: 1.7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .options-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin: 14px 0;
    }
    .options-container.locked {
      pointer-events: none;
    }

    .option-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 16px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--apple-border);
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
      user-select: none;
      font-size: 0.98rem;
    }
    .option-item:hover {
      background: rgba(255, 255, 255, 0.08);
    }
    .option-item.selected {
      border-color: var(--apple-blue);
      background: rgba(10, 132, 255, 0.12);
    }
    .option-item.correct {
      background: rgba(48, 209, 88, 0.18) !important;
      border-color: #30d158 !important;
      color: #fff;
    }
    .option-item.wrong {
      background: rgba(255, 69, 58, 0.18) !important;
      border-color: #ff453a !important;
      color: #fff;
    }
    .opt-letter {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 0.85rem;
      flex-shrink: 0;
      font-family: 'JetBrains Mono', Consolas, monospace;
    }

    .answer-input-row {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    .btn-reset-q {
      display: none;
      background: rgba(255, 69, 58, 0.15);
      color: #ff453a;
      border: 1px solid rgba(255, 69, 58, 0.4);
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.85rem;
      transition: all 0.2s;
    }
    .btn-reset-q:hover {
      background: #ff453a;
      color: #fff;
    }
    .solution-box {
      display: none;
      margin-top: 14px;
      padding: 14px 16px;
      background: rgba(10, 132, 255, 0.08);
      border: 1px solid rgba(10, 132, 255, 0.25);
      border-radius: 10px;
    }
    .solution-box.show {
      display: block;
    }

          <label for="issue-desc">وصف المشكلة <span style="color:var(--apple-red)">*</span></label>

  <script>
    const originalDriveLink = "";

    const letters = ['A', 'B', 'C', 'D', 'E', 'F', 'G'];

    const examSections = [
      {
        title: "Part 1: Conflict Definitions, Synonyms & Academic Views (Questions 1 – 12)",
        context: "Official questions covering definitions of conflict, goal incompatibility, synonyms, and disciplinary classifications (Psychology, Sociology, Political Science):",
        subQuestions: [
          {
            id: "ls_m6_1",
            type: "single",
            text: "1. Conflict is an existing state of ______ between two or more people.",
            opts: ["hostility", "compatibility", "dispute", "harmony", "All of the above", "a & c"],
            ans: 5,
            dispAnswer: "f) a & c",
            exp: "الصراع هو حالة قائمة من العداوة (Hostility) والخلاف/النزاع (Dispute) بين طرفين أو أكثر[cite: 14]."
          },
          {
            id: "ls_m6_2",
            type: "single",
            text: "2. Which of the following is not of the meanings of conflict?",
            opts: [
              "Two or more parties have an accord",
              "Pursuit of incompatible goals",
              "Collision course",
              "Opposition to existing view, stand, or position."
            ],
            ans: 0,
            dispAnswer: "a) Two or more parties have an accord",
            exp: "الاتفاق والتوافق (Accord) يتناقض تماماً مع مفهوم الصراع والنزاع[cite: 14]."
          },
          {
            id: "ls_m6_3",
            type: "single",
            text: "3. Conflict is said to exist when two or more groups engage in a struggle over values and claims to status, power and resources in which the aims of the opponents are to ______ the rivals.",
            opts: ["neutralize", "injure", "eliminate", "All of the above"],
            ans: 3,
            dispAnswer: "d) All of the above",
            exp: "في الصراعات الجماعية، تتنوع أهداف الخصوم بين تحييد المنافس (Neutralize)، أو إلحاق الضرر به (Injure)، أو إقصائه واستبعاده (Eliminate)[cite: 14]."
          },
          {
            id: "ls_m6_4",
            type: "single",
            text: "4. In politics, conflict is more ______ defined.",
            opts: ["implicitly", "explicitly", "externally", "extrinsically"],
            ans: 1,
            dispAnswer: "b) explicitly",
            exp: "يُعرّف الصراع في العلوم السياسية بصورة صريحة ومباشرة وواضحة (Explicitly defined)[cite: 14]."
          },
          {
            id: "ls_m6_5",
            type: "single",
            text: "5. Conflict is a demonstration of cross-purposes of distinct or similar political groups which often ends in political violence, and political violence, when contextualized in the Weberian sense is an ______ weapon to ventilate anger.",
            opts: ["unacceptable", "acceptable", "illogical", "illegal"],
            ans: 1,
            dispAnswer: "b) acceptable",
            exp: "حسب المفهوم الفيبري (Weberian sense)، يُعتبر العنف السياسي وسيلة وأداة مقبولة في سياقها لتفريغ الغضب والتوتر[cite: 14]."
          },
          {
            id: "ls_m6_6",
            type: "single",
            text: "6. Goal incompatibility implies opposing or ______ opposed motives or pursuits.",
            opts: ["symmetrically", "geometrically", "incompletely", "diametrically"],
            ans: 3,
            dispAnswer: "d) diametrically",
            exp: "تعارض الأهداف يعني وجود دوافع وأهداف متعارضة تماماً وبالكلية وبشكل قطري (Diametrically opposed)[cite: 14]."
          },
          {
            id: "ls_m6_7",
            type: "single",
            text: "7. Conflict connotes different perceptions, which ______ result in hostility.",
            opts: ["must normally", "should always", "may not necessarily", "necessarily"],
            ans: 2,
            dispAnswer: "c) may not necessarily",
            exp: "الصراع يعبر عن اختلاف وجهات النظر والتصورات، وهذا الاختلاف ليس بالضرورة أن يؤدي دائماً إلى عداوة صريحة[cite: 14]."
          },
          {
            id: "ls_m6_8",
            type: "single",
            text: "8. Which of the following is a synonym of conflict?",
            opts: ["Accord", "Concord", "Discord", "Chord"],
            ans: 2,
            dispAnswer: "c) Discord",
            exp: "كلمة Discord تعني الخلاف والنزاع والشقاق، وهي مرادف مباشر لكلمة Conflict[cite: 14]."
          },
          {
            id: "ls_m6_9",
            type: "single",
            text: "9. Which of the following is not a synonym of conflict?",
            opts: ["Combat", "Contest", "Contrast", "Contented"],
            ans: 3,
            dispAnswer: "d) Contented",
            exp: "كلمة Contented تعني القناعة والرضا، ولا ترتبط نهائياً بمرادفات الصراع والنزاع[cite: 14]."
          },
          {
            id: "ls_m6_10",
            type: "single",
            text: "10. Psychology as a discipline has espoused on ______ conflict.",
            opts: ["intra-personal", "inter-personal", "intra-group", "inter-group"],
            ans: 0,
            dispAnswer: "a) intra-personal",
            exp: "يركز علم النفس (Psychology) بالدرجة الأولى على الصراع الداخلي داخل الفرد نفسه (Intra-personal conflict)[cite: 14]."
          },
          {
            id: "ls_m6_11",
            type: "single",
            text: "11. Sociology identifies ______ conflicts.",
            opts: [
              "inter-personal",
              "intra-group",
              "intra-unit",
              "inter-group",
              "All of the above",
              "b & c"
            ],
            ans: 4,
            dispAnswer: "e) All of the above",
            exp: "علم الاجتماع يدرس ويحدد الصراعات الاجتماعية بكافة مستوياتها (بين الأفراد، داخل الجماعة، داخل الوحدة، وبين الجماعات)[cite: 14]."
          },
          {
            id: "ls_m6_12",
            type: "single",
            text: "12. Political Science and History have identified ______ conflicts.",
            opts: [
              "inter-ethnic",
              "intra-ethnic",
              "inter-state",
              "international.",
              "All of the above",
              "a & d",
              "b & c"
            ],
            ans: 5,
            dispAnswer: "f) a & d",
            exp: "وفق مفتاح إجابات المساق المعتمد في الملف، تم تحديد الخيار (f: a & d) لتركيز العلوم السياسية والتاريخ على الصراعات العرقية والدولية[cite: 14]."
          }
        ]
      },
      {
        title: "Part 2: Levels of Conflict - Intrapersonal, Interpersonal & Group/State (Questions 13 – 22)",
        context: "Official questions covering internal collapse, micro interpersonal conflict, types of societal conflicts, and intra/inter-state factors:",
        subQuestions: [
          {
            id: "ls_m6_13",
            type: "single",
            text: "13. Intra-personal conflict refers to a state of ______ in an individual shaped by the state of mind.",
            opts: ["displosion", "eclosion", "implosion", "emulsion", "explosion"],
            ans: 2,
            dispAnswer: "c) implosion",
            exp: "الصراع الداخلي يُعدّ حالة من 'الانفجار الداخلي' والانهيار نحو الداخل (Implosion) الناجم عن اضطراب الحالة النفسية[cite: 14]."
          },
          {
            id: "ls_m6_14",
            type: "single",
            text: "14. Anger, depression, confusion, etc. are situations, that may dictate the state of collapsing violently inward (implosion), could in extreme cases lead to ______.",
            opts: ["suicide", "aggression", "erratic behavior", "addiction", "All of the above"],
            ans: 0,
            dispAnswer: "a) suicide",
            exp: "في الحالات القصوى والحرجة، قد يؤدي الانهيار النفسي الداخلي الناتج عن الاكتئاب والغضب الشديد إلى الانتحار (Suicide)[cite: 14]."
          },
          {
            id: "ls_m6_15",
            type: "single",
            text: "15. Inter-personal conflict is what has been described as '______' in the micro sense.",
            opts: ["man against man", "man against self", "man against society", "man against nature"],
            ans: 0,
            dispAnswer: "a) man against man",
            exp: "الصراع بين الأشخاص على المستوى الجزئي المحدود يُوصف بـ 'إنسان ضد إنسان' (Man against man)[cite: 14]."
          },
          {
            id: "ls_m6_16",
            type: "single",
            text: "16. Human trafficking is an example of '______' conflict.",
            opts: ["man against man", "man against self", "man against society", "man against nature"],
            ans: 2,
            dispAnswer: "c) man against society",
            exp: "الاتجار بالبشر وانتهاك القوانين الإنسانية يُمثل صراعاً موجهاً ضد المجتمع ومنظومته الأخلاقية والقانونية[cite: 14]."
          },
          {
            id: "ls_m6_17",
            type: "single",
            text: "17. Desertification is an example of '______' conflict.",
            opts: ["man against man", "man against self", "man against society", "man against nature"],
            ans: 3,
            dispAnswer: "d) man against nature",
            exp: "التصحر والتغير المناخي يُمثلان مواجهة وصراعاً بين الإنسان والبيئة الطبيعية (Man against nature)[cite: 14]."
          },
          {
            id: "ls_m6_18",
            type: "single",
            text: "18. ______ refers to the kind of disagreement or feud that takes place between two or more sectarian or religious groups, ethnic groups, communities, or interest groups.",
            opts: ["Intra-Group conflict", "Inter-Group conflict", "Intra-State conflict", "Global conflict"],
            ans: 1,
            dispAnswer: "b) Inter-Group conflict",
            exp: "الصراع بين المجموعات (Inter-Group) هو النزاع الذي يدور بين طائفتين أو مجموعتين عرقيتين أو دينيتين مختلفتين فأكثر[cite: 14]."
          },
          {
            id: "ls_m6_19",
            type: "single",
            text: "19. ______ as land, uneven development, resource control and revenue-sharing formula could cause a conflict within a state.",
            opts: ["Economic factors", "Social factors", "Socio-ethnic factors", "Political factors"],
            ans: 0,
            dispAnswer: "a) Economic factors",
            exp: "النزاع على الأراضي والموارد الطبيعية وتوزيع الإيرادات والتنمية غير المتوازنة تمثل عوامل اقتصادية (Economic factors)[cite: 14]."
          },
          {
            id: "ls_m6_20",
            type: "single",
            text: "20. ______ such as real or perceived ethnic balancing or ethnic cleansing could also be a factor of intra-state conflict.",
            opts: ["Economic factors", "Social factors", "Socio-ethnic factors", "Political factors"],
            ans: 2,
            dispAnswer: "c) Socio-ethnic factors",
            exp: "التوازن العرقي أو التطهير العرقي والتفرقة العرقية تُعدّ عوامل اجتماعية-عرقية مسببة للنزاعات الداخلية[cite: 14]."
          },
          {
            id: "ls_m6_21",
            type: "single",
            text: "21. ______ such as power-sharing, power equation or zoning formula in public administration, lopsidedness (disequilibrium) in political appointments, quota system and the likes could cause intra-state conflict.",
            opts: ["Economic factors", "Social factors", "Socio-ethnic factors", "Political factors"],
            ans: 3,
            dispAnswer: "d) Political factors",
            exp: "تقاسم السلطة ونظام المحاصصة والخلل في التعيينات والمناصب الإدارية العليا تمثل عوامل سياسية مباشرة للنزاع[cite: 14]."
          },
          {
            id: "ls_m6_22",
            type: "single",
            text: "22. ______ can be caused by territorial encroachment by another state, breakdown of diplomatic ties, exportation of toxic or contrabands to another country, et cetera.",
            opts: ["Intra-state conflict", "Inter-state conflict", "Inter-group conflict", "Intra-group conflict"],
            ans: 1,
            dispAnswer: "b) Inter-state conflict",
            exp: "الصراع بين الدول (Inter-state) ينجم عن التعدي على الحدود الإقليمية، أو قطع العلاقات الدبلوماسية، أو الخلافات الحدودية[cite: 14]."
          }
        ]
      },
      {
        title: "Part 3: Key Benefits of Conflict Resolution & Management (Questions 23 – 29)",
        context: "Official questions on how constructive conflict brings change, builds relationships, opens minds, and stimulates ideas:",
        subQuestions: [
          {
            id: "ls_m6_23",
            type: "single",
            text: "23. 'Conflict can act as a stimulus for new thoughts and new points of view.' Which key benefit of conflict resolution does this statement indicate?",
            opts: [
              "New Ideas emerge out of Conflict",
              "Conflict brings about a change",
              "Conflict Builds Relationships",
              "Conflict Opens Minds",
              "Conflict Beats Competition"
            ],
            ans: 0,
            dispAnswer: "a) New Ideas emerge out of Conflict",
            exp: "الصراع يحفز ظهور وجهات نظر غير مألوفة، مما يؤدي إلى توليد أفكار جديدة وبناءة (New Ideas emerge)[cite: 14]."
          },
          {
            id: "ls_m6_24",
            type: "single",
            text: "24. 'Conflict can force people to ask difficult questions: Questions which have answers that can break deadlocks.' Which key benefit of conflict resolution does this statement indicate?",
            opts: [
              "New Ideas emerge out of Conflict",

    let userScores = {};

    function initQuiz() {
      const driveBtn = document.getElementById('drive-link-btn');
      if (driveBtn) {
        if (originalDriveLink && originalDriveLink.trim() !== "") {
          driveBtn.href = originalDriveLink;
          driveBtn.style.display = "inline-flex";
        } else {
          driveBtn.style.display = "none";
        }
      }

      const list = document.getElementById('quiz-list');
      list.innerHTML = '';

      examSections.forEach((section) => {
        const card = document.createElement('div');
        card.className = 'q-card';

        let subQuestionsHtml = '';
        section.subQuestions.forEach((sub) => {
          const optsHtml = sub.opts.map((opt, i) => `
            <div class="option-item" id="opt-${sub.id}-${i}" onclick="selectSingleOption('${sub.id}', ${i})">
              <div class="opt-letter">${letters[i]}</div>
              <div>${opt}</div>
            </div>
          `).join('');

          const interactionHtml = `
            <div class="options-container" id="opts-box-${sub.id}">${optsHtml}</div>
            <div class="answer-input-row">
              <button class="btn-reset-q" id="reset-btn-${sub.id}" onclick="resetSubQuestion('${sub.id}')">إعادة السؤال ↻</button>
              <button class="btn-action" onclick="toggleSolution('${sub.id}')">
                <span>💡</span> عرض الحل
              </button>
            </div>
          `;

          subQuestionsHtml += `
            <div class="sub-question-card ltr-content" id="card-${sub.id}">
              <div class="sub-q-header">${sub.text}</div>
              ${interactionHtml}
              <div class="solution-box" id="sol-${sub.id}">
                <div><strong>الإجابة الصحيحة (Answer):</strong></div>
                <div style="margin-top: 6px; font-size: 0.98rem; font-weight: bold; line-height: 1.6; color: #5ac8fa; font-family: 'JetBrains Mono', monospace;">${sub.dispAnswer}</div>
                <div style="margin-top: 6px; font-size: 0.90rem; line-height: 1.6; color: var(--text-secondary); direction: rtl; text-align: right;">${sub.exp}</div>
              </div>
            </div>
          `;
        });

        card.innerHTML = `
          <div>
            <div class="parent-q-title">${section.title}</div>
            <div class="parent-q-desc">${section.context}</div>
          </div>
          <div class="sub-list">${subQuestionsHtml}</div>
        `;

        list.appendChild(card);
      });

      calculateScore();
      setupReportModal();
    }

    function findSubQuestion(subId) {
      for (const sec of examSections) {
        const found = sec.subQuestions.find(s => s.id === subId);
        if (found) return found;
      }
      return null;
    }

    function selectSingleOption(subId, optIdx) {
      const sub = findSubQuestion(subId);
      const optsBox = document.getElementById(`opts-box-${subId}`);
      const resetBtn = document.getElementById(`reset-btn-${subId}`);
      if (!sub || !optsBox) return;

      optsBox.classList.add('locked');

      const picked = document.getElementById(`opt-${subId}-${optIdx}`);
      if (optIdx === sub.ans) {
        if (picked) picked.classList.add('correct');
        userScores[subId] = true;
      } else {
        if (picked) picked.classList.add('wrong');
        const correctOpt = document.getElementById(`opt-${subId}-${sub.ans}`);
        if (correctOpt) correctOpt.classList.add('correct');
        delete userScores[subId];
      }

      if (resetBtn) resetBtn.style.display = 'inline-flex';
      calculateScore();
    }

    function resetSubQuestion(subId) {
      delete userScores[subId];

      const optsBox = document.getElementById(`opts-box-${subId}`);
      if (optsBox) optsBox.classList.remove('locked');

      const sub = findSubQuestion(subId);
      if (sub && sub.opts) {
        sub.opts.forEach((_, i) => {
          const el = document.getElementById(`opt-${subId}-${i}`);
          if (el) el.className = 'option-item';
        });
      }

      const resetBtn = document.getElementById(`reset-btn-${subId}`);
      const sol = document.getElementById(`sol-${subId}`);

      if (resetBtn) resetBtn.style.display = 'none';
      if (sol) sol.classList.remove('show');

      calculateScore();
    }

    function calculateScore() {
      let total = 0;
      let score = 0;
      examSections.forEach(sec => {
        sec.subQuestions.forEach(sub => {
          total++;
          if (userScores[sub.id]) score++;
        });
      });

      const pct = total > 0 ? Math.round((score / total) * 100) : 0;
      const scoreEl = document.getElementById('score');
      if (scoreEl) {
        scoreEl.innerText = `${score} / ${total} (${pct}%)`;
      }
    }

    function toggleSolution(subId) {
      const sol = document.getElementById(`sol-${subId}`);
      if (sol) sol.classList.toggle('show');
    }

    let allShown = false;
    function toggleAllSolutions() {
      allShown = !allShown;
      examSections.forEach(sec => {
        sec.subQuestions.forEach(sub => {
          const sol = document.getElementById(`sol-${sub.id}`);
          if (sol) {
            if (allShown) sol.classList.add('show');
            else sol.classList.remove('show');
          }
        });
      });
    }

    function resetQuiz() {
      userScores = {};
      initQuiz();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function setupReportModal() {
      const openBtn = document.getElementById('openReportBtn');
      const closeBtn = document.getElementById('closeReportBtn');
      const overlay = document.getElementById('reportOverlay');
      const form = document.getElementById('bugReportForm');
      const status = document.getElementById('reportStatus');

      if (!openBtn || !overlay) return;

      openBtn.onclick = () => {
        overlay.classList.add('active');
        overlay.setAttribute('aria-hidden', 'false');
      };

      const closeModal = () => {
        overlay.classList.remove('active');
        overlay.setAttribute('aria-hidden', 'true');
        if (status) status.innerText = '';
      };

      if (closeBtn) closeBtn.onclick = closeModal;

      overlay.onclick = (e) => {
        if (e.target === overlay) closeModal();
      };

      if (form) {
        form.onsubmit = (e) => {
          e.preventDefault();
          const submitBtn = document.getElementById('submitReportBtn');
          if (submitBtn) submitBtn.disabled = true;
          if (status) {
            status.style.color = '#30d158';
            status.innerText = 'تم إرسال البلاغ بنجاح، شكراً لمساعدتك!';
          }
          setTimeout(() => {
            closeModal();
            form.reset();
            if (submitBtn) submitBtn.disabled = false;
          }, 1500);
        };
      }
    }

    initQuiz();
  </script>
