  <style>
    .bottom-nav-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      margin-top: 36px;
      padding-top: 24px;
      border-top: 1px solid var(--apple-border);
    }
    .btn-bottom-action {
      background: var(--apple-surface);
      border: 1px solid var(--apple-border-strong);
      color: var(--text-primary);
      padding: 12px 26px;
      border-radius: 99px;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.95rem;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      backdrop-filter: blur(20px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      transition: all 0.25s var(--ease-apple);
    }
    .btn-bottom-action:hover {
      background: var(--apple-surface-hover);
      border-color: rgba(255, 255, 255, 0.25);
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
    }
    .btn-bottom-action:active {
      transform: scale(0.96);
    }
    .btn-drive-action {
      background: linear-gradient(135deg, rgba(10, 132, 255, 0.15) 0%, rgba(48, 209, 88, 0.15) 100%);
      border-color: rgba(10, 132, 255, 0.4);
      color: #5ac8fa;
    }
    .btn-drive-action:hover {
      background: var(--apple-blue);
      color: #ffffff;
      border-color: var(--apple-blue);
    }

    .parent-q-title {
      font-size: 1.18rem;
      font-weight: 800;
      color: var(--apple-blue, #0a84ff);
      margin-bottom: 8px;
      border-bottom: 1px dashed var(--apple-border);
      padding-bottom: 8px;
    }
    .parent-q-desc {
      font-size: 0.98rem;
      line-height: 1.7;
      color: var(--text-secondary);
      margin-bottom: 18px;
    }
    .sub-question-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--apple-border);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 18px;
      text-align: right;
      direction: rtl;
    }
    .sub-q-header {
      font-weight: 700;
      font-size: 1.02rem;
      margin-bottom: 14px;
      color: var(--text-primary);
      line-height: 1.7;
    }

    .options-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin: 14px 0;
    }
    .options-container.locked {
      pointer-events: none;
    }

    .option-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 16px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--apple-border);
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
      user-select: none;
      font-size: 0.98rem;
    }
    .option-item:hover {
      background: rgba(255, 255, 255, 0.08);
    }
    .option-item.selected {
      border-color: var(--apple-blue);
      background: rgba(10, 132, 255, 0.12);
    }
    .option-item.correct {
      background: rgba(48, 209, 88, 0.18) !important;
      border-color: #30d158 !important;
      color: #fff;
    }
    .option-item.wrong {
      background: rgba(255, 69, 58, 0.18) !important;
      border-color: #ff453a !important;
      color: #fff;
    }
    .opt-letter {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 0.85rem;
      flex-shrink: 0;
    }

    .answer-input-row {
      display: الحرية-flex;
      gap: 10px;
      align-items: center;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    .btn-reset-q {
      display: none;
      background: rgba(255, 69, 58, 0.15);
      color: #ff453a;
      border: 1px solid rgba(255, 69, 58, 0.4);
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.85rem;
      transition: all 0.2s;
    }
    .btn-reset-q:hover {
      background: #ff453a;
      color: #fff;
    }
    .solution-box {
      display: none;
      margin-top: 14px;
      padding: 14px 16px;
      background: rgba(10, 132, 255, 0.08);
      border: 1px solid rgba(10, 132, 255, 0.25);
      border-radius: 10px;
    }
    .solution-box.show {
      display: block;
    }
  </style>
</head>

  <!-- نافذة التبليغ المنبثقة -->
  <div class="report-modal-overlay" id="reportOverlay" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="report-modal">
      <div class="report-modal-header">
        <h3>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          إبلاغ عن خطأ أو ملاحظة
        </h3>
        <button class="btn-close-modal" id="closeReportBtn" aria-label="إغلاق">✕</button>
      </div>

      <form class="report-form" id="bugReportForm">
        <div class="form-group">
          <label for="issue-type">نوع المشكلة</label>
          <select id="issue-type" required>
            <option value="سؤال أو إجابة خاطئة">خطأ في سؤال أو إجابة</option>
            <option value="خلل في التصميم أو الموقع">مشكلة في عرض الصفحة أو الموقع</option>
            <option value="اقتراح أو أخرى">اقتراح / أخرى</option>
          </select>
        </div>

        <div class="form-group">
          <label for="issue-desc">وصف المشكلة <span style="color:var(--apple-red)">*</span></label>
          <textarea id="issue-desc" placeholder="حدد السؤال أو المشكلة بالتفصيل..." required></textarea>
        </div>

        <div class="form-group">
          <label for="user-contact">وسيلة تواصل (اختياري)</label>
          <input type="text" id="user-contact" placeholder="إيميلك أو حسابك للمتابعة">
        </div>

        <button type="submit" class="btn-submit-report" id="submitReportBtn">إرسال البلاغ</button>
        <div class="report-status" id="reportStatus"></div>
      </form>
    </div>
  </div>

  <script>
    const originalDriveLink = "";

    const letters = ['أ', 'ب', 'ج', 'د'];

    const examSections = [
      {
        title: "الجزء الأول: أسئلة سنوات الميد الرسمية والشاملة (الأسئلة 1 – 47)",
        context: "أسئلة سنوات الميد السابقة وتغطي نشأة الدولة الأردنية، حرب 1948، المعاهدات، الدستور، والمبادرات الملكية:",
        subQuestions: [
          {
            id: "nat_mid_1",
            type: "single",
            text: "1) الجيش الذي حافظ في حرب سنة 1948م على الأرض التي دافع عنها، وهي الضفة الغربية والقدس الشرقية هو:",
            opts: ["العربي الأردني", "العراقي", "السوري واللبناني", "المصري"],
            ans: 0,
            dispAnswer: "أ) العربي الأردني",
            exp: "استطاع الجيش العربي الأردني بفضل بسالة وحداته حماية البوابات الشرقية للقدس وما تبقى من الضفة الغربية[cite: 24]."
          },
          {
            id: "nat_mid_2",
            type: "single",
            text: "2) تم إلغاء قانون الأحكام العرفية، وقانون الأحزاب السياسية 1992م، وقانون حديث للمطبوعات والنشر 1993م في عهد مجلس النواب:",
            opts: ["التاسع", "الع العاشر", "الحادي عشر", "الثاني عشر"],
            ans: 2,
            dispAnswer: "ج) الحادي عشر",
            exp: "شهد مجلس النواب الحادي عشر (1989م) عودة الحياة الديمقراطية وإلغاء الأحكام العرفية وإقرار قوانين الحريات[cite: 24]."
          },
          {
            id: "nat_mid_3",
            type: "single",
            text: "3) صدر دستور المملكة الأردنية الهاشمية الذي أقر أن نظام الحكم نيابي ملكي وراثي في عهد الملك:",
            opts: ["الملك الحسين بن طلال", "الملك عبدالله الأول", "الملك عبد الله الثاني", "الملك طلال بن عبدالله"],
            ans: 3,
            dispAnswer: "د) الملك طلال بن عبدالله",
            exp: "أُنجز وصدر الدستور الأردني المتقدم عام 1952م في عهد الملك طلال بن عبدالله رحمه الله[cite: 24]."
          },
          {
            id: "nat_mid_4",
            type: "single",
            text: "4) جرت الاتفاقية الأردنية - البريطانية الأولى في القدس عام:",
            opts: ["1924", "1926", "1928", "1946"],
            ans: 2,
            dispAnswer: "ج) 1928",
            exp: "وُقّعت المعاهدة الأولى في 20 شباط 1928م في مدينة القدس[cite: 24]."
          },
          {
            id: "nat_mid_5",
            type: "single",
            text: "5) عُقد المؤتمر الوطني الأردني (الأول ، الثاني) في:",
            opts: ["(عمان ، القدس)", "(القدس ، عمان)", "(عمان ، عمان)", "(القدس ، القدس)"],
            ans: 2,
            dispAnswer: "ج) (عمان ، عمان)",
            exp: "عُقد المؤتمر الوطني الأردني الأول والثاني في العاصمة عمان لمناقشة المعاهدة ورفض شروط الانتداب[cite: 24]."
          },
          {
            id: "nat_mid_6",
            type: "single",
            text: "6) كان من أبرز بنود الاتفاقية الأردنية البريطانية 1928م تنازل حكومة الانتداب عن السلطتين التشريعية والتنفيذية إلى الأمير.",
            opts: ["صح", "خطأ"],
            ans: 1,
            dispAnswer: "ب) خطأ",
            exp: "العبارة خاطئة؛ فالصلاحيات العليا والمالية والعسكرية بقيت مقيدة بسلطة المندوب السامي وبريطانيا، وهو ما رفضه المؤتمر الوطني[cite: 24]."
          },
          {
            id: "nat_mid_7",
            type: "single",
            text: "7) جاء تأسيس إمارة شرقي الأردن على يد:",
            opts: ["الشريف الحسين بن علي", "الأمير عبدالله الأول بن الحسين", "الأمير فيصل بن الحسين", "الملك طلال بن عبدالله"],
            ans: 1,
            dispAnswer: "ب) الأمير عبدالله الأول بن الحسين",
            exp: "أسס الأمير عبد الله الأول إمارة الشرق العربي عام 1921م[cite: 24]."
          },
          {
            id: "nat_mid_8",
            type: "single",
            text: "8) وُقّعت الاتفاقية الأردنية – البريطانية التي تضمنت اعترافاً دولياً بالكيان السياسي الأردني بتاريخ 20 شباط 1928م في مدينة:",
            opts: ["عمان", "القدس", "السلط", "إربد"],
            ans: 1,
            dispAnswer: "ب) القدس",
            exp: "موقع توقيع المعاهدة الأولى كان في مدينة القدس[cite: 24]."
          },
          {
            id: "nat_mid_9",
            type: "single",
            text: "9) حكومة عجلون مركزها مدينة عجلون برئاسة علي خلقي الشرايري:",
            opts: ["صح", "خطأ"],
            ans: 0,
            dispAnswer: "أ) صح",
            exp: "تشكلت حكومة عجلون المحلية في شمال الأردن برئاسة الزعيم الوطني علي خلقي الشرايري[cite: 24]."
          },
          {
            id: "nat_mid_10",
            type: "single",
            text: "10) وقعت معركة ميسلون في 24 تموز 1920م، وهي معركة غير متكافئة بكل المعايير، وانتهت باحتلال الفرنسيين لمدينة:",
            opts: ["دمشق", "بغداد", "عمان", "القدس"],
            ans: 0,
            dispAnswer: "أ) دمشق",
            exp: "انتهت معركة ميسلون بسقوط دمشق بيد القوات الفرنسية وسقوط الحكومة الفيصلية[cite: 24]."
          },
          {
            id: "nat_mid_11",
            type: "single",
            text: "11) أُسهمت (الأوراق النقاشية) لجلالة الملك والتي نُشرت بدءاً من عام 2012م في توفير إطار فكري للنقاشات الوطنية، وقد هدفت بشكل رئيسي إلى:",
            opts: [
              "إلغاء الحكومات البرلمانية وتعديل المواد الدستورية",
              "الاستغناء عن التعليم السياسي والتعلم الديمقراطي",
              "توسيع النقاش الوطني حول الإصلاح الشامل، والوصول إلى ديمقراطية أردنية متجددة وحيوية",
              "تقييد المشاركة الشعبية واقتصارها على المجالس البلدية"
            ],
            ans: 2,
            dispAnswer: "ج) توسيع النقاش الوطني حول الإصلاح الشامل، والوصول إلى ديمقراطية أردنية متجددة وحيوية",
            exp: "الأوراق النقاشية خارطة طريق ملكية لتعميق التحول الديمقراطي والمشاركة الشعبية الفاعلة[cite: 24]."
          },
          {
            id: "nat_mid_12",
            type: "single",
            text: "12) أطلق جلالة الملك عبدالله الثاني مبادرة (كلنا الأردن) في عام 2006م بهدف:",
            opts: [
              "تأسيس منظور وطني شامل يستند إلى رؤى مشتركة بين مكونات المجتمع عبر مشاركة واسعة وفاعلة",
              "إلغاء العمل بالدستور وتشكيل حكومة جديدة",
              "اقتصار الحركة السياسية على الفئات البرلمانية دون مكونات المجتمع",
              "تشكيل حكومات حزبية مطلقة بمعزل عن مظلة الملكية الدستورية"
            ],
            ans: 0,
            dispAnswer: "أ) تأسيس منظور وطني شامل يستند إلى رؤى مشتركة بين مكونات المجتمع عبر مشاركة واسعة وفاعلة",
            exp: "مبادرة 'كلنا الأردن' أُطلقت لتوحيد الرؤى الوطنية وتعزيز مشاركة الشباب في الشأن العام[cite: 24]."
          },
          {
            id: "nat_mid_13",
            type: "single",
            text: "13) عيّن الأمير عبد الله، رشيد طليع رئيساً لمجلس المشاورين عام 1921م، وكان أعضاء الحكومة من:",
            opts: [
              "الضباط البريطانيين والمستشارين المقيمين",
              "أعضاء مجلس عصبة الأمم",
              "القيادات العثمانية السابقة فقط",
              "حزب الاستقلال السوري، والحجاز، وفلسطين، وشرقي الأردن."
            ],
            ans: 3,
            dispAnswer: "د) حزب الاستقلال السوري، والحجاز، وفلسطين، وشرقي الأردن.",
            exp: "تميزت الحكومة الأولى بتشكيلتها القومية العربية الشاملة التي ضمت نخبة من أحرار العرب (سوريا، الحجاز، فلسطين، والأردن)[cite: 24]."
          },
          {
            id: "nat_mid_14",
            type: "single",
            text: "14) من القيم السياسية والثقافية للدولة الأردنية:",
            opts: ["الوسطية الإسلامية", "الاعتدال السياسي", "التسامح", "جميع ما ذكر صحيح"],
            ans: 3,
            dispAnswer: "د) جميع ما ذكر صحيح",
            exp: "منظومة القيم الأردنية تقوم على الوسطية، الاعتدال، والتسامح والتعايش[cite: 24]."
          },
          {
            id: "nat_mid_15",
            type: "single",
            text: "15) تم قبول الأردن عضواً في هيئة الأمم المتحدة في عهد جلالة المغفور له الملك:",
            opts: ["المؤسس عبدالله الأول بن الحسين", "الحسين بن طلال", "طلال بن عبدالله", "لا شيء مما ذكر"],
            ans: 0,
            dispAnswer: "أ) المؤسس عبدالله الأول بن الحسين",
            exp: "انضم الأردن لهيئة الأمم المتحدة والدول العربية المؤسسة لجامعة الدول العربية في عهد الملك المؤسس عبد الله الأول[cite: 24]."
          },
          {
            id: "nat_mid_16",
            type: "single",
            text: "16) فرنسا هي الدولة التي أنهت حكومة الملك فيصل بن الحسين رحمه الله تعالى في سوريا باحتلالها لدمشق سنة 1920م:",
            opts: ["صح", "خطأ"],
            ans: 0,
            dispAnswer: "أ) صح",
            exp: "احتلت القوات الفرنسية دمشق عام 1920م وأسقطت حكومة المملكة العربية السورية[cite: 24]."
          },
          {
            id: "nat_mid_17",
            type: "single",
            text: "17) أول مدينة أردنية وصل إليها الأمير عبد الله بن الحسين رحمه الله تعالى عام 1920م هي:",
            opts: ["معان", "الكرك", "وادي موسى", "العقبة"],
            ans: 0,
            dispAnswer: "أ) معان",
            exp: "وصل الأمير عبد الله الأول إلى معان في تشرين الثاني 1920م قادماً من الحجاز تلبية لنداء أحرار العرب[cite: 24]."
          },
          {
            id: "nat_mid_18",
            type: "single",
            text: "18) أول صدام عسكري للقوة الإسلامية الفتية خارج الجزيرة العربية كان في الأردن في معركة:",
            opts: ["اليرموك", "حطين", "القادسية", "مؤتة"],

    let userScores = {};

    function initQuiz() {
      const driveBtn = document.getElementById('drive-link-btn');
      if (driveBtn) {
        if (originalDriveLink && originalDriveLink.trim() !== "") {
          driveBtn.href = originalDriveLink;
          driveBtn.style.display = "inline-flex";
        } else {
          driveBtn.style.display = "none";
        }
      }

      const list = document.getElementById('quiz-list');
      list.innerHTML = '';

      examSections.forEach((section) => {
        const card = document.createElement('div');
        card.className = 'q-card';

        let subQuestionsHtml = '';
        section.subQuestions.forEach((sub) => {
          const optsHtml = sub.opts.map((opt, i) => `
            <div class="option-item" id="opt-${sub.id}-${i}" onclick="selectSingleOption('${sub.id}', ${i})">
              <div class="opt-letter">${letters[i]}</div>
              <div>${opt}</div>
            </div>
          `).join('');

          const interactionHtml = `
            <div class="options-container" id="opts-box-${sub.id}">${optsHtml}</div>
            <div class="answer-input-row">
              <button class="btn-reset-q" id="reset-btn-${sub.id}" onclick="resetSubQuestion('${sub.id}')">إعادة السؤال ↻</button>
              <button class="btn-action" onclick="toggleSolution('${sub.id}')">
                <span>💡</span> عرض الحل
              </button>
            </div>
          `;

          subQuestionsHtml += `
            <div class="sub-question-card" id="card-${sub.id}">
              <div class="sub-q-header">${sub.text}</div>
              ${interactionHtml}
              <div class="solution-box" id="sol-${sub.id}">
                <div><strong>الإجابة الصحيحة:</strong></div>
                <div style="margin-top: 6px; font-size: 0.98rem; font-weight: bold; line-height: 1.6; color: #5ac8fa;">${sub.dispAnswer}</div>
                <div style="margin-top: 6px; font-size: 0.90rem; line-height: 1.6; color: var(--text-secondary);">${sub.exp}</div>
              </div>
            </div>
          `;
        });

        card.innerHTML = `
          <div>
            <div class="parent-q-title">${section.title}</div>
            <div class="parent-q-desc">${section.context}</div>
          </div>
          <div class="sub-list">${subQuestionsHtml}</div>
        `;

        list.appendChild(card);
      });

      calculateScore();
      setupReportModal();
    }

    function findSubQuestion(subId) {
      for (const sec of examSections) {
        const found = sec.subQuestions.find(s => s.id === subId);
        if (found) return found;
      }
      return null;
    }

    function selectSingleOption(subId, optIdx) {
      const sub = findSubQuestion(subId);
      const optsBox = document.getElementById(`opts-box-${subId}`);
      const resetBtn = document.getElementById(`reset-btn-${subId}`);
      if (!sub || !optsBox) return;

      optsBox.classList.add('locked');

      const picked = document.getElementById(`opt-${subId}-${optIdx}`);
      if (optIdx === sub.ans) {
        if (picked) picked.classList.add('correct');
        userScores[subId] = true;
      } else {
        if (picked) picked.classList.add('wrong');
        const correctOpt = document.getElementById(`opt-${subId}-${sub.ans}`);
        if (correctOpt) correctOpt.classList.add('correct');
        delete userScores[subId];
      }

      if (resetBtn) resetBtn.style.display = 'inline-flex';
      calculateScore();
    }

    function resetSubQuestion(subId) {
      delete userScores[subId];

      const optsBox = document.getElementById(`opts-box-${subId}`);
      if (optsBox) optsBox.classList.remove('locked');

      const sub = findSubQuestion(subId);
      if (sub && sub.opts) {
        sub.opts.forEach((_, i) => {
          const el = document.getElementById(`opt-${subId}-${i}`);
          if (el) el.className = 'option-item';
        });
      }

      const resetBtn = document.getElementById(`reset-btn-${subId}`);
      const sol = document.getElementById(`sol-${subId}`);

      if (resetBtn) resetBtn.style.display = 'none';
      if (sol) sol.classList.remove('show');

      calculateScore();
    }

    function calculateScore() {
      let total = 0;
      let score = 0;
      examSections.forEach(sec => {
        sec.subQuestions.forEach(sub => {
          total++;
          if (userScores[sub.id]) score++;
        });
      });

      const pct = total > 0 ? Math.round((score / total) * 100) : 0;
      const scoreEl = document.getElementById('score');
      if (scoreEl) {
        scoreEl.innerText = `${score} / ${total} (${pct}%)`;
      }
    }

    function toggleSolution(subId) {
      const sol = document.getElementById(`sol-${subId}`);
      if (sol) sol.classList.toggle('show');
    }

    let allShown = false;
    function toggleAllSolutions() {
      allShown = !allShown;
      examSections.forEach(sec => {
        sec.subQuestions.forEach(sub => {
          const sol = document.getElementById(`sol-${sub.id}`);
          if (sol) {
            if (allShown) sol.classList.add('show');
            else sol.classList.remove('show');
          }
        });
      });
    }

    function resetQuiz() {
      userScores = {};
      initQuiz();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function setupReportModal() {
      const openBtn = document.getElementById('openReportBtn');
      const closeBtn = document.getElementById('closeReportBtn');
      const overlay = document.getElementById('reportOverlay');
      const form = document.getElementById('bugReportForm');
      const status = document.getElementById('reportStatus');

      if (!openBtn || !overlay) return;

      openBtn.onclick = () => {
        overlay.classList.add('active');
        overlay.setAttribute('aria-hidden', 'false');
      };

      const closeModal = () => {
        overlay.classList.remove('active');
        overlay.setAttribute('aria-hidden', 'true');
        if (status) status.innerText = '';
      };

      if (closeBtn) closeBtn.onclick = closeModal;

      overlay.onclick = (e) => {
        if (e.target === overlay) closeModal();
      };

      if (form) {
        form.onsubmit = (e) => {
          e.preventDefault();
          const submitBtn = document.getElementById('submitReportBtn');
          if (submitBtn) submitBtn.disabled = true;
          if (status) {
            status.style.color = '#30d158';
            status.innerText = 'تم إرسال البلاغ بنجاح، شكراً لمساعدتك!';
          }
          setTimeout(() => {
            closeModal();
            form.reset();
            if (submitBtn) submitBtn.disabled = false;
          }, 1500);
        };
      }
    }

    initQuiz();
  </script>
  <script src="../transition.js"></script>
</body>
