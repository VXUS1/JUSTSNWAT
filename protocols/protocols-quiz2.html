  <script>
    // رابط مجلد Drive الأصلي (اتركه فارغاً "" ليختفي الزر تلقائياً)
    const originalDriveLink = "https://drive.google.com/drive/folders/1EaylCO1Bd_KsybZVFBj80mJcRIBgYvWR";

    // مصفوفة الأسئلة
const questionsData = [
      {
        id: 1,
        img: "",
        q: "If the URG bit in the TCP header is 1,",
        opts: [
          "None of the given choices",
          "The URG pointer defines the end of the urgent data.",
          "The urgent data is inserted at the beginning of the TCP segment.",
          "Both of the given choices"
        ],
        ans: 3,
        exp: "تفعيل بت URG يعني وجود بيانات عاجلة توضع في بداية القطعة، ويشير مؤشر الـ URG Pointer إلى نهاية هذه البيانات العاجلة (Both of the given choices)."
      },
      {
        id: 2,
        img: "",
        q: "In group-shared tree multicast routing,",
        opts: [
          "None of the given choices.",
          "Each router has one shortest path tree for each group.",
          "One router has one shortest path tree for all groups.",
          "Each router has a table represents one shortest path tree."
        ],
        ans: 0,
        exp: "في Group-shared tree تُبنى شجرة واحدة مركزية متمركزة حول الـ Core/Rendezvous Router لكل مجموعة، ولا يملك كل راوتر شجرة مسار أقصر خاصة به لكل مجموعة (None of the given choices)."
      },
      {
        id: 3,
        img: "",
        q: "In DNS, if UDP is used and the size of the response message is more than 512 bytes,",
        opts: [
          "The server opens a TCP connection.",
          "None of the given choices.",
          "The server truncates the message.",
          "The server sends the message."
        ],
        ans: 2,
        exp: "عندما يتجاوز رد DNS عبر UDP حجم 512 بايت، يقوم السيرفر بقطع الرسالة (Truncate) ورفع علم TC Flag لإشعار العميل بإعادة الطلب عبر TCP."
      },
      {
        id: 4,
        img: "",
        q: "Which field in the IGMP header defines the maximum waiting time before sending a membership report in response to an IGMP query?",
        opts: [
          "QQIC",
          "QRV",
          "None of the given choices",
          "Response Code"
        ],
        ans: 3,
        exp: "حقل Max Response Time / Response Code هو المسؤول عن تحديد أقصى مهلة زمنية عشوائية ينتظرها الجهاز قبل إرسال تقرير العضوية."
      },
      {
        id: 5,
        img: "",
        q: "In IGMP, when a host receives a general query message:",
        opts: [
          "None of the given choices",
          "The host sends a report about each multicast group it has joined.",
          "The host discards the query if another host replies.",
          "The host sends a report about specific multicast groups that it is still interested in."
        ],
        ans: 1,
        exp: "عند تلقي استعلام عام (General Query)، يُلزم المضيف بالرد بتقرير عضوية عن كل مجموعة بث متعدد مسجل ومنضم إليها."
      },
      {
        id: 6,
        img: "",
        q: "Assume a router sent an IGMP query message that has a non-zero value in the Number of Sources field. This means that:",
        opts: [
          "The router probes each neighbor to report if it is still interested in specific multicast group.",
          "The router probes each neighbor to report if it is interested in any multicast group.",
          "The router probes each neighbor to report if it is still interested in receiving packets from specific multicast group, coming from any of the specified sources.",
          "None of the given choices"
        ],
        ans: 2,
        exp: "وجود قيمة غير صفرية في حقل Number of Sources يعني أن الاستعلام هو Group-and-Source-Specific Query لمعرفة رغبة الأجهزة باستقبال البث من مصادر محددة."
      },
      {
        id: 7,
        img: "",
        q: "Which of the following statements about multicast routing is true?\n1. Multicasting starts with one single packet from the source that is duplicated by the routers.\n2. Only one single copy of the multicast packet travels between any two routers.",
        opts: [
          "The two given statements are false.",
          "Multicasting starts with one single packet from the source that is duplicated by the routers.",
          "Only one single copy of the multicast packet travels between any two routers.",
          "The two given statements are true."
        ],
        ans: 0,
        exp: "وفقاً لنموذج حل الامتحان فالخيار المعتمد هو (The two given statements are false)، علماً بأنه نظرياً في شبكات البث المتعدد تُرسل حزمة واحدة ويتم تفريعها ولا تسير أكثر من نسخة بين أي راوترين."
      },
      {
        id: 8,
        img: "",
        q: "In IP classless routing,",
        opts: [
          "None of the given choices",
          "The routing table contains a supernet mask that has more 1s than the default mask.",
          "The routing table is stored from the shortest mask to the longest mask.",
          "The routing table is stored from the longest mask to the shortest mask."
        ],
        ans: 3,
        exp: "في التوجيه غير الفئوي (CIDR)، يُرتب جدول التوجيه من القناع الأطول إلى الأقصر (Longest Prefix Match أولاً)."
      },
      {
        id: 9,
        img: "",
        q: "Which of the following statements about the TCP protocol is true?",
        opts: [
          "The two given statements are false.",
          "A TCP host can still send data after receiving a FIN segment.",
          "The two given statements are true.",
          "A TCP host can still send data after receiving a zero-window-size advertisement."
        ],
        ans: 1,
        exp: "استقبال قطعة FIN يعني إغلاق قناة الاستقبال من الطرف الآخر فقط (Half-close)، ويظل بإمكان المضيف إرسال بيانات إضافية طالما لم يرسل FIN الخاصة به."
      },
      {
        id: 10,
        img: "",
        q: "A host has three processes: S1, S2, and S3.\n- S1 is a member of G1, and likes to receive from only {A, B, C}.\n- S2 is a member of G2, and likes to receive from all except {C, D, F}.\n- S3 is a member of G1, and likes to receive from all except {B, D, E}.\nWhat is the filter type and the list of source addresses that the host will send in the group record of G1?",
        opts: [
          "Exclude; D and E",
          "Include; A, B, C, D, and E",
          "Exclude; D",
          "None of the given choices"
        ],
        ans: 0,
        exp: "للمجموعة G1: العملية S3 تستثني {B, D, E} والعملية S1 تطلب {A, B, C}. بما أن S1 تريد B، يُحذف B من قائمة استثناءات المضيف، ويتبقى الاستثناء فقط لـ {D, E} بنمط Exclude."
      },
      {
        id: 11,
        img: "",
        q: "Consider the topology: N1 --- R1 --- R2 --- N2 --- R3 --- N3. R1 connected to N1 and R2. R2 connected to R1 and N2. R3 connected to N2 and N3. Assume all routers use OSPF and R3 is DR for N2. Router R2 will advertise a router link LSA with links of type:",
        opts: [
          "stub and transient",
          "only point-to-point",
          "point-to-point and transient",
          "point-to-point and stub"
        ],
        ans: 2,
        exp: "الوصلة بين R1 و R2 هي وصلة ثنائية (Point-to-Point)، والشبكة N2 شبكة متعددة الوصول بها DR فتعتبر وصلة عابرة (Transient)."
      },
      {
        id: 12,
        img: "",
        q: "A TCP host has a congestion window of 6000 bytes and a receive window of 7000 bytes. The host has sent 2500 bytes that have not been acknowledged. How many more bytes can be sent?",
        opts: [
          "2500",
          "4500",
          "3500",
          "None of the given choices"
        ],
        ans: 2,
        exp: "النافذة الفعلية = min(6000, 7000) = 6000 بايت. المتبقي للإرسال = 6000 - 2500 = 3500 بايت."
      },
      {
        id: 13,
        img: "",
        q: "A TCP FIN+ACK segment carrying the last chunk of data consumes ______ sequence number(s).",
        opts: [
          "two",
          "no",
          "one",
          "None of the given choices"
        ],
        ans: 2,
        exp: "بت الـ FIN يستهلك دائماً رقم تسلسلي واحد مستقل (One sequence number)، بالإضافة إلى أرقام بايتات البيانات إن وجدت."
      },
      {
        id: 14,
        img: "",
        q: "A TCP host has received bytes 1000-3999 in order. Assume that the host received out-of-order bytes 4500-4999 and 5500-5999, and duplicate bytes 3500-3999. Determine the blocks of the SACK option to be sent by the host.",
        opts: [
          "First block = 3500-4000; Second block = 4500-6000",
          "First block = 4500-5000; Second block = 5500-6000",
          "First block = 3500-4000; Second block = 4500-5000; Third block = 5500-6000",
          "None of the given choices"
        ],
        ans: 2,
        exp: "يحدد خيار SACK الكتل غير المرتبة بالإضافة للكتلة المكررة (D-SACK في البداية 3500-4000)، متبوعة بالكتل غير المتتالية 4500-5000 و 5500-6000."
      },
      {
        id: 15,
        img: "",
        q: "In BGP, the ______ message is used by the router to withdraw destinations and/or announce a route to new destinations.",
        opts: [
          "Notification",
          "Keepalive",
          "Open",
          "Update"
        ],
        ans: 3,
        exp: "رسالة Update في BGP هي الرسالة المخصصة للإعلان عن مسارات جديدة أو سحب مسارات غير صالحة."
      },
      {
        id: 16,
        img: "",
        q: "A router running the RIP protocol has a routing table with 10 entries. It does not receive information about three routes for 200 seconds. How many garbage collection timers are needed to handle this table?",
        opts: [
          "3",
          "1",
          "7",
          "10"
        ],
        ans: 0,
        exp: "بعد مرور 180 ثانية تنتهي صلاحية المسارات الثلاثة وتدخل طور الإلغاء، فيُخصص مؤقت جمع مهملات واحد لكل مسار ملغى (3 مؤقتات)."
      },
      {
        id: 17,
        img: "",
        q: "A TCP send window holds bytes 351 to 1350. The next byte to be sent is 751. Assume that an ACK segment with window size advertisement 800 and acknowledgment number 651 is received. Determine the byte number of the first byte, last byte, and next byte to be sent in the window.",
        opts: [
          "None of the given choices",
          "851; 1650; 951",
          "751; 1550; 851",
          "651; 1450; 751"
        ],
        ans: 3,
        exp: "بداية النافذة = رقم الإقرار = 651. نهاية النافذة = 651 + 800 - 1 = 1450. والبايت التالي للإرسال يظل كما هو 751."
      },
      {
        id: 18,
        img: "",
        q: "In TCP, connection reset occurs when:",
        opts: [
          "Aborting an established connection by sending a RST segment.",
          "None of the given choices",
          "Both of the given choices",
          "Denying a connection request by sending a RST+ACK segment as a reply to a SYN segment."
        ],
        ans: 2,
        exp: "يحدث الـ Reset إما لرفض طلب اتصال قادم عبر SYN، أو لإلغاء اتصال قائم فجأة عند حدوث خطأ جسيم (Both of the given choices)."
      },
      {
        id: 19,
        img: "",
        q: "Assume that a UDP process has started and is granted port number 50142. Which of the following fields in the UDP control-block table will be updated by the control-block module at this stage?",
        opts: [
          "Port number and Queue number.",
          "Process ID and Port number.",
          "Process ID, Port number, and Queue number.",
          "Process ID and Queue number."
        ],
        ans: 1,
        exp: "عند بدء تشغيل العملية، تقوم وحدة control-block module بتسجيل معرف العملية Process ID ورقم المنفذ Port number، ويبقى رقم الطابور فارغاً."
      },
      {
        id: 20,
        img: "",
        q: "The checksum in TCP is:",
        opts: [
          "Optional and its calculation considers the TCP header and pseudoheader.",
          "Optional and its calculation considers only the TCP header.",
          "Mandatory and its calculation considers the TCP header and pseudoheader.",
          "Mandatory and its calculation considers only the TCP header."
        ],
        ans: 2,
        exp: "حساب الـ Checksum في TCP إلزامي دائماً ويشمل ترويسة TCP والترويسة الزائفة (Pseudoheader) وحمولة البيانات."
      },
      {
        id: 21,
        img: "",
        q: "In reverse path multicasting, the router sends a ______ message to the upstream router to ______ sending the multicast packets.",
        opts: [
          "graft; resume",
          "None of the given choices",
          "graft; stop",
          "prune; resume"
        ],
        ans: 0,
        exp: "رسالة الـ Graft تُرسل لاستئناف استقبال حزم البث المتعدد (Resume) بعد أن كانت مقصوصة بـ Prune."
      },
      {
        id: 22,
        img: "",
        q: "Which of the following statements about the BGP routing protocol is true?\n1. A BGP router can have E-BGP session and I-BGP session at the same time.\n2. A BGP router uses the AS_PATH attribute to prevent routing loops.",
        opts: [
          "The two given statements are false.",
          "The two given statements are true.",
          "A BGP router can have E-BGP session and I-BGP session at the same time.",
          "A BGP router uses the AS_PATH attribute to prevent routing loops."
        ],
        ans: 1,
        exp: "كلا العبارتين صحيحتان؛ يمكن للراوتر الربط داخلياً وخارجياً في نفس الوقت، وخاصية AS_PATH تُستخدم لمنع اللوب."
      },
      {
        id: 23,
        img: "",
        q: "In RIP, the router shares its routing table with:",
        opts: [
          "Every router in the autonomous system.",
          "One of its neighbors.",
          "None of the given choices",
          "Its immediate neighbors."
        ],
        ans: 3,
        exp: "في بروتوكول RIP، يتبادل الراوتر جدول التوجيه فقط مع جيرانه المباشرين (Immediate neighbors)."
      },
      {
        id: 24,
        img: "",
        q: "A TCP client opens a connection using initial sequence number 4363, sends two segments with payload 1000 bytes each, and closes the connection. What is the sequence number in the second data segment sent by the client?",
        opts: [
          "5364",
          "6364",
          "6363",
          "5363"
        ],
        ans: 0,
        exp: "قطعة SYN تستهلك رقماً (4363). البيانات الأولى تبدأ من 4364 وتأخذ 1000 بايت حتى 5363. القطعة الثانية تبدأ بالرقم 5364."
      },
      {
        id: 25,
        img: "",
        q: "For the IP multicast address 228.150.32.8, what is the corresponding Ethernet multicast address?",
        opts: [
          "01-00-5E-16-20-08",
          "None of the given choices",
          "01-00-5E-96-20-08",
          "01-00-5E-150-32-08"
        ],
        ans: 0,
        exp: "150 بالباينري = 10010110، آخر 7 بتات مع الصفر تعطي 00010110 = 16 بالهيكسا. و 32 = 20، و 8 = 08. العنوان الناتج: 01-00-5E-16-20-08."
      },
      {
        id: 26,
        img: "",
        q: "A system has 10 multicast groups and 20 routers running the DVMRP protocol. How many multicast trees are formed?",
        opts: [
          "200",
          "1",
          "10",
          "20"
        ],
        ans: 0,
        exp: "يعتمد بروتوكول DVMRP على Source-Based Tree؛ إذا افترضنا أن كل راوتر يمكن أن يكون مصدراً لكل مجموعة، فإن عدد الأشجار = 10 × 20 = 200 شجرة."
      },
      {
        id: 27,
        img: "",
        q: "A TCP host receives an acknowledgment with window size of 32750 and window scale factor of 3. What is the window size (in bytes) that the host can use?",
        opts: [
          "98250",
          "294750",
          "None of the given choices",
          "262000"

        exp: "طول الترويسة المخصص للخيارات = 27 بايت. نطرح 3 بايتات للترويسة الخاصة بالخيار يتبقى 24 بايت. بما أن عنوان كل راوتر IPv4 يأخذ 4 بايت: 24 ÷ 4 = 6 راوترات."

    const letters = ['A', 'B', 'C', 'D', 'E'];
    let userAnswers = {};

    function initQuiz() {
      // فحص زر رابط ملف الدرايف الأصلي
      const driveBtn = document.getElementById('drive-link-btn');
      if (driveBtn) {
        if (originalDriveLink && originalDriveLink.trim() !== "") {
          driveBtn.href = originalDriveLink;
          driveBtn.style.display = "inline-flex";
        } else {
          driveBtn.style.display = "none";
        }
      }

      const list = document.getElementById('quiz-list');
      list.innerHTML = '';

      const totalQuestions = questionsData.length;

      const subtitleEl = document.getElementById('quiz-subtitle');
      if (subtitleEl && totalQuestions > 0) {
        subtitleEl.innerText = `Final Exam — ${totalQuestions} Questions`;
      }

      questionsData.forEach((q) => {
        const card = document.createElement('div');
        card.className = 'q-card';
        card.id = `q-${q.id}`;

        const optionsHtml = q.opts.map((opt, i) => `
          <div class="option-item" id="opt-${q.id}-${i}" onclick="chooseAnswer(${q.id}, ${i})">
            <div class="opt-letter">${letters[i]}</div>
            <div>${opt}</div>
          </div>
        `).join('');

        const hasImage = q.img && q.img.trim() !== "";
        
        const imageContainerHtml = hasImage ? `
          <div class="q-image-container" id="img-box-${q.id}">
            <img class="q-original-img" 
                 id="img-${q.id}"
                 data-src="${q.img}" 
                 alt="Original Question ${q.id}"
                 onerror="handleImageFallback(this)" />
          </div>
        ` : '';

        const imageButtonHtml = hasImage ? `
          <button class="btn-action" onclick="toggleOriginalImage(${q.id})">
            <span>📷</span> عرض صورة السؤال الأصلية
          </button>
        ` : '';

        card.innerHTML = `
          <div class="q-top">
            <span class="q-badge">Question ${q.id} / ${totalQuestions}</span>
          </div>
          <div class="q-text">${q.q}</div>

          ${imageContainerHtml}

          <div class="options-list" id="opts-container-${q.id}">${optionsHtml}</div>
          
          <div class="q-actions">
            ${imageButtonHtml}
            <button class="btn-action" onclick="toggleSolution(${q.id})">
              <span>💡</span> عرض الحل والشرح
            </button>
            <button class="btn-reset-q" id="reset-btn-${q.id}" onclick="resetSingleQuestion(${q.id})">
              إعادة السؤال ↻
            </button>
          </div>

          <div class="solution-box" id="sol-${q.id}">
            <div><strong>الإجابة الصحيحة: (${letters[q.ans]})</strong></div>
            <div style="margin-top: 6px;">${q.exp}</div>
          </div>
        `;
        list.appendChild(card);
      });

      calculateScore();
    }

    function toggleOriginalImage(qid) {
      const imgBox = document.getElementById(`img-box-${qid}`);
      const imgEl = document.getElementById(`img-${qid}`);

      if (imgEl && !imgEl.src && imgEl.dataset.src) {
        imgEl.src = imgEl.dataset.src;
      }

      if (imgBox) {
        imgBox.classList.toggle('show');
      }
    }

    function handleImageFallback(imgEl) {
      if (!imgEl.dataset.retried) {
        imgEl.dataset.retried = "1";
        if (imgEl.src.endsWith('.jpg')) {
          imgEl.src = imgEl.src.replace('.jpg', '.png');
        } else if (imgEl.src.endsWith('.png')) {
          imgEl.src = imgEl.src.replace('.png', '.jpg');
        }
      }
    }

    function chooseAnswer(qid, optIndex) {
      const q = questionsData.find(item => item.id === qid);
      const optsContainer = document.getElementById(`opts-container-${qid}`);

      q.opts.forEach((_, i) => {
        const el = document.getElementById(`opt-${qid}-${i}`);
        if (el) el.className = 'option-item';
      });

      const picked = document.getElementById(`opt-${qid}-${optIndex}`);
      
      if (optIndex === q.ans) {
        userAnswers[qid] = optIndex;
        if (picked) picked.classList.add('correct');
      } else {
        delete userAnswers[qid];
        if (picked) picked.classList.add('wrong');
      }

      if (optsContainer) optsContainer.classList.add('locked');

      const resetBtn = document.getElementById(`reset-btn-${qid}`);
      if (resetBtn) {
        resetBtn.style.display = 'inline-flex';
      }

      calculateScore();
    }

    function resetSingleQuestion(qid) {
      delete userAnswers[qid];

      const q = questionsData.find(item => item.id === qid);
      const optsContainer = document.getElementById(`opts-container-${qid}`);
      
      if (optsContainer) {
        optsContainer.classList.remove('locked');
      }

      if (q) {
        q.opts.forEach((_, i) => {
          const el = document.getElementById(`opt-${qid}-${i}`);
          if (el) el.className = 'option-item';
        });
      }

      const resetBtn = document.getElementById(`reset-btn-${qid}`);
      if (resetBtn) {
        resetBtn.style.display = 'none';
      }

      const sol = document.getElementById(`sol-${qid}`);
      if (sol) {
        sol.classList.remove('show');
      }

      calculateScore();
    }

    function calculateScore() {
      let score = 0;
      const total = questionsData.length;
      Object.keys(userAnswers).forEach(qid => {
        const q = questionsData.find(item => item.id == qid);
        if (q && userAnswers[qid] === q.ans) score++;
      });
      const pct = total > 0 ? Math.round((score / total) * 100) : 0;
      const scoreEl = document.getElementById('score');
      if (scoreEl) {
        scoreEl.innerText = `${score} / ${total} (${pct}%)`;
      }
    }

    function toggleSolution(qid) {
      const sol = document.getElementById(`sol-${qid}`);
      if (sol) sol.classList.toggle('show');
    }

    let allShown = false;
    function toggleAllSolutions() {
      allShown = !allShown;
      questionsData.forEach(q => {
        const sol = document.getElementById(`sol-${q.id}`);
        if (sol) {
          if (allShown) sol.classList.add('show');
          else sol.classList.remove('show');
        }
      });
    }

    function resetQuiz() {
      userAnswers = {};
      initQuiz();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    initQuiz();
  </script>
  <script src="../transition.js"></script>
