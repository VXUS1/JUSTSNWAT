      border-color: #ff453a !important;
      color: #fff;

      align-items: center;
      justify-content: center;
      flex-shrink: 0;

            id: "q18",
            type: "fill",
            text: "Question 18: Write one command to display all files exist under your parent directory that has full permissions, and have not been modified for more than a week.",
            acceptedAnswers: ["find ../ -perm 777 -mtime +7 -print", "find ../ -perm 777 -mtime +7", "find .. -perm 777 -mtime +7 -print"],
            dispAnswer: "find ../ -perm 777 -mtime +7 -print",
            exp: "الحل المعتمد المكتوب في الورقة: find ../ -perm 777 -mtime +7 -print",
            img: ""
          },
          {
            id: "q19",
            type: "single",
            text: "Question 19: Which of the following is considered as absolute pathname?",
            opts: [
              "document/nes202",
              "none is absolute",
              "../../document/nes202",
              "$HOME/document/nes202",
              "./Document/nes202"
            ],
            ans: 3, // $HOME/document/nes202
            dispAnswer: "$HOME/document/nes202",
            exp: "الخيار المؤشر عليه بسهم في ورقة الامتحان: $HOME/document/nes202.",
            img: ""
          },
          {
            id: "q20",
            type: "dnd_rects",
            text: "Question 20: Consider the following sample output. Do not assume that any other commands are executed between the creation of this sample and the commands in the followed question.\n<pre class=\"code-block\">[~rana:]$ ls\nCh04_s4.1     My Documents   assig1.c       lecture.ch1.3\nChapter1      _slides04      ch02.section1  slides.ch1</pre>What is the output of executing the following command line?\n<pre class=\"code-block\">[~rana:]$ ls *.*[0-9]</pre>Drag the rectangles labeled with correct answers only into the empty rectangles (or click them):",
            numSlots: 4,
            pool: ["My Documents", "Ch04_s4.1", "Chapter1", "assig1.c", "_slides04", "slides.ch1", "ch02.section1", "lecture.ch1.3"],
            correctAnswers: ["Ch04_s4.1", "lecture.ch1.3", "slides.ch1", "ch02.section1"],
            dispAnswer: "[Ch04_s4.1]  [lecture.ch1.3]  [slides.ch1]  [ch02.section1]",
            exp: "الخيارات المؤشر عليها بصح في ورقة الامتحان: Ch04_s4.1 و lecture.ch1.3 و slides.ch1 و ch02.section1.",
            img: ""
          }
        ]
      }
    ];

    let userScores = {};
    let dndBoxState = {}; // تخزين حالة المربعات لكل سؤال Drag & Drop

    function initQuiz() {
      const driveBtn = document.getElementById('drive-link-btn');
      if (driveBtn) {
        if (originalDriveLink && originalDriveLink.trim() !== "") {
          driveBtn.href = originalDriveLink;
          driveBtn.style.display = "inline-flex";
        } else {
          driveBtn.style.display = "none";
        }
      }

      const list = document.getElementById('quiz-list');
      list.innerHTML = '';

      examSections.forEach((section) => {
        const card = document.createElement('div');
        card.className = 'q-card';

        let subQuestionsHtml = '';
        section.subQuestions.forEach((sub) => {
          let interactionHtml = '';

          if (sub.type === "single") {
            const optsHtml = sub.opts.map((opt, i) => `
              <div class="option-item" id="opt-${sub.id}-${i}" onclick="selectSingleOption('${sub.id}', ${i})">
                <div class="opt-indicator"></div>
                <div>${opt}</div>
              </div>
            `).join('');

            interactionHtml = `
              <div class="options-container" id="opts-box-${sub.id}">${optsHtml}</div>
              <div class="answer-input-row">
                <button class="btn-reset-q" id="reset-btn-${sub.id}" onclick="resetSubQuestion('${sub.id}')">إعادة السؤال ↻</button>
                <button class="btn-action" onclick="toggleSolution('${sub.id}')">
                  <span>💡</span> عرض الحل
                </button>
              </div>
            `;
          } else if (sub.type === "fill") {
            interactionHtml = `
              <div class="answer-input-row" id="row-${sub.id}">
                <input type="text" 
                       class="user-ans-input" 
                       id="input-${sub.id}" 
                       placeholder="اكتب الإجابة هنا..." 
                       onkeydown="if(event.key==='Enter') checkFillAnswer('${sub.id}')" />
                <button class="btn" id="btn-check-${sub.id}" onclick="checkFillAnswer('${sub.id}')">تحقق</button>
                <button class="btn-reset-q" id="reset-btn-${sub.id}" onclick="resetSubQuestion('${sub.id}')">إعادة السؤال ↻</button>
                <button class="btn-action" onclick="toggleSolution('${sub.id}')">
                  <span>💡</span> عرض الحل
                </button>
              </div>
            `;
          } else if (sub.type === "dnd_rects") {
            dndBoxState[sub.id] = {
              slots: Array(sub.numSlots).fill(null),
              pool: [...sub.pool],
              correctAnswers: sub.correctAnswers,
              locked: false
            };

            let slotsHtml = '';
            for (let s = 0; s < sub.numSlots; s++) {
              slotsHtml += `<div class="dnd-box-target" id="box-slot-${sub.id}-${s}" 
                ondragover="allowDropBox(event)" ondrop="dropToBoxSlot(event, '${sub.id}', ${s})" 
                onclick="boxSlotClickRemove('${sub.id}', ${s})">[ فارغ ]</div>`;
            }

            interactionHtml = `
              <div class="dnd-box-layout ltr-content" id="dnd-layout-${sub.id}">
                <div style="font-size:0.85rem; color:var(--text-secondary); margin-bottom:8px;">Target slots:</div>
                <div class="dnd-empty-slots-row" id="slots-row-${sub.id}">
                  ${slotsHtml}
                </div>
                <div style="font-size:0.85rem; color:var(--text-secondary); margin-bottom:8px;">Available rectangles (Drag or Click to place into an empty slot):</div>
                <div class="dnd-chips-pool" id="pool-${sub.id}">
                  ${sub.pool.map((item, pIdx) => `
                    <div class="dnd-rect-chip" id="chip-${sub.id}-${pIdx}" draggable="true" 
                         ondragstart="dragChipStart(event, '${sub.id}', '${item}')" 
                         onclick="clickChipInsert('${sub.id}', '${item}')">${item}</div>
                  `).join('')}
                </div>
                <div class="dnd-hint-text">ملاحظة: يمكنك سحب المستطيل وإفلاته بالفراغ، أو النقر عليه مباشرة لنقله للفراغ الشاغر التالي، والنقر على الفراغ لإلغائه.</div>
              </div>
              <div class="answer-input-row">
                <button class="btn" id="btn-check-${sub.id}" onclick="checkDndBoxesAnswer('${sub.id}')">تحقق من المستطيلات</button>
                <button class="btn-reset-q" id="reset-btn-${sub.id}" onclick="resetSubQuestion('${sub.id}')">إعادة السؤال ↻</button>
                <button class="btn-action" onclick="toggleSolution('${sub.id}')">
                  <span>💡</span> عرض الحل
                </button>
              </div>
            `;
          }

          subQuestionsHtml += `
            <div class="sub-question-card ltr-content" id="card-${sub.id}">
              <div class="sub-q-header">${sub.text}</div>
              ${interactionHtml}
              <div class="solution-box" id="sol-${sub.id}">
                <div><strong>الإجابة المعتمدة في الامتحان:</strong></div>
                <div style="margin-top: 6px; font-size: 0.9rem; line-height: 1.6; font-family: 'JetBrains Mono', Consolas, monospace;">${sub.dispAnswer}</div>
                <div style="margin-top: 6px; font-size: 0.88rem; line-height: 1.5; color: var(--text-secondary);">${sub.exp}</div>
              </div>
            </div>
          `;
        });

        card.innerHTML = `
          <div class="ltr-content">
            <div class="parent-q-title">${section.title}</div>
            <div class="parent-q-desc">${section.context}</div>
          </div>
          <div class="sub-list">${subQuestionsHtml}</div>
        `;

        list.appendChild(card);
      });

      calculateScore();
    }

    function findSubQuestion(subId) {
      for (const sec of examSections) {
        const found = sec.subQuestions.find(s => s.id === subId);
        if (found) return found;
      }
      return null;
    }

    function selectSingleOption(subId, optIdx) {
      const sub = findSubQuestion(subId);
      const optsBox = document.getElementById(`opts-box-${subId}`);
      const resetBtn = document.getElementById(`reset-btn-${subId}`);
      if (!sub || !optsBox) return;

      optsBox.classList.add('locked');

      const picked = document.getElementById(`opt-${subId}-${optIdx}`);
      if (optIdx === sub.ans) {
        if (picked) picked.classList.add('correct');
        userScores[subId] = true;
      } else {
        if (picked) picked.classList.add('wrong');
        delete userScores[subId];
      }

      if (resetBtn) resetBtn.style.display = 'inline-flex';
      calculateScore();
    }

    function checkFillAnswer(subId) {
      const sub = findSubQuestion(subId);
      if (!sub) return;

      const inputEl = document.getElementById(`input-${subId}`);
      const checkBtn = document.getElementById(`btn-check-${subId}`);
      const resetBtn = document.getElementById(`reset-btn-${subId}`);
      if (!inputEl) return;

      const rawVal = inputEl.value.trim();
      if (rawVal === "") return;

      const isCorrect = sub.acceptedAnswers.some(ans => {
        return rawVal.toLowerCase() === ans.toLowerCase() || 
               rawVal.replace(/\s+/g, ' ').toLowerCase() === ans.replace(/\s+/g, ' ').toLowerCase();
      });

      if (isCorrect) {
        inputEl.className = 'user-ans-input correct';
        userScores[subId] = true;
      } else {
        inputEl.className = 'user-ans-input wrong';
        delete userScores[subId];
      }

      inputEl.disabled = true;
      if (checkBtn) checkBtn.style.display = 'none';
      if (resetBtn) resetBtn.style.display = 'inline-flex';

      calculateScore();
    }

    // منطق الـ Drag & Drop المحسّن بالمربعات الفارغة المستقلة
    let draggedBoxInfo = null;

    function dragChipStart(e, subId, itemText) {
      draggedBoxInfo = { subId, itemText };
      e.dataTransfer.setData('text/plain', JSON.stringify(draggedBoxInfo));
    }

    function allowDropBox(e) {
      e.preventDefault();
      e.currentTarget.classList.add('drag-over');
    }

    function dropToBoxSlot(e, subId, slotIdx) {
      e.preventDefault();
      e.currentTarget.classList.remove('drag-over');
      if (!draggedBoxInfo || draggedBoxInfo.subId !== subId) return;

      insertItemIntoSlot(subId, slotIdx, draggedBoxInfo.itemText);
      draggedBoxInfo = null;
    }

    function clickChipInsert(subId, itemText) {
      const state = dndBoxState[subId];
      if (!state || state.locked) return;

      const firstEmptySlot = state.slots.findIndex(s => s === null);
      if (firstEmptySlot !== -1) {
        insertItemIntoSlot(subId, firstEmptySlot, itemText);
      }
    }

    function boxSlotClickRemove(subId, slotIdx) {
      const state = dndBoxState[subId];
      if (!state || state.locked) return;

      const currentVal = state.slots[slotIdx];
      if (currentVal !== null) {
        state.slots[slotIdx] = null;
        state.pool.push(currentVal);
        renderBoxSlotsUi(subId);
      }
    }

    function insertItemIntoSlot(subId, slotIdx, itemText) {
      const state = dndBoxState[subId];
      if (!state || state.locked) return;

      if (state.slots[slotIdx] !== null) {
        state.pool.push(state.slots[slotIdx]);
      }

      state.slots[slotIdx] = itemText;
      state.pool = state.pool.filter(x => x !== itemText);
      renderBoxSlotsUi(subId);
    }

    function renderBoxSlotsUi(subId) {
      const state = dndBoxState[subId];
      if (!state) return;

      state.slots.forEach((val, idx) => {
        const slotEl = document.getElementById(`box-slot-${subId}-${idx}`);
        if (slotEl) {
          if (val !== null) {
            slotEl.innerText = val;
            slotEl.classList.add('filled');
          } else {
            slotEl.innerText = "[ فارغ ]";
            slotEl.classList.remove('filled');
          }
        }
      });

      const poolEl = document.getElementById(`pool-${subId}`);
      if (poolEl) {
        poolEl.innerHTML = state.pool.map((item, pIdx) => `
          <div class="dnd-rect-chip" id="chip-${subId}-${pIdx}" draggable="true" 
               ondragstart="dragChipStart(event, '${subId}', '${item}')" 
               onclick="clickChipInsert('${subId}', '${item}')">${item}</div>
        `).join('');
      }
    }

    function checkDndBoxesAnswer(subId) {
      const sub = findSubQuestion(subId);
      const state = dndBoxState[subId];
      const checkBtn = document.getElementById(`btn-check-${subId}`);
      const resetBtn = document.getElementById(`reset-btn-${subId}`);
      if (!sub || !state) return;

      if (state.slots.some(s => s === null)) {
        alert("يرجى تعبئة جميع المستطيلات الفارغة أولاً!");
        return;
      }

      const filledAnswersSet = new Set(state.slots);
      const correctAnswersSet = new Set(sub.correctAnswers);

      const isAllMatched = filledAnswersSet.size === correctAnswersSet.size && 
                           [...filledAnswersSet].every(ans => correctAnswersSet.has(ans));

      state.slots.forEach((val, idx) => {
        const slotEl = document.getElementById(`box-slot-${subId}-${idx}`);
        if (slotEl) {
          if (correctAnswersSet.has(val)) {
            slotEl.classList.add('box-correct');
          } else {
            slotEl.classList.add('box-wrong');
          }
        }
      });

      if (isAllMatched) {
        userScores[subId] = true;
      } else {
        delete userScores[subId];
      }

      state.locked = true;
      const layoutEl = document.getElementById(`dnd-layout-${subId}`);
      if (layoutEl) layoutEl.style.pointerEvents = 'none';

      if (checkBtn) checkBtn.style.display = 'none';
      if (resetBtn) resetBtn.style.display = 'inline-flex';

      calculateScore();
    }

    function resetSubQuestion(subId) {
      const sub = findSubQuestion(subId);
      if (!sub) return;

      delete userScores[subId];

      const optsBox = document.getElementById(`opts-box-${subId}`);
      if (optsBox) {
        optsBox.classList.remove('locked');
      }

      if (sub.type === "single") {
        sub.opts.forEach((_, i) => {
          const el = document.getElementById(`opt-${subId}-${i}`);
          if (el) el.className = 'option-item';
        });
      }

      if (sub.type === "fill") {
        const inputEl = document.getElementById(`input-${subId}`);
        if (inputEl) {
          inputEl.disabled = false;
          inputEl.value = "";
          inputEl.className = 'user-ans-input';
        }
      }

      if (sub.type === "dnd_rects") {
        dndBoxState[subId] = {
          slots: Array(sub.numSlots).fill(null),
          pool: [...sub.pool],
          correctAnswers: sub.correctAnswers,
          locked: false
        };

        for (let s = 0; s < sub.numSlots; s++) {
          const slotEl = document.getElementById(`box-slot-${subId}-${s}`);
          if (slotEl) {
            slotEl.innerText = "[ فارغ ]";
            slotEl.className = 'dnd-box-target';
          }
        }

        const layoutEl = document.getElementById(`dnd-layout-${subId}`);
        if (layoutEl) layoutEl.style.pointerEvents = 'auto';

        renderBoxSlotsUi(subId);
      }

      const checkBtn = document.getElementById(`btn-check-${subId}`);
      if (checkBtn) checkBtn.style.display = 'inline-flex';

      const resetBtn = document.getElementById(`reset-btn-${subId}`);
      if (resetBtn) resetBtn.style.display = 'none';

      const sol = document.getElementById(`sol-${subId}`);
      if (sol) sol.classList.remove('show');

      calculateScore();
    }

    function calculateScore() {
      let total = 0;
      let score = 0;
      examSections.forEach(sec => {
        sec.subQuestions.forEach(sub => {
          total++;
          if (userScores[sub.id]) score++;
        });
      });

      const pct = total > 0 ? Math.round((score / total) * 100) : 0;
      const scoreEl = document.getElementById('score');
      if (scoreEl) {
        scoreEl.innerText = `${score} / ${total} (${pct}%)`;
      }
    }

    function toggleSolution(subId) {
      const sol = document.getElementById(`sol-${subId}`);
      if (sol) sol.classList.toggle('show');
    }

    let allShown = false;
    function toggleAllSolutions() {
      allShown = !allShown;
      examSections.forEach(sec => {
        sec.subQuestions.forEach(sub => {
          const sol = document.getElementById(`sol-${sub.id}`);
          if (sol) {
            if (allShown) sol.classList.add('show');
            else sol.classList.remove('show');
          }
        });
      });
    }

    function resetQuiz() {
      userScores = {};
      initQuiz();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    initQuiz();
  </script>
  <script src="../transition.js"></script>
</body>
</html>
