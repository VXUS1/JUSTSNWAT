<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>خطة هندسة الحاسوب | CE Plan Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-base: #050608;
      --apple-surface: rgba(18, 22, 34, 0.82);
      --apple-surface-hover: rgba(26, 32, 48, 0.95);
      --apple-border: rgba(255, 255, 255, 0.08);
      --apple-border-strong: rgba(255, 255, 255, 0.16);
      
      --apple-red: #ff453a;
      --apple-blue: #0a84ff;
      --apple-green: #30d158;
      --apple-amber: #f59e0b;
      --apple-pink: #ec4899;
      
      --text-primary: #f5f5f7;
      --text-secondary: #8e95a5;
      --ease-apple: cubic-bezier(0.16, 1, 0.3, 1);
      --radius: 16px;
    }

    body.dark-mode {
      --bg-color: var(--bg-base);
      --viewport-bg: radial-gradient(circle at center, #101625 0%, #050608 100%);
      --panel-bg: rgba(14, 18, 28, 0.88);
      --card-bg: rgba(22, 28, 44, 0.96);
      --border-color: var(--apple-border);
      --border-strong: var(--apple-border-strong);
      --text-main: var(--text-primary);
      --text-muted: var(--text-secondary);
      --node-solid-fill: #0d121d;
      --node-text: #f1f5f9;
      --link-color: #334155;
      --glow-intensity: 12px;
      --modal-bg: rgba(14, 18, 28, 0.96);
      --btn-bg: rgba(255, 255, 255, 0.06);

      --c-completed-bg: rgba(48, 209, 88, 0.14);
      --c-completed-text: #30d158;
      --c-current-bg: rgba(10, 132, 255, 0.16);
      --c-current-text: #7dd3fc;
      --c-next-bg: rgba(245, 158, 11, 0.15);
      --c-next-text: #fde68a;
      --c-summer-bg: rgba(236, 72, 153, 0.15);
      --c-summer-text: #fbcfe8;
      --c-next-year-bg: #581c87;
      --c-next-year-text: #ffffff;
      --c-term-2028-bg: #164e63;
      --c-term-2028-text: #ffffff;

      --grid-dot-color: rgba(10, 132, 255, 0.08);
      --accent: #0a84ff;
      --accent-soft: rgba(10, 132, 255, 0.2);
    }

    body.light-mode {
      --bg-color: #f5f5f7;
      --viewport-bg: radial-gradient(circle at center, #ffffff 0%, #e2e8f0 100%);
      --panel-bg: rgba(255, 255, 255, 0.9);
      --card-bg: #ffffff;
      --border-color: rgba(0, 0, 0, 0.08);
      --border-strong: rgba(0, 0, 0, 0.15);
      --text-main: #1d1d1f;
      --text-muted: #6e6e73;
      --node-solid-fill: #ffffff;
      --node-text: #1d1d1f;
      --link-color: #cbd5e1;
      --glow-intensity: 6px;
      --modal-bg: #ffffff;
      --btn-bg: #f1f5f9;

      --c-completed-bg: #d1fae5;
      --c-completed-text: #065f46;
      --c-current-bg: #dbeafe;
      --c-current-text: #1e40af;
      --c-next-bg: #fef3c7;
      --c-next-text: #92400e;
      --c-summer-bg: #fce7f3;
      --c-summer-text: #9d174d;
      --c-next-year-bg: #ede9fe;
      --c-next-year-text: #5b21b6;
      --c-term-2028-bg: #cffafe;
      --c-term-2028-text: #155e75;

      --grid-dot-color: rgba(10, 132, 255, 0.1);
      --accent: #0071e3;
      --accent-soft: rgba(0, 113, 227, 0.12);
    }

    * { box-sizing: border-box; user-select: none; -webkit-touch-callout: none; }
    
    body[dir="rtl"], body[dir="rtl"] * {
      font-family: 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, sans-serif;
    }
    body[dir="ltr"], body[dir="ltr"] * {
      font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    #pctText, #completedHours, #totalHours, #completedCourses, #totalCourses,
    #count-completed, #count-current, #count-next, #count-summer, #count-next-year, #count-term-2028,
    .node-credits {
      font-family: 'IBM Plex Mono', 'Consolas', monospace !important;
      letter-spacing: 0.01em;
    }

    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: var(--bg-color); color: var(--text-main); transition: background-color 0.3s; touch-action: none; position: relative; }

    .ambient-glow {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 800px;
      height: 800px;
      background: radial-gradient(circle, rgba(10, 132, 255, 0.08) 0%, rgba(255, 69, 58, 0.03) 45%, transparent 70%);
      pointer-events: none;
      z-index: 1;
      filter: blur(80px);
    }

    #dashboard {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 100;
      background: var(--panel-bg);
      backdrop-filter: blur(14px);
      border-radius: 18px;
      padding: 14px 20px 16px;
      box-shadow: 0 10px 34px rgba(0,0,0,0.28);
      border: 1px solid var(--border-color);
      border-top: 1px solid var(--accent-soft);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .dash-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }
    .dash-header h2 {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .dash-header h2::before {
      content: "";
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--apple-green);
      box-shadow: 0 0 10px var(--apple-green);
      flex-shrink: 0;
      animation: pulse-dot 2.4s ease-in-out infinite;
    }
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.55; transform: scale(0.8); }
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .toggle-btn {
      background: var(--btn-bg);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 6px 13px;
      border-radius: 20px;
      font-size: 0.78rem;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }
    .toggle-btn:hover { border-color: var(--accent); color: var(--accent); }

    .home-return-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 40px;
      padding: 8px 15px;
      border: 1px solid rgba(10, 132, 255, 0.42);
      border-radius: 22px;
      background: linear-gradient(135deg, #1674d1, #0a84ff);
      box-shadow: 0 5px 16px rgba(10, 132, 255, 0.24);
      color: #ffffff;
      font: inherit;
      font-size: 0.9rem;
      font-weight: 700;
      text-decoration: none;
      white-space: nowrap;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }
    .home-return-btn:hover {
      background: linear-gradient(135deg, #0c65bb, #0878e8);
      box-shadow: 0 7px 20px rgba(10, 132, 255, 0.32);
      transform: translateY(-1px);
    }
    .home-return-btn:focus-visible {
      outline: 3px solid rgba(10, 132, 255, 0.35);
      outline-offset: 3px;
    }

    .home-transition {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: grid;
      place-items: center;
      background: rgba(5, 8, 14, 0.62);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.28s ease, visibility 0.28s ease;
    }
    body.light-mode .home-transition { background: rgba(226, 235, 246, 0.78); }
    .home-transition.is-active { opacity: 1; visibility: visible; }
    .home-transition-content {
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 18px 22px;
      border: 1px solid var(--border-strong);
      border-radius: 16px;
      background: var(--panel-bg);
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.2);
      color: var(--text-main);
      font-weight: 700;
      transform: translateY(8px) scale(0.98);
      transition: transform 0.28s ease;
    }
    .home-transition.is-active .home-transition-content { transform: translateY(0) scale(1); }
    .home-transition-spinner {
      width: 24px;
      height: 24px;
      flex: none;
      border: 3px solid var(--accent-soft);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: home-spin 0.72s linear infinite;
    }
    @keyframes home-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .home-return-btn, .home-transition, .home-transition-content { transition: none; }
      .home-transition-spinner { animation-duration: 1.8s; }
    }

    .collapse-btn {
      display: none;
      width: 30px;
      height: 30px;
      align-items: center;
      justify-content: center;
      background: var(--btn-bg);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      border-radius: 50%;
      font-size: 0.75rem;
      cursor: pointer;
      flex-shrink: 0;
    }

    .stats-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      font-size: 0.76rem;
      align-items: center;
      overflow: hidden;
      max-height: 200px;
      opacity: 1;
      transition: max-height 0.25s ease, opacity 0.2s ease, margin 0.25s ease;
    }
    #dashboard.collapsed .stats-row {
      max-height: 0;
      opacity: 0;
      pointer-events: none;
    }
    .stat-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      background: var(--btn-bg);
      border: 1px solid var(--border-color);
      padding: 4px 10px;
      border-radius: 999px;
    }
    .badge-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex-shrink: 0; }

    .progress-bar-bg {
      width: 100%;
      height: 8px;
      background: var(--border-color);
      border-radius: 6px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #10b981, #0a84ff);
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.8);
      transition: width 0.4s ease;
    }

    #viewport {
      width: 100vw;
      height: 100vh;
      cursor: grab;
      overflow: hidden;
      background-color: var(--bg-color);
      background-image: var(--viewport-bg), radial-gradient(var(--grid-dot-color) 1.5px, transparent 1.5px);
      background-size: 100% 100%, 28px 28px;
      background-position: 0 0, 0 0;
      position: relative;
      z-index: 10;
    }
    #viewport:active { cursor: grabbing; }

    svg#canvas { width: 100%; height: 100%; display: block; }

    .link-solid { stroke: var(--link-color); stroke-width: 2.4; fill: none; transition: stroke 0.2s; }
    .link-dashed { stroke: var(--link-color); stroke-width: 2.4; stroke-dasharray: 6,6; fill: none; transition: stroke 0.2s; }

    .node-group { cursor: pointer; transition: transform 0.15s ease; transform-box: fill-box; transform-origin: center; }

    @media (hover: hover) and (pointer: fine) {
      .node-group:hover { transform: scale(1.045); }
      .node-group:hover .node-circle { stroke-width: 4.5px; }
      .node-group:hover .node-mask { filter: brightness(1.1); }
    }

    .node-mask {
      fill: var(--node-solid-fill);
      stroke: none;
      transition: fill 0.25s ease, filter 0.15s ease;
    }

    .node-circle {
      fill: transparent;
      stroke-width: 3.4px;
      transition: all 0.2s ease;
    }
    .status-ring {
      fill: none;
      stroke-width: 0px;
      transition: all 0.3s ease;
      pointer-events: none;
    }

    .node-text {
      font-size: 11.5px;
      font-weight: 600;
      text-anchor: middle;
      dominant-baseline: central;
      fill: var(--node-text);
      pointer-events: none;
      transition: fill 0.25s ease;
    }
    .node-credits {
      font-size: 10.5px;
      font-weight: 600;
      text-anchor: middle;
      dominant-baseline: central;
      fill: var(--accent);
      pointer-events: none;
    }

    .ext-text { font-size: 10.5px; font-weight: 500; text-anchor: middle; fill: var(--text-muted); pointer-events: none; }
    .status-completed .status-ring { stroke: #30d158; stroke-width: 5.5px; filter: drop-shadow(0 0 14px rgba(48, 209, 88, 0.9)); }
    .status-completed .node-mask { fill: rgba(48, 209, 88, 0.18); }
    .status-completed .node-text { fill: #30d158 !important; }

    .status-current .status-ring { stroke: #0a84ff; stroke-width: 5.5px; animation: pulse-current-ring 2.6s ease-in-out infinite; }
    .status-current .node-mask { fill: rgba(10, 132, 255, 0.18); }
    .status-current .node-text { fill: #7dd3fc; }
    @keyframes pulse-current-ring {
      0%, 100% { filter: drop-shadow(0 0 14px rgba(10, 132, 255, 0.85)); }
      50% { filter: drop-shadow(0 0 22px rgba(10, 132, 255, 1)); }
    }

    .status-next .status-ring { stroke: #f59e0b; stroke-width: 5.5px; filter: drop-shadow(0 0 14px rgba(245, 158, 11, 0.9)); }
    .status-next .node-mask { fill: rgba(245, 158, 11, 0.18); }
    .status-next .node-text { fill: #fde68a; }

    .status-summer .status-ring { stroke: #ec4899; stroke-width: 5.5px; filter: drop-shadow(0 0 14px rgba(236, 72, 153, 0.9)); }
    .status-summer .node-mask { fill: rgba(236, 72, 153, 0.18); }
    .status-summer .node-text { fill: #fbcfe8; }

    .status-next-year .status-ring { stroke: #a855f7; stroke-width: 5px; filter: drop-shadow(0 0 var(--glow-intensity) #a855f7); }
    .status-next-year .node-mask { fill: var(--c-next-year-bg); }
    .status-next-year .node-text { fill: var(--c-next-year-text); }

    .status-term-2028 .status-ring { stroke: #06b6d4; stroke-width: 5px; filter: drop-shadow(0 0 var(--glow-intensity) #06b6d4); }
    .status-term-2028 .node-mask { fill: var(--c-term-2028-bg); }
    .status-term-2028 .node-text { fill: var(--c-term-2028-text); }

    #actionModal {
      position: absolute;
      display: none;
      opacity: 0;
      transform: scale(0.95) translateY(4px);
      transition: opacity 0.15s ease, transform 0.15s ease;
      z-index: 200;
      background: var(--modal-bg);
      border-radius: 16px;
      box-shadow: 0 20px 46px rgba(0,0,0,0.5);
      border: 1px solid var(--border-color);
      padding: 16px;
      padding-top: 18px;
      width: 260px;
      overflow: hidden;
    }
    #actionModal.show { opacity: 1; transform: scale(1) translateY(0); }
    #actionModal::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--apple-blue), var(--apple-green));
    }
    #actionModal h4 { margin: 0 0 12px 0; font-size: 0.92rem; color: var(--accent); text-align: center; font-weight: 700; }
    .btn-status {
      display: block;
      width: 100%;
      text-align: inherit;
      padding: 9px 13px;
      margin-bottom: 6px;
      border: 1px solid transparent;
      border-radius: 9px;
      font-size: 0.83rem;
      cursor: pointer;
      font-weight: 600;
      transition: transform 0.1s, filter 0.15s;
    }
    .btn-status:hover { filter: brightness(1.15); }
    .btn-status:active { transform: scale(0.98); }
    .btn-completed { background: rgba(48, 209, 88, 0.16); color: #30d158; border-color: rgba(48, 209, 88, 0.4); }
    .btn-current { background: rgba(10, 132, 255, 0.16); color: #0a84ff; border-color: rgba(10, 132, 255, 0.4); }
    .btn-next { background: rgba(245, 158, 11, 0.16); color: #f59e0b; border-color: rgba(245, 158, 11, 0.4); }
    .btn-summer { background: rgba(236, 72, 153, 0.16); color: #ec4899; border-color: rgba(236, 72, 153, 0.4); }
    .btn-next-year { background: rgba(168, 85, 247, 0.2); color: #a855f7; border-color: #a855f7; }
    .btn-term-2028 { background: rgba(6, 182, 212, 0.2); color: #06b6d4; border-color: #06b6d4; }
    .btn-reset { background: var(--btn-bg); color: var(--text-muted); }

    .legend-box {
      position: absolute;
      bottom: 16px;
      right: 16px;
      background: var(--panel-bg);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border-color);
      border-bottom: 1px solid var(--accent-soft);
      padding: 10px 16px;
      border-radius: 14px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.25);
      font-size: 0.74rem;
      display: flex;
      flex-direction: column;
      gap: 7px;
      z-index: 100;
    }
    body[dir="ltr"] .legend-box { right: auto; left: 16px; }
    .legend-item { display: flex; align-items: center; gap: 8px; color: var(--text-muted); font-weight: 500; }

    .zoom-controls {
      position: absolute;
      bottom: 16px;
      left: 16px;
      z-index: 100;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    body[dir="ltr"] .zoom-controls { left: auto; right: 16px; }
    .zoom-btn {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: var(--panel-bg);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      font-size: 1.25rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(0,0,0,0.25);
      line-height: 1;
      padding: 0;
    }
    .zoom-btn:active { transform: scale(0.92); }
    .zoom-btn.fit-btn { font-size: 0.95rem; color: var(--accent); }

    @media (max-width: 768px) {
      .ambient-glow { display: none; }
      #dashboard, .zoom-btn, .home-transition {
        -webkit-backdrop-filter: none;
        backdrop-filter: none;
      }
      .status-completed .status-ring,
      .status-current .status-ring,
      .status-next .status-ring,
      .status-summer .status-ring,
      .status-next-year .status-ring,
      .status-term-2028 .status-ring {
        animation: none;
        filter: none;
      }
      #scene { will-change: transform; }

      #dashboard { padding: 10px 14px; border-radius: 14px; gap: 8px; }
      .dash-header h2 { font-size: 0.92rem; }
      .stats-row { font-size: 0.7rem; gap: 6px; }
      .stat-badge { padding: 3px 8px; }
      .legend-box { display: none; }
      .collapse-btn { display: flex; }
      .zoom-btn { width: 40px; height: 40px; }
      #actionModal {
        position: fixed;
        top: 50% !important;
        left: 50% !important;
        transform: translate(-50%, -50%) scale(0.95);
        width: 85vw;
        max-width: 320px;
      }
      #actionModal.show { transform: translate(-50%, -50%) scale(1); }
    }
  </style>
</head>
<body class="dark-mode" dir="rtl">

  <div class="ambient-glow"></div>
  <div class="home-transition" id="homeTransition" aria-hidden="true">
    <div class="home-transition-content" role="status" aria-live="polite">
      <span class="home-transition-spinner" aria-hidden="true"></span>
      <span id="homeTransitionLabel">جارٍ العودة للرئيسية...</span>
    </div>
  </div>

  <div id="dashboard">
    <div class="dash-header">
      <h2 id="lblTitle">خطة هندسة الحاسوب (2022)</h2>
      <div class="header-controls">
        <button class="collapse-btn" onclick="toggleCollapse()" id="collapseBtn" aria-label="Toggle details">▾</button>
        <button class="toggle-btn" onclick="toggleTheme()" id="themeBtn">☀️ White</button>
        <a class="home-return-btn" href="index.html" id="homeReturnBtn" onclick="goHomeWithLoading(event)" aria-label="العودة إلى الصفحة الرئيسية">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m3 10 9-7 9 7"></path><path d="M5 9v11h14V9"></path><path d="M9 20v-6h6v6"></path>
          </svg>
          <span id="homeReturnLabel">الرئيسية</span>
        </a>
        <button class="toggle-btn" onclick="toggleLang()" id="langBtn">🌐 English</button>
      </div>
      <div style="font-size: 0.82rem; color: var(--text-muted);">
        <span id="lblProgress">الإنجاز:</span> 
        <strong id="pctText" style="color: var(--accent);">0%</strong> 
        (<strong id="completedHours">0</strong> / <span id="totalHours">160</span> <span id="lblHoursUnit">ساعة</span>)
        - <span id="completedCourses">0</span> / <span id="totalCourses">0</span> <span id="lblCoursesUnit">مادة</span>
      </div>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-fill" id="progressBar"></div>
    </div>
    <div class="stats-row">

    function anchorPt(n, side, d) {
      return side === 'r' ? [n.x + d, n.y] : side === 'l' ? [n.x - d, n.y]
           : side === 't' ? [n.x, n.y - d] : [n.x, n.y + d];

    function routeLink(l) {
      const P = l.from ? [anchorPt(nodesMap[l.from], l.s, 48)] : [];
      const E = anchorPt(nodesMap[l.to], l.e, l.type === 'dot' ? ringRadius + 3 : ringRadius + 5);
      if (l.pts) {
        P.push(...l.pts);
      } else {
        const A = P[0], vs = l.s === 't' || l.s === 'b', ve = l.e === 't' || l.e === 'b';
        if (vs && ve) {
          if (A[0] !== E[0]) { const m = l.m ?? (A[1] + E[1]) / 2; P.push([A[0], m], [E[0], m]); }
        } else if (!vs && !ve) {
          if (A[1] !== E[1]) { const m = l.m ?? (A[0] + E[0]) / 2; P.push([m, A[1]], [m, E[1]]); }
        } else if (vs) P.push([A[0], E[1]]);
        else P.push([E[0], A[1]]);
      }
      P.push(E);
      return P.filter((p, i) => i === 0 || p[0] !== P[i - 1][0] || p[1] !== P[i - 1][1]);
    }

    // خط بزوايا مدوّرة زي الصورة
    function roundedPath(P, r = 10) {
      let d = `M${P[0][0]} ${P[0][1]}`;
      for (let i = 1; i < P.length - 1; i++) {
        const [p0, p1, p2] = [P[i - 1], P[i], P[i + 1]];
        const l1 = Math.hypot(p1[0] - p0[0], p1[1] - p0[1]);
        const l2 = Math.hypot(p2[0] - p1[0], p2[1] - p1[1]);
        const k = Math.min(r, l1 / 2, l2 / 2);
        d += ` L${p1[0] + (p0[0] - p1[0]) / l1 * k} ${p1[1] + (p0[1] - p1[1]) / l1 * k}` +
             ` Q${p1[0]} ${p1[1]} ${p1[0] + (p2[0] - p1[0]) / l2 * k} ${p1[1] + (p2[1] - p1[1]) / l2 * k}`;
      }
      const L = P[P.length - 1];
      return d + ` L${L[0]} ${L[1]}`;
    }

    function fitToScreen(animate) {
      const b = getGraphBounds();
      const graphW = b.maxX - b.minX;
      const graphH = b.maxY - b.minY;
      const vw = viewport.clientWidth, vh = viewport.clientHeight;
      const headerH = document.getElementById('dashboard').getBoundingClientRect().height;
      const pad = 20;
      const availW = Math.max(100, vw - pad * 2);
      const availH = Math.max(100, vh - headerH - pad * 2 - 12);
      const fitScale = Math.min(availW / graphW, availH / graphH);
      const midX = (b.minX + b.maxX) / 2;
      const midY = (b.minY + b.maxY) / 2;
      centerOn(midX, midY, fitScale, animate);
    }

    function mobileFocusScale() {
      const vw = viewport.clientWidth;
      return Math.min(1.05, Math.max(0.55, vw / 480));
    }

    function initialMobileView() {
      const activeNodes = nodes.filter(n => userState[n.id] === 'current');
      let tx, ty;
      if (activeNodes.length) {
        tx = activeNodes.reduce((s, n) => s + n.x, 0) / activeNodes.length;
        ty = activeNodes.reduce((s, n) => s + n.y, 0) / activeNodes.length;
      } else {
        tx = 700; ty = 170;
      }
      centerOn(tx, ty, mobileFocusScale(), false);
    }

    function toggleCollapse() {
      const dash = document.getElementById('dashboard');
      dash.classList.toggle('collapsed');
      document.getElementById('collapseBtn').textContent = dash.classList.contains('collapsed') ? '▾' : '▴';
    }

    const viewport = document.getElementById('viewport');

    viewport.addEventListener('mousedown', (e) => {
      if (e.target.closest('.node-group') || e.button !== 0) return;
      isPanning = true;
      startX = e.clientX - currentX;
      startY = e.clientY - currentY;
    });

    window.addEventListener('mousemove', (e) => {
      if (!isPanning) return;
      currentX = e.clientX - startX;
      currentY = e.clientY - startY;
      applyTransform();
    });

    window.addEventListener('mouseup', () => { isPanning = false; });

    viewport.addEventListener('wheel', (e) => {
      e.preventDefault();
      const rect = viewport.getBoundingClientRect();
      const zoomFactor = e.deltaY < 0 ? 1.08 : 0.92;
      zoomAround(e.clientX - rect.left, e.clientY - rect.top, scale * zoomFactor);
      applyTransform();
    }, { passive: false });

    viewport.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1 && !e.target.closest('.node-group')) {
        isPanning = true;
        scene.style.transition = 'none';
        startX = e.touches[0].clientX - currentX;
        startY = e.touches[0].clientY - currentY;
      } else if (e.touches.length === 2) {
        isPanning = false;
        scene.style.transition = 'none';
        const rect = viewport.getBoundingClientRect();
        const t0 = e.touches[0], t1 = e.touches[1];
        initialPinchDist = Math.hypot(t0.clientX - t1.clientX, t0.clientY - t1.clientY);
        initialPinchScale = scale;
        const midX = (t0.clientX + t1.clientX) / 2 - rect.left;
        const midY = (t0.clientY + t1.clientY) / 2 - rect.top;
        pinchAnchorScreen = { x: midX, y: midY };
        pinchAnchorScene = { x: (midX - currentX) / scale, y: (midY - currentY) / scale };
      }
    }, { passive: false });

    viewport.addEventListener('touchmove', (e) => {
      if (isPanning && e.touches.length === 1) {
        currentX = e.touches[0].clientX - startX;
        currentY = e.touches[0].clientY - startY;
        scheduleTransform();
      } else if (e.touches.length === 2 && initialPinchDist) {
        e.preventDefault();
        const dist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        const factor = dist / initialPinchDist;
        const newScale = Math.min(Math.max(MIN_SCALE, initialPinchScale * factor), MAX_SCALE);
        currentX = pinchAnchorScreen.x - pinchAnchorScene.x * newScale;
        currentY = pinchAnchorScreen.y - pinchAnchorScene.y * newScale;
        scale = newScale;
        scheduleTransform();
      }
    }, { passive: false });

    viewport.addEventListener('touchend', (e) => {
      if (e.touches.length < 2) initialPinchDist = null;
      if (e.touches.length === 0) isPanning = false;
    });

    window.addEventListener('resize', () => {
      applyLangUI();
    });

    document.body.className = `${currentTheme}-mode`;
    if (isMobileDevice()) {
      document.getElementById('dashboard').classList.add('collapsed');
      document.getElementById('collapseBtn').textContent = '▾';
    }
    applyLangUI();
    renderDiagram();
    if (isMobileDevice()) {
      initialMobileView();
    } else {
      currentX = 15; currentY = 100; scale = 0.65;
      applyTransform();
    }
  </script>
</body>
