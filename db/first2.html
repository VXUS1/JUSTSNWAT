  <script>
    const originalDriveLink = "https://drive.google.com/file/d/1EMu3nJSVxcVBHDiosYC6fuGmKMHdYfCO/view?usp=drive_link";

    const letters = ['A', 'B', 'C', 'D'];

    function escapeHtml(text) {
      if (!text) return '';
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    /* ============ ER drawing helpers (SVG) ============ */
    const CL='stroke="currentColor" fill="none" stroke-width="1.4"';
    const Tx=(x,y,s,c='')=>`<text x="${x}" y="${y}" text-anchor="middle" font-size="12.5" fill="currentColor" stroke="none" font-family="Times New Roman,serif" ${c}>${s}</text>`;
    const Ln=(a,b,c,d,w)=>{ if(!w) return `<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" ${CL}/>`; const dx=c-a,dy=d-b,n=Math.hypot(dx,dy)||1,ox=-dy/n*2.3,oy=dx/n*2.3; return Ln(a+ox,b+oy,c+ox,d+oy)+Ln(a-ox,b-oy,c-ox,d-oy); };
    const Ent=(x,y,n,w)=>`<rect x="${x-45}" y="${y-15}" width="90" height="30" ${CL}/>`+(w?`<rect x="${x-41}" y="${y-11}" width="82" height="22" ${CL}/>`:'')+Tx(x,y+4.5,n,'font-weight="700"');
    const Rel=(x,y,n,id)=>`<polygon points="${x-50},${y} ${x},${y-22} ${x+50},${y} ${x},${y+22}" ${CL}/>`+(id?`<polygon points="${x-42},${y} ${x},${y-17} ${x+42},${y} ${x},${y+17}" ${CL}/>`:'')+Tx(x,y+4.5,n);
    const rxOf=n=>Math.max(24,n.length*3.8+12);
    // o: k = key, p = partial key, m = multivalued, d = derived
    const At=(x,y,n,o='')=>{const r=rxOf(n),w=n.length*3.3;let s=`<ellipse cx="${x}" cy="${y}" rx="${r}" ry="13" ${CL}${o=='d'?' stroke-dasharray="4 3"':''}/>`;if(o=='m')s+=`<ellipse cx="${x}" cy="${y}" rx="${r+4}" ry="17" ${CL}/>`;s+=Tx(x,y+4.5,n);if(o=='k'||o=='p')s+=`<line x1="${x-w}" y1="${y+7.5}" x2="${x+w}" y2="${y+7.5}" ${CL}${o=='p'?' stroke-dasharray="3 2"':''}/>`;return s;};
    const Ak=(ex,ey,x,y,n,o)=>{const r=rxOf(n)+(o=='m'?4:0);if(Math.abs(y-ey)<20){const s=x>ex?1:-1;return Ln(ex+s*45,ey,x-s*r,y)+At(x,y,n,o);}const up=y<ey,ry=o=='m'?17:13,px=Math.max(ex-40,Math.min(ex+40,x));return Ln(px,up?ey-15:ey+15,x,up?y+ry:y-ry)+At(x,y,n,o);};
    const Vw=(w,h,b)=>`<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:${w}px;height:auto;display:block;margin:auto;color:var(--text-primary,#e8e8ed)">${b}</svg>`;
    // vertical: entity - relationship - entity
    const vt=(a,b,rl,id,l1,l2,d1,d2,ex='',W=230)=>Vw(W,212,Ent(100,25,a[0],a[1])+Ent(100,185,b[0],b[1])+Rel(100,105,rl,id)+Ln(100,40,100,83,d1)+Ln(100,127,100,170,d2)+Tx(113,60,l1)+Tx(113,153,l2)+ex);
    // horizontal binary
    const at2=(x,n,w,a)=>Ent(x,75,n,w)+a.map(([m,px,o])=>Ak(x,75,px,25,m,o)).join('');
    const bin=(a,b,rl,id,dl,dr,ll,rr,ex='',W=480)=>Vw(W,118,at2(80,...a)+at2(370,...b)+Rel(225,75,rl,id)+Ln(125,75,175,75,dl)+Ln(275,75,325,75,dr)+Tx(150,68,ll)+Tx(300,68,rr)+ex);
    // recursive "marry"
    const mar=(d1,d2,id)=>Vw(400,125,Ent(110,80,'Musician')+Ak(110,80,60,25,'ssn','k')+Ak(110,80,125,25,'name')+Ak(110,80,190,25,'phone')+Rel(330,80,'marry',id)+Ln(155,72,330,58,d1)+Ln(155,88,330,102,d2)+Tx(245,56,'1')+Tx(245,112,'1'));
    const U=s=>({svg:'<span style="font-family:JetBrains Mono,Consolas,monospace;font-size:.88rem;line-height:1.7">'+s.replace(/_([A-Za-z]+)_/g,'<u>$1</u>')+'</span>'});
    const Q=(id,text,opts,ans,disp,exp,dg)=>({id,text,opts,ans,dispAnswer:disp,exp,diagram:dg});
    const MU=w=>['Musician',w,[['ssn',35,'k'],['name',95],['phone',160]]];
    const IN=w=>['Instrument',w,[['iid',300,'k'],['type',362],['name',432]]];
    const AL=['Album',0,[['aid',35,'k'],['title',95],['format',160]]];
    const AR=['Album',0,[['aid',300,'k'],['title',362],['format',435]]];
    const SG=(w,s)=>['Song',w,[['sid',300,s],['title',362],['author',435]]];
    const stuCar=vt(['Student'],['Car'],'HAS',0,'1','1',0,0);

    const examSections = [
      {
        title: "Part I: ER Modelling — الجزء الأول (Q1–Q10)",
        context: "Part-I: ER Modelling (15 points) — Select the correct statement for each ER diagram.",
        subQuestions: [
          Q("p1","1. Consider the following ER Diagram. Select the correct statement.",
            ["For each value of GPA there is at most one instance of Student.","For each instance of Student there is at most one value of GPA.","For each value of GPA there is at least one instance of Student.","Instances of Student are determined as a function of values of GPA."],
            1,"b. For each instance of Student there is at most one value of GPA.",
            "GPA سمة بسيطة أحادية القيمة (Single-valued): كل طالب له قيمة GPA واحدة على الأكثر، لكن أكثر من طالب ممكن يشتركوا بنفس القيمة، فالخيار a خاطئ.",
            Vw(200,118,Ent(100,25,'Student')+Ak(100,25,100,90,'GPA'))),
          Q("p2","2. Consider the following ER Diagram. Select the correct statement.",
            ["For each value of Phone there is at most one instance of Student.","For each instance of Student there may be multiple values of Phone.","For each instance of Student there is at most one value of Phone.","For each value of Phone there is at least one instance of Student."],
            1,"b. For each instance of Student there may be multiple values of Phone.",
            "الشكل ذو الإطار المزدوج (Double ellipse) يمثل سمة متعددة القيم (Multi-valued Attribute)، فالطالب الواحد ممكن يكون له عدة أرقام هاتف.",
            Vw(200,122,Ent(100,25,'Student')+Ak(100,25,100,92,'Phone','m'))),
          Q("p3","3. Consider the following ER Diagram. Select the correct statement.",
            ["Age is a composite attribute.","Age is a multi-valued attribute.","Age is a derived (computed) attribute.","Age is a stored attribute."],
            2,"c. Age is a derived (computed) attribute.",
            "الإطار المنقّط (Dashed ellipse) يمثل سمة مشتقة (Derived Attribute) تُحسب من سمة أخرى مثل تاريخ الميلاد.",
            Vw(200,118,Ent(100,25,'Student')+Ak(100,25,100,90,'Age','d'))),
          Q("p4","4. Consider the following ER Diagram. Select the correct statement.",
            ["Each instance of Advisor is related to zero, one or many instances of Student.","Each instance of Student is related to multiple instances of Advisor.","Each instance of HAS relates one instance of Advisor and many instances of Student.","Each instance of HAS relates one instance of Student and many instances of Advisor."],
            0,"a. Each instance of Advisor is related to zero, one or many instances of Student.",
            "العلاقة Student (M) : Advisor (1) بمشاركة جزئية (خط مفرد)؛ المرشد قد يكون له صفر أو واحد أو عدة طلاب. أما كل Instance من HAS فتربط طالباً واحداً بمرشد واحد فقط (c و d خطأ)، والطالب له مرشد واحد فقط (b خطأ).",
            vt(['Student'],['Advisor'],'HAS',0,'M','1',0,0)),
          Q("p5","5. Consider the ER diagram in Question 4. If there are 4 Advisors and 8 Students, how many instances of HAS are there?",
            ["min 0, max 4","min 0, max 8","min 8, max 8","min 4, max 8"],
            1,"b. min 0, max 8",
            "المشاركة جزئية (Partial) فقد لا يوجد أي ارتباط (min = 0)، وكل طالب يرتبط بمرشد واحد على الأكثر، فالحد الأقصى = عدد الطلاب = 8.",
            vt(['Student'],['Advisor'],'HAS',0,'M','1',0,0)),
          Q("p6","6. Consider the following ER Diagram. Select the correct statement.",
            ["Each instance of Car must participate in one instance of HAS.","Each instance of Student is related to exactly one instance of Car.","Each instance of HAS relates one instance of Student and one instance of Car.","All the choices are correct."],
            2,"c. Each instance of HAS relates one instance of Student and one instance of Car.",
            "العلاقة 1:1 بمشاركة جزئية (خطوط مفردة)؛ لذلك a و b غير صحيحتين (لا يوجد إلزام Must/Exactly)، والصحيح أن كل Instance من HAS تربط طالباً واحداً بسيارة واحدة.",
            stuCar),
          Q("p7","7. Consider the ER diagram in Question 6. If there are 4 Students and 8 Cars, how many instances of HAS are there?",
            ["min 0, max 4","min 4, max 8","min 1, max 4","min 0, max 8"],
            0,"a. min 0, max 4",
            "علاقة 1:1 بمشاركة جزئية: الأدنى 0، والأقصى = الأصغر بين العددين = min(4, 8) = 4 لأن كل طالب له سيارة واحدة وكل سيارة لطالب واحد.",
            stuCar),
          Q("p8","8. Consider the following ER. If there are 4 Students and 8 Cars, how many instances of HAS are there?",
            ["min 4, max 8","min 4, max 4","min 0, max 8","min 0, max 4"],
            1,"b. min 4, max 4",
            "الخط المزدوج بين Student و HAS يعني مشاركة كلية (Total) للطالب: كل طالب لازم يملك سيارة (min = 4)، والعلاقة 1:1 فالحد الأقصى 4 أيضاً.",
            vt(['Student'],['Car'],'HAS',0,'1','1',1,0)),
          Q("p9","9. Consider the following ER Diagram. Select the correct statement.",
            ["Each instance of Student must be related to many instances of HAS.","Each instance of Student must be related to many instances of Car.","Each instance of Student is related to zero, one or many instances of Car.","Each instance of HAS relates N instances of Student and M instances of Car."],
            2,"c. Each instance of Student is related to zero, one or many instances of Car.",
            "علاقة M:N بمشاركة جزئية؛ الطالب قد لا يملك سيارة أو يملك سيارة أو عدة سيارات. كلمة must خاطئة، وكل Instance من HAS تربط عنصراً واحداً من كل طرف.",
            vt(['Student'],['Car'],'HAS',0,'M','N',0,0)),
          Q("p10","10. What is the error in the following ER Diagram?",
            ["The SecNo should be primary key of Section entity.","N should be 1.","Course's participation in HAS relationship should be total.","M should be 1."],
            3,"d. M should be 1.",
            "Section كيان ضعيف يعتمد على Course عبر علاقة تعريفية (Identifying) وهي دائماً 1:N: المقرر الواحد له عدة شعب، والشعبة تتبع مقرراً واحداً. لذلك جهة Course يجب أن تكون 1 وليس M. و SecNo مفتاح جزئي (Partial Key) صحيح.",
            vt(['Course'],['Section',1],'HAS',1,'M','N',0,1,Ak(100,25,235,25,'CrsNo','k')+Ak(100,185,235,185,'SecNo','p'),300))
        ]
      },
      {
        title: "سيناريو شركة التلفزيون (Q11–Q15)",
        context: "Consider the following Database requirements.\nA TV Company (شركة تلفزيون) has decided to store information about musicians (مطربين) who perform on its albums (ألبوم الأغاني) in a database. Choose the right ER diagram that corresponds to the following specification:",
        subQuestions: [
          Q("p11","11. Each musician has an ssn (unique), name, and phone number. Musician may marry another musician.",
            [{svg:mar(1,1,0)},{svg:mar(0,0,1)},{svg:mar(0,0,0)},{svg:mar(1,0,0)}],
            2,"c. Recursive 1:1 relationship (marry) with partial participation (single lines)",
            "كلمة may تعني مشاركة جزئية (خطوط مفردة) وليست كلية، والعلاقة 1:1 لأن المطرب يتزوج مطرباً واحداً. الخط المزدوج (a, d) يعني الإلزام، والمعين المزدوج (b) يعني علاقة تعريفية لكيان ضعيف وهذا غير مطلوب."),
          Q("p12","12. Each instrument used in songs has a name, a type, and an id (unique). A musician may play several instruments, and an instrument may be played by several musicians. An instrument should have musicians who use it. Each musician should know how to play at least one instrument.",
            [{svg:bin(MU(),IN(),'plays',0,1,0,'N','1')},{svg:bin(MU(),IN(1),'plays',1,1,1,'N','N')},{svg:bin(MU(),IN(),'plays',0,1,1,'N','N')},{svg:bin(MU(1),IN(),'plays',0,1,1,'N','N')}],
            2,"c. M:N relationship with total participation on both sides (double lines), both regular entities",
            "العلاقة M:N (N و N)، و should تعني مشاركة كلية من الطرفين (خطين مزدوجين). الكيانان عاديان لأن لكل منهما مفتاحه (ssn و iid)، فلا يوجد كيان ضعيف ولا علاقة تعريفية."),
          Q("p13","13. Each album has a title, format (CD, DVD, etc.), and an id (unique). Each song recorded has a title, author, and a song id (unique within an album). Each album has a number of songs, but no song may appear on more than one album.",
            [{svg:bin(AL,SG(0,'k'),'has',0,1,0,'1','N')},{svg:bin(AL,SG(1,'p'),'has',1,0,1,'1','N')},{svg:bin(AL,SG(1,'p'),'has',1,1,1,'1','N')},{svg:bin(AL,SG(0,'k'),'has',0,0,0,'1','N')}],
            1,"b. Song is a weak entity (double box) with partial key sid, identifying relationship (double diamond), 1:N",
            "رقم الأغنية unique داخل الألبوم فقط ⇒ sid مفتاح جزئي (Partial key) و Song كيان ضعيف يعتمد على Album عبر علاقة تعريفية 1:N. المشاركة الكلية (خط مزدوج) تكون من جهة الكيان الضعيف فقط."),
          Q("p14","14. Each song is performed by one or more musicians, and a musician may perform a number of songs. A musician is paid money for every song he/she performs.",
            [{svg:bin(MU(),SG(0,'k'),'performs',0,0,1,'N','N',Ln(225,53,225,38)+At(225,25,'money'),490)},
             {svg:bin(MU(),SG(0,'k'),'performs',0,0,1,'N','N',Ln(225,53,225,38)+At(225,25,'money','k'),490)},
             {svg:bin(['Musician',0,[['ssn',30,'k'],['name',85],['phone',142],['money',205]]],SG(0,'k'),'performs',0,0,1,'N','N','',490)},

    let userScores = {};

    function initQuiz() {
      const driveBtn = document.getElementById('drive-link-btn');
      if (driveBtn) {
        if (originalDriveLink && originalDriveLink.trim() !== "") {
          driveBtn.href = originalDriveLink;
          driveBtn.style.display = "inline-flex";
        } else {
          driveBtn.style.display = "none";
        }
      }

      const list = document.getElementById('quiz-list');
      if (!list) return;
      list.innerHTML = '';

      examSections.forEach(section => {
        const card = document.createElement('div');
        card.className = 'q-card ltr-content';

        let subQuestionsHtml = '';

        section.subQuestions.forEach(sub => {
          const optsHtml = sub.opts.map((opt, i) => `
            <div class="option-item" id="opt-${sub.id}-${i}" onclick="selectSingleOption('${sub.id}', ${i})">
              <div class="opt-letter">${letters[i]}</div>
              <div style="min-width:0;flex:1">${typeof opt==='string'?escapeHtml(opt):opt.svg}</div>
            </div>
          `).join('');

          subQuestionsHtml += `
            <div class="sub-question-card ltr-content" id="card-${sub.id}">
              <div class="sub-q-header" style="white-space: pre-line;">${escapeHtml(sub.text)}</div>${sub.diagram?`<div style="background:rgba(255,255,255,0.05);border:1px solid var(--apple-border);border-radius:10px;padding:14px 10px;margin:4px 0 12px;overflow-x:auto">${sub.diagram}</div>`:''}
              <div class="options-container" id="opts-box-${sub.id}">${optsHtml}</div>
              <div class="answer-input-row">
                <button class="btn-reset-q" id="reset-btn-${sub.id}" onclick="resetSubQuestion('${sub.id}')">إعادة السؤال ↻</button>
                <button class="btn-action" onclick="toggleSolution('${sub.id}')">
                  <span>💡</span> عرض الحل
                </button>
              </div>
              <div class="solution-box" id="sol-${sub.id}">
                <div><strong>الإجابة النموذجية المعتمدة (Final Answer):</strong></div>
                <div style="margin-top: 6px; font-size: 0.95rem; font-weight: bold; line-height: 1.6; font-family: 'JetBrains Mono', Consolas, monospace; color: #5ac8fa;">${escapeHtml(sub.dispAnswer)}</div>
                <div style="margin-top: 8px; font-size: 0.90rem; line-height: 1.6; color: var(--text-primary); direction: rtl; text-align: right; white-space: pre-line;">${sub.exp}</div>
              </div>
            </div>
          `;
        });

        card.innerHTML = `
          <div>
            <div class="parent-q-title">${section.title}</div>
            <div class="parent-q-desc">${section.context}</div>
          </div>
          <div class="sub-list">${subQuestionsHtml}</div>
        `;

        list.appendChild(card);
      });

      calculateScore();
    }

    function findSubQuestion(subId) {
      for (const sec of examSections) {
        const found = sec.subQuestions.find(s => s.id === subId);
        if (found) return found;
      }
      return null;
    }

    /* ================= منطق عدم كشف الحل عند الخطأ + إظهار إعادة السؤال ================= */
    function selectSingleOption(subId, optIdx) {
      const sub = findSubQuestion(subId);
      const optsBox = document.getElementById(`opts-box-${subId}`);
      const resetBtn = document.getElementById(`reset-btn-${subId}`);
      if (!sub || !optsBox) return;

      optsBox.classList.add('locked');

      const picked = document.getElementById(`opt-${subId}-${optIdx}`);
      if (optIdx === sub.ans) {
        if (picked) picked.classList.add('correct');
        userScores[subId] = true;
      } else {
        if (picked) picked.classList.add('wrong');
        // لا يتم إظهار الإجابة الصحيحة عند الخطأ إطلاقاً
        delete userScores[subId];
      }

      if (resetBtn) resetBtn.style.display = 'inline-flex';
      calculateScore();
    }

    function resetSubQuestion(subId) {
      delete userScores[subId];

      const optsBox = document.getElementById(`opts-box-${subId}`);
      if (optsBox) {
        optsBox.classList.remove('locked');
      }

      const sub = findSubQuestion(subId);
      if (sub && sub.opts) {
        sub.opts.forEach((_, i) => {
          const el = document.getElementById(`opt-${subId}-${i}`);
          if (el) el.className = 'option-item';
        });
      }

      const resetBtn = document.getElementById(`reset-btn-${subId}`);
      const sol = document.getElementById(`sol-${subId}`);

      if (resetBtn) resetBtn.style.display = 'none';
      if (sol) sol.classList.remove('show');

      calculateScore();
    }

    function calculateScore() {
      let total = 0;
      examSections.forEach(sec => { total += sec.subQuestions.length; });

      let score = 0;
      for (const k in userScores) {
        if (userScores[k]) score++;
      }

      const pct = total > 0 ? Math.round((score / total) * 100) : 0;
      const scoreEl = document.getElementById('score');
      if (scoreEl) {
        scoreEl.innerText = `${score} / ${total} (${pct}%)`;
      }
    }

    function toggleSolution(id) {
      const sol = document.getElementById(`sol-${id}`);
      if (sol) sol.classList.toggle('show');
    }

    let allShown = false;
    function toggleAllSolutions() {
      allShown = !allShown;
      const allSols = document.querySelectorAll('.solution-box');
      allSols.forEach(sol => {
        if (allShown) sol.classList.add('show');
        else sol.classList.remove('show');
      });
    }

    function resetQuiz() {
      userScores = {};
      initQuiz();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    initQuiz();
  </script>
  <script src="../transition.js"></script>
