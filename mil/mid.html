  <style>
    .bottom-nav-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      margin-top: 36px;
      padding-top: 24px;
      border-top: 1px solid var(--apple-border);
    }
    .btn-bottom-action {
      background: var(--apple-surface);
      border: 1px solid var(--apple-border-strong);
      color: var(--text-primary);
      padding: 12px 26px;
      border-radius: 99px;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.95rem;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      backdrop-filter: blur(20px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      transition: all 0.25s var(--ease-apple);
    }
    .btn-bottom-action:hover {
      background: var(--apple-surface-hover);
      border-color: rgba(255, 255, 255, 0.25);
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
    }
    .btn-bottom-action:active {
      transform: scale(0.96);
    }
    .btn-drive-action {
      background: linear-gradient(135deg, rgba(10, 132, 255, 0.15) 0%, rgba(48, 209, 88, 0.15) 100%);
      border-color: rgba(10, 132, 255, 0.4);
      color: #5ac8fa;
    }
    .btn-drive-action:hover {
      background: var(--apple-blue);
      color: #ffffff;
      border-color: var(--apple-blue);
    }

    .parent-q-title {
      font-size: 1.18rem;
      font-weight: 800;
      color: var(--apple-blue, #0a84ff);
      margin-bottom: 8px;
      border-bottom: 1px dashed var(--apple-border);
      padding-bottom: 8px;
    }
    .parent-q-desc {
      font-size: 0.98rem;
      line-height: 1.7;
      color: var(--text-secondary);
      margin-bottom: 18px;
    }
    .sub-question-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--apple-border);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 18px;
      text-align: right;
      direction: rtl;
    }
    .sub-q-header {
      font-weight: 700;
      font-size: 1.02rem;
      margin-bottom: 14px;
      color: var(--text-primary);
      line-height: 1.7;
    }

    .options-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin: 14px 0;
    }
    .options-container.locked {
      pointer-events: none;
    }

    .option-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 16px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--apple-border);
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
      user-select: none;
      font-size: 0.98rem;
    }
    .option-item:hover {
      background: rgba(255, 255, 255, 0.08);
    }
    .option-item.selected {
      border-color: var(--apple-blue);
      background: rgba(10, 132, 255, 0.12);
    }
    .option-item.correct {
      background: rgba(48, 209, 88, 0.18) !important;
      border-color: #30d158 !important;
      color: #fff;
    }
    .option-item.wrong {
      background: rgba(255, 69, 58, 0.18) !important;
      border-color: #ff453a !important;
      color: #fff;
    }
    .opt-letter {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 0.85rem;
      flex-shrink: 0;
    }

    .answer-input-row {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    .btn-reset-q {
      display: none;
      background: rgba(255, 69, 58, 0.15);
      color: #ff453a;
      border: 1px solid rgba(255, 69, 58, 0.4);
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.85rem;
      transition: all 0.2s;
    }
    .btn-reset-q:hover {
      background: #ff453a;
      color: #fff;
    }
    .solution-box {
      display: none;
      margin-top: 14px;
      padding: 14px 16px;
      background: rgba(10, 132, 255, 0.08);
      border: 1px solid rgba(10, 132, 255, 0.25);
      border-radius: 10px;
    }
    .solution-box.show {
      display: block;
    }
  </style>
</head>

  <div class="report-modal-overlay" id="reportOverlay" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="report-modal">
      <div class="report-modal-header">
        <h3>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>

        <button class="btn-close-modal" id="closeReportBtn" aria-label="إغلاق">✕</button>
      </div>

      <form class="report-form" id="bugReportForm">
        <div class="form-group">
          <label for="issue-type">نوع المشكلة</label>

            <option value="سؤال أو إجابة خاطئة">خطأ في سؤال أو إجابة</option>
            <option value="خلل في التصميم أو الموقع">مشكلة في عرض الصفحة أو الموقع</option>
            <option value="اقتراح أو أخرى">اقتراح / أخرى</option>
          </select>
        </div>

        <div class="form-group">
          <label for="issue-desc">وصف المشكلة <span style="color:var(--apple-red)">*</span></label>
          <textarea id="issue-desc" placeholder="حدد السؤال أو المشكلة بالتفصيل..." required></textarea>
        </div>

        <div class="form-group">
          <label for="user-contact">وسيلة تواصل (اختياري)</label>
          <input type="text" id="user-contact" placeholder="إيميلك أو حسابك للمتابعة">
        </div>

        <button type="submit" class="btn-submit-report" id="submitReportBtn">إرسال البلاغ</button>
        <div class="report-status" id="reportStatus"></div>
      </form>
    </div>
  </div>

  <script>
    const originalDriveLink = "";

    const letters = ['أ', 'ب', 'ج', 'د'];

    const examSections = [
      {
        title: "الجزء الأول: الثورة العربية الكبرى ونشأة الدولة والرموز الوطنية (الأسئلة 1 – 14)",
        context: "أسئلة حول دلالات شعار المملكة والراية والعلم، أهداف ونتائج الثورة العربية، محطات تأسيس الدولة والدستور وتعريب الجيش:",
        subQuestions: [
          {
            id: "mil_1",
            type: "single",
            text: "1) يرمز لون طائر العقاب في شعار المملكة الأردنية الهاشمية إلى:",
            opts: ["راية الثورة العربية الكبرى", "العزة والقوة والشجاعة", "شموخ شعار المملكة الهاشمية", "راية الرسول صلى الله عليه وسلم وعمامته"],
            ans: 3,
            dispAnswer: "د) راية الرسول صلى الله عليه وسلم وعمامته",
            exp: "يرمز طائر العقاب بحد ذاته إلى القوة والمنعة، بينما لونه الأسود يرمز لراية الرسول صلى الله عليه وسلم وعمامته."
          },
          {
            id: "mil_2",
            type: "single",
            text: "2) تعلو الحربة رأس التاج في شعار المملكة الأردنية الهاشمية وترمز إلى:",
            opts: ["قوة الجيش العربي", "حرية راية الهاشميين", "تاريخ الهاشميين", "عزة النفس العربية"],
            ans: 0,
            dispAnswer: "أ) قوة الجيش العربي",
            exp: "رأس الحربة التي تعلو التاج الملكي ترمز إلى حركة التحرر العربي وقوة الجيش العربي ومنعته في حماية الوطن."
          },
          {
            id: "mil_3",
            type: "single",
            text: "3) رقعة من نسيج ذات عدة ألوان تحمل أشكالاً أو رموزاً تمثل الشخصية الاعتبارية والسيادية للدولة، يُعرف بـ:",
            opts: ["شعار الدولة", "العلم الوطني", "الراية الهاشمية", "شعار الجيش العربي"],
            ans: 1,
            dispAnswer: "ب) العلم الوطني",
            exp: "العلم الوطني هو الراية والرمز السيادي الأول الذي يمثل الشخصية الاعتبارية والهوية الدستورية للدولة."
          },
          {
            id: "mil_4",
            type: "single",
            text: "4) تم تسليم الراية الهاشمية رسمياً لأبناء القوات المسلحة الأردنية / الجيش العربي من قبل جلالة الملك عبدالله الثاني في:",
            opts: ["ذكرى تعريب قيادة الجيش العربي", "ذكرى معركة الكرامة الخالدة", "ذكرى الثورة العربية الكبرى ويوم الجيش", "ذكرى استقلال المملكة الأردنية الهاشمية"],
            ans: 2,
            dispAnswer: "ج) ذكرى الثورة العربية الكبرى ويوم الجيش",
            exp: "سلّم جلالة القائد الأعلى الملك عبدالله الثاني الراية الهاشمية في 9 حزيران 2015 في ذكرى الثورة العربية الكبرى ويوم الجيش."
          },
          {
            id: "mil_5",
            type: "single",
            text: "5) أطلق الشريف الحسين بن علي رصاصة إعلان الثورة العربية الكبرى في عام:",
            opts: ["1918", "1916", "1948", "1921"],
            ans: 1,
            dispAnswer: "ب) 1916",
            exp: "انطلقت الثورة العربية الكبرى من مكة المكرمة في 10 حزيران 1916 من أجل حرية العرب واستقلالهم."
          },
          {
            id: "mil_6",
            type: "single",
            text: "6) يُعتبر بناء قوات مسلحة نظامية حديثة قادرة على فرض الأمن والاستقرار واستقلال الأراضي العربية من أهداف الثورة العربية الكبرى:",
            opts: ["السياسية", "العسكرية", "النفسية والمعنوية", "الاقتصادية"],
            ans: 1,
            dispAnswer: "ب) العسكرية",
            exp: "تكوين جيش نظامي عربي حديث وقادر على حماية السيادة كان يمثل الهدف العسكري الأساسي للثورة."
          },
          {
            id: "mil_7",
            type: "single",
            text: "7) قيام أول دولة عربية في سوريا في العصر الحديث (الحكومة الفيصلية) يُعد من:",
            opts: ["أسباب الثورة العربية الكبرى", "مرتكزات الثورة العربية الكبرى", "نتائج الثورة العربية الكبرى", "صعوبات الثورة العربية الكبرى"],
            ans: 2,
            dispAnswer: "ج) نتائج الثورة العربية الكبرى",
            exp: "تأسيس الدولة العربية في بلاد الشام بزعامة الملك فيصل كان من أبرز النتائج التاريخية المباشرة للثورة."
          },
          {
            id: "mil_8",
            type: "single",
            text: "8) إعادة وحدة العرب الروحية وإحياء التاريخ القومي العربي والاعتراف بنجد دولة مستقلة من:",
            opts: ["نتائج الثورة العربية الكبرى", "الصعوبات التي واجهت الثورة العربية الكبرى", "مرتكزات الثورة العربية الكبرى", "أسباب الثورة العربية الكبرى"],
            ans: 0,
            dispAnswer: "أ) نتائج الثورة العربية الكبرى",
            exp: "أعادت الثورة الاعتبار للهوية القومية وحققت استقلال الكيانات العربية في الجزيرة وبلاد الشام."
          },
          {
            id: "mil_9",
            type: "single",
            text: "9) أول وزارة تشكلت في عهد إمارة شرق الأردن (نيسان 1921) برئاسة رشيد طليع حملت اسم:",
            opts: ["مجلس الإمارة", "مجلس الشورى", "مجلس الأمة", "مجلس المشاورين"],
            ans: 3,
            dispAnswer: "د) مجلس المشاورين",
            exp: "أُطلق على أول حكومة أردنية تشكلت في 11 نيسان 1921 اسم 'مجلس المشاورين'."
          },
          {
            id: "mil_10",
            type: "single",
            text: "10) الملك الذي صدر الدستور الأردني المعمول به في عهده (دستور 1952) هو:",
            opts: ["الملك عبدالله الأول بن الحسين", "الملك طلال بن عبدالله", "الملك الحسين بن طلال", "الملك عبدالله الثاني بن الحسين"],
            ans: 1,
            dispAnswer: "ب) الملك طلال بن عبدالله",
            exp: "صدر الدستور الأردني الديمقراطي المتطور في 8 كانون الثاني 1952 في عهد المغفور له الملك طلال بن عبدالله."
          },
          {
            id: "mil_11",
            type: "single",
            text: "11) تم اتخاذ القرار التاريخي بتعريب قيادة الجيش العربي في عهد جلالة الملك الحسين بن طلال في:",
            opts: ["1 آذار 1956", "2 أيار 1954", "31 آذار 1956", "25 أيار 1957"],
            ans: 0,
            dispAnswer: "أ) 1 آذار 1956",
            exp: "أعلن الملك الحسين بن طلال رحمه الله في 1 آذار 1956 قراره الشجاع بإنهاء خدمة كلوب باشا وتعريب قيادة الجيش."
          },
          {
            id: "mil_12",
            type: "single",
            text: "12) بويع جلالة الملك عبدالله الثاني ابن الحسين ملكاً دستورياً على رأس المملكة الأردنية الهاشمية في عام:",
            opts: ["1992", "1996", "1999", "2001"],
            ans: 2,
            dispAnswer: "ج) 1999",
            exp: "تسلم جلالة الملك عبدالله الثاني سلطاته الدستورية في 7 شباط عام 1999."
          },
          {
            id: "mil_13",
            type: "single",
            text: "13) سيفان متقاطعان ونجمة سباعية وياقتان حمراوان على القبة ترمز إلى رتبة:",
            opts: ["عقيد", "عميد", "لواء", "فريق"],
            ans: 2,
            dispAnswer: "ج) لواء",
            exp: "شارة رتبة 'لواء' في القوات المسلحة تتألف من سيفين متقاطعين ونجمة سباعية وياقتين حمراوين."
          },
          {
            id: "mil_14",
            type: "single",
            text: "14) القدرة العلمية والاقتصادية وعدد السكان تُعد من العوامل المؤثرة تأثيراً مباشراً على:",
            opts: ["توفير متطلبات العمل اليومية", "تنظيم القوات المسلحة", "نسبة نجاح وفشل الخطط الفردية", "تحديد شارات الترقية فقط"],
            ans: 1,
            dispAnswer: "ب) تنظيم القوات المسلحة",
            exp: "يتحدد حجم الجيش، وتشكيلاته، ونوعية تسليحه وإدامته بناءً على الطاقات البشرية، والاقتصادية، والعلمية للدولة."
          }
        ]
      },
      {
        title: "الجزء الثاني: صنوف وتشكيلات القوات المسلحة الأردنية وسلاح الجو والبحرية (الأسئلة 15 – 28)",
        context: "أسئلة حول نشأة الصنوف، سلاح الصيانة، الدروع، المدفعية، الهندسة، الجو الملكي، والقوة البحرية:",
        subQuestions: [
          {
            id: "mil_15",
            type: "single",
            text: "15) السلاح الذي واكب تطور القوات المسلحة الأردنية منذ عام 1921 (باسم المفارز الفنية) هو:",
            opts: ["سلاح الهندسة الملكي", "سلاح الجو الملكي", "سلاح المشاة الملكي", "سلاح الصيانة الملكي"],
            ans: 3,
            dispAnswer: "د) سلاح الصيانة الملكي",
            exp: "بدأ سلاح الصيانة مع تأسيس إمارة شرق الأردن عام 1921 عبر 'المفارز الفنية' وتطور ليواكب مسيرة الجيش العربي."
          },
          {
            id: "mil_16",
            type: "single",
            text: "16) من أبرز مهام وواجبات سلاح الصيانة الملكي الأساسية:",
            opts: ["زراعة حقول الألغام وإزالتها", "تقديم المشورة الفنية لجميع وحدات القوات المسلحة ولكافة المستويات", "إدامة الاتصالات اللاسلكية السيادية", "الإنزال الجوي المظلي خلف خطوط العدو"],
            ans: 1,
            dispAnswer: "ب) تقديم المشورة الفنية لجميع وحدات القوات المسلحة ولكافة المستويات",
            exp: "يتولى سلاح الصيانة الإدامة الفنية والتصليح لكافة آليات وأسلحة الجيش العربي وتقديم الاستشارات الهندسية والفنية."
          },
          {
            id: "mil_17",
            type: "single",
            text: "17) إعطاء العمق للقتال (قصف وتدمير أهداف في عمق العدو) من أدوار وواجبات سلاح:",
            opts: ["المدفعية", "اللاسلكي", "الهندسة", "الصيانة"],
            ans: 0,
            dispAnswer: "أ) المدفعية",
            exp: "تؤمن المدفعية نيران الإسناد والعمق الناري التكتيكي والتعبوي لشل تحركات وقدرات العدو الخلفية."
          },
          {

    let userScores = {};

    function initQuiz() {
      const driveBtn = document.getElementById('drive-link-btn');
      if (driveBtn) {
        if (originalDriveLink && originalDriveLink.trim() !== "") {
          driveBtn.href = originalDriveLink;
          driveBtn.style.display = "inline-flex";
        } else {
          driveBtn.style.display = "none";
        }
      }

      const list = document.getElementById('quiz-list');
      list.innerHTML = '';

      examSections.forEach((section) => {
        const card = document.createElement('div');
        card.className = 'q-card';

        let subQuestionsHtml = '';
        section.subQuestions.forEach((sub) => {
          const optsHtml = sub.opts.map((opt, i) => `
            <div class="option-item" id="opt-${sub.id}-${i}" onclick="selectSingleOption('${sub.id}', ${i})">
              <div class="opt-letter">${letters[i]}</div>
              <div>${opt}</div>
            </div>
          `).join('');

          const interactionHtml = `
            <div class="options-container" id="opts-box-${sub.id}">${optsHtml}</div>
            <div class="answer-input-row">
              <button class="btn-reset-q" id="reset-btn-${sub.id}" onclick="resetSubQuestion('${sub.id}')">إعادة السؤال ↻</button>
              <button class="btn-action" onclick="toggleSolution('${sub.id}')">
                <span>💡</span> عرض الحل
              </button>
            </div>
          `;

          subQuestionsHtml += `
            <div class="sub-question-card" id="card-${sub.id}">
              <div class="sub-q-header">${sub.text}</div>
              ${interactionHtml}
              <div class="solution-box" id="sol-${sub.id}">
                <div><strong>الإجابة الصحيحة:</strong></div>
                <div style="margin-top: 6px; font-size: 0.98rem; font-weight: bold; line-height: 1.6; color: #5ac8fa;">${sub.dispAnswer}</div>
                <div style="margin-top: 6px; font-size: 0.90rem; line-height: 1.6; color: var(--text-secondary);">${sub.exp}</div>
              </div>
            </div>
          `;
        });

        card.innerHTML = `
          <div>
            <div class="parent-q-title">${section.title}</div>
            <div class="parent-q-desc">${section.context}</div>
          </div>
          <div class="sub-list">${subQuestionsHtml}</div>
        `;

        list.appendChild(card);
      });

      calculateScore();
      setupReportModal();
    }

    function findSubQuestion(subId) {
      for (const sec of examSections) {
        const found = sec.subQuestions.find(s => s.id === subId);
        if (found) return found;
      }
      return null;
    }

    function selectSingleOption(subId, optIdx) {
      const sub = findSubQuestion(subId);
      const optsBox = document.getElementById(`opts-box-${subId}`);
      const resetBtn = document.getElementById(`reset-btn-${subId}`);
      if (!sub || !optsBox) return;

      optsBox.classList.add('locked');

      const picked = document.getElementById(`opt-${subId}-${optIdx}`);
      if (optIdx === sub.ans) {
        if (picked) picked.classList.add('correct');
        userScores[subId] = true;
      } else {
        if (picked) picked.classList.add('wrong');
        const correctOpt = document.getElementById(`opt-${subId}-${sub.ans}`);
        if (correctOpt) correctOpt.classList.add('correct');
        delete userScores[subId];
      }

      if (resetBtn) resetBtn.style.display = 'inline-flex';
      calculateScore();
    }

    function resetSubQuestion(subId) {
      delete userScores[subId];

      const optsBox = document.getElementById(`opts-box-${subId}`);
      if (optsBox) optsBox.classList.remove('locked');

      const sub = findSubQuestion(subId);
      if (sub && sub.opts) {
        sub.opts.forEach((_, i) => {
          const el = document.getElementById(`opt-${subId}-${i}`);
          if (el) el.className = 'option-item';
        });
      }

      const resetBtn = document.getElementById(`reset-btn-${subId}`);
      const sol = document.getElementById(`sol-${subId}`);

      if (resetBtn) resetBtn.style.display = 'none';
      if (sol) sol.classList.remove('show');

      calculateScore();
    }

    function calculateScore() {
      let total = 0;
      let score = 0;
      examSections.forEach(sec => {
        sec.subQuestions.forEach(sub => {
          total++;
          if (userScores[sub.id]) score++;
        });
      });

      const pct = total > 0 ? Math.round((score / total) * 100) : 0;
      const scoreEl = document.getElementById('score');
      if (scoreEl) {
        scoreEl.innerText = `${score} / ${total} (${pct}%)`;
      }
    }

    function toggleSolution(subId) {
      const sol = document.getElementById(`sol-${subId}`);
      if (sol) sol.classList.toggle('show');
    }

    let allShown = false;
    function toggleAllSolutions() {
      allShown = !allShown;
      examSections.forEach(sec => {
        sec.subQuestions.forEach(sub => {
          const sol = document.getElementById(`sol-${sub.id}`);
          if (sol) {
            if (allShown) sol.classList.add('show');
            else sol.classList.remove('show');
          }
        });
      });
    }

    function resetQuiz() {
      userScores = {};
      initQuiz();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function setupReportModal() {
      const openBtn = document.getElementById('openReportBtn');
      const closeBtn = document.getElementById('closeReportBtn');
      const overlay = document.getElementById('reportOverlay');
      const form = document.getElementById('bugReportForm');
      const status = document.getElementById('reportStatus');

      if (!openBtn || !overlay) return;

      openBtn.onclick = () => {
        overlay.classList.add('active');
        overlay.setAttribute('aria-hidden', 'false');
      };

      const closeModal = () => {
        overlay.classList.remove('active');
        overlay.setAttribute('aria-hidden', 'true');
        if (status) status.innerText = '';
      };

      if (closeBtn) closeBtn.onclick = closeModal;

      overlay.onclick = (e) => {
        if (e.target === overlay) closeModal();
      };

      if (form) {
        form.onsubmit = (e) => {
          e.preventDefault();
          const submitBtn = document.getElementById('submitReportBtn');
          if (submitBtn) submitBtn.disabled = true;
          if (status) {
            status.style.color = '#30d158';
            status.innerText = 'تم إرسال البلاغ بنجاح، شكراً لمساعدتك!';
          }
          setTimeout(() => {
            closeModal();
            form.reset();
            if (submitBtn) submitBtn.disabled = false;
          }, 1500);
        };
      }
    }

    initQuiz();
  </script>
