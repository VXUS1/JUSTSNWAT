  <style>
    .bottom-nav-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      margin-top: 36px;
      padding-top: 24px;
      border-top: 1px solid var(--apple-border);
    }
    .btn-bottom-action {
      background: var(--apple-surface);
      border: 1px solid var(--apple-border-strong);
      color: var(--text-primary);
      padding: 12px 26px;
      border-radius: 99px;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.95rem;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      backdrop-filter: blur(20px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      transition: all 0.25s var(--ease-apple);
    }
    .btn-bottom-action:hover {
      background: var(--apple-surface-hover);
      border-color: rgba(255, 255, 255, 0.25);
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
    }
    .btn-bottom-action:active {
      transform: scale(0.96);
    }
    .btn-drive-action {
      background: linear-gradient(135deg, rgba(10, 132, 255, 0.15) 0%, rgba(48, 209, 88, 0.15) 100%);
      border-color: rgba(10, 132, 255, 0.4);
      color: #5ac8fa;
    }
    .btn-drive-action:hover {
      background: var(--apple-blue);
      color: #ffffff;
      border-color: var(--apple-blue);
    }

    .parent-q-title {
      font-size: 1.18rem;
      font-weight: 800;
      color: var(--apple-blue, #0a84ff);
      margin-bottom: 8px;
      border-bottom: 1px dashed var(--apple-border);
      padding-bottom: 8px;
    }
    .parent-q-desc {
      font-size: 0.98rem;
      line-height: 1.7;
      color: var(--text-secondary);
      margin-bottom: 18px;
    }
    .sub-question-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--apple-border);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 18px;
      text-align: right;
      direction: rtl;
    }
    .sub-q-header {
      font-weight: 700;
      font-size: 1.02rem;
      margin-bottom: 14px;
      color: var(--text-primary);
      line-height: 1.7;
    }

    .options-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin: 14px 0;
    }
    .options-container.locked {
      pointer-events: none;
    }

    .option-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 16px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--apple-border);
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
      user-select: none;
      font-size: 0.98rem;
    }
    .option-item:hover {
      background: rgba(255, 255, 255, 0.08);
    }
    .option-item.selected {
      border-color: var(--apple-blue);
      background: rgba(10, 132, 255, 0.12);
    }
    .option-item.correct {
      background: rgba(48, 209, 88, 0.18) !important;
      border-color: #30d158 !important;
      color: #fff;
    }
    .option-item.wrong {
      background: rgba(255, 69, 58, 0.18) !important;
      border-color: #ff453a !important;
      color: #fff;
    }
    .opt-letter {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 0.85rem;
      flex-shrink: 0;
    }

    .answer-input-row {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    .btn-reset-q {
      display: none;
      background: rgba(255, 69, 58, 0.15);
      color: #ff453a;
      border: 1px solid rgba(255, 69, 58, 0.4);
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.85rem;
      transition: all 0.2s;
    }
    .btn-reset-q:hover {
      background: #ff453a;
      color: #fff;
    }
    .solution-box {
      display: none;
      margin-top: 14px;
      padding: 14px 16px;
      background: rgba(10, 132, 255, 0.08);
      border: 1px solid rgba(10, 132, 255, 0.25);
      border-radius: 10px;
    }
    .solution-box.show {
      display: block;
    }
  </style>
</head>

  <!-- نافذة التبليغ المنبثقة -->
  <div class="report-modal-overlay" id="reportOverlay" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="report-modal">
      <div class="report-modal-header">
        <h3>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          إبلاغ عن خطأ أو ملاحظة
        </h3>
        <button class="btn-close-modal" id="closeReportBtn" aria-label="إغلاق">✕</button>
      </div>

      <form class="report-form" id="bugReportForm">
        <div class="form-group">
          <label for="issue-type">نوع المشكلة</label>
          <select id="issue-type" required>
            <option value="سؤال أو إجابة خاطئة">خطأ في سؤال أو إجابة</option>
            <option value="خلل في التصميم أو الموقع">مشكلة في عرض الصفحة أو الموقع</option>
            <option value="اقتراح أو أخرى">اقتراح / أخرى</option>
          </select>
        </div>

        <div class="form-group">
          <label for="issue-desc">وصف المشكلة <span style="color:var(--apple-red)">*</span></label>
          <textarea id="issue-desc" placeholder="حدد السؤال أو المشكلة بالتفصيل..." required></textarea>
        </div>

        <div class="form-group">
          <label for="user-contact">وسيلة تواصل (اختياري)</label>
          <input type="text" id="user-contact" placeholder="إيميلك أو حسابك للمتابعة">
        </div>

        <button type="submit" class="btn-submit-report" id="submitReportBtn">إرسال البلاغ</button>
        <div class="report-status" id="reportStatus"></div>
      </form>
    </div>
  </div>

  <script>
    const originalDriveLink = "";

    const letters = ['أ', 'ب', 'ج', 'د'];

    const examSections = [
      {
        title: "الجزء الأول: دائرة المخابرات العامة ومفاهيم الولاء والانتماء والمواطنة (الأسئلة 1 – 15)",
        context: "أسئلة حول تاريخ المخابرات العامة ومكاتبها عام 1957، تشريعاتها، ومفاهيم الانتماء والولاء ودور الأسرة:",
        subQuestions: [
          {
            id: "fin_q1",
            type: "single",
            text: "1) كان يُعرف جهاز المخابرات العامة سابقاً (عند التأسيس الأولي) بـ:",
            opts: ["دائرة المباحث العامة (الجنائية)", "مكتب المظالم", "ديوان المخابرات العامة", "الأمن الوقائي"],
            ans: 0,
            dispAnswer: "أ) دائرة المباحث العامة (الجنائية)",
            exp: "تأسست دائرة المباحث العامة عام 1957 لتتولى المهام الاستخبارية والأمنية قبل صدور قانون دائرة المخابرات العامة المستقل عام 1964."
          },
          {
            id: "fin_q2",
            type: "single",
            text: "2) المحافظة على أمن القوات المسلحة من عمليات الاختراق والتغلغل الحزبي كانت في عام 1957م مهمة:",
            opts: ["مكتب التحقيقات السياسية", "دائرة المباحث العامة", "الأمن العام", "المحكمة العسكرية الخاصة"],
            ans: 0,
            dispAnswer: "أ) مكتب التحقيقات السياسية",
            exp: "أُنشئ مكتب التحقيقات السياسية في القوات المسلحة عام 1957 لحماية الجيش من النشاطات والتدخلات الحزبية والسياسية."
          },
          {
            id: "fin_q3",
            type: "single",
            text: "3) ارتبط مكتب التحقيقات السياسية في عام 1957م مباشرة بـ:",
            opts: ["مديرية الأمن العام", "رئيس الوزراء", "القوات المسلحة الأردنية / الجيش العربي", "جلالة الملك المعظم"],
            ans: 2,
            dispAnswer: "ج) القوات المسلحة الأردنية / الجيش العربي",
            exp: "كان مكتب التحقيقات السياسية يتبع قيادة الجيش العربي لتأمين سلامة وانضباط التشكيلات العسكرية."
          },
          {
            id: "fin_q4",
            type: "single",
            text: "4) في عام 1957 تم تأسيس جهازين/مكتبين لممارسة الدور الاستخباري هما:",
            opts: [
              "مكتب التحقيق الشرطي ومكتب التحقيق العسكري",
              "مكتب التحقيقات السرية ومكتب التحقيقات الجنائية",
              "مكتب التنفيذ القضائي ومكتب الأمن الوقائي",
              "مكتب التحقيقات السياسية ودائرة المباحث العامة"
            ],
            ans: 3,
            dispAnswer: "د) مكتب التحقيقات السياسية ودائرة المباحث العامة",
            exp: "توزع العمل الاستخباري عام 1957 بين مكتب التحقيقات السياسية (بالجيش) ودائرة المباحث العامة (بالأمن العام)."
          },
          {
            id: "fin_q5",
            type: "single",
            text: "5) تسري على كافة موظفي وضباط وأعضاء دائرة المخابرات العامة أحكام قانون:",
            opts: ["العقوبات العسكري", "العقوبات المدني", "القانون القضائي", "نظام الخدمة المدنية"],
            ans: 0,
            dispAnswer: "أ) العقوبات العسكري",
            exp: "يخضع كادر دائرة المخابرات العامة للانضباط العسكري وأحكام قانون العقوبات العسكري وقوانين القوات المسلحة."
          },
          {
            id: "fin_q6",
            type: "single",
            text: "6) تُعتبر دائرة المخابرات العامة في التشريع الأردني:",
            opts: [
              "جهاز استخباري في مديرية الأمن العام",
              "من عداد القوات المسلحة الأردنية",
              "هيئة مدنية تابعة لوزارة العدل",
              "هيئة نظامية تابعة لوزارة الإدارة المحلية"
            ],
            ans: 1,
            dispAnswer: "ب) من عداد القوات المسلحة الأردنية",
            exp: "ينص القانون على أن دائرة المخابرات العامة وضباطها وأفرادها هم من عداد القوات المسلحة الأردنية - الجيش العربي."
          },
          {
            id: "fin_q7",
            type: "single",
            text: "7) جمع المعلومات عن العدو والعدو المحتمل وتقدير الموقف يُعد من صميم واجبات:",
            opts: ["المخابرات العامة", "الدفاع المدني", "قوات الدرك", "الأمن السياحي"],
            ans: 0,
            dispAnswer: "أ) المخابرات العامة",
            exp: "تقوم المخابرات العامة بجمع المعلومات الاستخبارية وتحليلها عن القوى المعادية والمحتملة لحماية الأمن الوطني والمصالح العليا."
          },
          {
            id: "fin_q8",
            type: "single",
            text: "8) ترتبط دائرة المخابرات العامة تنظيمياً وإدارياً بـ:",
            opts: ["مدير الأمن العام", "وزير الداخلية", "رئيس هيئة الأركان المشتركة", "رئيس الوزراء"],
            ans: 3,
            dispAnswer: "د) رئيس الوزراء",
            exp: "ترتبط دائرة المخابرات العامة برئيس الوزراء مباشرة وفق أحكام قانون دائرة المخابرات العامة."
          },
          {
            id: "fin_q9",
            type: "single",
            text: "9) العمل على رفعة شأن الوطن بالعلم والعمل المخلص من أخلاق وسلوكيات:",
            opts: ["المواطن المغترب", "المواطن الطالح", "المواطن غير المكترث", "المواطن الصالح"],
            ans: 3,
            dispAnswer: "د) المواطن الصالح",
            exp: "المواطن الصالح يترجم حبه لوطنه سلوكاً وفعلاً من خلال الإخلاص والعمل والإنتاجية وصون مقدرات الأمة."
          },
          {
            id: "fin_q10",
            type: "single",
            text: "10) من الأفعال والمواقف الإيجابية التي تدل على انتماء المواطن الحقيقي لوطنه:",
            opts: [
              "تعزيز الأمن واستثمار الموارد بالشكل الأمثل",
              "حماية منجزات الوطن ومكتسباته ومقاومة الشائعات",
              "المشاركة الفاعلة في تنمية المجتمع والدفاع عنه",
              "جميع ما ذكر صحيح"
            ],
            ans: 3,
            dispAnswer: "د) جميع ما ذكر صحيح",
            exp: "الانتماء الحقيقي سلوك وممارسة تشمل الحفاظ على المكتسبات، ترشيد الموارد، رد الشائعات، والمساهمة في استقرار الوطن."
          },
          {
            id: "fin_q11",
            type: "single",
            text: "11) أولى المؤسسات التي تحتضن الإنسان من اللحظات الأولى لحياته وتعمل على تأصيل الانتماء في نفسه هي:",
            opts: ["المدرسة", "الأسرة", "الجامعة", "دور العبادة"],
            ans: 1,
            dispAnswer: "ب) الأسرة",
            exp: "تُعد الأسرة اللبنة الاجتماعية والتربوية الأولى التي تغرس بذور الانتماء والولاء والأخلاق الحميدة في وجدان الطفل."
          },
          {
            id: "fin_q12",
            type: "single",
            text: "12) من أبرز آثار الولاء والانتماء الإيجابية على الفرد والمجتمع:",
            opts: ["التضحية والإيثار وتقديم الصالح العام", "انتشار الشائعات والفتن", "التسرع والتهور", "التطرف في الأخلاق والسلوك"],
            ans: 0,
            dispAnswer: "أ) التضحية والإيثار",
            exp: "يعزز الولاء والانتماء روح العطاء، والتكافل، والإيثار، وبذل الغالي والنفيس في سبيل حماية الوطن وازدهاره."
          },
          {
            id: "fin_q13",
            type: "single",
            text: "13) 'ما يشعر به الفرد من الاتجاهات الإيجابية نحو الجماعة ونحو قيمها وعاداتها وطريقتها في الحياة' يُعبر عن مفهوم:",
            opts: ["الانتماء", "الولاء", "الحرية", "المواطن الصالح"],
            ans: 1,
            dispAnswer: "ب) الولاء",
            exp: "الولاء هو الاستجابة والمشاعر والاتجاهات الإيجابية الوجدانية الصادقة للفرد نحو مبادئ وقيم وقيادة جماعته ووطنه."
          },
          {
            id: "fin_q14",
            type: "single",
            text: "14) 'الانتساب الذي يُعد واحداً من المفاهيم الهادفة التي تحدد طبيعة علاقة الفرد بالجماعة' هو المعنى الدقيق لـ:",
            opts: ["المفهوم العام", "المساواة", "الانتماء", "الولاء المادي"],
            ans: 2,
            dispAnswer: "ج) الانتماء",
            exp: "الانتماء لغة واصطلاحاً هو الانتساب والارتباط الحقيقي والواعي بالأرض والجماعة والوطن."
          },
          {
            id: "fin_q15",
            type: "single",
            text: "15) المحافظة على العادات والتقاليد العربية الأصيلة والقيم المتوارثة تُعد من مظاهر:",
            opts: ["السلم المجتمعي فقط", "الغلو والتطرف", "الأمن الجنائي", "الانتماء والولاء"],
            ans: 3,
            dispAnswer: "د) الانتماء والولاء",
            exp: "الاعتزاز بالهوية الوطنية والتراث القيمي والحضاري للأمة يجسد حقيقة الانتماء والولاء للأرض والتاريخ."
          }
        ]
      },
      {
        title: "الجزء الثاني: القيادة والشرعية الهاشمية ومفهوم الأمن الوطني وإستراتيجيته (الأسئلة 16 – 30)",
        context: "أسئلة حول الشرعية الدينية والتاريخية، فلسفة الحكم الهاشمي، المفهوم الشامل للأمن الوطني، والموقع الجغرافي:",
        subQuestions: [
          {
            id: "fin_q16",
            type: "single",
            text: "16) تتمثل 'الشرعية الدينية' للقيادة الهاشمية تاريخياً في كون:",
            opts: [
              "الهاشميين سادة العرب قبل الإسلام وبعده",
              "الهاشميين هم آل بيت رسول الله صلى الله عليه وسلم ونسبهم الشريف الموصول",
              "التأييد الشعبي لقادة الثورة العربية الكبرى فقط",
              "الدور الدبلوماسي في العالم الإسلامي"
            ],
            ans: 1,
            dispAnswer: "ب) الهاشميين هم آل بيت رسول الله",
            exp: "تنبثق الشرعية الدينية لبني هاشم من انتسابهم الشريف لآل بيت النبي محمد صلى الله عليه وسلم وسيرتهم العطرة."
          },
          {

              "افتتاح معهد تكنولوجيا الأجهزة الطبية",
              "دعم المشاريع الفردية للمخترعين حصراً"
            ],
            ans: 1,
            dispAnswer: "ب) تصنيع ممرات التعقيم وكمامات و أقنعة الأوجه",
            exp: "سخر المركز قدراته التصنيعية والتكنولوجية المتقدمة لإنتاج مستلزمات الحماية وممرات التعقيم لمساندة الجهود الوطنية في الجائحة."

          {

            opts: [
              "الهيئة الهاشمية للمصابين العسكريين",
              "المركز الوطني للأمن وإدارة الأزمات",
              "المركز الأردني للتصميم والتطوير (JODDB)",
              "المركز العسكري لمكافحة الإرهاب"
            ],
            ans: 2,
            dispAnswer: "ج) المركز الأردني للتصميم والتطوير",
            exp: "تأسس المركز (JODDB) كذراع بحثي وتصنيعي متقدم للقوات المسلحة لتأمين حلول دفاعية وتكنولوجية وطنية مبتكرة."
          },
          {
            id: "fin_q46",
            type: "single",
            text: "46) من الأهداف الاستراتيجية الأساسية للمركز الأردني للتصميم والتطوير (JODDB):",
            opts: [
              "توظيف الطاقات العمالية المؤقتة فقط",
              "تدريب المهندسين حديثي التخرج فقط",
              "تعزيز الاعتماد على الذات من خلال تطوير وإنتاج الأنظمة والمعدات الدفاعية",
              "تصنيع ممرات التعقيم بصورة حصرية"
            ],
            ans: 2,
            dispAnswer: "ج) تعزيز الاعتماد على الذات من خلال تطوير وانتاج الانظمة والمعدات",
            exp: "يهدف المركز إلى توطين التكنولوجيا الدفاعية وتعزيز الاستقلالية والاعتماد على الذات في تلبية متطلبات القوات المسلحة."
          },
          {
            id: "fin_q47",
            type: "single",
            text: "47) من أبرز الخدمات والقدرات الصناعية التي يقدمها المركز الأردني للقوات المسلحة:",
            opts: [
              "إعداد ونشر الأبحاث النظرية فقط",
              "تأسيس اتصال استراتيجي تجاري",
              "تأمين المراسلات والبيانات الإلكترونية الورقية",
              "تطوير وتعديل وإنتاج الأنظمة والمعدات والآليات العسكرية حسب المتطلبات والاحتياجات الميدانية"
            ],
            ans: 3,
            dispAnswer: "د) تطوير وانتاج الانظمة والمعدات حسب المتطلبات",
            exp: "يتولى المركز تصميم وتصنيع الآليات المصفحة وتحديث الأسلحة والأنظمة التكتيكية والاتصالات لتناسب متطلبات الميدان العسكري الأردني."

    let userScores = {};

    function initQuiz() {
      const driveBtn = document.getElementById('drive-link-btn');
      if (driveBtn) {
        if (originalDriveLink && originalDriveLink.trim() !== "") {
          driveBtn.href = originalDriveLink;
          driveBtn.style.display = "inline-flex";
        } else {
          driveBtn.style.display = "none";
        }
      }

      const list = document.getElementById('quiz-list');
      list.innerHTML = '';

      examSections.forEach((section) => {
        const card = document.createElement('div');
        card.className = 'q-card';

        let subQuestionsHtml = '';
        section.subQuestions.forEach((sub) => {
          const optsHtml = sub.opts.map((opt, i) => `
            <div class="option-item" id="opt-${sub.id}-${i}" onclick="selectSingleOption('${sub.id}', ${i})">
              <div class="opt-letter">${letters[i]}</div>
              <div>${opt}</div>
            </div>
          `).join('');

          const interactionHtml = `
            <div class="options-container" id="opts-box-${sub.id}">${optsHtml}</div>
            <div class="answer-input-row">
              <button class="btn-reset-q" id="reset-btn-${sub.id}" onclick="resetSubQuestion('${sub.id}')">إعادة السؤال ↻</button>
              <button class="btn-action" onclick="toggleSolution('${sub.id}')">
                <span>💡</span> عرض الحل
              </button>
            </div>
          `;

          subQuestionsHtml += `
            <div class="sub-question-card" id="card-${sub.id}">
              <div class="sub-q-header">${sub.text}</div>
              ${interactionHtml}
              <div class="solution-box" id="sol-${sub.id}">
                <div><strong>الإجابة الصحيحة:</strong></div>
                <div style="margin-top: 6px; font-size: 0.98rem; font-weight: bold; line-height: 1.6; color: #5ac8fa;">${sub.dispAnswer}</div>
                <div style="margin-top: 6px; font-size: 0.90rem; line-height: 1.6; color: var(--text-secondary);">${sub.exp}</div>
              </div>
            </div>
          `;
        });

        card.innerHTML = `
          <div>
            <div class="parent-q-title">${section.title}</div>
            <div class="parent-q-desc">${section.context}</div>
          </div>
          <div class="sub-list">${subQuestionsHtml}</div>
        `;

        list.appendChild(card);
      });

      calculateScore();
      setupReportModal();
    }

    function findSubQuestion(subId) {
      for (const sec of examSections) {
        const found = sec.subQuestions.find(s => s.id === subId);
        if (found) return found;
      }
      return null;
    }

    function selectSingleOption(subId, optIdx) {
      const sub = findSubQuestion(subId);
      const optsBox = document.getElementById(`opts-box-${subId}`);
      const resetBtn = document.getElementById(`reset-btn-${subId}`);
      if (!sub || !optsBox) return;

      optsBox.classList.add('locked');

      const picked = document.getElementById(`opt-${subId}-${optIdx}`);
      if (optIdx === sub.ans) {
        if (picked) picked.classList.add('correct');
        userScores[subId] = true;
      } else {
        if (picked) picked.classList.add('wrong');
        const correctOpt = document.getElementById(`opt-${subId}-${sub.ans}`);
        if (correctOpt) correctOpt.classList.add('correct');
        delete userScores[subId];
      }

      if (resetBtn) resetBtn.style.display = 'inline-flex';
      calculateScore();
    }

    function resetSubQuestion(subId) {
      delete userScores[subId];

      const optsBox = document.getElementById(`opts-box-${subId}`);
      if (optsBox) optsBox.classList.remove('locked');

      const sub = findSubQuestion(subId);
      if (sub && sub.opts) {
        sub.opts.forEach((_, i) => {
          const el = document.getElementById(`opt-${subId}-${i}`);
          if (el) el.className = 'option-item';
        });
      }

      const resetBtn = document.getElementById(`reset-btn-${subId}`);
      const sol = document.getElementById(`sol-${subId}`);

      if (resetBtn) resetBtn.style.display = 'none';
      if (sol) sol.classList.remove('show');

      calculateScore();
    }

    function calculateScore() {
      let total = 0;
      let score = 0;
      examSections.forEach(sec => {
        sec.subQuestions.forEach(sub => {
          total++;
          if (userScores[sub.id]) score++;
        });
      });

      const pct = total > 0 ? Math.round((score / total) * 100) : 0;
      const scoreEl = document.getElementById('score');
      if (scoreEl) {
        scoreEl.innerText = `${score} / ${total} (${pct}%)`;
      }
    }

    function toggleSolution(subId) {
      const sol = document.getElementById(`sol-${subId}`);
      if (sol) sol.classList.toggle('show');
    }

    let allShown = false;
    function toggleAllSolutions() {
      allShown = !allShown;
      examSections.forEach(sec => {
        sec.subQuestions.forEach(sub => {
          const sol = document.getElementById(`sol-${sub.id}`);
          if (sol) {
            if (allShown) sol.classList.add('show');
            else sol.classList.remove('show');
          }
        });
      });
    }

    function resetQuiz() {
      userScores = {};
      initQuiz();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function setupReportModal() {
      const openBtn = document.getElementById('openReportBtn');
      const closeBtn = document.getElementById('closeReportBtn');
      const overlay = document.getElementById('reportOverlay');
      const form = document.getElementById('bugReportForm');
      const status = document.getElementById('reportStatus');

      if (!openBtn || !overlay) return;

      openBtn.onclick = () => {
        overlay.classList.add('active');
        overlay.setAttribute('aria-hidden', 'false');
      };

      const closeModal = () => {
        overlay.classList.remove('active');
        overlay.setAttribute('aria-hidden', 'true');
        if (status) status.innerText = '';
      };

      if (closeBtn) closeBtn.onclick = closeModal;

      overlay.onclick = (e) => {
        if (e.target === overlay) closeModal();
      };

      if (form) {
        form.onsubmit = (e) => {
          e.preventDefault();
          const submitBtn = document.getElementById('submitReportBtn');
          if (submitBtn) submitBtn.disabled = true;
          if (status) {
            status.style.color = '#30d158';
            status.innerText = 'تم إرسال البلاغ بنجاح، شكراً لمساعدتك!';
          }
          setTimeout(() => {
            closeModal();
            form.reset();
            if (submitBtn) submitBtn.disabled = false;
          }, 1500);
        };
      }
    }

    initQuiz();
  </script>
  <script src="../transition.js"></script>
</body>
