<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JUSTSNWAT | العلوم العسكرية - مكمل أسئلة الميد الشامل</title>

  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">

  <style>
    .bottom-nav-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      margin-top: 36px;
      padding-top: 24px;
      border-top: 1px solid var(--apple-border);
    }
    .btn-bottom-action {
      background: var(--apple-surface);
      border: 1px solid var(--apple-border-strong);
      color: var(--text-primary);
      padding: 12px 26px;
      border-radius: 99px;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.95rem;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      backdrop-filter: blur(20px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      transition: all 0.25s var(--ease-apple);
    }
    .btn-bottom-action:hover {
      background: var(--apple-surface-hover);
      border-color: rgba(255, 255, 255, 0.25);
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
    }
    .btn-bottom-action:active {
      transform: scale(0.96);
    }
    .btn-drive-action {
      background: linear-gradient(135deg, rgba(10, 132, 255, 0.15) 0%, rgba(48, 209, 88, 0.15) 100%);
      border-color: rgba(10, 132, 255, 0.4);
      color: #5ac8fa;
    }
    .btn-drive-action:hover {
      background: var(--apple-blue);
      color: #ffffff;
      border-color: var(--apple-blue);
    }

    .parent-q-title {
      font-size: 1.18rem;
      font-weight: 800;
      color: var(--apple-blue, #0a84ff);
      margin-bottom: 8px;
      border-bottom: 1px dashed var(--apple-border);
      padding-bottom: 8px;
    }
    .parent-q-desc {
      font-size: 0.98rem;
      line-height: 1.7;
      color: var(--text-secondary);
      margin-bottom: 18px;
    }
    .sub-question-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--apple-border);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 18px;
      text-align: right;
      direction: rtl;
    }
    .sub-q-header {
      font-weight: 700;
      font-size: 1.02rem;
      margin-bottom: 14px;
      color: var(--text-primary);
      line-height: 1.7;
    }

    .options-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin: 14px 0;
    }
    .options-container.locked {
      pointer-events: none;
    }

    .option-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 16px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--apple-border);
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
      user-select: none;
      font-size: 0.98rem;
    }
    .option-item:hover {
      background: rgba(255, 255, 255, 0.08);
    }
    .option-item.selected {
      border-color: var(--apple-blue);
      background: rgba(10, 132, 255, 0.12);
    }
    .option-item.correct {
      background: rgba(48, 209, 88, 0.18) !important;
      border-color: #30d158 !important;
      color: #fff;
    }
    .option-item.wrong {
      background: rgba(255, 69, 58, 0.18) !important;
      border-color: #ff453a !important;
      color: #fff;
    }
    .opt-letter {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 0.85rem;
      flex-shrink: 0;
    }

    .answer-input-row {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    .btn-reset-q {
      display: none;
      background: rgba(255, 69, 58, 0.15);
      color: #ff453a;
      border: 1px solid rgba(255, 69, 58, 0.4);
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.85rem;
      transition: all 0.2s;
    }
    .btn-reset-q:hover {
      background: #ff453a;
      color: #fff;
    }
    .solution-box {
      display: none;
      margin-top: 14px;
      padding: 14px 16px;
      background: rgba(10, 132, 255, 0.08);
      border: 1px solid rgba(10, 132, 255, 0.25);
      border-radius: 10px;
    }
    .solution-box.show {
      display: block;
    }
  </style>
</head>
<body>

  <header class="header">
    <a class="brand" href="../index.html">JUSTSNWAT</a>
    <div class="sub-brand">بنك أسئلة السنوات السابقة — كل مادة وأسئلتها بمكان واحد.</div>
  </header>

  <div class="container">
    <div class="nav-bar">
      <a class="back-link" href="../index.html#/s/mil">‹ رجوع للمواد</a>
    </div>

    <div class="subject-title">العلوم العسكرية</div>
    <div class="subject-subtitle" id="quiz-subtitle">مكمل أسئلة امتحان منتصف الفصل (الميد) — 60 سؤالاً شاملاً</div>

    <div class="sticky-bar">
      <div class="score-text">النتيجة: <span class="score-val" id="score">0 / 0 (0%)</span></div>
      <div style="display: flex; gap: 10px;">
        <button class="btn btn-secondary" onclick="toggleAllSolutions()">إظهار/إخفاء الحلول</button>
        <button class="btn" onclick="resetQuiz()">إعادة البدء</button>
      </div>

    <div id="quiz-list"></div>

    <div class="bottom-nav-bar">
      <a id="drive-link-btn" class="btn-bottom-action btn-drive-action" style="display: none;" target="_blank" rel="noopener noreferrer">
        <span>📁</span> ملف الأسئلة الأصلي ↗
      </a>
      <a class="btn-bottom-action" href="../index.html#/s/mil">
        <span>📚</span> العودة إلى قائمة المواد
      </a>
    </div>
  </div>

  <footer>
    <p>Designed By Abdallah</p>
  </footer>

  <!-- زر التبليغ العائم -->
  <button class="btn-bug-float" id="openReportBtn" aria-label="الإبلاغ عن خطأ أو مشكلة">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <rect width="8" height="14" x="8" y="6" rx="4"></rect>
      <path d="m19 7-3 2"></path>
      <path d="m5 7 3 2"></path>
      <path d="m19 19-3-2"></path>
      <path d="m5 19 3-2"></path>
      <path d="M20 13h-4"></path>
      <path d="M4 13h4"></path>
      <path d="m10 4 1 2"></path>
      <path d="m14 4-1 2"></path>
    </svg>
    <span>إبلاغ عن خطأ</span>
  </button>

  <!-- نافذة التبليغ المنبثقة -->
  <div class="report-modal-overlay" id="reportOverlay" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="report-modal">
      <div class="report-modal-header">
        <h3>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          إبلاغ عن خطأ أو ملاحظة
        </h3>
        <button class="btn-close-modal" id="closeReportBtn" aria-label="إغلاق">✕</button>
      </div>

      <form class="report-form" id="bugReportForm">
        <div class="form-group">
          <label for="issue-type">نوع المشكلة</label>
          <select id="issue-type" required>
            <option value="سؤال أو إجابة خاطئة">خطأ في سؤال أو إجابة</option>
            <option value="خلل في التصميم أو الموقع">مشكلة في عرض الصفحة أو الموقع</option>
            <option value="اقتراح أو أخرى">اقتراح / أخرى</option>
          </select>
        </div>

        <div class="form-group">
          <label for="issue-desc">وصف المشكلة <span style="color:var(--apple-red)">*</span></label>
          <textarea id="issue-desc" placeholder="حدد السؤال أو المشكلة بالتفصيل..." required></textarea>
        </div>

        <div class="form-group">
          <label for="user-contact">وسيلة تواصل (اختياري)</label>
          <input type="text" id="user-contact" placeholder="إيميلك أو حسابك للمتابعة">
        </div>

        <button type="submit" class="btn-submit-report" id="submitReportBtn">إرسال البلاغ</button>
        <div class="report-status" id="reportStatus"></div>
      </form>
    </div>
  </div>

  <script>
    const originalDriveLink = "";

    const letters = ['أ', 'ب', 'ج', 'د'];

    const examSections = [
      {
        title: "الجزء الأول: الدولة الأردنية، النظام السياسي، وشعار وعلم المملكة (الأسئلة 1 – 12)",
        context: "أسئلة أساسية حول نظام الحكم، الجغرافيا، السكان، دلالات ألوان العلم الوطني، ورموز شعار المملكة:",
        subQuestions: [
          {
            id: "mid_1",
            type: "single",
            text: "1) ما نظام الحكم في المملكة الأردنية الهاشمية؟",
            opts: ["جمهوري", "نيابي ملكي وراثي", "شيوعي", "رئاسي"],
            ans: 1,
            dispAnswer: "ب) نيابي ملكي وراثي",
            exp: "ينص الدستور الأردني في مادته الأولى على أن نظام الحكم في المملكة الأردنية الهاشمية نيابي ملكي وراثي."
          },
          {
            id: "mid_2",
            type: "single",
            text: "2) كم محافظة توجد في الأردن؟",
            opts: ["8", "10", "12", "14"],
            ans: 2,
            dispAnswer: "ج) 12",
            exp: "تتوزع المملكة على 12 محافظة مقسمة جغرافياً وإدارياً إلى ثلاثة أقاليم: الشمال، الوسط، والجنوب."
          },
          {
            id: "mid_3",
            type: "single",
            text: "3) ما هي العاصمة السياسية والاقتصادية للأردن؟",
            opts: ["إربد", "العقبة", "عمان", "الزرقاء"],
            ans: 2,
            dispAnswer: "ج) عمان",
            exp: "مدينة عمان هي العاصمة الرسمية والسياسية والإدارية والاقتصادية للمملكة الأردنية الهاشمية."
          },
          {
            id: "mid_4",
            type: "single",
            text: "4) كم يبلغ عدد السكان في الأردن حسب تعداد 2022 التقريبي؟",
            opts: ["حوالي 9 ملايين", "حوالي 11 مليون", "حوالي 7 ملايين", "حوالي 5 ملايين"],
            ans: 1,
            dispAnswer: "ب) حوالي 11 مليون",
            exp: "أظهرت التقديرات الإحصائية الرسمية لعام 2022 أن عدد سكان المملكة بلغ نحو 11.3 مليون نسمة."
          },
          {
            id: "mid_5",
            type: "single",
            text: "5) من يمثل رأس النظام في الأردن؟",
            opts: ["رئيس الوزراء", "مجلس النواب", "الملك", "مجلس الأعيان"],
            ans: 2,
            dispAnswer: "ج) الملك",
            exp: "الملك هو رأس الدولة ورئيس السلطة التنفيذية والقائد الأعلى للقوات المسلحة الأردنية."
          },
          {
            id: "mid_6",
            type: "single",
            text: "6) أي من الآتي يُعد رمزاً للدفاع عن الحق في شعار المملكة الأردنية الهاشمية؟",
            opts: ["التاج", "الترس", "العقاب", "الوشاح"],
            ans: 1,
            dispAnswer: "ب) الترس",
            exp: "يرمز الترس البرونزي في شعار المملكة إلى الدفاع عن الحق والعدالة وصون الوطن."
          },
          {
            id: "mid_7",
            type: "single",
            text: "7) ماذا يرمز اللون الأسود في علم الأردن؟",
            opts: ["الأمويون", "العباسيون", "الفاطميون", "الهاشميون"],
            ans: 1,
            dispAnswer: "ب) العباسيون",
            exp: "اللون الأسود مأخوذ من راية الدولة العباسية (وراية الرسول صلى الله عليه وسلم 'العقاب')."
          },
          {
            id: "mid_8",
            type: "single",
            text: "8) كم يبلغ طول الحدود الأردنية الإجمالي وفق المنهاج؟",
            opts: ["1635 كم", "1661 كم", "1100 كم", "1400 كم"],
            ans: 1,
            dispAnswer: "ب) 1661 كم",
            exp: "يبلغ إجمالي طول الحدود البرية والمائية للمملكة حوالي 1661 كم (وفي بعض الدراسات 1635 كم برياً)."
          },
          {
            id: "mid_9",
            type: "single",
            text: "9) النجمة السباعية البيضاء في العلم الأردني تمثل:",
            opts: ["القارات السبع", "أركان الإسلام", "المثاني السبع (فاتحة الكتاب)", "رايات الجيش"],
            ans: 2,
            dispAnswer: "ج) المثاني السبع",
            exp: "ترمز النجمة السباعية البيضاء في منتصف المثلث الأحمر إلى السبع المثاني (آيات سورة الفاتحة السبع)."
          },
          {
            id: "mid_10",
            type: "single",
            text: "10) متى تم إعلان استقلال المملكة الأردنية الهاشمية؟",
            opts: ["1921", "1946", "1956", "1989"],
            ans: 1,
            dispAnswer: "ب) 1946",
            exp: "أُعلن استقلال الأردن ومبايعة الملك عبدالله الأول بن الحسين ملكاً دستورياً في 25 أيار 1946."
          },
          {
            id: "mid_11",
            type: "single",
            text: "11) ما هو اسم العلم الذي استخدمته الثورة العربية الكبرى؟",
            opts: ["العلم الفاطمي", "العلم الأردني الحالي", "الراية الهاشمية (علم الثورة العربية)", "الراية الأموية"],
            ans: 2,
            dispAnswer: "ج) الراية الهاشمية",
            exp: "استخدمت الثورة العربية الكبرى راية النهضة بألوانها وأشكالها التي أصبحت أصلاً لأعلام الدول العربية."
          },
          {
            id: "mid_12",
            type: "single",
            text: "12) من هو القائد الذي أطلق مسمى 'الجيش العربي'؟",
            opts: ["الملك عبدالله الثاني", "الملك الحسين بن طلال", "الشريف حسين بن علي", "الملك طلال بن عبدالله"],
            ans: 2,
            dispAnswer: "ج) الشريف حسين بن علي",
            exp: "أطلق قائد الثورة العربية الكبرى الشريف الحسين بن علي اسم 'الجيش العربي' على قوات الثورة عام 1917 ليكون جيشاً لكل العرب."
          }
        ]
      },
      {
        title: "الجزء الثاني: الثورة العربية الكبرى، محطات تاريخية وتأسيس الجيش (الأسئلة 13 – 25)",
        context: "أسئلة حول تشكيلات الجيش، تعريب القيادة، أسلحة المناورة والإسناد، والرتب العسكرية:",
        subQuestions: [
          {
            id: "mid_13",
            type: "single",
            text: "13) ما نوع القوات العسكرية التي تستخدم الزوارق الملكية؟",
            opts: ["القوات البرية", "القوة البحرية", "القوات الجوية", "القوات الخاصة"],
            ans: 1,
            dispAnswer: "ب) القوة البحرية",
            exp: "تستخدم القوة البحرية والزوارق الملكية الزوارق المقاتلة وزوارق الاعتراض لحماية المياه الإقليمية وخليج العقبة."
          },
          {
            id: "mid_14",
            type: "single",
            text: "14) في أي عام اتخذ المغفور له الملك الحسين القرار التاريخي بتعريب قيادة الجيش؟",
            opts: ["1948", "1951", "1956", "1967"],
            ans: 2,
            dispAnswer: "ج) 1956",
            exp: "تم تعريب قيادة الجيش الأردني وطرد كلوب باشا والضباط الإنجليز في 1 آذار 1956."
          },
          {
            id: "mid_15",
            type: "single",
            text: "15) أول لواء مدرع في القوات المسلحة الأردنية تأسس عام:",
            opts: ["1933", "1948", "1958", "1968"],
            ans: 1,
            dispAnswer: "ب) 1948",
            exp: "شُكلت أول نواة وأول لواء مدرع (اللواء المدرع الرابع) بالتزامن مع دخول الجيش حرب 1948 في فلسطين."
          },
          {
            id: "mid_16",
            type: "single",
            text: "16) ما رمز النظام الملكي في الشعار الرسمي للمملكة الأردنية الهاشمية؟",
            opts: ["العقاب", "التاج", "السيفان", "النجمة"],
            ans: 1,
            dispAnswer: "ب) التاج",
            exp: "يرمز التاج الملكي الهاشمي في رأس الشعار إلى نظام الحكم الملكي الوراثي."
          },
          {
            id: "mid_17",
            type: "single",
            text: "17) ما هو الاسم الرسمي لقواتنا المسلحة الباسلة؟",
            opts: ["الجيش الهاشمي", "القوات الملكية", "الجيش العربي", "الجيش الفيصلي"],
            ans: 2,
            dispAnswer: "ج) الجيش العربي",
            exp: "الاسم الرسمي المعتمد هو: القوات المسلحة الأردنية - الجيش العربي."
          },
          {
            id: "mid_18",
            type: "single",
            text: "18) أين تقع قيادة قاعدة الأمير هاشم بن عبدالله الثاني البحرية؟",
            opts: ["عمان", "إربد", "الزرقاء", "العقبة"],
            ans: 3,
            dispAnswer: "د) العقبة",
            exp: "تقع القاعدة البحرية في مدينة العقبة على الساحل الجنوبي لحماية المنفذ البحري الوحيد للمملكة."
          },
          {
            id: "mid_19",
            type: "single",
            text: "19) في أي سنة انتهى الوجود والحكم العثماني في جنوب الأردن مع تقدم الثورة؟",
            opts: ["1916", "1917", "1920", "1921"],
            ans: 1,
            dispAnswer: "ب) 1917",
            exp: "أنهت معركة العقبة وتحرير معان عام 1917 الحكم العثماني في جنوب الأردن وفتحت الطريق نحو دمشق."
          },
          {
            id: "mid_20",
            type: "single",
            text: "20) ما هو لون الراية الهاشمية التاريخية المعتمدة؟",
            opts: ["أحمر داكن (عنابي)", "أسود", "أخضر", "أبيض"],
            ans: 0,
            dispAnswer: "أ) أحمر داكن",
            exp: "تتميز الراية الهاشمية بلونها الأحمر الداكن (القرمزي/العنابي) رمزاً لرايات آل البيت والهاشميين."
          },
          {
            id: "mid_21",
            type: "single",
            text: "21) الجهة التي أنشأت وأسست أول مستشفى عسكري للخدمات الطبية الملكية عام 1948 هي:",
            opts: ["الملك عبدالله الثاني", "الجيش العربي", "وزارة الصحة", "الأمانة العامة"],
            ans: 1,
            dispAnswer: "ب) الجيش العربي",
            exp: "أنشأ الجيش العربي أول مستشفى عسكري عام 1948 في ماركا لمعالجة مصابي وجرحى معارك فلسطين."
          },
          {
            id: "mid_22",
            type: "single",
            text: "22) أي من الصنوف والأسلحة التالية يُصنف ضمن 'أسلحة الإسناد'؟",
            opts: ["سلاح المشاة", "سلاح الدروع", "سلاح المدفعية الملكي", "سلاح الصاعقة"],
            ans: 2,
            dispAnswer: "ج) سلاح المدفعية الملكي",
            exp: "المشاة والدروع أسلحة مناورة وقتال مباشر، بينما سلاح المدفعية والهندسة تصنف كأسلحة إسناد ناري وقتالي."
          },

    let userScores = {};

    function initQuiz() {
      const driveBtn = document.getElementById('drive-link-btn');
      if (driveBtn) {
        if (originalDriveLink && originalDriveLink.trim() !== "") {
          driveBtn.href = originalDriveLink;
          driveBtn.style.display = "inline-flex";
        } else {
          driveBtn.style.display = "none";
        }
      }

      const list = document.getElementById('quiz-list');
      list.innerHTML = '';

      examSections.forEach((section) => {
        const card = document.createElement('div');
        card.className = 'q-card';

        let subQuestionsHtml = '';
        section.subQuestions.forEach((sub) => {
          const optsHtml = sub.opts.map((opt, i) => `
            <div class="option-item" id="opt-${sub.id}-${i}" onclick="selectSingleOption('${sub.id}', ${i})">
              <div class="opt-letter">${letters[i]}</div>
              <div>${opt}</div>
            </div>
          `).join('');

          const interactionHtml = `
            <div class="options-container" id="opts-box-${sub.id}">${optsHtml}</div>
            <div class="answer-input-row">
              <button class="btn-reset-q" id="reset-btn-${sub.id}" onclick="resetSubQuestion('${sub.id}')">إعادة السؤال ↻</button>
              <button class="btn-action" onclick="toggleSolution('${sub.id}')">
                <span>💡</span> عرض الحل
              </button>
            </div>
          `;

          subQuestionsHtml += `
            <div class="sub-question-card" id="card-${sub.id}">
              <div class="sub-q-header">${sub.text}</div>
              ${interactionHtml}
              <div class="solution-box" id="sol-${sub.id}">
                <div><strong>الإجابة الصحيحة:</strong></div>
                <div style="margin-top: 6px; font-size: 0.98rem; font-weight: bold; line-height: 1.6; color: #5ac8fa;">${sub.dispAnswer}</div>
                <div style="margin-top: 6px; font-size: 0.90rem; line-height: 1.6; color: var(--text-secondary);">${sub.exp}</div>
              </div>
            </div>
          `;
        });

        card.innerHTML = `
          <div>
            <div class="parent-q-title">${section.title}</div>
            <div class="parent-q-desc">${section.context}</div>
          </div>
          <div class="sub-list">${subQuestionsHtml}</div>
        `;

        list.appendChild(card);
      });

      calculateScore();
      setupReportModal();
    }

    function findSubQuestion(subId) {
      for (const sec of examSections) {
        const found = sec.subQuestions.find(s => s.id === subId);
        if (found) return found;
      }
      return null;
    }

    function selectSingleOption(subId, optIdx) {
      const sub = findSubQuestion(subId);
      const optsBox = document.getElementById(`opts-box-${subId}`);
      const resetBtn = document.getElementById(`reset-btn-${subId}`);
      if (!sub || !optsBox) return;

      optsBox.classList.add('locked');

      const picked = document.getElementById(`opt-${subId}-${optIdx}`);
      if (optIdx === sub.ans) {
        if (picked) picked.classList.add('correct');
        userScores[subId] = true;
      } else {
        if (picked) picked.classList.add('wrong');
        const correctOpt = document.getElementById(`opt-${subId}-${sub.ans}`);
        if (correctOpt) correctOpt.classList.add('correct');
        delete userScores[subId];
      }

      if (resetBtn) resetBtn.style.display = 'inline-flex';
      calculateScore();
    }

    function resetSubQuestion(subId) {
      delete userScores[subId];

      const optsBox = document.getElementById(`opts-box-${subId}`);
      if (optsBox) optsBox.classList.remove('locked');

      const sub = findSubQuestion(subId);
      if (sub && sub.opts) {
        sub.opts.forEach((_, i) => {
          const el = document.getElementById(`opt-${subId}-${i}`);
          if (el) el.className = 'option-item';
        });
      }

      const resetBtn = document.getElementById(`reset-btn-${subId}`);
      const sol = document.getElementById(`sol-${subId}`);

      if (resetBtn) resetBtn.style.display = 'none';
      if (sol) sol.classList.remove('show');

      calculateScore();
    }

    function calculateScore() {
      let total = 0;
      let score = 0;
      examSections.forEach(sec => {
        sec.subQuestions.forEach(sub => {
          total++;
          if (userScores[sub.id]) score++;
        });
      });

      const pct = total > 0 ? Math.round((score / total) * 100) : 0;
      const scoreEl = document.getElementById('score');
      if (scoreEl) {
        scoreEl.innerText = `${score} / ${total} (${pct}%)`;
      }
    }

    function toggleSolution(subId) {
      const sol = document.getElementById(`sol-${subId}`);
      if (sol) sol.classList.toggle('show');
    }

    let allShown = false;
    function toggleAllSolutions() {
      allShown = !allShown;
      examSections.forEach(sec => {
        sec.subQuestions.forEach(sub => {
          const sol = document.getElementById(`sol-${sub.id}`);
          if (sol) {
            if (allShown) sol.classList.add('show');
            else sol.classList.remove('show');
          }
        });
      });
    }

    function resetQuiz() {
      userScores = {};
      initQuiz();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function setupReportModal() {
      const openBtn = document.getElementById('openReportBtn');
      const closeBtn = document.getElementById('closeReportBtn');
      const overlay = document.getElementById('reportOverlay');
      const form = document.getElementById('bugReportForm');
      const status = document.getElementById('reportStatus');

      if (!openBtn || !overlay) return;

      openBtn.onclick = () => {
        overlay.classList.add('active');
        overlay.setAttribute('aria-hidden', 'false');
      };

      const closeModal = () => {
        overlay.classList.remove('active');
        overlay.setAttribute('aria-hidden', 'true');
        if (status) status.innerText = '';
      };

      if (closeBtn) closeBtn.onclick = closeModal;

      overlay.onclick = (e) => {
        if (e.target === overlay) closeModal();
      };

      if (form) {
        form.onsubmit = (e) => {
          e.preventDefault();
          const submitBtn = document.getElementById('submitReportBtn');
          if (submitBtn) submitBtn.disabled = true;
          if (status) {
            status.style.color = '#30d158';
            status.innerText = 'تم إرسال البلاغ بنجاح، شكراً لمساعدتك!';
          }
          setTimeout(() => {
            closeModal();
            form.reset();
            if (submitBtn) submitBtn.disabled = false;
          }, 1500);
        };
      }
    }

    initQuiz();
  </script>
  <script src="../transition.js"></script>
