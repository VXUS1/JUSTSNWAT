  <style>
    .bottom-nav-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      margin-top: 36px;
      padding-top: 24px;
      border-top: 1px solid var(--apple-border);
    }
    .btn-bottom-action {
      background: var(--apple-surface);
      border: 1px solid var(--apple-border-strong);
      color: var(--text-primary);
      padding: 12px 26px;
      border-radius: 99px;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.95rem;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      backdrop-filter: blur(20px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      transition: all 0.25s var(--ease-apple);
    }
    .btn-bottom-action:hover {
      background: var(--apple-surface-hover);
      border-color: rgba(255, 255, 255, 0.25);
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
    }
    .btn-bottom-action:active {
      transform: scale(0.96);
    }
    .btn-drive-action {
      background: linear-gradient(135deg, rgba(10, 132, 255, 0.15) 0%, rgba(48, 209, 88, 0.15) 100%);
      border-color: rgba(10, 132, 255, 0.4);
      color: #5ac8fa;
    }
    .btn-drive-action:hover {
      background: var(--apple-blue);
      color: #ffffff;
      border-color: var(--apple-blue);
    }

    .parent-q-title {
      font-size: 1.18rem;
      font-weight: 800;
      color: var(--apple-blue, #0a84ff);
      margin-bottom: 8px;
      border-bottom: 1px dashed var(--apple-border);
      padding-bottom: 8px;
    }
    .parent-q-desc {
      font-size: 0.98rem;
      line-height: 1.7;
      color: var(--text-secondary);
      margin-bottom: 18px;
    }
    .sub-question-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--apple-border);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 18px;
      text-align: right;
      direction: rtl;
    }
    .sub-q-header {
      font-weight: 700;
      font-size: 1.02rem;
      margin-bottom: 14px;
      color: var(--text-primary);
      line-height: 1.7;
    }

    .options-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin: 14px 0;
    }
    .options-container.locked {
      pointer-events: none;
    }

    .option-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 16px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--apple-border);
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
      user-select: none;
      font-size: 0.98rem;
    }
    .option-item:hover {
      background: rgba(255, 255, 255, 0.08);
    }
    .option-item.selected {
      border-color: var(--apple-blue);
      background: rgba(10, 132, 255, 0.12);
    }
    .option-item.correct {
      background: rgba(48, 209, 88, 0.18) !important;
      border-color: #30d158 !important;
      color: #fff;
    }
    .option-item.wrong {
      background: rgba(255, 69, 58, 0.18) !important;
      border-color: #ff453a !important;
      color: #fff;
    }
    .opt-letter {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 0.85rem;
      flex-shrink: 0;
    }

    .answer-input-row {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    .btn-reset-q {
      display: none;
      background: rgba(255, 69, 58, 0.15);
      color: #ff453a;
      border: 1px solid rgba(255, 69, 58, 0.4);
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.85rem;
      transition: all 0.2s;
    }
    .btn-reset-q:hover {
      background: #ff453a;
      color: #fff;
    }
    .solution-box {
      display: none;
      margin-top: 14px;
      padding: 14px 16px;
      background: rgba(10, 132, 255, 0.08);
      border: 1px solid rgba(10, 132, 255, 0.25);
      border-radius: 10px;
    }
    .solution-box.show {
      display: block;
    }
  </style>
</head>

  <script>
    const originalDriveLink = "";

    const letters = ['أ', 'ب', 'ج', 'د'];

    const examSections = [
      {
        title: "الجزء الأول: الأمن الوطني، الهوية الوطنية، والمواطنة والدستور (الأسئلة 1 – 12)",
        context: "أسئلة سنوات حول مفاهيم الأمن الوطني وأبعاده، خصائص الهوية الوطنية، القيادة الهاشمية، والأوراق النقاشية والدستور:",
        subQuestions: [
          {
            id: "fin_1",
            type: "single",
            text: "1) يُعبّر مفهوم 'الأمن الوطني' في جوهره عن حالة الشعور بـ:",
            opts: ["القدرة الفكرية", "التوجه الثقافي", "عدم الشعور بالتهديد وحماية مصالح الدولة", "التفوق العسكري فقط"],
            ans: 2,
            dispAnswer: "ج) عدم الشعور بالتهديد",
            exp: "الأمن الوطني هو قدرة الدولة على حماية أراضيها ومصالحها ومواطنيها وتوفير بيئة خالية من التهديدات الداخلية والخارجية."
          },
          {
            id: "fin_2",
            type: "single",
            text: "2) من أهم مميزات النظرة الأردنية للأمن الوطني أنها تتسم بـ:",
            opts: ["الدفاع والأمن الصرف", "الشمولية، التوازن، وتطوير منظور التعاون", "الشمولية والوضوح والتركيز على العناصر المحلية فقط", "الانعزال عن المحيط الإقليمي"],
            ans: 1,
            dispAnswer: "ب) الشمولية، التوازن، تطوير منظور التعاون",
            exp: "يرتكز المفهوم الأردني للأمن الوطني على نظرة شاملة تدمج الأبعاد السياسية، الاقتصادية، الاجتماعية، وتتعاون إقليمياً ودولياً."
          },
          {
            id: "fin_3",
            type: "single",
            text: "3) من أبعاد الأمن الوطني الأردني 'البعد السياسي' ويتمثل أساساً في:",
            opts: ["مكافحة التجسس الإلكتروني", "توفير الأمن المعيشي والغذائي", "الحفاظ على كيان الدولة السياسي واستقلالها وحرية قرارها", "دعم المؤسسات الخيرية"],
            ans: 2,
            dispAnswer: "ج) الحفاظ على كيان الدولة السياسي وحرية قرارها",
            exp: "البعد السياسي للأمن الوطني يُعنى بصون السيادة، وحماية الدستور والمؤسسات الشرعية، واستقلال القرار الوطني."
          },
          {
            id: "fin_4",
            type: "single",
            text: "4) يتوقف إعداد وتجهيز القوات المسلحة في مجال تعبئة الموارد الوطنية على:",
            opts: ["إعداد الزراعة الموسمية فقط", "الموقف السياسي والاقتصادي للدولة", "مشاريع قواعد الإنتاج المحلية", "الاتفاقيات التجارية البينية"],
            ans: 1,
            dispAnswer: "ب) الموقف السياسي والاقتصادي للدولة",
            exp: "تعتمد خطط التعبئة العامة والتسليح والجاهزية القتالية مباشرة على الموارد الاقتصادية المتاحة والموقف السياسي للدولة."
          },
          {
            id: "fin_5",
            type: "single",
            text: "5) تشكلت وتبلورت الهوية الوطنية الأردنية تاريخياً في ضوء تفاعل:",
            opts: ["العوامل الخارجية فقط", "العوامل السياسية وحدها", "العوامل الداخلية والخارجية معاً", "الضغوط الدولية المعاصرة"],
            ans: 2,
            dispAnswer: "ج) العوامل الداخلية والخارجية",
            exp: "تكونت الهوية الوطنية عبر تمازج البناء الداخلي المترابط مع الأحداث الإقليمية والعربية والموقع الجيوسياسي للأردن."
          },
          {
            id: "fin_6",
            type: "single",
            text: "6) علاقة الأردن وقيادته الهاشمية التاريخية بالثورة العربية الكبرى تُعد من العوامل المؤثرة في:",
            opts: ["تعزيز وترسيخ الهوية الوطنية", "التقدم والتطور العلمي الحصري", "تحديد أسعار السلع والخدمات", "العلاقات الاقتصادية الخارجية"],

            dispAnswer: "أ) تعزيز الهوية الوطنية",
            exp: "تمثل مبادئ الثورة العربية الكبرى والشرعية الدينية والتاريخية للهاشميين الركيزة الأساسية للهوية والوجدان الوطني الأردني."
          },
          {
            id: "fin_7",
            type: "single",
            text: "7) من العوامل الأساسية التي تساعد على ترسيخ وتماسك الهوية الوطنية ومنعتها:",
            opts: ["تطور الجهاز الوظيفي الإداري", "طبيعة الموقع الجغرافي الصحراوي", "الحرص على الوحدة الوطنية وتعزيزها ونبذ الفرقة", "الاعتماد على المساعدات الخارجية"],

            dispAnswer: "ج) الحرص على الوحدة الوطنية وتعزيزها",

          },
          {
            id: "fin_8",
            type: "single",
            text: "8) من العوامل الحيوية التي تعزز الانتماء الوطني الصادق لدى المواطن:",

            ans: 3,
            dispAnswer: "د) جميع ما ذكر صحيح",
            exp: "يتعزز الانتماء بتحقيق العدالة الاجتماعية، وإشباع الاحتياجات، والمشاركة السياسية في ظل التنشئة الوطنية الواعية."
          },
          {
            id: "fin_9",
            type: "single",
            text: "9) من أبرز سمات وخصائص النهج القيادي للقيادة الهاشمية التاريخية:",
            opts: [
              "الالتزام الديني والانتماء للأمة العربية والإسلامية",
              "الوسطية، والاعتدال، والواقعية، وقوة الإرادة",
              "جميع ما ذكر صحيح",
              "التشدد والانعزال عن القضايا القومية"
            ],
            ans: 2,
            dispAnswer: "ج) جميع ما ذكر",
            exp: "تتميز القيادة الهاشمية بالحكمة، والنهج التسامحي المعتدل، والتفاني في خدمة قضايا الأمتين العربية والإسلامية."
          },
          {
            id: "fin_10",
            type: "single",
            text: "10) من الأهداف الدستورية والسياسية الاستراتيجية لترسيخ المواطنة الفاعلة:",
            opts: ["بناء وتطوير نظام سياسي تعددي متنوع", "تقديم الخدمات الإدارية فقط", "وضوح الهدف الشخصي للفرد", "تقليص المشاركة الشعبية"],
            ans: 0,
            dispAnswer: "أ) بناء نظام سياسي تعددي متنوع",
            exp: "تهدف المواطنة إلى تفعيل التعددية الحزبية والسياسية وسيادة القانون والمشاركة الشعبية المسؤولة في صنع القرار."
          },
          {
            id: "fin_11",
            type: "single",
            text: "11) إن أساس ومنطلق الحياة السياسية والديمقراطية في الدولة الأردنية يشكلها:",
            opts: ["مجلس الأعيان", "الدستور الأردني", "مجلس النواب", "النظام الإداري للوزارات"],
            ans: 1,
            dispAnswer: "ب) الدستور",
            exp: "الدستور هو القانون الأسمى والمرجع الأعلى لكافة السلطات والحريات والضامن لحقوق المواطنين ومسار الديمقراطية."
          },
          {
            id: "fin_12",
            type: "single",
            text: "12) قادت التعديلات الدستورية المتلاحقة في الأردن إلى:",
            opts: ["الربط التام والخلط بين السلطات", "تعزيز الفصل والتوازن والرقابة المتبادلة بين السلطات الثلاث", "الدمج التام بين السلطات الثلاث", "إلغاء استقلال القضاء"],

            dispAnswer: "ب) تعزيز الفصل والتوازن بين السلطات الثلاث",

        subQuestions: [
          {
            id: "fin_13",
            type: "single",
            text: "13) تعود البدايات الأولى لنشأة وتشكيل جهاز الأمن العام (قوة الدرك والشرطة) إلى عام:",

          {
            id: "fin_14",

    let userScores = {};

    function initQuiz() {
      const driveBtn = document.getElementById('drive-link-btn');
      if (driveBtn) {
        if (originalDriveLink && originalDriveLink.trim() !== "") {
          driveBtn.href = originalDriveLink;
          driveBtn.style.display = "inline-flex";
        } else {
          driveBtn.style.display = "none";
        }
      }

      const list = document.getElementById('quiz-list');
      list.innerHTML = '';

      examSections.forEach((section) => {
        const card = document.createElement('div');
        card.className = 'q-card';

        let subQuestionsHtml = '';
        section.subQuestions.forEach((sub) => {
          const optsHtml = sub.opts.map((opt, i) => `
            <div class="option-item" id="opt-${sub.id}-${i}" onclick="selectSingleOption('${sub.id}', ${i})">
              <div class="opt-letter">${letters[i]}</div>
              <div>${opt}</div>
            </div>
          `).join('');

          const interactionHtml = `
            <div class="options-container" id="opts-box-${sub.id}">${optsHtml}</div>
            <div class="answer-input-row">
              <button class="btn-reset-q" id="reset-btn-${sub.id}" onclick="resetSubQuestion('${sub.id}')">إعادة السؤال ↻</button>
              <button class="btn-action" onclick="toggleSolution('${sub.id}')">
                <span>💡</span> عرض الحل
              </button>
            </div>
          `;

          subQuestionsHtml += `
            <div class="sub-question-card" id="card-${sub.id}">
              <div class="sub-q-header">${sub.text}</div>
              ${interactionHtml}
              <div class="solution-box" id="sol-${sub.id}">
                <div><strong>الإجابة الصحيحة:</strong></div>
                <div style="margin-top: 6px; font-size: 0.98rem; font-weight: bold; line-height: 1.6; color: #5ac8fa;">${sub.dispAnswer}</div>
                <div style="margin-top: 6px; font-size: 0.90rem; line-height: 1.6; color: var(--text-secondary);">${sub.exp}</div>
              </div>
            </div>
          `;
        });

        card.innerHTML = `
          <div>
            <div class="parent-q-title">${section.title}</div>
            <div class="parent-q-desc">${section.context}</div>
          </div>
          <div class="sub-list">${subQuestionsHtml}</div>
        `;

        list.appendChild(card);
      });

      calculateScore();
      setupReportModal();
    }

    function findSubQuestion(subId) {
      for (const sec of examSections) {
        const found = sec.subQuestions.find(s => s.id === subId);
        if (found) return found;
      }
      return null;
    }

    function selectSingleOption(subId, optIdx) {
      const sub = findSubQuestion(subId);
      const optsBox = document.getElementById(`opts-box-${subId}`);
      const resetBtn = document.getElementById(`reset-btn-${subId}`);
      if (!sub || !optsBox) return;

      optsBox.classList.add('locked');

      const picked = document.getElementById(`opt-${subId}-${optIdx}`);
      if (optIdx === sub.ans) {
        if (picked) picked.classList.add('correct');
        userScores[subId] = true;
      } else {
        if (picked) picked.classList.add('wrong');
        const correctOpt = document.getElementById(`opt-${subId}-${sub.ans}`);
        if (correctOpt) correctOpt.classList.add('correct');
        delete userScores[subId];
      }

      if (resetBtn) resetBtn.style.display = 'inline-flex';
      calculateScore();
    }

    function resetSubQuestion(subId) {
      delete userScores[subId];

      const optsBox = document.getElementById(`opts-box-${subId}`);
      if (optsBox) optsBox.classList.remove('locked');

      const sub = findSubQuestion(subId);
      if (sub && sub.opts) {
        sub.opts.forEach((_, i) => {
          const el = document.getElementById(`opt-${subId}-${i}`);
          if (el) el.className = 'option-item';
        });
      }

      const resetBtn = document.getElementById(`reset-btn-${subId}`);
      const sol = document.getElementById(`sol-${subId}`);

      if (resetBtn) resetBtn.style.display = 'none';
      if (sol) sol.classList.remove('show');

      calculateScore();
    }

    function calculateScore() {
      let total = 0;
      let score = 0;
      examSections.forEach(sec => {
        sec.subQuestions.forEach(sub => {
          total++;
          if (userScores[sub.id]) score++;
        });
      });

      const pct = total > 0 ? Math.round((score / total) * 100) : 0;
      const scoreEl = document.getElementById('score');
      if (scoreEl) {
        scoreEl.innerText = `${score} / ${total} (${pct}%)`;
      }
    }

    function toggleSolution(subId) {
      const sol = document.getElementById(`sol-${subId}`);
      if (sol) sol.classList.toggle('show');
    }

    let allShown = false;
    function toggleAllSolutions() {
      allShown = !allShown;
      examSections.forEach(sec => {
        sec.subQuestions.forEach(sub => {
          const sol = document.getElementById(`sol-${sub.id}`);
          if (sol) {
            if (allShown) sol.classList.add('show');
            else sol.classList.remove('show');
          }
        });
      });
    }

    function resetQuiz() {
      userScores = {};
      initQuiz();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function setupReportModal() {
      const openBtn = document.getElementById('openReportBtn');
      const closeBtn = document.getElementById('closeReportBtn');
      const overlay = document.getElementById('reportOverlay');
      const form = document.getElementById('bugReportForm');
      const status = document.getElementById('reportStatus');

      if (!openBtn || !overlay) return;

      openBtn.onclick = () => {
        overlay.classList.add('active');
        overlay.setAttribute('aria-hidden', 'false');
      };

      const closeModal = () => {
        overlay.classList.remove('active');
        overlay.setAttribute('aria-hidden', 'true');
        if (status) status.innerText = '';
      };

      if (closeBtn) closeBtn.onclick = closeModal;

      overlay.onclick = (e) => {
        if (e.target === overlay) closeModal();
      };

      if (form) {
        form.onsubmit = (e) => {
          e.preventDefault();
          const submitBtn = document.getElementById('submitReportBtn');
          if (submitBtn) submitBtn.disabled = true;
          if (status) {
            status.style.color = '#30d158';
            status.innerText = 'تم إرسال البلاغ بنجاح، شكراً لمساعدتك!';
          }
          setTimeout(() => {
            closeModal();
            form.reset();
            if (submitBtn) submitBtn.disabled = false;
          }, 1500);
        };
      }
    }

    initQuiz();
  </script>
  <script src="../transition.js"></script>
</body>
</html>
