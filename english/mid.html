  <style>
    .bottom-nav-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      margin-top: 36px;
      padding-top: 24px;
      border-top: 1px solid var(--apple-border);
    }
    .btn-bottom-action {
      background: var(--apple-surface);
      border: 1px solid var(--apple-border-strong);
      color: var(--text-primary);
      padding: 12px 26px;
      border-radius: 99px;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.95rem;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      backdrop-filter: blur(20px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      transition: all 0.25s var(--ease-apple);
    }
    .btn-bottom-action:hover {
      background: var(--apple-surface-hover);
      border-color: rgba(255, 255, 255, 0.25);
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
    }
    .btn-bottom-action:active {
      transform: scale(0.96);
    }
    .btn-drive-action {
      background: linear-gradient(135deg, rgba(10, 132, 255, 0.15) 0%, rgba(48, 209, 88, 0.15) 100%);
      border-color: rgba(10, 132, 255, 0.4);
      color: #5ac8fa;
    }
    .btn-drive-action:hover {
      background: var(--apple-blue);
      color: #ffffff;
      border-color: var(--apple-blue);
    }

    .ltr-content {
      direction: ltr;
      text-align: left;
    }

    .parent-q-title {
      font-size: 1.18rem;
      font-weight: 800;
      color: var(--apple-blue, #0a84ff);
      margin-bottom: 8px;
      border-bottom: 1px dashed var(--apple-border);
      padding-bottom: 8px;
    }
    .parent-q-desc {
      font-size: 0.98rem;
      line-height: 1.7;
      color: var(--text-secondary);
      margin-bottom: 18px;
    }
    .sub-question-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--apple-border);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 18px;
    }
    .sub-q-header {
      font-weight: 700;
      font-size: 1.02rem;
      margin-bottom: 14px;
      color: var(--text-primary);
      line-height: 1.7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .options-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin: 14px 0;
    }
    .options-container.locked {
      pointer-events: none;
    }

    .option-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 16px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--apple-border);
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
      user-select: none;
      font-size: 0.98rem;
    }
    .option-item:hover {
      background: rgba(255, 255, 255, 0.08);
    }
    .option-item.selected {
      border-color: var(--apple-blue);
      background: rgba(10, 132, 255, 0.12);
    }
    .option-item.correct {
      background: rgba(48, 209, 88, 0.18) !important;
      border-color: #30d158 !important;
      color: #fff;
    }
    .option-item.wrong {
      background: rgba(255, 69, 58, 0.18) !important;
      border-color: #ff453a !important;
      color: #fff;
    }
    .opt-letter {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 0.85rem;
      flex-shrink: 0;
      font-family: 'JetBrains Mono', Consolas, monospace;
    }

    .answer-input-row {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    .btn-reset-q {
      display: none;
      background: rgba(255, 69, 58, 0.15);
      color: #ff453a;
      border: 1px solid rgba(255, 69, 58, 0.4);
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.85rem;
      transition: all 0.2s;
    }
    .btn-reset-q:hover {
      background: #ff453a;
      color: #fff;
    }
    .solution-box {
      display: none;
      margin-top: 14px;
      padding: 14px 16px;
      background: rgba(10, 132, 255, 0.08);
      border: 1px solid rgba(10, 132, 255, 0.25);
      border-radius: 10px;
    }
    .solution-box.show {
      display: block;
    }
  </style>
</head>

      <rect width="8" height="14" x="8" y="6" rx="4"></rect>
      <path d="m19 7-3 2"></path>

      <path d="m19 19-3-2"></path>
      <path d="m5 19 3-2"></path>
      <path d="M20 13h-4"></path>
      <path d="M4 13h4"></path>

  <!-- نافذة التبليغ المنبثقة -->
  <div class="report-modal-overlay" id="reportOverlay" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="report-modal">
      <div class="report-modal-header">
        <h3>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          إبلاغ عن خطأ أو ملاحظة
        </h3>
        <button class="btn-close-modal" id="closeReportBtn" aria-label="إغلاق">✕</button>
      </div>

      <form class="report-form" id="bugReportForm">
        <div class="form-group">
          <label for="issue-type">نوع المشكلة</label>
          <select id="issue-type" required>
            <option value="سؤال أو إجابة خاطئة">خطأ في سؤال أو إجابة</option>
            <option value="خلل في التصميم أو الموقع">مشكلة في عرض الصفحة أو الموقع</option>
            <option value="اقتراح أو أخرى">اقتراح / أخرى</option>
          </select>
        </div>

        <div class="form-group">
          <label for="issue-desc">وصف المشكلة <span style="color:var(--apple-red)">*</span></label>
          <textarea id="issue-desc" placeholder="حدد السؤال أو المشكلة بالتفصيل..." required></textarea>
        </div>

        <div class="form-group">
          <label for="user-contact">وسيلة تواصل (اختياري)</label>
          <input type="text" id="user-contact" placeholder="إيميلك أو حسابك للمتابعة">
        </div>

        <button type="submit" class="btn-submit-report" id="submitReportBtn">إرسال البلاغ</button>
        <div class="report-status" id="reportStatus"></div>
      </form>
    </div>
  </div>

  <script>
    const originalDriveLink = "";

    const letters = ['A', 'B', 'C', 'D'];

    const examSections = [
      {
        title: "Part 1: Past Years Midterm Exam Questions",
        context: "The official 40 multiple-choice questions from past midterm exams with explanations from the official answer key:",
        subQuestions: [
          {
            id: "eng_m1",
            type: "single",
            text: "1) He was ______ a sad face to impress the audience during the play.",
            opts: ["Holding on", "Putting on", "Struck by", "Met with"],
            ans: 1,
            dispAnswer: "B. Putting on",
            exp: "Putting on تعني التظاهر أو اصطناع ملامح معينة (pretending) للتأثير على الجمهور[cite: 4]."
          },
          {
            id: "eng_m2",
            type: "single",
            text: "2) Larry ______ a lot of money last year but he ______ it.",
            opts: ["Won / already spent", "Has won / already spent", "Won / has already spent", "Has won / has already spent"],
            ans: 2,
            dispAnswer: "C. Won / has already spent",
            exp: "الحدث الأول ماضٍ محدد بـ last year (ماضي بسيط Won)، والحدث الثاني أثره ممتد للحاضر بوجود already (مضارع تام has already spent)[cite: 4]."
          },
          {
            id: "eng_m3",
            type: "single",
            text: "3) They ______ in Paris for the last two years and are still adjusting to the lifestyle there.",
            opts: ["Lived", "Are living", "Live", "Have been living"],
            ans: 3,
            dispAnswer: "D. Have been living",
            exp: "الحدث بدأ قبل عامين ومستمر حتى الآن بدلالة are still adjusting (مضارع تام مستمر Have been living)[cite: 4]."
          },
          {
            id: "eng_m4",
            type: "single",
            text: "4) By the time the teacher ______, the students ______ for more than an hour.",
            opts: ["Had come, were waiting", "Came, had been waiting", "Came, were waiting", "Comes, have been waiting"],
            ans: 1,
            dispAnswer: "B. Came, had been waiting",
            exp: "حدث الانتظار استمر لفترة قبل حدث آخر في الماضي مسبوق بـ By the time (ماضي تام مستمر had been waiting وماضي بسيط came)[cite: 4]."
          },
          {
            id: "eng_m5",
            type: "single",
            text: "5) She ______ more confident in her presentations as she gains more experience.",
            opts: ["Becomes", "Has become", "Became", "Is becoming"],
            ans: 3,
            dispAnswer: "D. Is becoming",
            exp: "تغير تدريجي مستمر في الحاضر (gradual change)[cite: 4]."
          },
          {
            id: "eng_m6",
            type: "single",
            text: "6) My mother ______ Asian cuisines very much. I am surprised that she ______ this western dish.",
            opts: ["Is enjoying, enjoys", "Enjoyed, enjoys", "Enjoys, enjoys", "Enjoys, is enjoying"],
            ans: 3,
            dispAnswer: "D. Enjoys, is enjoying",
            exp: "الجملة الأولى عادة وحقيقة ثابتة (Enjoys)، والثانية تعبير عن نشاط مؤقت يحدث الآن ومفاجئ (is enjoying)[cite: 4]."
          },
          {
            id: "eng_m7",
            type: "single",
            text: "7) Gerard won't come with us to the party. He ______ to Paris for the weekend.",
            opts: ["Had been", "Has been", "Goes", "Has gone"],
            ans: 3,
            dispAnswer: "D. Has gone",
            exp: "ذهب إلى باريس ولم يعد بعد (gone and not back) ولذلك لن يتمكن من حضور الحفل[cite: 4]."
          },
          {
            id: "eng_m8",
            type: "single",
            text: "8) They ______ the museum before they went to the park.",
            opts: ["Had been visiting", "Had visited", "Have visited", "Visit"],
            ans: 1,
            dispAnswer: "B. Had visited",
            exp: "حدث اكتمل في الماضي قبل حدث ماضٍ آخر مسبوق بـ before (ماضي تام Had visited)[cite: 4]."
          },
          {
            id: "eng_m9",
            type: "single",
            text: "9) The refugees had to ______ their homeland due to the ongoing war.",
            opts: ["Migrate", "Flee", "Share", "Rear"],
            ans: 1,
            dispAnswer: "B. Flee",
            exp: "Flee تعني الهروب والفرار من الخطر والحرب (escape danger)[cite: 4]."
          },
          {
            id: "eng_m10",
            type: "single",
            text: "10) The ______ guided their cattle through the valley, ensuring they had enough grazing land.",
            opts: ["Stilt huts", "Livestock herders", "Monsoon seasons", "Dairy products"],
            ans: 1,
            dispAnswer: "B. Livestock herders",
            exp: "Livestock herders هم رعاة الماشية الذين يقودون الأبقار والماشية للمرعى[cite: 4]."
          },
          {
            id: "eng_m11",
            type: "single",
            text: "11) The farmer used a sharp tool to ______ the sheep's wool before the summer heat.",
            opts: ["Share", "Move", "Flee", "Shear"],
            ans: 3,
            dispAnswer: "D. Shear",
            exp: "Shear تعني جزّ وقص صوف الأغنام (cut wool)[cite: 4]."
          },
          {
            id: "eng_m12",
            type: "single",
            text: "12) I prefer to sit in a(an) ______ so I can easily get up and move around during the flight.",
            opts: ["Aisle window", "Conveyor belt", "Conveyor seat", "Aisle seat"],
            ans: 3,
            dispAnswer: "D. Aisle seat",
            exp: "Aisle seat هو المقعد المحاذي للممر في الطائرة ليسهل الخروج والحركة[cite: 4]."
          },
          {
            id: "eng_m13",
            type: "single",
            text: "13) They ______ new ways to improve efficiency in their manufacturing process when they stumbled upon a more sustainable method.",
            opts: ["Had explored", "Had been exploring", "Explored", "Were exploring"],
            ans: 3,
            dispAnswer: "D. Were exploring",
            exp: "حدث كان مستمراً في الماضي وقاطعه حدث مفاجئ stumbled upon (ماضي مستمر Were exploring)[cite: 4]."
          },
          {
            id: "eng_m14",
            type: "single",
            text: "14) Mr. Jonson ______ this luxurious hotel for more than 20 years. It is one of the country's best places.",
            opts: ["Has", "Had", "Has been having", "Has had"],
            ans: 3,
            dispAnswer: "D. Has had",
            exp: "الفعل have بمعنى الملكية فعل حالة لا يقبل الاستمرار، ومع for more than 20 years نستخدم المضارع التام (Has had)[cite: 4]."
          },
          {
            id: "eng_m15",
            type: "single",
            text: "15) Hey, you look different. ______ you ______ your hairstyle?",
            opts: ["Did / change", "Have / changed", "Do / change", "Are / changing"],
            ans: 1,
            dispAnswer: "B. Have / changed",
            exp: "سؤال عن حدث تم مؤخراً وأثره ظاهر على الشخص الآن (recent action with present result)[cite: 4]."
          },
          {
            id: "eng_m16",
            type: "single",
            text: "16) The teacher ______ to the students for more than two hours, so she ______ a break.",
            opts: ["Had been talking / was wanting", "Has talked / was wanting", "Had been talking / wanted", "Was talking / wanted"],
            ans: 2,
            dispAnswer: "C. Had been talking / wanted",
            exp: "الفعل want من أفعال الحالة ولا يُصاغ بالمستمر (wanted)، والحدث المستمر قبله ماضي تام مستمر (Had been talking)[cite: 4]."
          },
          {
            id: "eng_m17",
            type: "single",
            text: "17) The baby ______ pale; do you think she is sick?",
            opts: ["Looked", "Has been looking", "Looks", "Was looking"],
            ans: 2,
            dispAnswer: "C. Looks",
            exp: "فعل حالة يصف المظهر والشكل الحالي للطفلة (current state)[cite: 4]."
          },
          {
            id: "eng_m18",
            type: "single",
            text: "18) I ______ John at the airport tomorrow.",
            opts: ["Have met", "Have been meeting", "Am meeting", "Used to meeting"],
            ans: 2,
            dispAnswer: "C. Am meeting",
            exp: "المضارع المستمر يُستخدم للتعبير عن خطة وموعد مستقبلي مؤكد ومحدد مسبقاً (fixed future arrangement)[cite: 4]."
          },
          {
            id: "eng_m19",
            type: "single",
            text: "19) Sally ______ school three years ago.",
            opts: ["Had left", "Was leaving", "Left", "Has left"],
            ans: 2,
            dispAnswer: "C. Left",
            exp: "حقيقة وحدث وقع وانتهى في الماضي لوجود ago (ماضي بسيط Left)[cite: 4]."
          },
          {
            id: "eng_m20",
            type: "single",
            text: "20) As she saw the cat, she jumped to the next room without a second ______.",
            opts: ["Scene", "Chase", "Thought", "Suspicion"],
            ans: 2,
            dispAnswer: "C. Thought",
            exp: "تعبير واصطلاح لغوي شائع: without a second thought (دون أي تردد أو تفكير ثانٍ)[cite: 4]."
          },
          {
            id: "eng_m21",
            type: "single",
            text: "21) Online trading has been slow to ______ (become popular) in this part of the country.",
            opts: ["Hold on", "Count on", "Catch on", "Look on"],
            ans: 2,
            dispAnswer: "C. Catch on",
            exp: "الفعل المركب catch on يعني يصبح رائجاً وشائعاً ومقبولاً (become popular)[cite: 4]."
          },
          {
            id: "eng_m22",
            type: "single",
            text: "22) I often ______ my mother to her work when I was sixteen.",
            opts: ["Have been joining", "Join", "Was joining", "Joined"],
            ans: 3,
            dispAnswer: "D. Joined",
            exp: "عادة وتكرار في فترة زمنية ماضية منتهية (past habit)[cite: 4]."
          },
          {
            id: "eng_m23",
            type: "single",
            text: "23) Where ______ all that time? You've missed most of the film.",
            opts: ["Have you gone", "Have you been", "Did you go", "Were you"],
            ans: 1,
            dispAnswer: "B. Have you been",
            exp: "السؤال عن مكان تواجده مؤخراً وقد عاد الآن للشخص (recent presence)[cite: 4]."
          },
          {
            id: "eng_m24",
            type: "single",
            text: "24) My grandfather ______ in an airplane before, so this is his first time.",
            opts: ["Never flew", "Had never flown", "Has never flown", "Never flies"],
            ans: 2,
            dispAnswer: "C. Has never flown",
            exp: "تجارب وخبرات الحياة حتى اللحظة الحالية مع before و first time تأخذ المضارع التام (Has never flown)[cite: 4]."
          },
          {
            id: "eng_m25",
            type: "single",
            text: "25) I am sorry, I ______ what you say. Can you repeat it?",
            opts: ["Haven't been understanding", "Am not understand", "Am not understanding", "Don't understand"],
            ans: 3,
            dispAnswer: "D. Don't understand",
            exp: "الفعل understand فعل إدراك وحالة لا يقبل صيغ الاستمرار (current state)[cite: 4]."
          },
          {
            id: "eng_m26",
            type: "single",
            text: "26) When Sara opened her eyes, she ______ her reflection in the mirror.",
            opts: ["Had seen", "Saw", "Was seeing", "Has seen"],
            ans: 1,
            dispAnswer: "B. Saw",
            exp: "حدث فوري ولحظي متتابع في الماضي بعد فتح عينيها مباشرة (sudden action)[cite: 4]."
          },
          {
            id: "eng_m27",
            type: "single",
            text: "27) One of the following sentences does not indicate a repeated action in the past:",
            opts: [
              "She always watched new movies",
              "She would have two new CDs",
              "She used to start studying after 4 p.m.",
              "She wouldn't wake up before noon"
            ],
            ans: 1,
            dispAnswer: "B. She would have two new CDs",
            exp: "لا يجوز استخدام would مع أفعال الحالة والملكية مثل have للتعبير عن عادات الماضي (not repeated habit)[cite: 4]."
          },
          {
            id: "eng_m28",
            type: "single",
            text: "28) I ______ three programs on my computer; two of them are working well now.",
            opts: ["Am fixing", "Fixed", "Have fixed", "Have been fixing"],
            ans: 2,
            dispAnswer: "C. Have fixed",
            exp: "اكتمال عدد محدد من الأعمال (three programs) مع أثر قائم الآن (مضارع تام Have fixed)[cite: 4]."
          },
          {
            id: "eng_m29",
            type: "single",
            text: "29) The world is becoming different and we will have to be prepared to ______ to the change.",
            opts: ["Accept", "Adopt", "Adapt", "Used"],
            ans: 2,
            dispAnswer: "C. Adapt",
            exp: "Adapt to تعني يتكيف ويتأقلم مع التغيير (adjust)[cite: 4]."
          },
          {
            id: "eng_m30",
            type: "single",
            text: "30) He is always on the ______; he never stays more than a year in one country.",
            opts: ["Leave", "Show", "Move", "Run"],
            ans: 2,
            dispAnswer: "C. Move",
            exp: "On the move تعبير اصطلاحي يعني في حالة تنقل وترحال دائم (always changing)[cite: 4]."
          },
          {
            id: "eng_m31",

    function initQuiz() {
      const driveBtn = document.getElementById('drive-link-btn');
      if (driveBtn) {
        if (originalDriveLink && originalDriveLink.trim() !== "") {
          driveBtn.href = originalDriveLink;
          driveBtn.style.display = "inline-flex";
        } else {
          driveBtn.style.display = "none";
        }
      }

      const list = document.getElementById('quiz-list');
      list.innerHTML = '';

      examSections.forEach((section) => {
        const card = document.createElement('div');
        card.className = 'q-card';

        let subQuestionsHtml = '';
        section.subQuestions.forEach((sub) => {
          const optsHtml = sub.opts.map((opt, i) => `
            <div class="option-item" id="opt-${sub.id}-${i}" onclick="selectSingleOption('${sub.id}', ${i})">
              <div class="opt-letter">${letters[i]}</div>
              <div>${opt}</div>
            </div>
          `).join('');

          const interactionHtml = `
            <div class="options-container" id="opts-box-${sub.id}">${optsHtml}</div>
            <div class="answer-input-row">
              <button class="btn-reset-q" id="reset-btn-${sub.id}" onclick="resetSubQuestion('${sub.id}')">إعادة السؤال ↻</button>
              <button class="btn-action" onclick="toggleSolution('${sub.id}')">
                <span>💡</span> عرض الحل
              </button>
            </div>
          `;

          subQuestionsHtml += `
            <div class="sub-question-card ltr-content" id="card-${sub.id}">
              <div class="sub-q-header">${sub.text}</div>
              ${interactionHtml}
              <div class="solution-box" id="sol-${sub.id}">
                <div><strong>الإجابة الصحيحة (Answer):</strong></div>
                <div style="margin-top: 6px; font-size: 0.98rem; font-weight: bold; line-height: 1.6; color: #5ac8fa; font-family: 'JetBrains Mono', monospace;">${sub.dispAnswer}</div>
                <div style="margin-top: 6px; font-size: 0.90rem; line-height: 1.6; color: var(--text-secondary); direction: rtl; text-align: right;">${sub.exp}</div>
              </div>
            </div>
          `;
        });

        card.innerHTML = `
          <div>
            <div class="parent-q-title">${section.title}</div>
            <div class="parent-q-desc">${section.context}</div>
          </div>
          <div class="sub-list">${subQuestionsHtml}</div>
        `;

        list.appendChild(card);
      });

      calculateScore();
      setupReportModal();
    }

    function findSubQuestion(subId) {
      for (const sec of examSections) {
        const found = sec.subQuestions.find(s => s.id === subId);
        if (found) return found;
      }
      return null;
    }

    function selectSingleOption(subId, optIdx) {
      const sub = findSubQuestion(subId);
      const optsBox = document.getElementById(`opts-box-${subId}`);
      const resetBtn = document.getElementById(`reset-btn-${subId}`);
      if (!sub || !optsBox) return;

      optsBox.classList.add('locked');

      const picked = document.getElementById(`opt-${subId}-${optIdx}`);
      if (optIdx === sub.ans) {
        if (picked) picked.classList.add('correct');
        userScores[subId] = true;
      } else {
        if (picked) picked.classList.add('wrong');
        const correctOpt = document.getElementById(`opt-${subId}-${sub.ans}`);
        if (correctOpt) correctOpt.classList.add('correct');
        delete userScores[subId];
      }

      if (resetBtn) resetBtn.style.display = 'inline-flex';
      calculateScore();
    }

    function resetSubQuestion(subId) {
      delete userScores[subId];

      const optsBox = document.getElementById(`opts-box-${subId}`);
      if (optsBox) optsBox.classList.remove('locked');

      const sub = findSubQuestion(subId);
      if (sub && sub.opts) {
        sub.opts.forEach((_, i) => {
          const el = document.getElementById(`opt-${subId}-${i}`);
          if (el) el.className = 'option-item';
        });
      }

      const resetBtn = document.getElementById(`reset-btn-${subId}`);
      const sol = document.getElementById(`sol-${subId}`);

      if (resetBtn) resetBtn.style.display = 'none';
      if (sol) sol.classList.remove('show');

      calculateScore();
    }

    function calculateScore() {
      let total = 0;
      let score = 0;
      examSections.forEach(sec => {
        sec.subQuestions.forEach(sub => {
          total++;
          if (userScores[sub.id]) score++;
        });
      });

      const pct = total > 0 ? Math.round((score / total) * 100) : 0;
      const scoreEl = document.getElementById('score');
      if (scoreEl) {
        scoreEl.innerText = `${score} / ${total} (${pct}%)`;
      }
    }

    function toggleSolution(subId) {
      const sol = document.getElementById(`sol-${subId}`);
      if (sol) sol.classList.toggle('show');
    }

    let allShown = false;
    function toggleAllSolutions() {
      allShown = !allShown;
      examSections.forEach(sec => {
        sec.subQuestions.forEach(sub => {
          const sol = document.getElementById(`sol-${sub.id}`);
          if (sol) {
            if (allShown) sol.classList.add('show');
            else sol.classList.remove('show');
          }
        });
      });
    }

    function resetQuiz() {
      userScores = {};
      initQuiz();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function setupReportModal() {
      const openBtn = document.getElementById('openReportBtn');
      const closeBtn = document.getElementById('closeReportBtn');
      const overlay = document.getElementById('reportOverlay');
      const form = document.getElementById('bugReportForm');
      const status = document.getElementById('reportStatus');

      if (!openBtn || !overlay) return;

      openBtn.onclick = () => {
        overlay.classList.add('active');
        overlay.setAttribute('aria-hidden', 'false');
      };

      const closeModal = () => {
        overlay.classList.remove('active');
        overlay.setAttribute('aria-hidden', 'true');
        if (status) status.innerText = '';
      };

      if (closeBtn) closeBtn.onclick = closeModal;

      overlay.onclick = (e) => {
        if (e.target === overlay) closeModal();
      };

      if (form) {
        form.onsubmit = (e) => {
          e.preventDefault();
          const submitBtn = document.getElementById('submitReportBtn');
          if (submitBtn) submitBtn.disabled = true;
          if (status) {
            status.style.color = '#30d158';
            status.innerText = 'تم إرسال البلاغ بنجاح، شكراً لمساعدتك!';
          }
          setTimeout(() => {
            closeModal();
            form.reset();
            if (submitBtn) submitBtn.disabled = false;
          }, 1500);
        };
      }
    }

    initQuiz();
  </script>
  <script src="../transition.js"></script>
</body>
</html>
