  <style>
    .bottom-nav-bar {
      display: flex;
      justify-content: center;

    .ltr-content {

    .parent-q-title {

      margin-bottom: 8px;
      border-bottom: 1px dashed var(--apple-border);
      padding-bottom: 8px;

    .parent-q-desc {
      font-size: 0.98rem;
      line-height: 1.7;
      color: var(--text-secondary);
      margin-bottom: 18px;
    }
    .sub-question-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--apple-border);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 18px;
    }
    .sub-q-header {
      font-weight: 700;
      font-size: 1.02rem;
      margin-bottom: 14px;
      color: var(--text-primary);
      line-height: 1.7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .options-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin: 14px 0;
    }
    .options-container.locked {
      pointer-events: none;
    }

    .option-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 16px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--apple-border);
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
      user-select: none;
      font-size: 0.98rem;
    }
    .option-item:hover {
      background: rgba(255, 255, 255, 0.08);
    }
    .option-item.selected {
      border-color: var(--apple-blue);
      background: rgba(10, 132, 255, 0.12);
    }
    .option-item.correct {
      background: rgba(48, 209, 88, 0.18) !important;
      border-color: #30d158 !important;
      color: #fff;
    }
    .option-item.wrong {
      background: rgba(255, 69, 58, 0.18) !important;
      border-color: #ff453a !important;
      color: #fff;
    }
    .opt-letter {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 0.85rem;
      flex-shrink: 0;
      font-family: 'JetBrains Mono', Consolas, monospace;
    }

    .answer-input-row {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    .btn-reset-q {
      display: none;
      background: rgba(255, 69, 58, 0.15);
      color: #ff453a;
      border: 1px solid rgba(255, 69, 58, 0.4);
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.85rem;
      transition: all 0.2s;
    }
    .btn-reset-q:hover {
      background: #ff453a;
      color: #fff;
    }
    .solution-box {
      display: none;
      margin-top: 14px;
      padding: 14px 16px;
      background: rgba(10, 132, 255, 0.08);
      border: 1px solid rgba(10, 132, 255, 0.25);
      border-radius: 10px;
    }
    .solution-box.show {
      display: block;
    }
  </style>

  <script>
    const originalDriveLink = "https://drive.google.com/file/d/1utMHTXvpWMm0k8YEoLSsOhcHSslV9adm/view";

    const letters = ['A', 'B', 'C', 'D', 'E'];

    const examSections = [
      {
        title: "Part 1: Tenses & Stative Verbs (Questions 1 – 13)",
        context: "Official past final questions covering tenses, time expressions, and action vs. stative verbs:",
        subQuestions: [
          {
            id: "ef_1",
            type: "single",
            text: "1. By the time the police arrived, the thief ______.",
            opts: ["was escaping", "had been escaping", "escaped", "had escaped"],
            ans: 3,
            dispAnswer: "d) had escaped",
            exp: "The past perfect tense is used for an action completed before another past event (arrived)."
          },
          {
            id: "ef_2",
            type: "single",
            text: "2. Mary is so annoying. She ______ me stupid questions. I really hate it.",
            opts: ["was always asking", "is always asking", "has always asked", "always asks"],
            ans: 1,
            dispAnswer: "b) is always asking",
            exp: "'Is always asking' conveys irritation or annoyance regarding an ongoing, repeated behavior."
          },
          {
            id: "ef_3",
            type: "single",
            text: "3. The solution to the problem ______ to be more complicated than we thought.",
            opts: ["appear", "appears", "appearing", "is appearing"],
            ans: 1,
            dispAnswer: "b) appears",
            exp: "'Appear' is a stative verb meaning 'seems' and takes singular present simple form 'appears'."
          },
          {
            id: "ef_4",
            type: "single",
            text: "4. She ______ such a beautiful painting before she visited the gallery last weekend.",
            opts: ["never seen", "had never seen", "had never been seeing", "has never seen"],
            ans: 1,
            dispAnswer: "b) had never seen",
            exp: "Past experience prior to a specific event in the past (visited) requires the past perfect."
          },
          {
            id: "ef_5",
            type: "single",
            text: "5. Her father ______ in a bank, and her mother ______ at a high school.",
            opts: ["works, is teaching", "is working, is teaching", "works, teach", "works, teaches"],
            ans: 3,
            dispAnswer: "d) works, teaches",
            exp: "Permanent occupations/facts require simple present with singular 3rd person 's' (works, teaches)."
          },
          {
            id: "ef_6",
            type: "single",
            text: "6. She ______ rude today and snapping at everyone, but usually, she's much friendlier.",
            opts: ["was", "is being", "was being", "is"],
            ans: 1,
            dispAnswer: "b) is being",
            exp: "'Is being' indicates temporary, uncharacteristic behavior occurring today."
          },
          {
            id: "ef_7",
            type: "single",
            text: "7. The storm ______ significant damage to the coastal areas last year.",
            opts: ["had caused", "caused", "was causing", "cause"],
            ans: 1,
            dispAnswer: "b) caused",
            exp: "A finished past event with a specific time indicator ('last year') takes the past simple."
          },
          {
            id: "ef_8",
            type: "single",
            text: "8. Larry ______ a lot of money last year but he ______ it all.",
            opts: ["won/ already spent", "has won/ already spent", "won/has already spent", "has won/has already spent"],
            ans: 2,
            dispAnswer: "c) won/has already spent",
            exp: "Past simple for 'last year' combined with present perfect with 'already' having present relevance."
          },
          {
            id: "ef_9",
            type: "single",
            text: "9. They ______ in Paris for the last two years and are readjusting to the lifestyle there.",
            opts: ["lived", "are living", "live", "have been living"],
            ans: 3,
            dispAnswer: "d) have been living",
            exp: "An action continuing over a period up into the present requires present perfect continuous."
          },
          {
            id: "ef_10",
            type: "single",
            text: "10. They ______ new ways to improve efficiency in their manufacturing process when they stumbled upon a more sustainable method.",
            opts: ["had explored", "had been exploring", "explored", "were exploring"],
            ans: 1,
            dispAnswer: "b) had been exploring",
            exp: "An ongoing process leading up to an interruption in the past takes past perfect continuous."
          },
          {
            id: "ef_11",
            type: "single",
            text: "11. Mr. Jonson ______ this luxurious hotel for more than 20 years. It is one of the country's best places.",
            opts: ["has", "had", "has been having", "has had"],
            ans: 3,
            dispAnswer: "d) has had",
            exp: "'Have' indicating possession is stative; with duration ('for more than 20 years'), present perfect is used."
          },
          {
            id: "ef_12",
            type: "single",
            text: "12. My mother ______ Asian cuisines very much. I am surprised that she ______ this western dish.",
            opts: ["is enjoying, enjoys", "enjoyed, enjoys", "enjoys, enjoys", "enjoys, is enjoying"],
            ans: 3,
            dispAnswer: "d) enjoys, is enjoying",
            exp: "General taste (enjoys) versus a specific action happening right now (is enjoying)."
          },
          {
            id: "ef_13",
            type: "single",
            text: "13. She ______ more confident in her presentations as she gains more experience.",
            opts: ["becomes", "has become", "became", "is becoming"],
            ans: 3,
            dispAnswer: "d) is becoming",
            exp: "Present continuous represents a gradual ongoing process of change."
          }
        ]
      },
      {
        title: "Part 2: Passive Voice, Causatives & Pronouns (Questions 14 – 44)",
        context: "Official past final questions covering active to passive transformations, reflexive pronouns, and causatives:",
        subQuestions: [
          {
            id: "ef_14",
            type: "single",
            text: "14. A: Look. Your car ______ the ground.<br>B: Oh, no. Wait a minute, please. I didn't know that...",
            opts: ["is just being lifted off", "has just been lifted off", "is lifted off", "is lifting off"],
            ans: 0,
            dispAnswer: "a) is just being lifted off",
            exp: "Present continuous passive ('is just being lifted off') describes an action in progress right now."
          },
          {
            id: "ef_15",
            type: "single",
            text: "15. A: Our boat ______ by storm when we were sailing to Corfu.<br>B: And how did you get back?",
            opts: ["was damaged", "was being damaged", "has been damaged", "is damaged"],
            ans: 0,
            dispAnswer: "a) was damaged",
            exp: "Past simple passive describes a completed event that occurred during their journey."
          },
          {
            id: "ef_16",
            type: "single",
            text: "16. A: Sarah didn't take part in the press conference yesterday night.<br>B: She told me that she ______.",
            opts: ["had not been informed", "has not been informed", "was not being informed", "informed"],
            ans: 0,
            dispAnswer: "a) had not been informed",
            exp: "Past perfect passive represents an event prior to Sarah's reporting/absence."
          },
          {
            id: "ef_17",
            type: "single",
            text: "17. I can guarantee that this room (tidy) ______ every morning.",
            opts: ["is tidied", "is being tidied", "are tidied", "was tidied"],
            ans: 0,
            dispAnswer: "a) is tidied",
            exp: "Present simple passive expresses a regular, routine event ('every morning')."
          },
          {
            id: "ef_18",
            type: "single",
            text: "18. A: A lot of houses were destroyed ______ fire when we were in California.<br>B: Yes, I know. I've heard about it.",
            opts: ["By", "with"],
            ans: 0,
            dispAnswer: "a) By",
            exp: "'By' introduces the agent or cause of destruction."
          },
          {
            id: "ef_19",
            type: "single",
            text: "19. Somebody accused me of stealing the money.",
            opts: ["I am accused of stealing the money.", "I were accused of stealing the money.", "I will be accused of stealing the money.", "I was accused of stealing the money."],
            ans: 3,
            dispAnswer: "d) I was accused of stealing the money.",
            exp: "Past simple active transforms to 'was/were + V3' ('I was accused')."
          },
          {
            id: "ef_20",
            type: "single",
            text: "20. Cells ______ for the first time by the English scientist Robert Hooke, who, in 1665, ______ a book about his findings.",
            opts: ["were described / published", "had described / has published", "has described / had published", "Has been described/published"],
            ans: 0,
            dispAnswer: "a) were described / published",
            exp: "Historical past events require past simple passive followed by past simple active."
          },
          {
            id: "ef_21",
            type: "single",
            text: "21. The world's first dental school, Baltimore College of Dental Surgery, ______ by two Americans, Horace Hayden and Chapin Harris, in 1839.",
            opts: ["was founding", "was founded (established)", "had founded", "has been founded"],
            ans: 1,
            dispAnswer: "b) was founded (established)",
            exp: "'Was founded' is the past simple passive for establishing an institution."
          },
          {
            id: "ef_22",
            type: "single",
            text: "22. We will send you your examination results.",
            opts: ["You will sent your examination results.", "You will be send your examination results.", "You will be sent your examination results.", "You will send your examination results."],
            ans: 2,
            dispAnswer: "c) You will be sent your examination results.",
            exp: "Future passive structure: 'will + be + past participle' (will be sent)."
          },
          {
            id: "ef_23",
            type: "single",
            text: "23. The kids enjoyed ______ when they visited Disneyland.",
            opts: ["himself", "them", "themselves", "their"],
            ans: 2,
            dispAnswer: "c) themselves",
            exp: "Reflexive pronoun for plural 'the kids' is 'themselves'."
          },
          {
            id: "ef_24",
            type: "single",
            text: "24. I didn't realize that someone was recording our conversation.",
            opts: [
              "I didn't realize that our conversation had being recorded.",
              "I didn't realize that our conversation was recorded.",
              "I didn't realize that our conversation was being recorded.",
              "I didn't realize that our conversation had been recorded."
            ],
            ans: 2,
            dispAnswer: "c) I didn't realize that our conversation was being recorded.",
            exp: "Past continuous passive requires 'was/were + being + V3'."
          },
          {
            id: "ef_25",
            type: "single",
            text: "25. The works of Shakespeare ______ into every major language in the world.",
            opts: ["are going to translate", "have been translated", "had translated", "had been translating"],
            ans: 1,
            dispAnswer: "b) have been translated",
            exp: "Present perfect passive indicates completion with current relevance."
          },
          {
            id: "ef_26",
            type: "single",
            text: "26. I really hate ______ waiting at the dentist.",
            opts: ["being kept", "to have kept", "having kept", "to keep"],
            ans: 0,
            dispAnswer: "a) being kept",
            exp: "Passive gerund 'being kept' follows verbs of feeling/preference like 'hate'."
          },
          {
            id: "ef_27",
            type: "single",
            text: "27. The twins ______ after by a German nanny for the last three years, so they can both speak German quite fluently.",
            opts: ["were being looked", "have been looked", "will have looked", "have been looking"],
            ans: 1,
            dispAnswer: "b) have been looked",
            exp: "Present perfect passive expresses care that has continued for three years."
          },
          {
            id: "ef_28",
            type: "single",
            text: "28. I'll have to come by bus as my car ______.",
            opts: ["is repairing", "is being repaired", "Was being repaired", "Has been repaired"],
            ans: 1,
            dispAnswer: "b) is being repaired",
            exp: "Present continuous passive denotes an ongoing process happening now."
          },
          {
            id: "ef_29",
            type: "single",
            text: "29. Archaeologists ______ the gold in a cave near the top of the mountain.",
            opts: ["were discovered", "was discovered", "discovered", "Have been discovered"],
            ans: 2,
            dispAnswer: "c) discovered",
            exp: "The subject 'Archaeologists' performs the action, requiring active past simple."
          },
          {
            id: "ef_30",
            type: "single",
            text: "30. 'The government has to take precautions against the hunters to protect the elephants because they are becoming extinct.' = Precautions ______ against the hunters to protect the elephants because they are becoming extinct.",
            opts: ["are to be taken", "were to be taken", "has to be taken", "have to be taken"],
            ans: 3,
            dispAnswer: "d) have to be taken",
            exp: "Plural subject 'Precautions' requires 'have to be + past participle'."
          },
          {
            id: "ef_31",
            type: "single",
            text: "31. There isn't any ice cream in the refrigerator now. It all ______.",
            opts: ["was/been eaten", "has/been eaten", "had/eaten", "had/been eaten"],
            ans: 1,
            dispAnswer: "b) has/been eaten",
            exp: "Result in the present ('isn't any now') demands present perfect passive ('has been eaten')."
          },
          {
            id: "ef_32",
            type: "single",
            text: "32. Ali ______ his credit card ______.",
            opts: ["has/change", "get/to change", "made/to change", "had/changed"],
            ans: 3,
            dispAnswer: "d) had/changed",
            exp: "Causative pattern: have/had + object + past participle ('had his credit card changed')."
          },
          {
            id: "ef_33",
            type: "single",
            text: "33. He is the kind of man who doesn't do even a simple favor without ______.",
            opts: ["be paid", "to have been paid", "being paid", "paying"],
            ans: 2,
            dispAnswer: "c) being paid",
            exp: "Prepositions like 'without' are followed by a passive gerund ('being paid')."
          },
          {
            id: "ef_34",
            type: "single",
            text: "34. The Remembrance Day and the Veteran's Day ______ on the 11th of November every year.",
            opts: ["Celebrated", "are celebrated", "will be celebrated", "is celebrated"],
            ans: 1,
            dispAnswer: "b) are celebrated",
            exp: "Plural compound subject takes plural present simple passive ('are celebrated')."
          },
          {
            id: "ef_35",
            type: "single",
            text: "35. The people next door disappeared 6 months ago. They ______ since then.",
            opts: ["aren't seen", "haven't been seen", "weren't seen", "weren't being seen"],
            ans: 1,
            dispAnswer: "b) haven't been seen",
            exp: "'Since then' triggers the present perfect passive ('haven't been seen')."
          },
          {
            id: "ef_36",
            type: "single",
            text: "36. Tim injured ______ while playing football.",
            opts: ["He", "herself", "themselves", "himself"],
            ans: 3,
            dispAnswer: "d) himself",
            exp: "Singular masculine reflexive pronoun is 'himself'."
          },
          {
            id: "ef_37",
            type: "single",
            text: "37. The hotel, which ______ only last year, ______ with a solarium and sauna.",
            opts: ["was completed / is equipped", "had completed / was equipped", "has been completed / will be equipped", "completed/ was equipped"],

        }
      }

      const list = document.getElementById('quiz-list');
      list.innerHTML = '';

      examSections.forEach((section) => {
        const card = document.createElement('div');
        card.className = 'q-card';

        let subQuestionsHtml = '';
        section.subQuestions.forEach((sub) => {
          const optsHtml = sub.opts.map((opt, i) => `
            <div class="option-item" id="opt-${sub.id}-${i}" onclick="selectSingleOption('${sub.id}', ${i})">
              <div class="opt-letter">${letters[i]}</div>
              <div>${opt}</div>
            </div>
          `).join('');

          const interactionHtml = `
            <div class="options-container" id="opts-box-${sub.id}">${optsHtml}</div>
            <div class="answer-input-row">
              <button class="btn-reset-q" id="reset-btn-${sub.id}" onclick="resetSubQuestion('${sub.id}')">إعادة السؤال ↻</button>
              <button class="btn-action" onclick="toggleSolution('${sub.id}')">
                <span>💡</span> عرض الحل
              </button>
            </div>
          `;

          subQuestionsHtml += `
            <div class="sub-question-card ltr-content" id="card-${sub.id}">
              <div class="sub-q-header">${sub.text}</div>
              ${interactionHtml}
              <div class="solution-box" id="sol-${sub.id}">
                <div><strong>الإجابة الصحيحة (Answer):</strong></div>
                <div style="margin-top: 6px; font-size: 0.98rem; font-weight: bold; line-height: 1.6; color: #5ac8fa; font-family: 'JetBrains Mono', monospace;">${sub.dispAnswer}</div>
                <div style="margin-top: 6px; font-size: 0.90rem; line-height: 1.6; color: var(--text-secondary); direction: rtl; text-align: right;">${sub.exp}</div>
              </div>
            </div>
          `;
        });

        card.innerHTML = `
          <div>
            <div class="parent-q-title">${section.title}</div>
            <div class="parent-q-desc">${section.context}</div>
          </div>
          <div class="sub-list">${subQuestionsHtml}</div>
        `;

        list.appendChild(card);
      });

      calculateScore();
      setupReportModal();
    }

    function findSubQuestion(subId) {
      for (const sec of examSections) {
        const found = sec.subQuestions.find(s => s.id === subId);
        if (found) return found;
      }
      return null;
    }

    function selectSingleOption(subId, optIdx) {
      const sub = findSubQuestion(subId);
      const optsBox = document.getElementById(`opts-box-${subId}`);
      const resetBtn = document.getElementById(`reset-btn-${subId}`);
      if (!sub || !optsBox) return;

      optsBox.classList.add('locked');

      const picked = document.getElementById(`opt-${subId}-${optIdx}`);
      if (optIdx === sub.ans) {
        if (picked) picked.classList.add('correct');
        userScores[subId] = true;
      } else {
        if (picked) picked.classList.add('wrong');
        const correctOpt = document.getElementById(`opt-${subId}-${sub.ans}`);
        if (correctOpt) correctOpt.classList.add('correct');
        delete userScores[subId];
      }

      if (resetBtn) resetBtn.style.display = 'inline-flex';
      calculateScore();
    }

    function resetSubQuestion(subId) {
      delete userScores[subId];

      const optsBox = document.getElementById(`opts-box-${subId}`);
      if (optsBox) optsBox.classList.remove('locked');

      const sub = findSubQuestion(subId);
      if (sub && sub.opts) {
        sub.opts.forEach((_, i) => {
          const el = document.getElementById(`opt-${subId}-${i}`);
          if (el) el.className = 'option-item';
        });
      }

      const resetBtn = document.getElementById(`reset-btn-${subId}`);
      const sol = document.getElementById(`sol-${subId}`);

      if (resetBtn) resetBtn.style.display = 'none';
      if (sol) sol.classList.remove('show');

      calculateScore();
    }

    function calculateScore() {
      let total = 0;
      let score = 0;
      examSections.forEach(sec => {
        sec.subQuestions.forEach(sub => {
          total++;
          if (userScores[sub.id]) score++;
        });
      });

      const pct = total > 0 ? Math.round((score / total) * 100) : 0;
      const scoreEl = document.getElementById('score');
      if (scoreEl) {
        scoreEl.innerText = `${score} / ${total} (${pct}%)`;
      }
    }

    function toggleSolution(subId) {
      const sol = document.getElementById(`sol-${subId}`);
      if (sol) sol.classList.toggle('show');
    }

    let allShown = false;
    function toggleAllSolutions() {
      allShown = !allShown;
      examSections.forEach(sec => {
        sec.subQuestions.forEach(sub => {
          const sol = document.getElementById(`sol-${sub.id}`);
          if (sol) {
            if (allShown) sol.classList.add('show');
            else sol.classList.remove('show');
          }
        });
      });
    }

    function resetQuiz() {
      userScores = {};
      initQuiz();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function setupReportModal() {
      const openBtn = document.getElementById('openReportBtn');
      const closeBtn = document.getElementById('closeReportBtn');
      const overlay = document.getElementById('reportOverlay');
      const form = document.getElementById('bugReportForm');
      const status = document.getElementById('reportStatus');

      if (!openBtn || !overlay) return;

      openBtn.onclick = () => {
        overlay.classList.add('active');
        overlay.setAttribute('aria-hidden', 'false');
      };

      const closeModal = () => {
        overlay.classList.remove('active');
        overlay.setAttribute('aria-hidden', 'true');
        if (status) status.innerText = '';
      };

      if (closeBtn) closeBtn.onclick = closeModal;

      overlay.onclick = (e) => {
        if (e.target === overlay) closeModal();
      };

      if (form) {
        form.onsubmit = (e) => {
          e.preventDefault();
          const submitBtn = document.getElementById('submitReportBtn');
          if (submitBtn) submitBtn.disabled = true;
          if (status) {
            status.style.color = '#30d158';
            status.innerText = 'تم إرسال البلاغ بنجاح، شكراً لمساعدتك!';
          }
          setTimeout(() => {
            closeModal();
            form.reset();
            if (submitBtn) submitBtn.disabled = false;
          }, 1500);
        };
      }
    }

    initQuiz();
  </script>
  <script src="../transition.js"></script>
</body>
</html>
