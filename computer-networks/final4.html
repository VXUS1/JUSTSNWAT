  <script>
    const originalDriveLink = "https://drive.google.com/drive/folders/1_IK9Yffbh_W9Alx3vDCqTE39GpHvbnx-";

    function escapeHtml(text) {
      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    const letters = ['A', 'B', 'C', 'D', 'E'];

    const examSections = [
      {
        title: "Part 1: [10 pts, each 0.5 marks] [CLOs: 2-9: Data link, network, Transport layers]",
        context: "Mark each of the following statements with False/True (F/T):",
        subQuestions: [
          {
            id: "tf_1",
            type: "single",
            text: "1. Collision cannot occur in token ring networks",
            img: "",
            opts: ["True", "False"],
            ans: 0,
            dispAnswer: "True",
            exp: "في شبكات <bdi>Token Ring</bdi>، لا ترسل المحطة البيانات إلا بعد حيازة الرمز المميز (<bdi>Token</bdi>)، مما يمنع حدوث أي تصادم."
          },
          {
            id: "tf_2",
            type: "single",
            text: "2. TCP relies on port addressing to multiplex received segments",
            img: "",
            opts: ["True", "False"],
            ans: 1,
            dispAnswer: "False",
            exp: "عند الاستقبال، تعتمد طبقة النقل على أرقام المنافذ لفك التجميع (<bdi>Demultiplexing</bdi>) وتسليم البيانات للتطبيق المناسب، بينما التجميع (<bdi>Multiplexing</bdi>) يحدث عند الإرسال."
          },
          {
            id: "tf_3",
            type: "single",
            text: "3. MLPS is a layer 2/3 protocol",
            img: "",
            opts: ["True", "False"],
            ans: 0,
            dispAnswer: "True",
            exp: "يعمل بروتوكول <bdi>MPLS</bdi> بين الطبقة الثانية والثالثة ويصنف اصطلاحاً كبروتوكول <bdi>Layer 2.5</bdi>."
          },
          {
            id: "tf_4",
            type: "single",
            text: "4. MLPS is classified as a packet-switched networks",
            img: "",
            opts: ["True", "False"],
            ans: 0,
            dispAnswer: "True",
            exp: "تعتمد تقنية <bdi>MPLS</bdi> على توجيه الحزم والملصقات (<bdi>Packet-switched</bdi>) دون حجز دارات مخصصة مسبقاً."
          },
          {
            id: "tf_5",
            type: "single",
            text: "5. The switch MAC table displays the VLAN which the host belong to",
            img: "",
            opts: ["True", "False"],
            ans: 0,
            dispAnswer: "True",
            exp: "في المبدلات الحديثة، يربط جدول <bdi>MAC</bdi> كل عنوان برقم المنفذ ورقم الشبكة الافتراضية (<bdi>VLAN ID</bdi>) الخاصة به."
          },
          {
            id: "tf_6",
            type: "single",
            text: "6. DHCP messages are carried in UDP datagrams",
            img: "",
            opts: ["True", "False"],
            ans: 0,
            dispAnswer: "True",
            exp: "تُرسل رسائل بروتوكول <bdi>DHCP</bdi> عبر حزم <bdi>UDP</bdi> باستخدام المنفذين 67 و 68."
          },
          {
            id: "tf_7",
            type: "single",
            text: "7. DHCP may provide the host with the name and IP address of DNS sever",
            img: "",
            opts: ["True", "False"],
            ans: 0,
            dispAnswer: "True",
            exp: "من خيارات بروتوكول <bdi>DHCP</bdi> تزويد العميل بعنوان خادم أسماء النطاقات (<bdi>DNS Server IP</bdi>) واسم النطاق."
          },
          {
            id: "tf_8",
            type: "single",
            text: "8. Trunk port is used to interconnect different VLANS",
            img: "",
            opts: ["True", "False"],
            ans: 1,
            dispAnswer: "False",
            exp: "منفذ <bdi>Trunk</bdi> ينقل حركة بيانات عدة شبكات <bdi>VLANs</bdi> بين المبدلات، لكن التوجيه والربط بين شبكات مختلفة يتطلب راوتر أو مبدل طبقة ثالثة (<bdi>Inter-VLAN Routing</bdi>)."
          },
          {
            id: "tf_9",
            type: "single",
            text: "9. A router with 3 interfaces could have up to 3 ARP tables",
            img: "",
            opts: ["True", "False"],
            ans: 1,
            dispAnswer: "False",
            exp: "يمتلك الراوتر جدول <bdi>ARP</bdi> مركزياً واحداً لنظام التشغيل يجمع عناوين كافة الواجهات."
          },
          {
            id: "tf_10",
            type: "single",
            text: "10. The maximum size of Ethernet frame is 1500 Bytes",
            img: "",
            opts: ["True", "False"],
            ans: 1,
            dispAnswer: "False",
            exp: "الـ <bdi>1500 Bytes</bdi> هي سعة حمولة البيانات القصوى (<bdi>MTU</bdi>)، بينما الحجم الأقصى للإطار شاملاً الترويسة والذيل هو <bdi>1518 Bytes</bdi>."
          },
          {
            id: "tf_11",
            type: "single",
            text: "11. Once an entry is placed in an ARP table of a host it can be used as long as the host is up",
            img: "",
            opts: ["True", "False"],
            ans: 1,
            dispAnswer: "False",
            exp: "مداخل جدول <bdi>ARP</bdi> مؤقتة وتُحذف بعد انقضاء زمن البقاء (<bdi>Timeout / TTL</bdi>) لضمان التحديث المستمر."
          },
          {
            id: "tf_12",
            type: "single",
            text: "12. In CSMA/CD, if a collision happens, a host must wait for t=K*256 bit times (K=random number)",
            img: "",
            opts: ["True", "False"],
            ans: 1,
            dispAnswer: "False",
            exp: "في معيار الإيثرنت (<bdi>CSMA/CD</bdi>)، فترة الشريحة هي 512 بت؛ فينتظر المضيف زمناً قدره <bdi>t = K × 512 bit times</bdi>."
          },
          {
            id: "tf_13",
            type: "single",
            text: "13. The VLAN tag carries the port ID connected to the source Host",
            img: "",
            opts: ["True", "False"],
            ans: 1,
            dispAnswer: "False",
            exp: "تحمل علامة <bdi>802.1Q</bdi> رقم الشبكة الافتراضية (<bdi>VLAN ID</bdi>) وأولويات الخدمة، ولا علاقة لها برقم منفذ الجهاز المصدر."
          },
          {
            id: "tf_14",
            type: "single",
            text: "14. IPV6 packet cannot have more than one header",
            img: "",
            opts: ["True", "False"],
            ans: 1,
            dispAnswer: "False",
            exp: "يدعم بروتوكول <bdi>IPv6</bdi> ترويسات التوسعة المتعددة (<bdi>Extension Headers</bdi>) المتتابعة بين الترويسة الثابتة وحمولة البيانات."
          },
          {
            id: "tf_15",
            type: "single",
            text: "15. In RIP, each node sends its own distance vector to all nodes in the network every 30 secs",
            img: "",
            opts: ["True", "False"],
            ans: 1,
            dispAnswer: "False",
            exp: "يرسل بروتوكول <bdi>RIP</bdi> تحديثاته إلى الراوترات المجاورة المباشرة فقط (<bdi>Neighbors</bdi>) وليس إلى كافة عقد الشبكة."
          },
          {
            id: "tf_16",
            type: "single",
            text: "16. The MAC address (1A-2F-BB-76-M9-AD) is a valid Ethernet address",
            img: "",
            opts: ["True", "False"],
            ans: 1,
            dispAnswer: "False",
            exp: "العنوان غير صالح؛ لأن الحرف <bdi>'M'</bdi> ليس من ضمن الرموز الست عشرية الصحيحة (<bdi>0-9, A-F</bdi>)."
          },
          {
            id: "tf_17",
            type: "single",
            text: "17. Self-learning switches will never broadcast a frame having a valid MAC address",
            img: "",
            opts: ["True", "False"],
            ans: 1,
            dispAnswer: "False",
            exp: "إذا كان ماك الوجهة غير مسجل في جدول المبدل بعد (<bdi>Unknown Unicast</bdi>)، يقوم المبدل ببث الإطار عبر كافة المنافذ للبحث عنه."
          },
          {
            id: "tf_18",
            type: "single",
            text: "18. 802.1Q protocol should not adds/removed additional header fields for frames forwarded between trunk ports",
            img: "",
            opts: ["True", "False"],
            ans: 1,
            dispAnswer: "False",
            exp: "يضيف بروتوكول <bdi>802.1Q</bdi> وسماً بطول 4 بايت عند إرسال الإطار عبر روابط <bdi>Trunk</bdi> ويزيله عند التسليم لمنافذ الوصول."
          },
          {
            id: "tf_19",
            type: "single",
            text: "19. In MPLS datagram the IP address is removed from the IP datagram",
            img: "",
            opts: ["True", "False"],
            ans: 1,
            dispAnswer: "False",
            exp: "تبقى ترويسة <bdi>IP</bdi> وعناوينها كما هي دون مساس؛ ويتم فقط إدراج ملصق <bdi>MPLS</bdi> كترويسة إضافية."
          },
          {
            id: "tf_20",
            type: "single",
            text: "20. Out-of-order segments are well handled by TCP standard",
            img: "",
            opts: ["True", "False"],
            ans: 1,
            dispAnswer: "False",
            exp: "معيار وثيقة <bdi>RFC</bdi> لبروتوكول <bdi>TCP</bdi> لا يحدد آلية موحدة إلزامية لمعالجة الحزم غير المرتبة، بل يترك الأمر لخيار المطور."
          }
        ]
      },
      {

          <div class="ltr-content">
            <div class="parent-q-title">${section.title}</div>
            <div class="parent-q-desc">${section.context}</div>
          </div>
          <div class="sub-list">${subQuestionsHtml}</div>
        `;

        list.appendChild(card);
      });

      calculateScore();
      setupReportModal();
    }

    function toggleOriginalImage(qid) {
      const imgBox = document.getElementById(`img-box-${qid}`);
      const imgEl = document.getElementById(`img-${qid}`);

      if (imgEl && !imgEl.src && imgEl.dataset.src) {
        imgEl.src = imgEl.dataset.src;
      }

      if (imgBox) {
        imgBox.classList.toggle('show');
      }
    }

    function handleImageFallback(imgEl) {
      if (!imgEl.dataset.retried) {
        imgEl.dataset.retried = "1";
        if (imgEl.src.endsWith('.jpg')) {
          imgEl.src = imgEl.src.replace('.jpg', '.png');
        } else if (imgEl.src.endsWith('.png')) {
          imgEl.src = imgEl.src.replace('.png', '.jpg');
        }
      }
    }

    function findSubQuestion(subId) {
      for (const sec of examSections) {
        const found = sec.subQuestions.find(s => s.id === subId);
        if (found) return found;
      }
      return null;
    }

    function selectSingleOption(subId, optIdx) {
      const sub = findSubQuestion(subId);
      const optsBox = document.getElementById(`opts-box-${subId}`);
      const resetBtn = document.getElementById(`reset-btn-${subId}`);
      if (!sub || !optsBox) return;

      optsBox.classList.add('locked');

      const picked = document.getElementById(`opt-${subId}-${optIdx}`);
      if (optIdx === sub.ans) {
        if (picked) picked.classList.add('correct');
        userScores[subId] = true;
      } else {
        if (picked) picked.classList.add('wrong');
        delete userScores[subId];
      }

      if (resetBtn) resetBtn.style.display = 'inline-flex';
      calculateScore();
    }

    function checkInputAnswer(subId) {
      const sub = findSubQuestion(subId);
      const inputEl = document.getElementById(`input-${subId}`);
      const resetBtn = document.getElementById(`reset-btn-${subId}`);
      const checkBtn = document.getElementById(`btn-check-${subId}`);
      if (!sub || !inputEl) return;

      const userVal = inputEl.value.trim();
      if (!userVal) {
        alert("يرجى إدخال إجابة أولاً!");
        return;
      }

      const isCorrect = sub.validate(userVal);
      inputEl.disabled = true;

      if (isCorrect) {
        inputEl.className = 'text-input-field correct';
        userScores[subId] = true;
      } else {
        inputEl.className = 'text-input-field wrong';
        delete userScores[subId];
      }

      if (checkBtn) checkBtn.style.display = 'none';
      if (resetBtn) resetBtn.style.display = 'inline-flex';

      calculateScore();
    }

    function checkP4SubnetTable() {
      const subId = "p4_sub_table";
      const checkBtn = document.getElementById(`btn-check-${subId}`);
      const resetBtn = document.getElementById(`reset-btn-${subId}`);

      const answers = {
        1: { sub: "187.88.99.64/28", start: "187.88.99.65", end: "187.88.99.78", bcast: "187.88.99.79" },
        2: { sub: "187.88.99.80/28", start: "187.88.99.81", end: "187.88.99.94", bcast: "187.88.99.95" },
        3: { sub: "187.88.99.96/28", start: "187.88.99.97", end: "187.88.99.110", bcast: "187.88.99.111" },
        4: { sub: "187.88.99.112/28", start: "187.88.99.113", end: "187.88.99.126", bcast: "187.88.99.127" }
      };

      let allCorrect = true;
      [1, 2, 3, 4].forEach(s => {
        ["sub", "start", "end", "bcast"].forEach(col => {
          const el = document.getElementById(`p4_${col}_${s}`);
          if (!el) return;
          el.disabled = true;
          if (el.value.trim().toLowerCase() === answers[s][col].toLowerCase()) {
            el.className = "table-input correct";
          } else {
            el.className = "table-input wrong";
            allCorrect = false;
          }
        });
      });

      if (allCorrect) userScores[subId] = true;
      else delete userScores[subId];

      if (checkBtn) checkBtn.style.display = 'none';
      if (resetBtn) resetBtn.style.display = 'inline-flex';
      calculateScore();
    }

    function checkP5DvTable() {
      const subId = "p5_dv_table";
      const checkBtn = document.getElementById(`btn-check-${subId}`);
      const resetBtn = document.getElementById(`reset-btn-${subId}`);

      const targets = { "p5_u": "4", "p5_y": "4", "p5_z": "6", "p5_v": "7" };
      let allCorrect = true;

      Object.keys(targets).forEach(id => {
        const el = document.getElementById(id);
        if (!el) return;
        el.disabled = true;
        if (el.value.trim() === targets[id]) {
          el.className = "table-input correct";
        } else {
          el.className = "table-input wrong";
          allCorrect = false;
        }
      });

      if (allCorrect) userScores[subId] = true;
      else delete userScores[subId];

      if (checkBtn) checkBtn.style.display = 'none';
      if (resetBtn) resetBtn.style.display = 'inline-flex';
      calculateScore();
    }

    function checkP6DijkstraTable() {
      const subId = "p6_dijkstra_table";
      const checkBtn = document.getElementById(`btn-check-${subId}`);
      const resetBtn = document.getElementById(`reset-btn-${subId}`);

      const clean = (val) => val.trim().toLowerCase().replace(/\s/g, '');

      let allCorrect = true;

      const checkField = (id, validArray) => {
        const el = document.getElementById(id);
        if (!el) return;
        el.disabled = true;
        const v = clean(el.value);
        if (validArray.some(target => v === clean(target))) {
          el.className = "table-input correct";
        } else {
          el.className = "table-input wrong";
          allCorrect = false;
        }
      };

      // Step 3
      checkField("p6_n_3", ["zxvy", "z,x,v,y", "zxv,y"]);
      checkField("p6_u_3", ["14,v", "14, v"]);
      checkField("p6_w_3", ["14,x", "14, x"]);
      checkField("p6_t_3", ["15,v", "15, v"]);

      // Step 4
      checkField("p6_n_4", ["zxvyu", "z,x,v,y,u", "zxvyw", "z,x,v,y,w"]);
      checkField("p6_w_4", ["14,x", "14, x", "14,u", "14, u"]);
      checkField("p6_t_4", ["15,v", "15, v"]);

      // Step 5
      checkField("p6_n_5", ["zxvyuw", "z,x,v,y,u,w", "zxvywu"]);
      checkField("p6_t_5", ["15,v", "15, v"]);

      // Step 6
      checkField("p6_n_6", ["zxvyuwt", "z,x,v,y,u,w,t", "zxvywut"]);

      if (allCorrect) userScores[subId] = true;
      else delete userScores[subId];

      if (checkBtn) checkBtn.style.display = 'none';
      if (resetBtn) resetBtn.style.display = 'inline-flex';
      calculateScore();
    }

    function resetSubQuestion(subId) {
      delete userScores[subId];

      const inputEl = document.getElementById(`input-${subId}`);
      if (inputEl) {
        inputEl.disabled = false;
        inputEl.value = '';
        inputEl.className = 'text-input-field';
        inputEl.focus();
      }

      const optsBox = document.getElementById(`opts-box-${subId}`);
      if (optsBox) {
        optsBox.classList.remove('locked');
      }

      const sub = findSubQuestion(subId);
      if (sub && sub.type === "single") {
        sub.opts.forEach((_, i) => {
          const el = document.getElementById(`opt-${subId}-${i}`);
          if (el) el.className = 'option-item';
        });
      }

      const tableReset = (prefix, keys) => {
        keys.forEach(k => {
          const el = document.getElementById(`${prefix}${k}`);
          if (el) {
            el.disabled = false;
            el.value = '';
            el.className = 'table-input';
          }
        });
      };

      if (subId === "p4_sub_table") {
        [1, 2, 3, 4].forEach(s => {
          tableReset("p4_", [`sub_${s}`, `start_${s}`, `end_${s}`, `bcast_${s}`]);
        });
      }

      if (subId === "p5_dv_table") {
        tableReset("p5_", ["u", "y", "z", "v"]);
      }

      if (subId === "p6_dijkstra_table") {
        tableReset("p6_", [
          "n_3", "u_3", "w_3", "t_3",
          "n_4", "w_4", "t_4",
          "n_5", "t_5",
          "n_6"
        ]);
      }

      const checkBtn = document.getElementById(`btn-check-${subId}`);
      const resetBtn = document.getElementById(`reset-btn-${subId}`);
      const sol = document.getElementById(`sol-${subId}`);
      const imgBox = document.getElementById(`img-box-${subId}`);

      if (checkBtn) checkBtn.style.display = 'inline-flex';
      if (resetBtn) resetBtn.style.display = 'none';
      if (sol) sol.classList.remove('show');
      if (imgBox) imgBox.classList.remove('show');

      calculateScore();
    }

    function calculateScore() {
      let total = 0;
      let score = 0;
      examSections.forEach(sec => {
        sec.subQuestions.forEach(sub => {
          total++;
          if (userScores[sub.id]) score++;
        });
      });

      const pct = total > 0 ? Math.round((score / total) * 100) : 0;
      const scoreEl = document.getElementById('score');
      if (scoreEl) {
        scoreEl.innerText = `${score} / ${total} (${pct}%)`;
      }
    }

    function toggleSolution(subId) {
      const sol = document.getElementById(`sol-${subId}`);
      if (sol) sol.classList.toggle('show');
    }

    let allShown = false;
    function toggleAllSolutions() {
      allShown = !allShown;
      examSections.forEach(sec => {
        sec.subQuestions.forEach(sub => {
          const sol = document.getElementById(`sol-${sub.id}`);
          if (sol) {
            if (allShown) sol.classList.add('show');
            else sol.classList.remove('show');
          }
        });
      });
    }

    function resetQuiz() {
      userScores = {};
      initQuiz();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function setupReportModal() {
      const openBtn = document.getElementById('openReportBtn');
      const closeBtn = document.getElementById('closeReportBtn');
      const overlay = document.getElementById('reportOverlay');
      const form = document.getElementById('bugReportForm');
      const status = document.getElementById('reportStatus');

      if (!openBtn || !overlay) return;

      openBtn.onclick = () => {
        overlay.classList.add('active');
        overlay.setAttribute('aria-hidden', 'false');
      };

      const closeModal = () => {
        overlay.classList.remove('active');
        overlay.setAttribute('aria-hidden', 'true');
        if (status) status.innerText = '';
      };

      if (closeBtn) closeBtn.onclick = closeModal;

      overlay.onclick = (e) => {
        if (e.target === overlay) closeModal();
      };

      if (form) {
        form.onsubmit = (e) => {
          e.preventDefault();
          const submitBtn = document.getElementById('submitReportBtn');
          if (submitBtn) submitBtn.disabled = true;
          if (status) {
            status.style.color = '#30d158';
            status.innerText = 'تم إرسال البلاغ بنجاح، شكراً لمساعدتك!';
          }
          setTimeout(() => {
            closeModal();
            form.reset();
            if (submitBtn) submitBtn.disabled = false;
          }, 1500);
        };
      }
    }

    initQuiz();
  </script>
  <script src="../transition.js"></script>
</body>
