  <style>
    .bottom-nav-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      margin-top: 36px;
      padding-top: 24px;

    }
    .btn-bottom-action {
      background: var(--apple-surface);
      border: 1px solid var(--apple-border-strong);
      color: var(--text-primary);
      padding: 12px 26px;
      border-radius: 99px;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.95rem;

      gap: 8px;

    }
    .btn-bottom-action:hover {
      background: var(--apple-surface-hover);
      border-color: rgba(255, 255, 255, 0.25);
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);

      font-size: 0.98rem;
      line-height: 1.7;
      color: var(--text-primary);
      margin-bottom: 18px;
      white-space: pre-line;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .sub-question-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--apple-border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .sub-q-header {
      font-weight: 700;
      font-size: 0.95rem;
      margin-bottom: 12px;
      color: var(--text-primary);
      line-height: 1.6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .options-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin: 12px 0;
    }
    .options-container.locked {
      pointer-events: none;
    }

    .option-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--apple-border);
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
      user-select: none;
    }
    .option-item:hover {
      background: rgba(255, 255, 255, 0.08);
    }
    .option-item.correct {
      background: rgba(48, 209, 88, 0.18) !important;
      border-color: #30d158 !important;
      color: #fff;
    }
    .option-item.wrong {
      background: rgba(255, 69, 58, 0.18) !important;
      border-color: #ff453a !important;
      color: #fff;
    }
    .opt-letter {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 0.8rem;
      flex-shrink: 0;
    }

    .answer-input-row {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    .text-input-field {
      background: rgba(0, 0, 0, 0.35);
      border: 1.5px solid var(--apple-border-strong);
      border-radius: 8px;
      padding: 9px 14px;
      color: #fff;
      font-family: 'JetBrains Mono', Consolas, monospace;
      font-size: 0.92rem;
      outline: none;
      min-width: 240px;
      transition: all 0.2s;
    }
    .text-input-field:focus {
      border-color: var(--apple-blue);
      box-shadow: 0 0 10px rgba(10, 132, 255, 0.25);
    }
    .text-input-field.correct {
      border-color: #30d158 !important;
      background: rgba(48, 209, 88, 0.12) !important;
    }
    .text-input-field.wrong {
      border-color: #ff453a !important;
      background: rgba(255, 69, 58, 0.12) !important;
    }

    .unit-label {
      font-family: 'JetBrains Mono', Consolas, monospace;
      font-size: 0.9rem;
      color: #8e8e93;
      user-select: none;
    }

    .btn-reset-q {
      display: none;
      background: rgba(255, 69, 58, 0.15);
      color: #ff453a;
      border: 1px solid rgba(255, 69, 58, 0.4);
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.85rem;
      transition: all 0.2s;
    }
    .btn-reset-q:hover {
      background: #ff453a;
      color: #fff;
    }

    pre.code-block {
      background: #111317;
      border: 1px solid var(--apple-border-strong);
      border-radius: 8px;
      padding: 14px;
      overflow-x: auto;
      font-family: 'JetBrains Mono', Consolas, monospace;
      font-size: 0.88rem;
      line-height: 1.65;
      color: #79c0ff;
      margin: 8px 0 14px 0;
      white-space: pre-wrap;
    }

    .svg-container {
      background: #111317;
      border: 1px solid var(--apple-border);
      border-radius: 10px;
      padding: 16px;
      text-align: center;
      margin: 12px 0;
    }
  </style>
</head>

  <script>
    const originalDriveLink = "https://drive.google.com/file/d/14SjIDbPxNRrngMzwCcob-uiyIba6URs6/view";

    function escapeHtml(text) {
      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    const letters = ['A', 'B', 'C', 'D', 'E'];

    const examSections = [
      {
        title: "Problem 1: Short Answer Questions (60 Points)",
        context: "Short answer questions [5 points each] covering fundamental network principles:",
        subQuestions: [
          {
            id: "p1_q1",
            type: "input",
            text: "Question 1: What are the four types of packet delay?",
            img: "",
            validate: (input) => {
              const val = input.toLowerCase();
              const delays = ["transmission", "propagation", "processing", "queuing", "queue"];
              const matched = delays.filter(d => val.includes(d));
              return matched.length >= 3;
            },
            dispAnswer: "Transmission, Propagation, Processing, Queuing",
            exp: "أنواع التأخير الأربعة الأساسية في الشبكات هي: Transmission delay، Propagation delay، Nodal processing delay، و Queuing delay.",
            placeholder: "Enter answer..."
          },
          {
            id: "p1_q2",
            type: "input",
            text: "Question 2: Two hosts, A and B, are connected by a link with a transmission rate R = 2 Mbps. Suppose that the packet length is L = 10 Kbits. Find the maximum number of packets per second that can be transmitted by the link:",
            img: "",
            unit: "packets/sec",
            validate: (input) => {
              const num = parseFloat(input.trim().replace(/[^0-9.]/g, ''));
              return Math.abs(num - 200) < 0.1;
            },
            dispAnswer: "200",
            exp: "N = R / L = (2 × 10^6 bps) / (10 × 10^3 bits) = 200 packets/sec.",
            placeholder: "Enter number..."
          },
          {
            id: "p1_q3",
            type: "single",
            text: "Question 3: Suppose a client sends an HTTP request message with the If-modified-since: header. Suppose the object in a server has not changed since the last time a client retrieved the object. Then the server will send a response message with the status code:",
            img: "",
            opts: [
              "404 Not Found",
              "200 OK",
              "304 Not Modified",
              "None of the above"
            ],
            ans: 2,
            dispAnswer: "304 Not Modified",
            exp: "إذا لم يتغير الكائن في السيرفر منذ التاريخ المحدد، يُرجع السيرفر كود 304 Not Modified بدون إعادة إرسال جسم الملف لتوفير الباندويث.",
            placeholder: ""
          },
          {
            id: "p1_q4",
            type: "input",
            text: "Question 4: If the distance between end systems is 2500 km. Assuming the signal is propagated at speed of light (2.5 × 10^8 m/s), the propagation delay would be (Enter value in ms):",
            img: "",
            unit: "ms",
            validate: (input) => {
              const num = parseFloat(input.trim().replace(/[^0-9.]/g, ''));
              return Math.abs(num - 10) < 0.1 || Math.abs(num - 0.01) < 0.001;
            },
            dispAnswer: "10",
            exp: "d_prop = Distance / Speed = (2500 × 10^3 m) / (2.5 × 10^8 m/s) = 0.01 s = 10 ms.",
            placeholder: "Enter number..."
          },
          {
            id: "p1_q5",
            type: "single",
            text: "Question 5: In HTTP the server does not keep the state of the communication. To overcome this limitation of HTTP, which of the following mechanisms is used:",
            img: "",
            opts: [
              "Web caching",
              "Cookies",
              "Both web caching and cookies",
              "None of the above"
            ],
            ans: 1,
            dispAnswer: "Cookies",
            exp: "بروتوكول HTTP يعتبر Stateless؛ وتُستخدم ملفات تعريف الارتباط (Cookies) للاحتفاظ بحالة الجلسة وتتبع المستخدم.",
            placeholder: ""
          },
          {
            id: "p1_q6",
            type: "input",
            text: "Question 6: Is the propagation delay (d_prop) affected by increasing the packet's length (L)?",
            img: "",
            validate: (input) => {
              const val = input.toLowerCase().trim();
              return val.includes("no") || val.includes("not affected") || val.includes("لا");
            },
            dispAnswer: "Not affected (No)",
            exp: "تأخير الانتشار d_prop يعتمد فقط على المسافة وسرعة انتقال الإشارة في الوسط (d/s)، ولا علاقة له بحجم الباكت L.",
            placeholder: "Enter answer..."
          },
          {
            id: "p1_q7",
            type: "input",
            text: "Question 7: If you were building a network for sources that generate point-to-point traffic at a constant rate of 64 kbps. Which type of network is more suitable for this traffic pattern: circuit switched network or packet switched network?",
            img: "",
            validate: (input) => {
              const val = input.toLowerCase().trim();
              return val.includes("circuit");
            },
            dispAnswer: "Circuit switched network",
            exp: "بما أن معدل تدفق البيانات ثابت ومستمر (Constant bit rate)، فإن شبكات تبديل الدوائر (Circuit switching) هي الأنسب لحجز النطاق مسبقاً وتجنب التأخير.",
            placeholder: "Enter answer..."
          },
          {
            id: "p1_q8",
            type: "input",
            text: "Question 8: Suppose users share a 4 Mbps link. Each user transmits continuously at 1 Mbps when transmitting, but each user transmits only 30 percent of the time. When circuit switching is used, how many users can be supported?",
            img: "",
            unit: "users",
            validate: (input) => {
              const num = parseInt(input.trim().replace(/[^0-9]/g, ''), 10);
              return num === 4;
            },
            dispAnswer: "4",
            exp: "في Circuit switching يجب حجز 1 Mbps مخصص لكل مستخدم طوال الوقت بغض النظر عن نسبة نشاطه: 4 Mbps / 1 Mbps = 4 مستخدمين فقط.",
            placeholder: "Enter number..."
          },
          {
            id: "p1_q9",
            type: "input",
            text: "Question 9: What are the requirements of an email application in terms of data loss, throughput, and time sensitivity?",
            img: "",
            validate: (input) => {
              const val = input.toLowerCase();
              return (val.includes("no loss") || val.includes("loss-tolerant") === false) && (val.includes("elastic") || val.includes("not sensitive"));
            },
            dispAnswer: "Data Loss: No loss, Throughput: Elastic, Time Sensitivity: Not sensitive",
            exp: "البريد الإلكتروني يتطلب نقلاً موثوقاً 100% للبيانات (No loss)، ومعدل نقله مرن (Elastic throughput)، وهو غير حساس للتأخير الزمني (Not time-sensitive).",
            placeholder: "Enter answer..."
          },
          {
            id: "p1_q10_a",
            type: "input",
            text: `Question 10 (Part 1): Consider 4 different servers connected to 4 different clients. The sender link is R = 60 Mbps, the client link is R = 90 Mbps, and the middle link R = 100 Mbps is equally shared among the 4 pairs.
<br><br>What is the maximum achievable end-to-end throughput?`,
            img: "../images/cw_2.png",
            unit: "Mbps",
            validate: (input) => {
              const num = parseFloat(input.trim().replace(/[^0-9.]/g, ''));
              return Math.abs(num - 25) < 0.1;
            },
            dispAnswer: "25",
            exp: "حصة كل زوج من الرابط المشترك الأوسط = 100 Mbps / 4 = 25 Mbps. بما أن 25 < 60 و 25 < 90، فإن الرابط الأوسط هو الـ Bottleneck، والإنتاجية القصوى = 25 Mbps.",
            placeholder: "Enter number..."
          },
          {
            id: "p1_q10_b",
            type: "input",
            text: "Question 10 (Part 2): Based on Question 10 (Part 1), what is the utilization of the sender (server) link?",
            img: "",
            validate: (input) => {
              const num = parseFloat(input.trim().replace(/[^0-9.]/g, ''));
              return Math.abs(num - 0.416) < 0.02 || Math.abs(num - 0.417) < 0.02 || Math.abs(num - 41.6) < 1;
            },
            dispAnswer: "25 / 60 ≈ 0.416 (41.6%)",
            exp: "نسبة استغلال رابط الخادم (Sender Utilization) = Throughput / R_sender = 25 / 60 ≈ 0.416.",
            placeholder: "Enter number..."
          },
          {
            id: "p1_q11",
            type: "input",
            text: `Question 11: Consider the following HTTP GET message:
<pre class="code-block">GET /welcome.html HTTP/1.1
Host: myweb.com
User-Agent: Mozilla/5.0 (Macintosh; Intel Mac OS X 10.11; rv:48.0) Gecko/20100101 Firefox/48.0
Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8
Accept-Language: en-US,en;q=0.7,hi;q=0.3
Accept-Encoding: gzip, deflate
Connection: keep-alive
Upgrade-Insecure-Requests: 1
Cache-Control: max-age=0</pre>
What is the browser type and the server name?`,
            img: "",
            validate: (input) => {
              const val = input.toLowerCase();
              return (val.includes("mozilla") || val.includes("firefox")) && val.includes("myweb.com");
            },
            dispAnswer: "Browser: Mozilla (or Firefox), Server: myweb.com",
            exp: "نوع المتصفح من حقل User-Agent هو Mozilla / Firefox، واسم السيرفر من حقل Host هو myweb.com.",
            placeholder: "Enter answer..."
          },
          {
            id: "p1_q12",
            type: "input",
            text: "Question 12: Two hosts, A and B, are connected by a link with a transmission rate R = 2 Mbps, a length of 10,000 kilometers, and a propagation speed 4 × 10^8 m/sec. What is the maximum number of bits that the link can contain at a time? (Bandwidth-Delay Product)",
            img: "",
            unit: "bits",
            validate: (input) => {
              const num = parseFloat(input.trim().replace(/[^0-9.]/g, ''));
              return Math.abs(num - 50000) < 50 || Math.abs(num - 5) < 0.1;
            },
            dispAnswer: "50,000 (5 × 10^4)",
            exp: "d_prop = (10,000 × 10^3) / (4 × 10^8) = 0.025 s. أقصى سعة بالبتات = R × d_prop = (2 × 10^6 bps) × 0.025 s = 50,000 bits.",
            placeholder: "Enter number..."
          }
        ]
      },
      {
        title: "Problem 2: HTTP Download Delays (15 Points)",
        context: `Suppose within your Web browser you click on a link to obtain a Web page. Assume the IP address is cached locally. The Web page contains a very small HTML file that references 10 very small objects on the same server. Neglecting transmission times, how much roundtrip times (in RTT) is required in:`,
        subQuestions: [
          {
            id: "p2_a",
            type: "input",
            text: "a. [5 Points] Non-persistent HTTP with no parallel TCP connections:",
            img: "",
            unit: "RTT",
            validate: (input) => {
              const num = parseFloat(input.trim().replace(/[^0-9.]/g, ''));
              return Math.abs(num - 22) < 0.1;
            },
            dispAnswer: "22",
            exp: "لدينا ملف HTML أساسي + 10 كائنات = 11 كائناً. كل كائن يتطلب 2 RTT (واحد لمصافحة TCP والآخر لطلب وجلب HTTP). التأخير الإجمالي = 11 × 2 = 22 RTT.",
            placeholder: "Enter number..."
          },
          {
            id: "p2_b",
            type: "input",
            text: "b. [5 Points] Non-persistent HTTP with 8 parallel TCP connections:",
            img: "",
            unit: "RTT",
            validate: (input) => {
              const num = parseFloat(input.trim().replace(/[^0-9.]/g, ''));
              return Math.abs(num - 6) < 0.1;
            },
            dispAnswer: "6",
            exp: "جلب ملف HTML الأساسي يأخذ 2 RTT. يتبقى 10 كائنات: أول 8 كائنات تُجلب بالتوازي عبر 8 اتصالات متوازية في 2 RTT، ثم الكائنان المتبقيان في دفعة متوازية ثانية في 2 RTT. المجموع = 2 + 2 + 2 = 6 RTT.",
            placeholder: "Enter number..."
          },
          {
            id: "p2_c",
            type: "input",
            text: "c. [5 Points] Persistent HTTP with pipelining (unlimited):",
            img: "",
            unit: "RTT",
            validate: (input) => {
              const num = parseFloat(input.trim().replace(/[^0-9.]/g, ''));
              return Math.abs(num - 3) < 0.1;
            },
            dispAnswer: "3",
            exp: "1 RTT لمصافحة TCP الأولي، ثم 1 RTT لطلب وجلب ملف HTML. بعد ذلك يتم طلب جميع الكائنات العشرة بالتوازي على نفس الاتصال عبر الـ pipelining وتصل معاً في 1 RTT إضافي. المجموع = 1 + 1 + 1 = 3 RTT.",
            placeholder: "Enter number..."
          }
        ]
      },
      {
        title: "Problem 3: Proxy Server & Web Cache Delays (25 Points)",
        context: `In the institutional network connected to the Internet:
- Average object size L = 1250 bytes (10,000 bits)
- Average request rate a = 135 requests/second
- Access link capacity R_access = 1.5 Mbps
- LAN rate R_LAN = 10 Mbps
- Internet delay (RTT between Internet router and origin servers) = 1 second
- Access delay formula: d_a = λ / (1 - λ), where λ is the traffic intensity on the access link.`,
        subQuestions: [
          {
            id: "p3_a",
            type: "input",
            text: "a. [4 Points] Find λ, the traffic intensity of the access link:",
            img: "../images/cw_3.png",
            unit: "",
            validate: (input) => {
              const num = parseFloat(input.trim().replace(/[^0-9.]/g, ''));
              return Math.abs(num - 0.9) < 0.02;
            },
            dispAnswer: "0.9",
            exp: "حجم الكائن بالبت = 1250 × 8 = 10,000 بت. معدل الوصول La = 10,000 × 135 = 1.35 Mbps. كثافة الحركة λ = La / R = 1.35 / 1.5 = 0.9.",
            placeholder: "Enter number..."
          },
          {
            id: "p3_b",
            type: "input",
            text: "b. [8 Points] Find the total average response time per object between institutional LAN browsers and origin servers (Enter only the number in seconds):",
            img: "",
            unit: "seconds",
            validate: (input) => {
              const num = parseFloat(input.trim().replace(/[^0-9.]/g, ''));
              return Math.abs(num - 10.001) < 0.05 || Math.abs(num - 10) < 0.05;
            },
            dispAnswer: "10.001",
            exp: "d_LAN = L / R_LAN = 10,000 / 10^7 = 0.001 s. d_a = 0.9 / (1 - 0.9) = 9 s. d_Internet = 1 s. المجموع = 0.001 + 9 + 1 = 10.001 ثانية.",
            placeholder: "Enter number..."
          },
          {
            id: "p3_c_1",
            type: "input",
            text: "c. (i) [8 Points] Suppose a proxy server is installed in LAN with hit ratio = 40% (0.4). Find the total average response time (Enter only the number in seconds):",
            img: "",
            unit: "seconds",
            validate: (input) => {
              const num = parseFloat(input.trim().replace(/[^0-9.]/g, ''));
              return Math.abs(num - 1.3) < 0.08 || Math.abs(num - 1.304) < 0.08;
            },
            dispAnswer: "≈ 1.3",
            exp: "معدل الـ Miss = 0.6، وبالتالي الكثافة الجديدة λ = 0.9 × 0.6 = 0.54. تأخير الوصول d_a = 0.54 / (1 - 0.54) ≈ 1.174 s. زمن الـ Total = 0.4 × (d_LAN) + 0.6 × (d_LAN + d_a + d_Internet) = 0.4 × 0.001 + 0.6 × (0.001 + 1.174 + 1) ≈ 1.3 ثانية.",
            placeholder: "Enter number..."
          },
          {
            id: "p3_c_2",
            type: "input",
            text: "c. (ii) [5 Points] Determine the minimum bandwidth of the access link needed (in Mbps) such that the total average response time is no more than 1 second:",
            img: "",
            unit: "Mbps",
            validate: (input) => {
              const num = parseFloat(input.trim().replace(/[^0-9.]/g, ''));
              return Math.abs(num - 2.025) < 0.05 || Math.abs(num - 2.03) < 0.05;
            },
            dispAnswer: "2.025",
            exp: "المعادلة: 0.4 × 0.001 + 0.6 × (λ/(1-λ) + 1) = 1. ينتج أن 0.6 × (λ/(1-λ) + 1) ≈ 1 ← λ/(1-λ) = 0.4/0.6 ← λ = 0.4. وبما أن λ = (1.35 × 0.6) / R_access = 0.81 / R_access = 0.4 ← R_access = 0.81 / 0.4 = 2.025 Mbps.",
            placeholder: "Enter number..."
          }
        ]
      }
    ];

    let userScores = {};

    function initQuiz() {
      const driveBtn = document.getElementById('drive-link-btn');
      if (driveBtn) {
        if (originalDriveLink && originalDriveLink.trim() !== "") {
          driveBtn.href = originalDriveLink;
          driveBtn.style.display = "inline-flex";
        } else {
          driveBtn.style.display = "none";
        }
      }

      const list = document.getElementById('quiz-list');
      list.innerHTML = '';

      examSections.forEach((section) => {
        const card = document.createElement('div');
        card.className = 'q-card';

        let subQuestionsHtml = '';
        section.subQuestions.forEach((sub) => {
          const unitHtml = sub.unit ? `<span class="unit-label">${sub.unit}</span>` : '';
          const hasImage = sub.img && sub.img.trim() !== "";

          const imageContainerHtml = hasImage ? `
            <div class="q-image-container" id="img-box-${sub.id}">
              <img class="q-original-img" 
                   id="img-${sub.id}" 
                   data-src="${sub.img}" 
                   alt="Original Question ${sub.id}" 
                   onerror="handleImageFallback(this)" />
            </div>
          ` : '';

          const imageButtonHtml = hasImage ? `
            <button class="btn-action" onclick="toggleOriginalImage('${sub.id}')">
              <span>📷</span> عرض صورة السؤال الأصلية
            </button>
          ` : '';

          let interactionHtml = '';

          if (sub.type === "single") {
            const optsHtml = sub.opts.map((opt, i) => `
              <div class="option-item" id="opt-${sub.id}-${i}" onclick="selectSingleOption('${sub.id}', ${i})">
                <div class="opt-letter">${letters[i]}</div>
                <div>${opt}</div>
              </div>
            `).join('');

            interactionHtml = `
              <div class="options-container" id="opts-box-${sub.id}">${optsHtml}</div>
              <div class="answer-input-row">
                ${imageButtonHtml}
                <button class="btn-reset-q" id="reset-btn-${sub.id}" onclick="resetSubQuestion('${sub.id}')">إعادة السؤال ↻</button>
                <button class="btn-action" onclick="toggleSolution('${sub.id}')">
                  <span>💡</span> عرض الحل
                </button>
              </div>
            `;
          } else {
            interactionHtml = `
              <div class="answer-input-row ltr-content">
                <input type="text" class="text-input-field" id="input-${sub.id}" placeholder="${sub.placeholder || 'Enter answer...'}" onkeydown="if(event.key==='Enter') checkInputAnswer('${sub.id}')">
                ${unitHtml}
                <button class="btn" id="btn-check-${sub.id}" onclick="checkInputAnswer('${sub.id}')">تحقق</button>
                ${imageButtonHtml}
                <button class="btn-reset-q" id="reset-btn-${sub.id}" onclick="resetSubQuestion('${sub.id}')">إعادة السؤال ↻</button>
                <button class="btn-action" onclick="toggleSolution('${sub.id}')">
                  <span>💡</span> عرض الحل
                </button>
              </div>
            `;
          }

          subQuestionsHtml += `
            <div class="sub-question-card ltr-content" id="card-${sub.id}">
              <div class="sub-q-header">${sub.text}</div>
              ${imageContainerHtml}
              ${interactionHtml}
              <div class="solution-box" id="sol-${sub.id}">
                <div><strong>الإجابة النموذجية المعتمدة (Final Answer):</strong></div>
                <div style="margin-top: 6px; font-size: 0.95rem; font-weight: bold; line-height: 1.6; font-family: 'JetBrains Mono', Consolas, monospace; color: #5ac8fa;">${escapeHtml(sub.dispAnswer)} ${sub.unit ? escapeHtml(sub.unit) : ''}</div>
                <div style="margin-top: 6px; font-size: 0.88rem; line-height: 1.5; color: var(--text-secondary);">${sub.exp}</div>
              </div>
            </div>
          `;
        });

        card.innerHTML = `
          <div class="ltr-content">
            <div class="parent-q-title">${section.title}</div>
            <div class="parent-q-desc">${section.context}</div>
          </div>
          <div class="sub-list">${subQuestionsHtml}</div>
        `;

        list.appendChild(card);
      });

      calculateScore();
      setupReportModal();
    }

    function toggleOriginalImage(qid) {
      const imgBox = document.getElementById(`img-box-${qid}`);
      const imgEl = document.getElementById(`img-${qid}`);

      if (imgEl && !imgEl.src && imgEl.dataset.src) {
        imgEl.src = imgEl.dataset.src;
      }

      if (imgBox) {
        imgBox.classList.toggle('show');
      }
    }

    function handleImageFallback(imgEl) {
      if (!imgEl.dataset.retried) {
        imgEl.dataset.retried = "1";
        if (imgEl.src.endsWith('.jpg')) {
          imgEl.src = imgEl.src.replace('.jpg', '.png');
        } else if (imgEl.src.endsWith('.png')) {
          imgEl.src = imgEl.src.replace('.png', '.jpg');
        }
      }
    }

    function findSubQuestion(subId) {
      for (const sec of examSections) {
        const found = sec.subQuestions.find(s => s.id === subId);
        if (found) return found;
      }
      return null;
    }

    function selectSingleOption(subId, optIdx) {
      const sub = findSubQuestion(subId);
      const optsBox = document.getElementById(`opts-box-${subId}`);
      const resetBtn = document.getElementById(`reset-btn-${subId}`);
      if (!sub || !optsBox) return;

      optsBox.classList.add('locked');

      const picked = document.getElementById(`opt-${subId}-${optIdx}`);
      if (optIdx === sub.ans) {
        if (picked) picked.classList.add('correct');
        userScores[subId] = true;
      } else {
        if (picked) picked.classList.add('wrong');
        delete userScores[subId];
      }

      if (resetBtn) resetBtn.style.display = 'inline-flex';
      calculateScore();
    }

    function checkInputAnswer(subId) {
      const sub = findSubQuestion(subId);
      const inputEl = document.getElementById(`input-${subId}`);
      const resetBtn = document.getElementById(`reset-btn-${subId}`);
      const checkBtn = document.getElementById(`btn-check-${subId}`);
      if (!sub || !inputEl) return;

      const userVal = inputEl.value.trim();
      if (!userVal) {
        alert("يرجى إدخال إجابة أولاً!");
        return;
      }

      const isCorrect = sub.validate(userVal);
      inputEl.disabled = true;

      if (isCorrect) {
        inputEl.className = 'text-input-field correct';
        userScores[subId] = true;
      } else {
        inputEl.className = 'text-input-field wrong';
        delete userScores[subId];
      }

      if (checkBtn) checkBtn.style.display = 'none';
      if (resetBtn) resetBtn.style.display = 'inline-flex';

      calculateScore();
    }

    function resetSubQuestion(subId) {
      const inputEl = document.getElementById(`input-${subId}`);
      const resetBtn = document.getElementById(`reset-btn-${subId}`);
      const checkBtn = document.getElementById(`btn-check-${subId}`);
      const sol = document.getElementById(`sol-${subId}`);
      const imgBox = document.getElementById(`img-box-${subId}`);
      const optsBox = document.getElementById(`opts-box-${subId}`);

      delete userScores[subId];

      if (inputEl) {
        inputEl.disabled = false;
        inputEl.value = '';
        inputEl.className = 'text-input-field';
        inputEl.focus();
      }

      if (optsBox && sub && sub.type === "single") {
        optsBox.classList.remove('locked');
        sub.opts.forEach((_, i) => {
          const el = document.getElementById(`opt-${subId}-${i}`);
          if (el) el.className = 'option-item';
        });
      }

      if (checkBtn) checkBtn.style.display = 'inline-flex';
      if (resetBtn) resetBtn.style.display = 'none';
      if (sol) sol.classList.remove('show');
      if (imgBox) imgBox.classList.remove('show');

      calculateScore();
    }

    function calculateScore() {
      let total = 0;
      let score = 0;
      examSections.forEach(sec => {
        sec.subQuestions.forEach(sub => {
          total++;
          if (userScores[sub.id]) score++;
        });
      });

      const pct = total > 0 ? Math.round((score / total) * 100) : 0;
      const scoreEl = document.getElementById('score');
      if (scoreEl) {
        scoreEl.innerText = `${score} / ${total} (${pct}%)`;
      }
    }

    function toggleSolution(subId) {
      const sol = document.getElementById(`sol-${subId}`);
      if (sol) sol.classList.toggle('show');
    }

    let allShown = false;
    function toggleAllSolutions() {
      allShown = !allShown;
      examSections.forEach(sec => {
        sec.subQuestions.forEach(sub => {
          const sol = document.getElementById(`sol-${sub.id}`);
          if (sol) {
            if (allShown) sol.classList.add('show');
            else sol.classList.remove('show');
          }
        });
      });
    }

    function resetQuiz() {
      userScores = {};
      initQuiz();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function setupReportModal() {
      const openBtn = document.getElementById('openReportBtn');
      const closeBtn = document.getElementById('closeReportBtn');
      const overlay = document.getElementById('reportOverlay');
      const form = document.getElementById('bugReportForm');
      const status = document.getElementById('reportStatus');

      if (!openBtn || !overlay) return;

      openBtn.onclick = () => {
        overlay.classList.add('active');
        overlay.setAttribute('aria-hidden', 'false');
      };

      const closeModal = () => {
        overlay.classList.remove('active');
        overlay.setAttribute('aria-hidden', 'true');
        if (status) status.innerText = '';
      };

      if (closeBtn) closeBtn.onclick = closeModal;

      overlay.onclick = (e) => {
        if (e.target === overlay) closeModal();
      };

      if (form) {
        form.onsubmit = (e) => {
          e.preventDefault();
          const submitBtn = document.getElementById('submitReportBtn');
          if (submitBtn) submitBtn.disabled = true;
          if (status) {
            status.style.color = '#30d158';
            status.innerText = 'تم إرسال البلاغ بنجاح، شكراً لمساعدتك!';
          }
          setTimeout(() => {
            closeModal();
            form.reset();
            if (submitBtn) submitBtn.disabled = false;
          }, 1500);
        };
      }
    }

    initQuiz();
  </script>
  <script src="../transition.js"></script>
</body>
</html>
