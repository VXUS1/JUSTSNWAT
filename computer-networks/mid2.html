  <script>
    const originalDriveLink = "https://drive.google.com/drive/folders/1wsRYhmt5NpqLv9I6Gj-LCjq0dBYoNK1k";

    function escapeHtml(text) {
      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    const letters = ['A', 'B', 'C', 'D', 'E'];

    const examSections = [
      {
        title: "Part 1: Multiple Choice Questions (6 Points)",
        context: "Choose the best answer for each of the following multiple-choice questions:",
        subQuestions: [
          {
            id: "p1_q1",
            type: "single",
            text: "Question 1: If a device has the five layers of TCP/IP (Internet) model, then it:",
            img: "",
            opts: [
              "must be core device",
              "must an edge device",
              "either an edge or core",
              "core device applying packet switching"
            ],
            ans: 1,
            dispAnswer: "must an edge device",
            exp: "أجهزة الحافة والمستخدم النهائي (<bdi>Edge devices / Hosts</bdi>) هي فقط التي تطبق طبقات بروتوكول <bdi>TCP/IP</bdi> الخمس كاملة (بما فيها طبقتي النقل والتطبيقات)، بينما أجهزة قلب الشبكة كالراوترات تطبق الطبقات الثلاث السفلية فقط.",
            placeholder: ""
          },
          {
            id: "p1_q2",
            type: "multi",
            text: "Question 2: Which of the following services is provided by UDP protocol? (check all that apply)",
            img: "",
            opts: [
              "Multiplexing and demultiplexing",
              "Reliable data transfer",
              "Flow control",
              "Congestion control",
              "Encryption"
            ],
            correctAnswers: [0],
            dispAnswer: "Multiplexing and demultiplexing",
            exp: "بروتوكول <bdi>UDP</bdi> هو بروتوكول خفيف يوفر بالأساس التجميع وفك التجميع (<bdi>Multiplexing / Demultiplexing</bdi>) باستخدام أرقام المنافذ، مع فحص الأخطاء عبر <bdi>Checksum</bdi>، ولا يوفر التحكم بالتدفق أو الازدحام أو الموثوقية.",
            placeholder: ""
          },
          {
            id: "p1_q3",
            type: "single",
            text: "Question 3: The correct statement about circuit switching compared to packet switching is:",
            img: "",
            opts: [
              "Best for real-time traffic",
              "Better for burst traffic",
              "Always provide less delay",
              "Can handle out of order packet"
            ],
            ans: 0,
            dispAnswer: "Best for real-time traffic",
            exp: "تعتبر شبكات تبديل الدوائر (<bdi>Circuit switching</bdi>) مثالية للبيانات الفورية واللحظية (<bdi>Real-time traffic</bdi>) مثل المكالمات الصوتية؛ لكونها تحجز سعة نطاق مخصصة وثابتة وتضمن استقرار التأخير.",
            placeholder: ""
          },
          {
            id: "p1_q4",
            type: "single",
            text: "Question 4: Suppose the propagation delay for a packet over a link from Host A and Host B is less than its transmission delay (d_prop < d_trans). At time t = d_trans, where is the first bit of the packet?",
            img: "",
            opts: [
              "The first bit has reached Host B",
              "Exactly at half of the link",
              "Has reached B",
              "Cannot be determined"
            ],
            ans: 0,
            dispAnswer: "The first bit has reached Host B",
            exp: "تصل البت الأولى إلى الطرف <bdi>B</bdi> فور انقضاء زمن الانتشار <bdi>t = d_prop</bdi>. وبما أن <bdi>d_prop < d_trans</bdi>، فعند اللحظة <bdi>t = d_trans</bdi> تكون البت الأولى قد وصلت مسبقاً وتجاوزت الرابط نحو المضيف <bdi>B</bdi>.",
            placeholder: ""
          },
          {
            id: "p1_q5",
            type: "single",
            text: "Question 5: The traffic intensity (La/R) of a given system is a network factor which mostly affects:",
            img: "",
            opts: [
              "Transmission delay",
              "Propagation delay",
              "Processing delay",
              "Queuing delay"
            ],
            ans: 3,
            dispAnswer: "Queuing delay",
            exp: "تؤثر كثافة الحركة (<bdi>Traffic intensity = La/R</bdi>) بشكل مباشر على تأخير الانتظار في الطابور (<bdi>Queuing delay</bdi>)؛ حيث يزداد هذا التأخير بشكل حاد ويتجه إلى ما لا نهاية كلما اقتربت النسبة من 1.",
            placeholder: ""
          },
          {
            id: "p1_q6",
            type: "single",
            text: "Question 6: Which of the following is not considered as an end system?",
            img: "",
            opts: [
              "A mobile phone",
              "An Ethernet switch",
              "A laptop PC",
              "A web server"
            ],
            ans: 1,
            dispAnswer: "An Ethernet switch",
            exp: "مبدل الإيثرنت (<bdi>Ethernet switch</bdi>) هو جهاز وسيط ضمن البنية التحتية لنقل البيانات في الشبكة وليس نظاماً طرفياً (<bdi>End system / Host</bdi>).",
            placeholder: ""
          }
        ]
      },
      {
        title: "Part 2: Transport Layer Protocol Comparison (6 Points)",
        context: `Assume timeout values for all three protocols are sufficiently long so 5 consecutive data segments and their ACKs can be received by Host B and Host A respectively.
Host A sends 5 data segments (Seq 1 to 5, each carries 1 Byte of data) to Host B, and the <strong>2nd segment is lost</strong>. Eventually, all 5 data segments are correctly received.
Fill in the comparison table:`,
        subQuestions: [
          {
            id: "p2_comp_table",
            type: "table_part2",
            text: "Protocol Comparison Table (GBN vs SR vs TCP):",
            img: "",
            dispAnswer: `Row a: GBN=9, SR=6, TCP=6
Row b: GBN=8, SR=5, TCP=5
Row c: GBN=4, SR=1, TCP=1
Row d: GBN=5, SR=2, TCP=6
Row e: GBN=5/9, SR=5/6, TCP=5/6
Row f: TCP`,
            exp: "تفصيل البروتوكولات الثلاثة عند فقدان الحزمة رقم 2:\n• في <bdi>GBN</bdi>: يتجاهل المستلم الحزم 3، 4، 5 ويرسل تأكيدات مكررة للحزمة 1، وعند انتهاء المؤقت يعيد المرسل بث الحزم الأربع (2، 3، 4، 5)؛ فيكون المجموع 9 حزم و8 تأكيدات وتأخيرها الأخير 5.\n• في <bdi>SR</bdi>: يقوم المستلم بتخزين الحزم 3، 4، 5 في الذاكرة المؤقتة ويرسل تأكيداً منفرداً لكل منها، ويعيد المرسل بث الحزمة 2 فقط؛ فيكون الإجمالي 6 حزم و5 تأكيدات وآخر تأكيد مرسل هو <bdi>ACK 2</bdi>.\n• في <bdi>TCP</bdi>: تُرسل الحزم 3، 4، 5 فتولد 3 تأكيدات مكررة (<bdi>3 duplicate ACKs</bdi>) تطلب البايت 2، مما يفعل إعادة الإرسال السريع (<bdi>Fast Retransmit</bdi>) فوراً للحزمة 2 فقط دون انتظار المؤقت، وعند وصولها يرسل المستلم تأكيداً تراكمياً برقم <bdi>ACK 6</bdi>، ويكون هو الأسرع إنجازاً."
          }
        ]

          {
            id: "p3_tcp_trace",
            type: "table_part3",
            text: `TCP Operation Sequence Diagram & Variables:
<div class="svg-container ltr-content">
  <svg width="600" height="520" viewBox="0 0 600 520" style="max-width:100%; height:auto;">

    <!-- خطوط الوقت -->
    <line x1="160" y1="40" x2="160" y2="500" stroke="#8e8e93" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="440" y1="40" x2="440" y2="500" stroke="#8e8e93" stroke-width="2.5" stroke-linecap="round"/>

    <!-- عناوين الأعمدة -->

    function toggleOriginalImage(qid) {
      const imgBox = document.getElementById(`img-box-${qid}`);
      const imgEl = document.getElementById(`img-${qid}`);

      if (imgEl && !imgEl.src && imgEl.dataset.src) {
        imgEl.src = imgEl.dataset.src;
      }

      if (imgBox) {
        imgBox.classList.toggle('show');
      }
    }

    function handleImageFallback(imgEl) {
      if (!imgEl.dataset.retried) {
        imgEl.dataset.retried = "1";
        if (imgEl.src.endsWith('.jpg')) {
          imgEl.src = imgEl.src.replace('.jpg', '.png');
        } else if (imgEl.src.endsWith('.png')) {
          imgEl.src = imgEl.src.replace('.png', '.jpg');
        }
      }
    }

    function findSubQuestion(subId) {
      for (const sec of examSections) {
        const found = sec.subQuestions.find(s => s.id === subId);
        if (found) return found;
      }
      return null;
    }

    function selectSingleOption(subId, optIdx) {
      const sub = findSubQuestion(subId);
      const optsBox = document.getElementById(`opts-box-${subId}`);
      const resetBtn = document.getElementById(`reset-btn-${subId}`);
      if (!sub || !optsBox) return;

      optsBox.classList.add('locked');

      const picked = document.getElementById(`opt-${subId}-${optIdx}`);
      if (optIdx === sub.ans) {
        if (picked) picked.classList.add('correct');
        userScores[subId] = true;
      } else {
        if (picked) picked.classList.add('wrong');
        delete userScores[subId];
      }

      if (resetBtn) resetBtn.style.display = 'inline-flex';
      calculateScore();
    }

    function toggleMultiOption(subId, optIdx) {
      const set = multiSelections[subId];
      const optEl = document.getElementById(`opt-${subId}-${optIdx}`);
      if (!set || !optEl) return;

      if (set.has(optIdx)) {
        set.delete(optIdx);
        optEl.classList.remove('selected');
      } else {
        set.add(optIdx);
        optEl.classList.add('selected');
      }
    }

    function checkMultiAnswer(subId) {
      const sub = findSubQuestion(subId);
      const set = multiSelections[subId];
      const optsBox = document.getElementById(`opts-box-${subId}`);
      const checkBtn = document.getElementById(`btn-check-${subId}`);
      const resetBtn = document.getElementById(`reset-btn-${subId}`);
      if (!sub || !set || !optsBox) return;

      optsBox.classList.add('locked');
      const correctSet = new Set(sub.correctAnswers);
      let isAllCorrect = (set.size === correctSet.size);

      sub.opts.forEach((_, i) => {
        const el = document.getElementById(`opt-${subId}-${i}`);
        if (!el) return;
        if (correctSet.has(i)) {
          el.className = 'option-item correct';
          if (!set.has(i)) isAllCorrect = false;
        } else if (set.has(i)) {
          el.className = 'option-item wrong';
          isAllCorrect = false;
        }
      });

      if (isAllCorrect) {
        userScores[subId] = true;
      } else {
        delete userScores[subId];
      }

      if (checkBtn) checkBtn.style.display = 'none';
      if (resetBtn) resetBtn.style.display = 'inline-flex';
      calculateScore();
    }

      }

      if (checkBtn) checkBtn.style.display = 'none';
      if (resetBtn) resetBtn.style.display = 'inline-flex';
      calculateScore();
    }

    function resetSubQuestion(subId) {
      delete userScores[subId];

      const optsBox = document.getElementById(`opts-box-${subId}`);
      if (optsBox) {
        optsBox.classList.remove('locked');
      }

      const sub = findSubQuestion(subId);
      if (sub && sub.type === "single") {
        sub.opts.forEach((_, i) => {
          const el = document.getElementById(`opt-${subId}-${i}`);
          if (el) el.className = 'option-item';
        });
      }

      if (sub && sub.type === "multi") {
        multiSelections[subId] = new Set();
        sub.opts.forEach((_, i) => {
          const el = document.getElementById(`opt-${subId}-${i}`);
          if (el) el.className = 'option-item';
        });
      }

      if (subId === "p2_comp_table") {
        const ids = [
          "p2_a_gbn", "p2_a_sr", "p2_a_tcp",
          "p2_b_gbn", "p2_b_sr", "p2_b_tcp",
          "p2_c_gbn", "p2_c_sr", "p2_c_tcp",
          "p2_d_gbn", "p2_d_sr", "p2_d_tcp",
          "p2_e_gbn", "p2_e_sr", "p2_e_tcp",
          "p2_f_choice"
        ];
        ids.forEach(id => {
          const el = document.getElementById(id);
          if (el) {
            el.disabled = false;
            el.value = '';
            el.className = 'table-input';
          }
        });
      }

      if (subId === "p3_tcp_trace") {
        const ids = [
          "p3_a", "p3_b", "p3_c", "p3_d", "p3_e",
          "p3_f", "p3_g", "p3_h", "p3_i", "p3_j",
          "p3_k", "p3_l", "p3_m", "p3_n", "p3_v", "p3_w"
        ];
        ids.forEach(id => {
          const el = document.getElementById(id);
          if (el) {
            el.disabled = false;
            el.value = '';
            el.className = 'table-input';
          }
        });
      }

      const checkBtn = document.getElementById(`btn-check-${subId}`);
      const resetBtn = document.getElementById(`reset-btn-${subId}`);
      const sol = document.getElementById(`sol-${subId}`);
      const imgBox = document.getElementById(`img-box-${subId}`);

      if (checkBtn) checkBtn.style.display = 'inline-flex';
      if (resetBtn) resetBtn.style.display = 'none';
      if (sol) sol.classList.remove('show');
      if (imgBox) imgBox.classList.remove('show');

      calculateScore();
    }

    function calculateScore() {
      let total = 0;
      let score = 0;
      examSections.forEach(sec => {
        sec.subQuestions.forEach(sub => {
          total++;
          if (userScores[sub.id]) score++;
        });
      });

      const pct = total > 0 ? Math.round((score / total) * 100) : 0;
      const scoreEl = document.getElementById('score');
      if (scoreEl) {
        scoreEl.innerText = `${score} / ${total} (${pct}%)`;
      }
    }

    function toggleSolution(subId) {
      const sol = document.getElementById(`sol-${subId}`);
      if (sol) sol.classList.toggle('show');
    }

    let allShown = false;
    function toggleAllSolutions() {
      allShown = !allShown;
      examSections.forEach(sec => {
        sec.subQuestions.forEach(sub => {
          const sol = document.getElementById(`sol-${sub.id}`);
          if (sol) {
            if (allShown) sol.classList.add('show');
            else sol.classList.remove('show');
          }
        });
      });
    }

    function resetQuiz() {
      userScores = {};
      initQuiz();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function setupReportModal() {
      const openBtn = document.getElementById('openReportBtn');
      const closeBtn = document.getElementById('closeReportBtn');
      const overlay = document.getElementById('reportOverlay');
      const form = document.getElementById('bugReportForm');
      const status = document.getElementById('reportStatus');

      if (!openBtn || !overlay) return;

      openBtn.onclick = () => {
        overlay.classList.add('active');
        overlay.setAttribute('aria-hidden', 'false');
      };

      const closeModal = () => {
        overlay.classList.remove('active');
        overlay.setAttribute('aria-hidden', 'true');
        if (status) status.innerText = '';
      };

      if (closeBtn) closeBtn.onclick = closeModal;

      overlay.onclick = (e) => {
        if (e.target === overlay) closeModal();
      };

      if (form) {
        form.onsubmit = (e) => {
          e.preventDefault();
          const submitBtn = document.getElementById('submitReportBtn');
          if (submitBtn) submitBtn.disabled = true;
          if (status) {
            status.style.color = '#30d158';
            status.innerText = 'تم إرسال البلاغ بنجاح، شكراً لمساعدتك!';
          }
          setTimeout(() => {
            closeModal();
            form.reset();
            if (submitBtn) submitBtn.disabled = false;
          }, 1500);
        };
      }
    }

    initQuiz();
  </script>
  <script src="../transition.js"></script>
</body>
</html>
