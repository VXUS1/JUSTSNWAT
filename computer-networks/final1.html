  <script>
    const originalDriveLink = "https://drive.google.com/file/d/1CF7mXS2hoxbiTexWf6z1ignYrBuRpWec/view";

    function escapeHtml(text) {
      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    const letters = ['A', 'B', 'C', 'D', 'E','F'];

    const examSections = [
      {
        title: "Final Exam (Second Semester 2020/2021)",
        context: "Official Solved Exam — 32 Comprehensive Questions:",
        subQuestions: [
          {
            id: "q1",
            type: "input",
            text: "Question 1: For the figure shown below, how many subnets are there?",
            img: "../images/cw_7.png",
            unit: "subnets",
            validate: (input) => {
              const num = parseInt(input.trim().replace(/[^0-9]/g, ''), 10);
              return num === 8;
            },
            dispAnswer: "8",
            exp: "تحتوي الشبكة على 5 شبكات محلية طرفية (<bdi>LANs</bdi>) بالإضافة إلى 3 روابط مباشرة نقطة لنقطة بين الراوترات الثلاثة (<bdi>Router-to-Router Links</bdi>)؛ فيكون المجموع الكلي: <bdi>5 + 3 = 8 subnets</bdi>.",
            placeholder: "Enter number..."
          },
          {
            id: "q2",
            type: "multi",
            text: "Question 2: Which of the following is (are) considered as an end system(s)? (Check all that apply):",
            img: "",
            opts: [
              "A laptop PC.",
              "An IP router.",
              "An Ethernet switch.",
              "A mobile phone.",
              "A web server."
            ],
            correctAnswers: [0, 3, 4],
            dispAnswer: "A laptop PC, A mobile phone, A web server.",
            exp: "الأنظمة الطرفية (<bdi>End systems / Hosts</bdi>) هي الأجهزة التي تشغل تطبيقات المستخدمين عند حافة الشبكة، بينما الراوترات ومبدلات الإيثرنت هي أجهزة ربط وسيطة داخل قلب الشبكة.",
            placeholder: ""
          },
          {
            id: "q3",
            type: "single",
            text: "Question 3: In SDN, the forwarding decisions may be made using:",
            img: "",
            opts: [
              "Source MAC address",
              "Destination MAC address",
              "Source IP address",
              "Destination IP address",
              "All of the given choices"
            ],
            ans: 4,
            dispAnswer: "All of the given choices",
            exp: "في شبكات <bdi>SDN (OpenFlow)</bdi>، تعتمد قرارات التوجيه على مطابقة الحقول المعممة (<bdi>Match-plus-Action</bdi>) عبر طبقات متعددة تشمل عناوين <bdi>MAC</bdi> وعناوين <bdi>IP</bdi> والمنافذ.",
            placeholder: ""
          },
          {
            id: "q4_p1",
            type: "input",
            text: `Question 4: Suppose three active nodes (A, B, C) compete for channel access using slotted ALOHA with transmission probability p = 0.3 per slot.
<br><br>1. What is the probability that node A will succeed in slot 5?`,
            img: "",
            unit: "",
            validate: (input) => {
              const num = parseFloat(input.trim().replace(/[^0-9.]/g, ''));
              return Math.abs(num - 0.147) < 0.005;
            },
            dispAnswer: "0.147",
            exp: "تنجح العقدة <bdi>A</bdi> عندما ترسل هي ولا ترسل أي من العقدتين الأخريين: <bdi>P = p × (1-p)^2 = 0.3 × (0.7)^2 = 0.147</bdi>.",
            placeholder: "Enter number..."
          },
          {
            id: "q4_p2",
            type: "input",
            text: "Question 4 (Part 2): What is the probability that some node (either A, B, or C) will succeed in slot 5?",
            img: "",
            unit: "",
            validate: (input) => {
              const num = parseFloat(input.trim().replace(/[^0-9.]/g, ''));
              return Math.abs(num - 0.441) < 0.005;
            },
            dispAnswer: "0.441",
            exp: "احتمال نجاح أي عقدة من العقد الثلاث: <bdi>3 × p × (1-p)^2 = 3 × 0.147 = 0.441</bdi>.",
            placeholder: "Enter number..."
          },
          {
            id: "q4_p3",
            type: "input",
            text: "Question 4 (Part 3): What is the probability that none of the nodes will succeed in slot 5?",
            img: "",
            unit: "",
            validate: (input) => {
              const num = parseFloat(input.trim().replace(/[^0-9.]/g, ''));
              return Math.abs(num - 0.559) < 0.005;
            },
            dispAnswer: "0.559",
            exp: "احتمال عدم نجاح أي عقدة: <bdi>1 - P(نجاح إحدى العقد) = 1 - 0.441 = 0.559</bdi>.",
            placeholder: "Enter number..."
          },
          {
            id: "q5",
            type: "single",
            text: "Question 5: The UDP protocol provides:",
            img: "",
            opts: [
              "best-effort data delivery.",
              "connection-oriented service.",
              "guaranteed bandwidth.",
              "in-order data delivery.",
              "reliable data delivery service."
            ],
            ans: 0,
            dispAnswer: "best-effort data delivery.",
            exp: "يقدم بروتوكول <bdi>UDP</bdi> خدمة التوصيل بأفضل جهد ممكن (<bdi>Best-effort</bdi>) دون ضمانات على الوصول أو الترتيب أو ثبات النطاق.",
            placeholder: ""
          },
          {
            id: "q6",
            type: "input",
            text: "Question 6: Assume a slotted ALOHA-based network using a shared link of 200 Mbps. What is the maximum effective throughput of the network in the long run? (in Mbps)",
            img: "",
            unit: "Mbps",
            validate: (input) => {
              const num = parseFloat(input.trim().replace(/[^0-9.]/g, ''));
              return Math.abs(num - 73.6) < 1 || Math.abs(num - 73.57) < 1 || Math.abs(num - 74) < 1;
            },
            dispAnswer: "≈ 73.6 (or 200/e)",
            exp: "أقصى كفاءة لبروتوكول <bdi>Slotted ALOHA</bdi> هي <bdi>1/e ≈ 0.368</bdi>. الإنتاجية الفعالة القصوى: <bdi>200 × (1/e) ≈ 73.58 Mbps</bdi>.",
            placeholder: "Enter number..."
          },
          {
            id: "q7_p1",
            type: "input",
            text: `Question 7: NAT router has public IP 55.34.112.22 and home network 192.168.1.0/24.
- Host 192.168.1.1 has 6 ongoing TCP connections to port 80 at 128.119.45.87.
- Host 192.168.1.2 has 2 ongoing TCP connections to port 443 at 155.18.66.22.
- Host 192.168.1.3 has 5 ongoing TCP connections to port 80 at 77.18.23.44.
<br><br>1. How many entries would be in the NAT translation table?`,
            img: "../images/cw_8.png",
            unit: "entries",
            validate: (input) => {
              const num = parseInt(input.trim().replace(/[^0-9]/g, ''), 10);
              return num === 13;
            },
            dispAnswer: "13",
            exp: "يتطلب كل اتصال <bdi>TCP</bdi> نشط سطراً مستقلاً في جدول <bdi>NAT</bdi>: <bdi>6 + 2 + 5 = 13 entries</bdi>.",
            placeholder: "Enter number..."
          },
          {
            id: "q7_p2",
            type: "input",
            text: "Question 7 (Part 2): What would be the number of entries in the NAT translation table if all connections in Part (1) were made to port 80 on server 128.119.45.87?",
            img: "",
            unit: "entries",
            validate: (input) => {
              const num = parseInt(input.trim().replace(/[^0-9]/g, ''), 10);
              return num === 13 || num === 0;
            },
            dispAnswer: "13",
            exp: "يبقى عدد المداخل 13 مدخلاً؛ لأن كل اتصال من داخل الشبكة يُخصص له منفذ <bdi>WAN</bdi> فريد ومستقل بغض النظر عن وجهة السيرفر.",
            placeholder: "Enter number..."
          },
          {
            id: "q7_p3",
            type: "input",
            text: "Question 7 (Part 3): Host 192.168.1.4 has an ongoing TCP connection from port 9825 with server port 80. The NAT router changes client port to 5559. What will be the value of the destination port field for packets received by host 192.168.1.4?",
            img: "",
            unit: "",
            validate: (input) => {
              const num = parseInt(input.trim().replace(/[^0-9]/g, ''), 10);
              return num === 9825;
            },
            dispAnswer: "9825",
            exp: "يقوم راوتر <bdi>NAT</bdi> بترجمة منفذ الوجهة للحزم العائدة من 5559 إلى المنفذ الداخلي الأصلي للجهاز وهو <bdi>9825</bdi>.",
            placeholder: "Enter number..."
          },
          {
            id: "q8",
            type: "input",
            text: "Question 8: Given the network that consists of five routers (u, v, x, y, z). Each router has a number of ports labeled p1, p2, etc. The integers shown on the links represent the link costs.\nUsing the Link State routing algorithm at router z, the number of iterations needed to reach the least-cost paths to all other destinations is:",
            img: "../images/cw_9.png",
            unit: "iterations",
            validate: (input) => {
              const num = parseInt(input.trim().replace(/[^0-9]/g, ''), 10);
              return num === 4;
            },
            dispAnswer: "4",
            exp: "في خوارزمية ديكسترا لشبكة تحتوي على <bdi>n = 5</bdi> عقد، يتطلب إيجاد أقصر مسار لجميع الوجهات الأخرى <bdi>n - 1 = 4</bdi> تكرارات.",
            placeholder: "Enter number..."
          },
          {
            id: "q9",
            type: "table_q9",

            text: "Question 30: Which of the following is correct regarding link costs? (Check all that apply):",
            img: "",
            opts: [
              "The link cost increases as the congestion decreases.",
              "As the link cost decreases, it is more likely to be part of the shortest path.",
              "The link cost is changed by any node connected to it.",
              "The link cost may be changed by the routing algorithm.",
              "The performance of the routing algorithm can be affected by the link cost changes.",
              "The link cost never changes."
            ],
            correctAnswers: [1, 3, 4],
            dispAnswer: "As link cost decreases, it is more likely part of shortest path. & May be changed by routing algorithm. & Performance affected by cost changes.",
            exp: "انخفاض كلفة الرابط يزيد احتمالية دخوله في المسار الأقصر، ويمكن للخوارزميات تعديل الأوزان ديناميكياً مما يؤثر على أداء واستقرار الشبكة.",
            placeholder: ""
          },
          {
            id: "q31",
            type: "single",
            text: "Question 31: In a link-state routing protocol:",
            img: "",
            opts: [
              "The state of a link will change based on the state of other links that share the same node.",
              "Each node begins with only the knowledge of the costs of its own directly attached links.",
              "A node informs only its neighbor nodes about changes to the state of any of its links.",
              "The state of a link is dynamically queried to determine whether data can be routed through it.",
              "All nodes get updates on node connectivity so each node can build a full graph of the network."
            ],
            ans: 4,
            dispAnswer: "All nodes get updates on node connectivity so each node can build a full graph of the network.",
            exp: "تعتمد خوارزميات حالة الرابط على إذاعة ونشر حالة الروابط (<bdi>Link-State Broadcast</bdi>) لتتلقى كل العقد نفس المعلومات وتبني مخططاً متكاملاً للشبكة.",
            placeholder: ""
          },
          {
            id: "q32",
            type: "single",
            text: "Question 32: The correct statement about hierarchical routing is:",
            img: "",
            opts: [
              "Different AS's must use the same inter-AS and intra-AS routing algorithms.",
              "Different AS's are completely independent and can use any routing algorithms they prefer.",
              "Different AS's must use the same intra-AS but not necessarily the same inter-AS routing protocols.",
              "Different AS's must use the same inter-AS but not necessarily the same intra-AS routing algorithms."
            ],
            ans: 3,
            dispAnswer: "Different AS's must use the same inter-AS but not necessarily the same intra-AS routing algorithms.",
            exp: "يجب على الأنظمة المستقلة استخدام نفس البروتوكول بين الأنظمة (<bdi>Inter-AS مثل BGP</bdi>) للتنسيق العام، بينما تملك حرية اختيار البروتوكول الداخلي (<bdi>Intra-AS مثل OSPF</bdi>).",
            placeholder: ""
          }
        ]
      }
    ];

    let userScores = {};
    let multiSelections = {};

    function initQuiz() {
      const driveBtn = document.getElementById('drive-link-btn');
      if (driveBtn) {
        if (originalDriveLink && originalDriveLink.trim() !== "") {
          driveBtn.href = originalDriveLink;
          driveBtn.style.display = "inline-flex";
        } else {
          driveBtn.style.display = "none";
        }
      }

      const list = document.getElementById('quiz-list');
      list.innerHTML = '';

      examSections.forEach((section) => {
        const card = document.createElement('div');
        card.className = 'q-card';

        let subQuestionsHtml = '';
        section.subQuestions.forEach((sub) => {
          const unitHtml = sub.unit ? `<span class="unit-label">${sub.unit}</span>` : '';
          const hasImage = sub.img && sub.img.trim() !== "";

          const imageContainerHtml = hasImage ? `
            <div class="q-image-container" id="img-box-${sub.id}">
              <img class="q-original-img" 
                   id="img-${sub.id}" 
                   data-src="${sub.img}" 
                   alt="Original Question ${sub.id}" 
                   onerror="handleImageFallback(this)" />
            </div>
          ` : '';

          const imageButtonHtml = hasImage ? `
            <button class="btn-action" onclick="toggleOriginalImage('${sub.id}')">
              <span>📷</span> عرض صورة السؤال الأصلية
            </button>
          ` : '';

          let interactionHtml = '';

          if (sub.type === "single") {
            const optsHtml = sub.opts.map((opt, i) => `
              <div class="option-item" id="opt-${sub.id}-${i}" onclick="selectSingleOption('${sub.id}', ${i})">
                <div class="opt-letter">${letters[i]}</div>
                <div>${opt}</div>
              </div>
            `).join('');

            interactionHtml = `
              <div class="options-container" id="opts-box-${sub.id}">${optsHtml}</div>
              <div class="answer-input-row">
                ${imageButtonHtml}
                <button class="btn-reset-q" id="reset-btn-${sub.id}" onclick="resetSubQuestion('${sub.id}')">إعادة السؤال ↻</button>
                <button class="btn-action" onclick="toggleSolution('${sub.id}')">
                  <span>💡</span> عرض الحل
                </button>
              </div>
            `;
          } else if (sub.type === "multi") {
            multiSelections[sub.id] = new Set();
            const optsHtml = sub.opts.map((opt, i) => `
              <div class="option-item" id="opt-${sub.id}-${i}" onclick="toggleMultiOption('${sub.id}', ${i})">
                <div class="opt-checkbox" id="check-${sub.id}-${i}">✓</div>
                <div>${opt}</div>
              </div>
            `).join('');

            interactionHtml = `
              <div class="options-container" id="opts-box-${sub.id}">${optsHtml}</div>
              <div class="answer-input-row">
                <button class="btn" id="btn-check-${sub.id}" onclick="checkMultiAnswer('${sub.id}')">تحقق من الاختيارات</button>
                ${imageButtonHtml}
                <button class="btn-reset-q" id="reset-btn-${sub.id}" onclick="resetSubQuestion('${sub.id}')">إعادة السؤال ↻</button>
                <button class="btn-action" onclick="toggleSolution('${sub.id}')">
                  <span>💡</span> عرض الحل
                </button>
              </div>
            `;
          } else if (sub.type === "table_q9") {
            interactionHtml = `
              <div class="table-container ltr-content">
                <table class="exam-table">
                  <thead>
                    <tr>
                      <th>Step</th><th>N'</th><th>D(x), p(x)</th><th>D(z), p(z)</th><th>D(v), p(v)</th><th>D(u), p(u)</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr>
                      <td style="font-weight:bold;">2</td>
                      <td><input type="text" class="table-input" id="q9_n" placeholder=""></td>
                      <td><input type="text" class="table-input" id="q9_dx" placeholder=""></td>
                      <td><input type="text" class="table-input" id="q9_dz" placeholder=""></td>
                      <td><input type="text" class="table-input" id="q9_dv" placeholder=""></td>
                      <td><input type="text" class="table-input" id="q9_du" placeholder=""></td>
                    </tr>
                  </tbody>
                </table>
                <div style="font-weight:bold; margin:10px 0 6px 0; color:var(--apple-blue);">Forwarding Table at Router y:</div>
                <table class="exam-table" style="max-width:320px;">
                  <thead>
                    <tr><th>Dest Router</th><th>Port Number</th></tr>
                  </thead>
                  <tbody>
                    <tr><td>X</td><td><input type="text" class="table-input" id="q9_px" placeholder=""></td></tr>
                    <tr><td>Z</td><td><input type="text" class="table-input" id="q9_pz" placeholder=""></td></tr>
                    <tr><td>V</td><td><input type="text" class="table-input" id="q9_pv" placeholder=""></td></tr>
                    <tr><td>U</td><td><input type="text" class="table-input" id="q9_pu" placeholder=""></td></tr>
                  </tbody>
                </table>
              </div>
              <div class="answer-input-row">
                <button class="btn" id="btn-check-${sub.id}" onclick="checkQ9Table()">تحقق من الجدول</button>
                ${imageButtonHtml}
                <button class="btn-reset-q" id="reset-btn-${sub.id}" onclick="resetSubQuestion('${sub.id}')">إعادة السؤال ↻</button>
                <button class="btn-action" onclick="toggleSolution('${sub.id}')">
                  <span>💡</span> عرض الحل
                </button>
              </div>
            `;
          } else if (sub.type === "table_q26") {
            interactionHtml = `
              <div class="table-container ltr-content">
                <table class="exam-table">
                  <thead>
                    <tr><th>Router</th><th>Cost to u</th><th>Cost to y</th><th>Cost to z</th><th>Cost to v</th></tr>
                  </thead>
                  <tbody>
                    <tr>
                      <td style="font-weight:bold; color:var(--apple-blue);">x</td>
                      <td><input type="text" class="table-input" id="q26_u" placeholder=""></td>
                      <td><input type="text" class="table-input" id="q26_y" placeholder=""></td>
                      <td><input type="text" class="table-input" id="q26_z" placeholder=""></td>
                      <td><input type="text" class="table-input" id="q26_v" placeholder=""></td>
                    </tr>
                  </tbody>
                </table>
              </div>
              <div class="answer-input-row">
                <button class="btn" id="btn-check-${sub.id}" onclick="checkQ26Table()">تحقق من المداخل</button>
                ${imageButtonHtml}
                <button class="btn-reset-q" id="reset-btn-${sub.id}" onclick="resetSubQuestion('${sub.id}')">إعادة السؤال ↻</button>
                <button class="btn-action" onclick="toggleSolution('${sub.id}')">
                  <span>💡</span> عرض الحل
                </button>
              </div>
            `;
          } else {
            interactionHtml = `
              <div class="answer-input-row ltr-content">
                <input type="text" class="text-input-field" id="input-${sub.id}" placeholder="${sub.placeholder || 'Enter answer...'}" onkeydown="if(event.key==='Enter') checkInputAnswer('${sub.id}')">
                ${unitHtml}
                <button class="btn" id="btn-check-${sub.id}" onclick="checkInputAnswer('${sub.id}')">تحقق</button>
                ${imageButtonHtml}
                <button class="btn-reset-q" id="reset-btn-${sub.id}" onclick="resetSubQuestion('${sub.id}')">إعادة السؤال ↻</button>
                <button class="btn-action" onclick="toggleSolution('${sub.id}')">
                  <span>💡</span> عرض الحل
                </button>
              </div>
            `;
          }

          subQuestionsHtml += `
            <div class="sub-question-card ltr-content" id="card-${sub.id}">
              <div class="sub-q-header">${sub.text}</div>
              ${imageContainerHtml}
              ${interactionHtml}
              <div class="solution-box" id="sol-${sub.id}">
                <div><strong>الإجابة النموذجية المعتمدة (Final Answer):</strong></div>
                <div style="margin-top: 6px; font-size: 0.95rem; font-weight: bold; line-height: 1.6; font-family: 'JetBrains Mono', Consolas, monospace; color: #5ac8fa; white-space: pre-wrap;">${escapeHtml(sub.dispAnswer)} ${sub.unit ? escapeHtml(sub.unit) : ''}</div>
                <div style="margin-top: 6px; font-size: 0.88rem; line-height: 1.6; color: var(--text-secondary); direction: rtl; text-align: right; white-space: pre-wrap;">${sub.exp}</div>
              </div>
            </div>
          `;
        });

        card.innerHTML = `
          <div class="ltr-content">
            <div class="parent-q-title">${section.title}</div>
            <div class="parent-q-desc">${section.context}</div>
          </div>
          <div class="sub-list">${subQuestionsHtml}</div>
        `;

        list.appendChild(card);
      });

      calculateScore();
      setupReportModal();
    }

    function toggleOriginalImage(qid) {
      const imgBox = document.getElementById(`img-box-${qid}`);
      const imgEl = document.getElementById(`img-${qid}`);

      if (imgEl && !imgEl.src && imgEl.dataset.src) {
        imgEl.src = imgEl.dataset.src;
      }

      if (imgBox) {
        imgBox.classList.toggle('show');
      }
    }

    function handleImageFallback(imgEl) {
      if (!imgEl.dataset.retried) {
        imgEl.dataset.retried = "1";
        if (imgEl.src.endsWith('.jpg')) {
          imgEl.src = imgEl.src.replace('.jpg', '.png');
        } else if (imgEl.src.endsWith('.png')) {
          imgEl.src = imgEl.src.replace('.png', '.jpg');
        }
      }
    }

    function findSubQuestion(subId) {
      for (const sec of examSections) {
        const found = sec.subQuestions.find(s => s.id === subId);
        if (found) return found;
      }
      return null;
    }

    function selectSingleOption(subId, optIdx) {
      const sub = findSubQuestion(subId);
      const optsBox = document.getElementById(`opts-box-${subId}`);
      const resetBtn = document.getElementById(`reset-btn-${subId}`);
      if (!sub || !optsBox) return;

      optsBox.classList.add('locked');

      const picked = document.getElementById(`opt-${subId}-${optIdx}`);
      if (optIdx === sub.ans) {
        if (picked) picked.classList.add('correct');
        userScores[subId] = true;
      } else {
        if (picked) picked.classList.add('wrong');
        delete userScores[subId];
      }

      if (resetBtn) resetBtn.style.display = 'inline-flex';
      calculateScore();
    }

    function toggleMultiOption(subId, optIdx) {
      const set = multiSelections[subId];
      const optEl = document.getElementById(`opt-${subId}-${optIdx}`);
      if (!set || !optEl) return;

      if (set.has(optIdx)) {
        set.delete(optIdx);
        optEl.classList.remove('selected');
      } else {
        set.add(optIdx);
        optEl.classList.add('selected');
      }
    }

    function checkMultiAnswer(subId) {
      const sub = findSubQuestion(subId);
      const set = multiSelections[subId];
      const optsBox = document.getElementById(`opts-box-${subId}`);
      const checkBtn = document.getElementById(`btn-check-${subId}`);
      const resetBtn = document.getElementById(`reset-btn-${subId}`);
      if (!sub || !set || !optsBox) return;

      optsBox.classList.add('locked');
      const correctSet = new Set(sub.correctAnswers);
      let isAllCorrect = (set.size === correctSet.size);

      sub.opts.forEach((_, i) => {
        const el = document.getElementById(`opt-${subId}-${i}`);
        if (!el) return;
        if (correctSet.has(i)) {
          el.className = 'option-item correct';
          if (!set.has(i)) isAllCorrect = false;
        } else if (set.has(i)) {
          el.className = 'option-item wrong';
          isAllCorrect = false;
        }
      });

      if (isAllCorrect) {
        userScores[subId] = true;
      } else {
        delete userScores[subId];
      }

      if (checkBtn) checkBtn.style.display = 'none';
      if (resetBtn) resetBtn.style.display = 'inline-flex';
      calculateScore();
    }

    function checkInputAnswer(subId) {
      const sub = findSubQuestion(subId);
      const inputEl = document.getElementById(`input-${subId}`);
      const resetBtn = document.getElementById(`reset-btn-${subId}`);
      const checkBtn = document.getElementById(`btn-check-${subId}`);
      if (!sub || !inputEl) return;

      const userVal = inputEl.value.trim();
      if (!userVal) {
        alert("يرجى إدخال إجابة أولاً!");
        return;
      }

      const isCorrect = sub.validate(userVal);
      inputEl.disabled = true;

      if (isCorrect) {
        inputEl.className = 'text-input-field correct';
        userScores[subId] = true;
      } else {
        inputEl.className = 'text-input-field wrong';
        delete userScores[subId];
      }

      if (checkBtn) checkBtn.style.display = 'none';
      if (resetBtn) resetBtn.style.display = 'inline-flex';

      calculateScore();
    }

    function checkQ9Table() {
      const subId = "q9";
      const checkBtn = document.getElementById(`btn-check-${subId}`);
      const resetBtn = document.getElementById(`reset-btn-${subId}`);

      const fields = [
        { id: "q9_n", val: ["yxv", "y,x,v", "y, x, v"] },
        { id: "q9_dx", val: ["1,y", "1, y", "-", ""] },
        { id: "q9_dz", val: ["4,x", "4, x"] },
        { id: "q9_dv", val: ["2,y", "2, y", "-", ""] },
        { id: "q9_du", val: ["3,v", "3, v"] },
        { id: "q9_px", val: ["p2", "2"] },
        { id: "q9_pz", val: ["p2", "2"] },
        { id: "q9_pv", val: ["p1", "1"] },
        { id: "q9_pu", val: ["p1", "1"] }
      ];

      let allCorrect = true;
      fields.forEach(f => {
        const el = document.getElementById(f.id);
        if (!el) return;
        el.disabled = true;
        const v = el.value.trim().toLowerCase().replace(/\s/g, '');
        if (f.val.some(target => v === target.replace(/\s/g, ''))) {
          el.className = 'table-input correct';
        } else {
          el.className = 'table-input wrong';
          allCorrect = false;
        }
      });

      if (allCorrect) userScores[subId] = true;
      else delete userScores[subId];

      if (checkBtn) checkBtn.style.display = 'none';
      if (resetBtn) resetBtn.style.display = 'inline-flex';
      calculateScore();
    }

    function checkQ26Table() {
      const subId = "q26";
      const checkBtn = document.getElementById(`btn-check-${subId}`);
      const resetBtn = document.getElementById(`reset-btn-${subId}`);

      const fields = [
        { id: "q26_u", val: "3" },
        { id: "q26_y", val: "2" },
        { id: "q26_z", val: "4" },
        { id: "q26_v", val: "7" }
      ];

      let allCorrect = true;
      fields.forEach(f => {
        const el = document.getElementById(f.id);
        if (!el) return;
        el.disabled = true;
        const v = el.value.trim();
        if (v === f.val) {
          el.className = 'table-input correct';
        } else {
          el.className = 'table-input wrong';
          allCorrect = false;
        }
      });

      if (allCorrect) userScores[subId] = true;
      else delete userScores[subId];

      if (checkBtn) checkBtn.style.display = 'none';
      if (resetBtn) resetBtn.style.display = 'inline-flex';
      calculateScore();
    }

    function resetSubQuestion(subId) {
      delete userScores[subId];

      const inputEl = document.getElementById(`input-${subId}`);
      if (inputEl) {
        inputEl.disabled = false;
        inputEl.value = '';
        inputEl.className = 'text-input-field';
        inputEl.focus();
      }

      const optsBox = document.getElementById(`opts-box-${subId}`);
      if (optsBox) {
        optsBox.classList.remove('locked');
      }

      const sub = findSubQuestion(subId);
      if (sub && sub.type === "single") {
        sub.opts.forEach((_, i) => {
          const el = document.getElementById(`opt-${subId}-${i}`);
          if (el) el.className = 'option-item';
        });
      }

      if (sub && sub.type === "multi") {
        multiSelections[subId] = new Set();
        sub.opts.forEach((_, i) => {
          const el = document.getElementById(`opt-${subId}-${i}`);
          if (el) el.className = 'option-item';
        });
      }

      if (subId === "q9") {
        ["q9_n", "q9_dx", "q9_dz", "q9_dv", "q9_du", "q9_px", "q9_pz", "q9_pv", "q9_pu"].forEach(id => {
          const el = document.getElementById(id);
          if (el) {
            el.disabled = false;
            el.value = '';
            el.className = 'table-input';
          }
        });
      }

      if (subId === "q26") {
        ["q26_u", "q26_y", "q26_z", "q26_v"].forEach(id => {
          const el = document.getElementById(id);
          if (el) {
            el.disabled = false;
            el.value = '';
            el.className = 'table-input';
          }
        });
      }

      const checkBtn = document.getElementById(`btn-check-${subId}`);
      const resetBtn = document.getElementById(`reset-btn-${subId}`);
      const sol = document.getElementById(`sol-${subId}`);
      const imgBox = document.getElementById(`img-box-${subId}`);

      if (checkBtn) checkBtn.style.display = 'inline-flex';
      if (resetBtn) resetBtn.style.display = 'none';
      if (sol) sol.classList.remove('show');
      if (imgBox) imgBox.classList.remove('show');

      calculateScore();
    }

    function calculateScore() {
      let total = 0;
      let score = 0;
      examSections.forEach(sec => {
        sec.subQuestions.forEach(sub => {
          total++;
          if (userScores[sub.id]) score++;
        });
      });

      const pct = total > 0 ? Math.round((score / total) * 100) : 0;
      const scoreEl = document.getElementById('score');
      if (scoreEl) {
        scoreEl.innerText = `${score} / ${total} (${pct}%)`;
      }
    }

    function toggleSolution(subId) {
      const sol = document.getElementById(`sol-${subId}`);
      if (sol) sol.classList.toggle('show');
    }

    let allShown = false;
    function toggleAllSolutions() {
      allShown = !allShown;
      examSections.forEach(sec => {
        sec.subQuestions.forEach(sub => {
          const sol = document.getElementById(`sol-${sub.id}`);
          if (sol) {
            if (allShown) sol.classList.add('show');
            else sol.classList.remove('show');
          }
        });
      });
    }

    function resetQuiz() {
      userScores = {};
      initQuiz();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function setupReportModal() {
      const openBtn = document.getElementById('openReportBtn');
      const closeBtn = document.getElementById('closeReportBtn');
      const overlay = document.getElementById('reportOverlay');
      const form = document.getElementById('bugReportForm');
      const status = document.getElementById('reportStatus');

      if (!openBtn || !overlay) return;

      openBtn.onclick = () => {
        overlay.classList.add('active');
        overlay.setAttribute('aria-hidden', 'false');
      };

      const closeModal = () => {
        overlay.classList.remove('active');
        overlay.setAttribute('aria-hidden', 'true');
        if (status) status.innerText = '';
      };

      if (closeBtn) closeBtn.onclick = closeModal;

      overlay.onclick = (e) => {
        if (e.target === overlay) closeModal();
      };

      if (form) {
        form.onsubmit = (e) => {
          e.preventDefault();
          const submitBtn = document.getElementById('submitReportBtn');
          if (submitBtn) submitBtn.disabled = true;
          if (status) {
            status.style.color = '#30d158';
            status.innerText = 'تم إرسال البلاغ بنجاح، شكراً لمساعدتك!';
          }
          setTimeout(() => {
            closeModal();
            form.reset();
            if (submitBtn) submitBtn.disabled = false;
          }, 1500);
        };
      }
    }

    initQuiz();
  </script>
  <script src="../transition.js"></script>
</body>
</html>
