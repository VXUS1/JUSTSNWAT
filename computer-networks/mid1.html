  <script>
    const originalDriveLink = "https://drive.google.com/file/d/1kL3pXp0dyj8C2tcQ1kV-MENZWUYPYtPp/view";

    function escapeHtml(text) {
      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    const letters = ['A', 'B', 'C', 'D', 'E'];

    const examSections = [
      {
        title: "Midterm Exam (Second Semester 2020/2021)",
        context: "Official Solved Exam — 20 Interactive Questions:",
        subQuestions: [
          {
            id: "q1",
            type: "input",
            text: "Question 1: In the Selective Repeat algorithm with window size = 9, suppose that the oldest transmitted segment without ACK has a sequence number equal to 66 and that the sender has already received ACKs for segments 67, 68, 69. What will be the value of the sender's Send_Base after receiving ACK66?",
            img: "",
            unit: "",
            validate: (input) => {
              const num = parseInt(input.trim().replace(/[^0-9]/g, ''), 10);
              return num === 70;
            },
            dispAnswer: "70",
            exp: "عند استلام تأكيد الشريحة <bdi>66</bdi>، تصبح الشرائح <bdi>66, 67, 68, 69</bdi> مؤكدة بالكامل تباعاً، فتنزلق بداية النافذة (<bdi>Send_Base</bdi>) إلى أول بايت غير مؤكد وهو <bdi>70</bdi>.",
            placeholder: "Enter number..."
          },
          {
            id: "q2",
            type: "single",
            text: "Question 2: The delay that is least controlled in the Internet is:",
            img: "",
            opts: [
              "Queuing delay.",
              "Propagation delay.",
              "Transmission delay.",
              "Nodal processing delay."
            ],
            ans: 0,
            dispAnswer: "Queuing delay.",
            exp: "تأخير الانتظار في الطابور (<bdi>Queuing delay</bdi>) هو الأقل تحكماً وتوقعاً؛ لأنه يعتمد كلياً على مستوى الازدحام اللحظي في الراوترات وطبيعة تدفق البيانات المتغيرة زمنياً.",
            placeholder: ""
          },
          {
            id: "q3_p1",
            type: "input",
            text: `Question 3 (Part 1): Consider a server connected to a router by a link Rs = 240 Mbps with 150 ms prop delay. The router connects to two other routers over links Ra = 175 Mbps with 200 ms prop delay. A 1 Gbps link connects a host and a cache to each router.
<br><br>Assume client hosts send requests directly to the server (caches off). What is the maximum rate (in Mbps) at which the server can deliver data to a single client?`,
            img: "../images/cw_6.png",
            unit: "Mbps",
            validate: (input) => {
              const num = parseFloat(input.trim().replace(/[^0-9.]/g, ''));
              return Math.abs(num - 175) < 0.1;
            },
            dispAnswer: "175",
            exp: "السرعة القصوى محكومة بأضعف رابط في المسار (<bdi>Bottleneck Link</bdi>) بين <bdi>240 Mbps</bdi> و <bdi>175 Mbps</bdi> و <bdi>1000 Mbps</bdi>، وهو الرابط ذو السرعة <bdi>175 Mbps</bdi>.",
            placeholder: "Enter number..."
          },
          {
            id: "q3_p2",
            type: "input",
            text: "Question 3 (Part 2): Based on Question 3, assume caches are turned on: 80% of requests are satisfied by the local cache (1 Gbps = 1000 Mbps) and 20% by the server (175 Mbps). What is the average rate at which the client can receive data?",
            img: "",
            unit: "Mbps",
            validate: (input) => {
              const num = parseFloat(input.trim().replace(/[^0-9.]/g, ''));
              return Math.abs(num - 835) < 0.5;
            },
            dispAnswer: "835",
            exp: "معدل النقل المتوسط: <bdi>Average Rate = (0.80 × 1000) + (0.20 × 175) = 800 + 35 = 835 Mbps</bdi>.",
            placeholder: "Enter number..."
          },
          {
            id: "q4",
            type: "single",
            text: `Question 4: Specify the values of X and Y in the following rdt3.0 scenario:
<div class="svg-container ltr-content">
  <svg width="480" height="350" viewBox="0 0 480 350" style="max-width:100%; height:auto;">
    <defs>
      <marker id="arrow-pkt" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1 L 10 5 L 0 9 z" fill="#0a84ff" />
      </marker>
      <marker id="arrow-ack" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1 L 10 5 L 0 9 z" fill="#30d158" />
      </marker>
    </defs>

    <!-- خطوط التايم لاين -->
    <line x1="120" y1="40" x2="120" y2="330" stroke="#8e8e93" stroke-width="3" stroke-linecap="round"/>
    <line x1="360" y1="40" x2="360" y2="330" stroke="#8e8e93" stroke-width="3" stroke-linecap="round"/>

    <!-- عناوين الأعمدة -->
    <rect x="75" y="10" width="90" height="26" rx="5" fill="#1c1c1e" stroke="#0a84ff" stroke-width="1.5"/>
    <text x="120" y="27" fill="#fff" font-size="13" font-weight="bold" text-anchor="middle">Sender</text>

    <rect x="315" y="10" width="90" height="26" rx="5" fill="#1c1c1e" stroke="#0a84ff" stroke-width="1.5"/>
    <text x="360" y="27" fill="#fff" font-size="13" font-weight="bold" text-anchor="middle">Receiver</text>

    <!-- 1. Pkt0 -->
    <line x1="120" y1="65" x2="352" y2="95" stroke="#0a84ff" stroke-width="2" marker-end="url(#arrow-pkt)"/>
    <text x="235" y="74" fill="#79c0ff" font-size="12" font-weight="bold">Pkt0</text>

    <!-- 2. X (ACK0) -->
    <line x1="360" y1="105" x2="128" y2="135" stroke="#30d158" stroke-width="2" marker-end="url(#arrow-ack)"/>
    <rect x="225" y="112" width="26" height="18" rx="4" fill="#ff9f0a"/>
    <text x="238" y="125" fill="#000" font-size="12" font-weight="bold" text-anchor="middle">X</text>

    <!-- 3. Pkt1 -->
    <line x1="120" y1="145" x2="352" y2="175" stroke="#0a84ff" stroke-width="2" marker-end="url(#arrow-pkt)"/>
    <text x="235" y="154" fill="#79c0ff" font-size="12" font-weight="bold">Pkt1</text>

    <!-- مؤشر انتهاء الوقت Timeout -->
    <path d="M 115 150 L 85 150 L 85 210 L 115 210" fill="none" stroke="#ff453a" stroke-width="2"/>
    <text x="75" y="184" fill="#ff453a" font-size="11" font-weight="bold" text-anchor="end">Time Out</text>

    <!-- 4. ACK1 -->
    <line x1="360" y1="185" x2="128" y2="235" stroke="#30d158" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow-ack)"/>
    <text x="245" y="205" fill="#30d158" font-size="12" font-weight="bold">ACK1</text>

    <!-- 5. Pkt1 Retransmit -->
    <line x1="120" y1="220" x2="352" y2="250" stroke="#0a84ff" stroke-width="2" marker-end="url(#arrow-pkt)"/>
    <text x="235" y="230" fill="#79c0ff" font-size="12" font-weight="bold">Pkt1</text>

    <!-- 6. Y (Pkt0) -->
    <line x1="120" y1="265" x2="352" y2="295" stroke="#0a84ff" stroke-width="2.5" marker-end="url(#arrow-pkt)"/>
    <rect x="225" y="272" width="26" height="18" rx="4" fill="#ff9f0a"/>
    <text x="238" y="285" fill="#000" font-size="12" font-weight="bold" text-anchor="middle">Y</text>
  </svg>
</div>`,
            img: "",
            opts: [
              "X=ACK1, Y=Pkt0",
              "X=Pkt0, Y=Pkt1",
              "X=ACK1, Y=Pkt1",
              "X=ACK0, Y=Pkt0",
              "X=ACK0, Y=Pkt1"
            ],
            ans: 3,
            dispAnswer: "X=ACK0, Y=Pkt0",
            exp: "عند استلام الحزمة <bdi>Pkt0</bdi>، يرسل المستقبل إشعار الاستلام <bdi>X = ACK0</bdi>. وبعد استلام التأكيد <bdi>ACK1</bdi> للشريحة الأولى بنجاح، يُرسل المرسل الحزمة الجديدة التالية وهي <bdi>Y = Pkt0</bdi>.",
            placeholder: ""
          },
          {
            id: "q5",
            type: "single",
            text: "Question 5: If the propagation delay over a communication link is half its transmission delay, then:",
            img: "",
            opts: [
              "The whole packet will occupy half of the link space.",
              "The whole packet will occupy the whole link space.",
              "Only two bits can be in the link at the same time.",
              "No more than one bit can be in the link at any time."
            ],
            ans: 3,
            dispAnswer: "No more than one bit can be in the link at any time.",
            exp: "بما أن زمن انتشار الإشارة على طول السلك نصف زمن بث البتات، فإن البت الأولى تصل وتغادر قبل أن يكتمل دفع البت التالية على السلك، فلا يوجد أكثر من بت واحدة في نفس اللحظة.",
            placeholder: ""
          },
          {
            id: "q6",
            type: "input",
            text: "Question 6: In the Go-Back-N protocol with window size = 14, the oldest transmitted segment without ACK has a sequence number equal to 90. The sender has already sent 3 packets from its transmission window. What will be the value of send_base after receiving ACK91?",
            img: "",
            unit: "",
            validate: (input) => {
              const num = parseInt(input.trim().replace(/[^0-9]/g, ''), 10);
              return num === 92;
            },
            dispAnswer: "92",
            exp: "تأكيد الاستلام في <bdi>Go-Back-N</bdi> تراكمي؛ بوصول <bdi>ACK91</bdi> تتأكد كل الحزم حتى 91 شاملاً لها، وتتحرك بداية النافذة إلى الحزمة التالية: <bdi>91 + 1 = 92</bdi>.",
            placeholder: "Enter number..."
          },
          {
            id: "q7_p1",
            type: "input",
            text: `Question 7 (Part 1): A web page contains 12 objects (1 main HTML file, 10 JPG images, and 1 MP3 background music). Each object has a size of 3 Kbits and fits in one TCP packet. Assume RTT = 300 ms, TCP setup time Ts = 450 ms, and download rate = 1 Mbps.
<br><br>If the client downloads using persistent HTTP with pipelining, what will the entire page download time be? (in ms)`,
            img: "",
            unit: "ms",
            validate: (input) => {
              const num = parseFloat(input.trim().replace(/[^0-9.]/g, ''));
              return Math.abs(num - 1086) < 1;
            },
            dispAnswer: "1086",
            exp: "زمن التحميل الكلي: <bdi>Ts + 2×RTT + 12×(L/R) = 450 + (2 × 300) + 12 × (3 Kbits / 1 Mbps) = 450 + 600 + 36 = 1086 ms</bdi>.",
            placeholder: "Enter number..."
          },
          {
            id: "q7_p2",
            type: "input",
            text: "Question 7 (Part 2): Based on Question 7, suppose the main page and 9 JPG images are from Server 1, and the other 2 objects are from Server 2. Client can only open one connection at a time. What will the entire page download time be? (in ms)",
            img: "",
            unit: "ms",
            validate: (input) => {
              const num = parseFloat(input.trim().replace(/[^0-9.]/g, ''));
              return Math.abs(num - 1836) < 1;

    let userScores = {};
    let multiSelections = {};

    function initQuiz() {
      const driveBtn = document.getElementById('drive-link-btn');
      if (driveBtn) {
        if (originalDriveLink && originalDriveLink.trim() !== "") {
          driveBtn.href = originalDriveLink;
          driveBtn.style.display = "inline-flex";
        } else {
          driveBtn.style.display = "none";
        }
      }

      const list = document.getElementById('quiz-list');
      list.innerHTML = '';

      examSections.forEach((section) => {
        const card = document.createElement('div');
        card.className = 'q-card';

        let subQuestionsHtml = '';
        section.subQuestions.forEach((sub) => {
          const unitHtml = sub.unit ? `<span class="unit-label">${sub.unit}</span>` : '';
          const hasImage = sub.img && sub.img.trim() !== "";

          const imageContainerHtml = hasImage ? `
            <div class="q-image-container" id="img-box-${sub.id}">
              <img class="q-original-img" 
                   id="img-${sub.id}" 
                   data-src="${sub.img}" 
                   alt="Original Question ${sub.id}" 
                   onerror="handleImageFallback(this)" />
            </div>
          ` : '';

          const imageButtonHtml = hasImage ? `
            <button class="btn-action" onclick="toggleOriginalImage('${sub.id}')">
              <span>📷</span> عرض صورة السؤال الأصلية
            </button>
          ` : '';

          let interactionHtml = '';

          if (sub.type === "single") {
            const optsHtml = sub.opts.map((opt, i) => `
              <div class="option-item" id="opt-${sub.id}-${i}" onclick="selectSingleOption('${sub.id}', ${i})">
                <div class="opt-letter">${letters[i]}</div>
                <div>${opt}</div>
              </div>
            `).join('');

            interactionHtml = `
              <div class="options-container" id="opts-box-${sub.id}">${optsHtml}</div>
              <div class="answer-input-row">
                ${imageButtonHtml}
                <button class="btn-reset-q" id="reset-btn-${sub.id}" onclick="resetSubQuestion('${sub.id}')">إعادة السؤال ↻</button>
                <button class="btn-action" onclick="toggleSolution('${sub.id}')">
                  <span>💡</span> عرض الحل
                </button>
              </div>
            `;
          } else if (sub.type === "multi") {
            multiSelections[sub.id] = new Set();
            const optsHtml = sub.opts.map((opt, i) => `
              <div class="option-item" id="opt-${sub.id}-${i}" onclick="toggleMultiOption('${sub.id}', ${i})">
                <div class="opt-checkbox" id="check-${sub.id}-${i}">✓</div>
                <div>${opt}</div>
              </div>
            `).join('');

            interactionHtml = `
              <div class="options-container" id="opts-box-${sub.id}">${optsHtml}</div>
              <div class="answer-input-row">
                <button class="btn" id="btn-check-${sub.id}" onclick="checkMultiAnswer('${sub.id}')">تحقق من الاختيارات</button>
                ${imageButtonHtml}
                <button class="btn-reset-q" id="reset-btn-${sub.id}" onclick="resetSubQuestion('${sub.id}')">إعادة السؤال ↻</button>
                <button class="btn-action" onclick="toggleSolution('${sub.id}')">
                  <span>💡</span> عرض الحل
                </button>
              </div>
            `;
          } else {
            interactionHtml = `
              <div class="answer-input-row ltr-content">
                <input type="text" class="text-input-field" id="input-${sub.id}" placeholder="${sub.placeholder || 'Enter answer...'}" onkeydown="if(event.key==='Enter') checkInputAnswer('${sub.id}')">
                ${unitHtml}
                <button class="btn" id="btn-check-${sub.id}" onclick="checkInputAnswer('${sub.id}')">تحقق</button>
                ${imageButtonHtml}
                <button class="btn-reset-q" id="reset-btn-${sub.id}" onclick="resetSubQuestion('${sub.id}')">إعادة السؤال ↻</button>
                <button class="btn-action" onclick="toggleSolution('${sub.id}')">
                  <span>💡</span> عرض الحل
                </button>
              </div>
            `;
          }

          subQuestionsHtml += `
            <div class="sub-question-card ltr-content" id="card-${sub.id}">
              <div class="sub-q-header">${sub.text}</div>
              ${imageContainerHtml}
              ${interactionHtml}
              <div class="solution-box" id="sol-${sub.id}">
                <div><strong>الإجابة النموذجية المعتمدة (Final Answer):</strong></div>
                <div style="margin-top: 6px; font-size: 0.95rem; font-weight: bold; line-height: 1.6; font-family: 'JetBrains Mono', Consolas, monospace; color: #5ac8fa;">${escapeHtml(sub.dispAnswer)} ${sub.unit ? escapeHtml(sub.unit) : ''}</div>
                <div style="margin-top: 6px; font-size: 0.88rem; line-height: 1.6; color: var(--text-secondary); direction: rtl; text-align: right;">${sub.exp}</div>
              </div>
            </div>
          `;
        });

        card.innerHTML = `
          <div class="ltr-content">
            <div class="parent-q-title">${section.title}</div>
            <div class="parent-q-desc">${section.context}</div>
          </div>
          <div class="sub-list">${subQuestionsHtml}</div>
        `;

        list.appendChild(card);
      });

      calculateScore();
      setupReportModal();
    }

    function toggleOriginalImage(qid) {
      const imgBox = document.getElementById(`img-box-${qid}`);
      const imgEl = document.getElementById(`img-${qid}`);

      if (imgEl && !imgEl.src && imgEl.dataset.src) {
        imgEl.src = imgEl.dataset.src;
      }

      if (imgBox) {
        imgBox.classList.toggle('show');
      }
    }

    function handleImageFallback(imgEl) {
      if (!imgEl.dataset.retried) {
        imgEl.dataset.retried = "1";
        if (imgEl.src.endsWith('.jpg')) {
          imgEl.src = imgEl.src.replace('.jpg', '.png');
        } else if (imgEl.src.endsWith('.png')) {
          imgEl.src = imgEl.src.replace('.png', '.jpg');
        }
      }
    }

    function findSubQuestion(subId) {
      for (const sec of examSections) {
        const found = sec.subQuestions.find(s => s.id === subId);
        if (found) return found;
      }
      return null;
    }

    function selectSingleOption(subId, optIdx) {
      const sub = findSubQuestion(subId);
      const optsBox = document.getElementById(`opts-box-${subId}`);
      const resetBtn = document.getElementById(`reset-btn-${subId}`);
      if (!sub || !optsBox) return;

      optsBox.classList.add('locked');

      const picked = document.getElementById(`opt-${subId}-${optIdx}`);
      if (optIdx === sub.ans) {
        if (picked) picked.classList.add('correct');
        userScores[subId] = true;
      } else {
        if (picked) picked.classList.add('wrong');
        delete userScores[subId];
      }

      if (resetBtn) resetBtn.style.display = 'inline-flex';
      calculateScore();
    }

    function toggleMultiOption(subId, optIdx) {
      const set = multiSelections[subId];
      const optEl = document.getElementById(`opt-${subId}-${optIdx}`);
      if (!set || !optEl) return;

      if (set.has(optIdx)) {
        set.delete(optIdx);
        optEl.classList.remove('selected');
      } else {
        set.add(optIdx);
        optEl.classList.add('selected');
      }
    }

    function checkMultiAnswer(subId) {
      const sub = findSubQuestion(subId);
      const set = multiSelections[subId];
      const optsBox = document.getElementById(`opts-box-${subId}`);
      const checkBtn = document.getElementById(`btn-check-${subId}`);
      const resetBtn = document.getElementById(`reset-btn-${subId}`);
      if (!sub || !set || !optsBox) return;

      optsBox.classList.add('locked');
      const correctSet = new Set(sub.correctAnswers);
      let isAllCorrect = (set.size === correctSet.size);

      sub.opts.forEach((_, i) => {
        const el = document.getElementById(`opt-${subId}-${i}`);
        if (!el) return;
        if (correctSet.has(i)) {
          el.className = 'option-item correct';
          if (!set.has(i)) isAllCorrect = false;
        } else if (set.has(i)) {
          el.className = 'option-item wrong';
          isAllCorrect = false;
        }
      });

      if (isAllCorrect) {
        userScores[subId] = true;
      } else {
        delete userScores[subId];
      }

      if (checkBtn) checkBtn.style.display = 'none';
      if (resetBtn) resetBtn.style.display = 'inline-flex';
      calculateScore();
    }

    function checkInputAnswer(subId) {
      const sub = findSubQuestion(subId);
      const inputEl = document.getElementById(`input-${subId}`);
      const resetBtn = document.getElementById(`reset-btn-${subId}`);
      const checkBtn = document.getElementById(`btn-check-${subId}`);
      if (!sub || !inputEl) return;

      const userVal = inputEl.value.trim();
      if (!userVal) {
        alert("يرجى إدخال إجابة أولاً!");
        return;
      }

      const isCorrect = sub.validate(userVal);
      inputEl.disabled = true;

      if (isCorrect) {
        inputEl.className = 'text-input-field correct';
        userScores[subId] = true;
      } else {
        inputEl.className = 'text-input-field wrong';
        delete userScores[subId];
      }

      if (checkBtn) checkBtn.style.display = 'none';
      if (resetBtn) resetBtn.style.display = 'inline-flex';

      calculateScore();
    }

    function resetSubQuestion(subId) {
      const sub = findSubQuestion(subId);
      delete userScores[subId];

      const inputEl = document.getElementById(`input-${subId}`);
      if (inputEl) {
        inputEl.disabled = false;
        inputEl.value = '';
        inputEl.className = 'text-input-field';
        inputEl.focus();
      }

      const optsBox = document.getElementById(`opts-box-${subId}`);
      if (optsBox) {
        optsBox.classList.remove('locked');
      }

      if (sub && sub.type === "single") {
        sub.opts.forEach((_, i) => {
          const el = document.getElementById(`opt-${subId}-${i}`);
          if (el) el.className = 'option-item';
        });
      }

      if (sub && sub.type === "multi") {
        multiSelections[subId] = new Set();
        sub.opts.forEach((_, i) => {
          const el = document.getElementById(`opt-${subId}-${i}`);
          if (el) el.className = 'option-item';
        });
      }

      const checkBtn = document.getElementById(`btn-check-${subId}`);
      const resetBtn = document.getElementById(`reset-btn-${subId}`);
      const sol = document.getElementById(`sol-${subId}`);
      const imgBox = document.getElementById(`img-box-${subId}`);

      if (checkBtn) checkBtn.style.display = 'inline-flex';
      if (resetBtn) resetBtn.style.display = 'none';
      if (sol) sol.classList.remove('show');
      if (imgBox) imgBox.classList.remove('show');

      calculateScore();
    }

    function calculateScore() {
      let total = 0;
      let score = 0;
      examSections.forEach(sec => {
        sec.subQuestions.forEach(sub => {
          total++;
          if (userScores[sub.id]) score++;
        });
      });

      const pct = total > 0 ? Math.round((score / total) * 100) : 0;
      const scoreEl = document.getElementById('score');
      if (scoreEl) {
        scoreEl.innerText = `${score} / ${total} (${pct}%)`;
      }
    }

    function toggleSolution(subId) {
      const sol = document.getElementById(`sol-${subId}`);
      if (sol) sol.classList.toggle('show');
    }

    let allShown = false;
    function toggleAllSolutions() {
      allShown = !allShown;
      examSections.forEach(sec => {
        sec.subQuestions.forEach(sub => {
          const sol = document.getElementById(`sol-${sub.id}`);
          if (sol) {
            if (allShown) sol.classList.add('show');
            else sol.classList.remove('show');
          }
        });
      });
    }

    function resetQuiz() {
      userScores = {};
      initQuiz();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function setupReportModal() {
      const openBtn = document.getElementById('openReportBtn');
      const closeBtn = document.getElementById('closeReportBtn');
      const overlay = document.getElementById('reportOverlay');
      const form = document.getElementById('bugReportForm');
      const status = document.getElementById('reportStatus');

      if (!openBtn || !overlay) return;

      openBtn.onclick = () => {
        overlay.classList.add('active');
        overlay.setAttribute('aria-hidden', 'false');
      };

      const closeModal = () => {
        overlay.classList.remove('active');
        overlay.setAttribute('aria-hidden', 'true');
        if (status) status.innerText = '';
      };

      if (closeBtn) closeBtn.onclick = closeModal;

      overlay.onclick = (e) => {
        if (e.target === overlay) closeModal();
      };

      if (form) {
        form.onsubmit = (e) => {
          e.preventDefault();
          const submitBtn = document.getElementById('submitReportBtn');
          if (submitBtn) submitBtn.disabled = true;
          if (status) {
            status.style.color = '#30d158';
            status.innerText = 'تم إرسال البلاغ بنجاح، شكراً لمساعدتك!';
          }
          setTimeout(() => {
            closeModal();
            form.reset();
            if (submitBtn) submitBtn.disabled = false;
          }, 1500);
        };
      }
    }

    initQuiz();
  </script>
  <script src="../transition.js"></script>
</body>
</html>
