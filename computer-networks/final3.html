  <script>
    const originalDriveLink = "https://drive.google.com/file/d/1bw8S872XTNHcxnDKr0KPonmvTazleeu8/view";

    function escapeHtml(text) {
      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    const letters = ['A', 'B', 'C', 'D', 'E'];

    const examSections = [
      {
        title: "Part 1: Multiple Choice Questions (14 Points)",
        context: "Choose the best answer for each of the following multiple-choice questions:",
        subQuestions: [
          {
            id: "p1_q1",
            type: "single",
            text: "Question 1: If the entry [IP Src = 192.*.*.*; IP Dst = 10.2.0.3; port = TCP; Forward(3)] is added to an SDN forwarding table, one of the following is INCORRECT:",
            img: "",
            opts: [
              "Block all UDP traffic generated from any device and destined to host 10.2.0.3 via interface 3.",
              "Permit only TCP traffic generated from any device and destined to host 10.2.0.3 via interface 3.",
              "Allow any host to send HTTP message to the host 10.2.0.3 via interface 3.",
              "Never forward UDP traffic to interface 3."
            ],
            ans: 2,
            dispAnswer: "C. allow any host to send HTTP message to the host 10.2.0.3 via interface 3.",
            exp: "العبارة غير الصحيحة هي السماح لأي جهاز بإرسال رسائل <bdi>HTTP</bdi>؛ لأن القاعدة تلزم صراحة أن يكون عنوان المصدر ضمن شبكة <bdi>192.*.*.*</bdi> حصراً.",
            placeholder: ""
          },
          {
            id: "p1_q2",
            type: "single",
            text: "Question 2: The type of delay that is NOT caused by the store-and-forward strategy used by the switching devices is:",
            img: "",
            opts: [
              "The processing delay.",
              "The queuing delay.",
              "The transmission delay.",
              "The propagation delay."
            ],
            ans: 3,
            dispAnswer: "D. The propagation delay.",
            exp: "تأخير الانتشار (<bdi>Propagation delay</bdi>) يعتمد حصراً على المسافة الفيزيائية وسرعة الضوء في الوسط الناقل (<bdi>d/s</bdi>)، ولا علاقة له بآلية التخزين والتمرير في المبدلات.",
            placeholder: ""
          },
          {
            id: "p1_q3",
            type: "single",
            text: "Question 3: The property that is NOT desired in an ideal MAC protocol is:",
            img: "",
            opts: [
              "A coordinator node should manage the channel access.",
              "A single active node gets the full channel bandwidth.",
              "The protocol should be simple and cost-effective.",
              "The protocol should be decentralized."
            ],
            ans: 0,
            dispAnswer: "A. A coordinator node should manage the channel access.",
            exp: "وجود عقدة مركزية للتنسيق (<bdi>Coordinator node</bdi>) يمثل نقطة فشل مفردة وعنق زجاجة، بينما بروتوكول <bdi>MAC</bdi> المثالي يفضل أن يكون لا مركزياً وموزعاً بالكامل.",
            placeholder: ""
          },
          {
            id: "p1_q4",
            type: "single",
            text: "Question 4: The FALSE statement about the ARP table is:",
            img: "",
            opts: [
              "The ARP table has entries to all nodes in the LAN.",
              "The ARP table is automatically configured.",
              "The ARP table exists in each host in the network.",
              "An ARP table entry is added only when needed."
            ],
            ans: 0,
            dispAnswer: "A. The ARP table has entries to all nodes in the LAN.",
            exp: "العبارة الخاطئة هي احتواء الجدول على كل الأجهزة في الشبكة؛ حيث يحتوي جدول <bdi>ARP</bdi> فقط على العناوين التي تم التخاطب معها وتخزينها مؤقتاً عند الحاجة.",
            placeholder: ""
          },
          {
            id: "p1_q5",
            type: "single",
            text: "Question 5: The DHCP protocol is:",
            img: "",
            opts: [
              "An application layer protocol.",

            ans: 0,
            dispAnswer: "A. An application layer protocol.",
            exp: "بروتوكول <bdi>DHCP</bdi> يعمل في طبقة التطبيقات (<bdi>Application layer</bdi>) ويستخدم بروتوكول <bdi>UDP</bdi> عبر المنفذين 67 و 68.",
            placeholder: ""
          },
          {

          {

          },
          {
            id: "p1_q8",
            type: "single",
            text: "Question 8: The function that is NOT a cause of extra overhead on the routers used to forward IPv4 datagrams is:",

            ans: 3,
            dispAnswer: "D. The datagram reassembly.",
            exp: "إعادة تجميع الحزم المجزأة (<bdi>Reassembly</bdi>) تتم حصراً في الجهاز النهائي المستقبل وليس على الراوترات الوسيطة إطلاقاً.",

            `).join('');

            interactionHtml = `
              <div class="table-container ltr-content">
                <table class="exam-table">
                  <thead><tr><th>No.</th><th>Questions</th><th>Answer</th></tr></thead>
                  <tbody>${rowsHtml}</tbody>
                </table>
              </div>
              <div class="answer-input-row">
                <button class="btn" id="btn-check-${sub.id}" onclick="checkP2Table()">تحقق من الجدول</button>
                ${imageButtonHtml}
                <button class="btn-reset-q" id="reset-btn-${sub.id}" onclick="resetSubQuestion('${sub.id}')">إعادة السؤال ↻</button>
                <button class="btn-action" onclick="toggleSolution('${sub.id}')">
                  <span>💡</span> عرض الحل
                </button>
              </div>
            `;
          } else if (sub.type === "table_p3") {
            let rowsHtml = [0, 1, 2, 3].map(s => `
              <tr>
                <td style="font-weight:bold; color:var(--apple-blue);">Subnet ${s}</td>
                <td><input type="text" class="table-input" id="p3_sub_${s}" placeholder=""></td>
                <td><input type="text" class="table-input" id="p3_first_${s}" placeholder=""></td>
                <td><input type="text" class="table-input" id="p3_end_${s}" placeholder=""></td>
              </tr>
            `).join('');

            interactionHtml = `
              <div class="table-container ltr-content">
                <table class="exam-table">
                  <thead>
                    <tr><th>Subnet</th><th>Subnet Address (a.b.c.d/x)</th><th>First Usable Address</th><th>Ending (Broadcast) Address</th></tr>
                  </thead>
                  <tbody>${rowsHtml}</tbody>
                </table>
              </div>
              <div class="answer-input-row">
                <button class="btn" id="btn-check-${sub.id}" onclick="checkP3Table()">تحقق من التقسيم</button>
                ${imageButtonHtml}
                <button class="btn-reset-q" id="reset-btn-${sub.id}" onclick="resetSubQuestion('${sub.id}')">إعادة السؤال ↻</button>
                <button class="btn-action" onclick="toggleSolution('${sub.id}')">
                  <span>💡</span> عرض الحل
                </button>
              </div>
            `;
          } else if (sub.type === "table_p4") {
            let steps = [0, 1, 2, 3, 4, 5, 6];
            let rowsHtml = steps.map(s => `
              <tr>
                <td style="font-weight:bold;">${s}</td>
                <td><input type="text" class="table-input" id="p4_n_${s}" placeholder=""></td>
                <td><input type="text" class="table-input" id="p4_b_${s}" placeholder=""></td>
                <td><input type="text" class="table-input" id="p4_c_${s}" placeholder=""></td>
                <td><input type="text" class="table-input" id="p4_d_${s}" placeholder=""></td>
                <td><input type="text" class="table-input" id="p4_e_${s}" placeholder=""></td>
                <td><input type="text" class="table-input" id="p4_f_${s}" placeholder=""></td>
                <td><input type="text" class="table-input" id="p4_g_${s}" placeholder=""></td>
              </tr>
            `).join('');

            interactionHtml = `
              <div class="table-container ltr-content">
                <table class="exam-table">
                  <thead>
                    <tr><th>Step</th><th>N'</th><th>B, p(B)</th><th>C, p(C)</th><th>D, p(D)</th><th>E, p(E)</th><th>F, p(F)</th><th>G, p(G)</th></tr>
                  </thead>
                  <tbody>${rowsHtml}</tbody>
                </table>
              </div>
              <div class="answer-input-row">
                <button class="btn" id="btn-check-${sub.id}" onclick="checkP4Table()">تحقق من الخطوات</button>
                ${imageButtonHtml}
                <button class="btn-reset-q" id="reset-btn-${sub.id}" onclick="resetSubQuestion('${sub.id}')">إعادة السؤال ↻</button>
                <button class="btn-action" onclick="toggleSolution('${sub.id}')">
                  <span>💡</span> عرض الحل
                </button>
              </div>
            `;
          } else if (sub.type === "table_p5") {
            interactionHtml = `
              <div class="table-container ltr-content">
                <table class="exam-table">
                  <thead>
                    <tr><th>a</th><th>X</th><th>b</th><th>c</th><th>d</th><th>Y</th><th>e</th><th>Z</th><th>f</th><th>W</th></tr>
                  </thead>
                  <tbody>
                    <tr>
                      <td><input type="text" class="table-input" id="p5_a" placeholder=""></td>
                      <td><input type="text" class="table-input" id="p5_x" placeholder=""></td>
                      <td><input type="text" class="table-input" id="p5_b" placeholder=""></td>
                      <td><input type="text" class="table-input" id="p5_c" placeholder=""></td>
                      <td><input type="text" class="table-input" id="p5_d" placeholder=""></td>
                      <td><input type="text" class="table-input" id="p5_y" placeholder=""></td>
                      <td><input type="text" class="table-input" id="p5_e" placeholder=""></td>
                      <td><input type="text" class="table-input" id="p5_z" placeholder=""></td>
                      <td><input type="text" class="table-input" id="p5_f" placeholder=""></td>
                      <td><input type="text" class="table-input" id="p5_w" placeholder=""></td>
                    </tr>
                  </tbody>
                </table>
                <table class="exam-table" style="margin-top:10px;">
                  <thead>
                    <tr><th>h</th><th>N</th><th>g</th><th>V</th><th>R</th><th>S</th><th>T</th><th>U</th><th>Q</th><th>L</th></tr>
                  </thead>
                  <tbody>
                    <tr>
                      <td><input type="text" class="table-input" id="p5_h" placeholder=""></td>
                      <td><input type="text" class="table-input" id="p5_n" placeholder=""></td>
                      <td><input type="text" class="table-input" id="p5_g" placeholder=""></td>
                      <td><input type="text" class="table-input" id="p5_v" placeholder=""></td>
                      <td><input type="text" class="table-input" id="p5_r" placeholder=""></td>
                      <td><input type="text" class="table-input" id="p5_s" placeholder=""></td>
                      <td><input type="text" class="table-input" id="p5_t" placeholder=""></td>
                      <td><input type="text" class="table-input" id="p5_u" placeholder=""></td>
                      <td><input type="text" class="table-input" id="p5_q" placeholder=""></td>
                      <td><input type="text" class="table-input" id="p5_l" placeholder=""></td>
                    </tr>
                  </tbody>
                </table>
              </div>
              <div class="answer-input-row">
                <button class="btn" id="btn-check-${sub.id}" onclick="checkP5Table()">تحقق من المتغيرات</button>
                ${imageButtonHtml}
                <button class="btn-reset-q" id="reset-btn-${sub.id}" onclick="resetSubQuestion('${sub.id}')">إعادة السؤال ↻</button>
                <button class="btn-action" onclick="toggleSolution('${sub.id}')">
                  <span>💡</span> عرض الحل
                </button>
              </div>
            `;
          } else {
            interactionHtml = `
              <div class="answer-input-row ltr-content">
                <input type="text" class="text-input-field" id="input-${sub.id}" placeholder="${sub.placeholder || 'Enter answer...'}" onkeydown="if(event.key==='Enter') checkInputAnswer('${sub.id}')">
                ${unitHtml}
                <button class="btn" id="btn-check-${sub.id}" onclick="checkInputAnswer('${sub.id}')">تحقق</button>
                ${imageButtonHtml}
                <button class="btn-reset-q" id="reset-btn-${sub.id}" onclick="resetSubQuestion('${sub.id}')">إعادة السؤال ↻</button>
                <button class="btn-action" onclick="toggleSolution('${sub.id}')">
                  <span>💡</span> عرض الحل
                </button>
              </div>
            `;
          }

          subQuestionsHtml += `
            <div class="sub-question-card ltr-content" id="card-${sub.id}">
              <div class="sub-q-header">${sub.text}</div>
              ${imageContainerHtml}
              ${interactionHtml}
              <div class="solution-box" id="sol-${sub.id}">
                <div><strong>الإجابة النموذجية المعتمدة (Final Answer):</strong></div>
                <div style="margin-top: 6px; font-size: 0.95rem; font-weight: bold; line-height: 1.6; font-family: 'JetBrains Mono', Consolas, monospace; color: #5ac8fa; white-space: pre-wrap;">${escapeHtml(sub.dispAnswer)} ${sub.unit ? escapeHtml(sub.unit) : ''}</div>
                <div style="margin-top: 6px; font-size: 0.88rem; line-height: 1.6; color: var(--text-secondary); direction: rtl; text-align: right; white-space: pre-wrap;">${sub.exp}</div>
              </div>
            </div>
          `;
        });

        card.innerHTML = `
          <div class="ltr-content">
            <div class="parent-q-title">${section.title}</div>
            <div class="parent-q-desc">${section.context}</div>
          </div>
          <div class="sub-list">${subQuestionsHtml}</div>
        `;

        list.appendChild(card);
      });

      calculateScore();
      setupReportModal();
    }

    function toggleOriginalImage(qid) {
      const imgBox = document.getElementById(`img-box-${qid}`);
      const imgEl = document.getElementById(`img-${qid}`);

      if (imgEl && !imgEl.src && imgEl.dataset.src) {
        imgEl.src = imgEl.dataset.src;
      }

      if (imgBox) {
        imgBox.classList.toggle('show');
      }
    }

    function handleImageFallback(imgEl) {
      if (!imgEl.dataset.retried) {
        imgEl.dataset.retried = "1";
        if (imgEl.src.endsWith('.jpg')) {
          imgEl.src = imgEl.src.replace('.jpg', '.png');
        } else if (imgEl.src.endsWith('.png')) {
          imgEl.src = imgEl.src.replace('.png', '.jpg');
        }
      }
    }

    function findSubQuestion(subId) {
      for (const sec of examSections) {
        const found = sec.subQuestions.find(s => s.id === subId);
        if (found) return found;
      }
      return null;
    }

    function selectSingleOption(subId, optIdx) {
      const sub = findSubQuestion(subId);
      const optsBox = document.getElementById(`opts-box-${subId}`);
      const resetBtn = document.getElementById(`reset-btn-${subId}`);
      if (!sub || !optsBox) return;

      optsBox.classList.add('locked');

      const picked = document.getElementById(`opt-${subId}-${optIdx}`);
      if (optIdx === sub.ans) {
        if (picked) picked.classList.add('correct');
        userScores[subId] = true;
      } else {
        if (picked) picked.classList.add('wrong');
        delete userScores[subId];
      }

      if (resetBtn) resetBtn.style.display = 'inline-flex';
      calculateScore();
    }

    function checkInputAnswer(subId) {
      const sub = findSubQuestion(subId);
      const inputEl = document.getElementById(`input-${subId}`);
      const resetBtn = document.getElementById(`reset-btn-${subId}`);
      const checkBtn = document.getElementById(`btn-check-${subId}`);
      if (!sub || !inputEl) return;

      const userVal = inputEl.value.trim();
      if (!userVal) {
        alert("يرجى إدخال إجابة أولاً!");
        return;
      }

      const isCorrect = sub.validate(userVal);
      inputEl.disabled = true;

      if (isCorrect) {
        inputEl.className = 'text-input-field correct';
        userScores[subId] = true;
      } else {
        inputEl.className = 'text-input-field wrong';
        delete userScores[subId];
      }

      if (checkBtn) checkBtn.style.display = 'none';
      if (resetBtn) resetBtn.style.display = 'inline-flex';

      calculateScore();
    }

    function checkP2Table() {
      const subId = "p2_analysis_table";
      const checkBtn = document.getElementById(`btn-check-${subId}`);
      const resetBtn = document.getElementById(`reset-btn-${subId}`);

      const targets = {
        "p2_a": ["15", "14"], "p2_b": ["9", "11"], "p2_c": "2", "p2_d": "2",
        "p2_e": ["6", "5", "8"], "p2_f": ["6", "4"], "p2_g": "2", "p2_h": "5",
        "p2_i": ["10", "7"], "p2_j": "6"
      };

      let allCorrect = true;
      Object.keys(targets).forEach(id => {
        const el = document.getElementById(id);
        if (!el) return;
        el.disabled = true;
        const v = el.value.trim();
        const expected = Array.isArray(targets[id]) ? targets[id] : [targets[id]];
        if (expected.includes(v)) {
          el.className = "table-input correct";
        } else {
          el.className = "table-input wrong";
          allCorrect = false;
        }
      });

      if (allCorrect) userScores[subId] = true;
      else delete userScores[subId];

      if (checkBtn) checkBtn.style.display = 'none';
      if (resetBtn) resetBtn.style.display = 'inline-flex';
      calculateScore();
    }

    function checkP3Table() {
      const subId = "p3_subnet_table";
      const checkBtn = document.getElementById(`btn-check-${subId}`);
      const resetBtn = document.getElementById(`reset-btn-${subId}`);

      const answers = {
        0: { sub: "128.119.40.64/28", first: "128.119.40.65", end: "128.119.40.79" },
        1: { sub: "128.119.40.80/28", first: "128.119.40.81", end: "128.119.40.95" },
        2: { sub: "128.119.40.96/28", first: "128.119.40.97", end: "128.119.40.111" },
        3: { sub: "128.119.40.112/28", first: "128.119.40.113", end: "128.119.40.127" }
      };

      let allCorrect = true;
      [0, 1, 2, 3].forEach(s => {
        const elSub = document.getElementById(`p3_sub_${s}`);
        const elFirst = document.getElementById(`p3_first_${s}`);
        const elEnd = document.getElementById(`p3_end_${s}`);

        const testField = (el, target) => {
          if (!el) return;
          el.disabled = true;
          if (el.value.trim().toLowerCase() === target.toLowerCase()) {
            el.className = "table-input correct";
          } else {
            el.className = "table-input wrong";
            allCorrect = false;
          }
        };

        testField(elSub, answers[s].sub);
        testField(elFirst, answers[s].first);
        testField(elEnd, answers[s].end);
      });

      if (allCorrect) userScores[subId] = true;
      else delete userScores[subId];

      if (checkBtn) checkBtn.style.display = 'none';
      if (resetBtn) resetBtn.style.display = 'inline-flex';
      calculateScore();
    }

    function checkP4Table() {
      const subId = "p4_dijkstra_table";
      const checkBtn = document.getElementById(`btn-check-${subId}`);
      const resetBtn = document.getElementById(`reset-btn-${subId}`);

      let allCorrect = true;
      for (let s = 0; s <= 6; s++) {
        ["n", "b", "c", "d", "e", "f", "g"].forEach(col => {
          const el = document.getElementById(`p4_${col}_${s}`);
          if (el) {
            el.disabled = true;
            if (el.value.trim() !== "") {
              el.className = "table-input correct";
            } else {
              el.className = "table-input";
            }
          }
        });
      }

      userScores[subId] = true;

      if (checkBtn) checkBtn.style.display = 'none';
      if (resetBtn) resetBtn.style.display = 'inline-flex';
      calculateScore();
    }

    function checkP5Table() {
      const subId = "p5_trace_table";
      const checkBtn = document.getElementById(`btn-check-${subId}`);
      const resetBtn = document.getElementById(`reset-btn-${subId}`);

      const targets = {
        "p5_a": "400", "p5_x": "601", "p5_b": "601", "p5_c": "401", "p5_d": "401",
        "p5_y": "701", "p5_e": "701", "p5_z": "402", "p5_f": "403", "p5_w": "801",
        "p5_h": "405", "p5_n": "1201", "p5_g": "901", "p5_v": "402", "p5_r": "405",
        "p5_s": "406", "p5_t": "406", "p5_u": "1201", "p5_q": "408", "p5_l": "408"
      };

      let allCorrect = true;
      Object.keys(targets).forEach(id => {
        const el = document.getElementById(id);
        if (!el) return;
        el.disabled = true;
        const v = el.value.trim().toLowerCase();
        if (v === targets[id]) {
          el.className = "table-input correct";
        } else {
          el.className = "table-input wrong";
          allCorrect = false;
        }
      });

      if (allCorrect) userScores[subId] = true;
      else delete userScores[subId];

      if (checkBtn) checkBtn.style.display = 'none';
      if (resetBtn) resetBtn.style.display = 'inline-flex';
      calculateScore();
    }

    function resetSubQuestion(subId) {
      delete userScores[subId];

      const inputEl = document.getElementById(`input-${subId}`);
      if (inputEl) {
        inputEl.disabled = false;
        inputEl.value = '';
        inputEl.className = 'text-input-field';
        inputEl.focus();
      }

      const optsBox = document.getElementById(`opts-box-${subId}`);
      if (optsBox) {
        optsBox.classList.remove('locked');
      }

      const sub = findSubQuestion(subId);
      if (sub && sub.type === "single") {
        sub.opts.forEach((_, i) => {
          const el = document.getElementById(`opt-${subId}-${i}`);
          if (el) el.className = 'option-item';
        });
      }

      const tableReset = (prefix, keys) => {
        keys.forEach(k => {
          const el = document.getElementById(`${prefix}${k}`);
          if (el) {
            el.disabled = false;
            el.value = '';
            el.className = 'table-input';
          }
        });
      };

      if (subId === "p2_analysis_table") {
        tableReset("p2_", ["a", "b", "c", "d", "e", "f", "g", "h", "i", "j"]);
      }

      if (subId === "p3_subnet_table") {
        [0, 1, 2, 3].forEach(s => {
          tableReset("p3_", [`sub_${s}`, `first_${s}`, `end_${s}`]);
        });
      }

      if (subId === "p4_dijkstra_table") {
        for (let s = 0; s <= 6; s++) {
          tableReset("p4_", [`n_${s}`, `b_${s}`, `c_${s}`, `d_${s}`, `e_${s}`, `f_${s}`, `g_${s}`]);
        }
      }

      if (subId === "p5_trace_table") {
        tableReset("p5_", ["a", "x", "b", "c", "d", "y", "e", "z", "f", "w", "h", "n", "g", "v", "r", "s", "t", "u", "q", "l"]);
      }

      const checkBtn = document.getElementById(`btn-check-${subId}`);
      const resetBtn = document.getElementById(`reset-btn-${subId}`);
      const sol = document.getElementById(`sol-${subId}`);
      const imgBox = document.getElementById(`img-box-${subId}`);

      if (checkBtn) checkBtn.style.display = 'inline-flex';
      if (resetBtn) resetBtn.style.display = 'none';
      if (sol) sol.classList.remove('show');
      if (imgBox) imgBox.classList.remove('show');

      calculateScore();
    }

    function calculateScore() {
      let total = 0;
      let score = 0;
      examSections.forEach(sec => {
        sec.subQuestions.forEach(sub => {
          total++;
          if (userScores[sub.id]) score++;
        });
      });

      const pct = total > 0 ? Math.round((score / total) * 100) : 0;
      const scoreEl = document.getElementById('score');
      if (scoreEl) {
        scoreEl.innerText = `${score} / ${total} (${pct}%)`;
      }
    }

    function toggleSolution(subId) {
      const sol = document.getElementById(`sol-${subId}`);
      if (sol) sol.classList.toggle('show');
    }

    let allShown = false;
    function toggleAllSolutions() {
      allShown = !allShown;
      examSections.forEach(sec => {
        sec.subQuestions.forEach(sub => {
          const sol = document.getElementById(`sol-${sub.id}`);
          if (sol) {
            if (allShown) sol.classList.add('show');
            else sol.classList.remove('show');
          }
        });
      });
    }

    function resetQuiz() {
      userScores = {};
      initQuiz();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function setupReportModal() {
      const openBtn = document.getElementById('openReportBtn');
      const closeBtn = document.getElementById('closeReportBtn');
      const overlay = document.getElementById('reportOverlay');
      const form = document.getElementById('bugReportForm');
      const status = document.getElementById('reportStatus');

      if (!openBtn || !overlay) return;

      openBtn.onclick = () => {
        overlay.classList.add('active');
        overlay.setAttribute('aria-hidden', 'false');
      };

      const closeModal = () => {
        overlay.classList.remove('active');
        overlay.setAttribute('aria-hidden', 'true');
        if (status) status.innerText = '';
      };

      if (closeBtn) closeBtn.onclick = closeModal;

      overlay.onclick = (e) => {
        if (e.target === overlay) closeModal();
      };

      if (form) {
        form.onsubmit = (e) => {
          e.preventDefault();
          const submitBtn = document.getElementById('submitReportBtn');
          if (submitBtn) submitBtn.disabled = true;
          if (status) {
            status.style.color = '#30d158';
            status.innerText = 'تم إرسال البلاغ بنجاح، شكراً لمساعدتك!';
          }
          setTimeout(() => {
            closeModal();
            form.reset();
            if (submitBtn) submitBtn.disabled = false;
          }, 1500);
        };
      }
    }

    initQuiz();
  </script>
  <script src="../transition.js"></script>
</body>
