  <style>
    .bottom-nav-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      margin-top: 36px;
      padding-top: 24px;
      border-top: 1px solid var(--apple-border);
    }
    .btn-bottom-action {
      background: var(--apple-surface);
      border: 1px solid var(--apple-border-strong);
      color: var(--text-primary);
      padding: 12px 26px;
      border-radius: 99px;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.95rem;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      backdrop-filter: blur(20px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      transition: all 0.25s var(--ease-apple);
    }
    .btn-bottom-action:hover {
      background: var(--apple-surface-hover);
      border-color: rgba(255, 255, 255, 0.25);
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
    }
    .btn-bottom-action:active {
      transform: scale(0.96);
    }
    .btn-drive-action {
      background: linear-gradient(135deg, rgba(10, 132, 255, 0.15) 0%, rgba(48, 209, 88, 0.15) 100%);
      border-color: rgba(10, 132, 255, 0.4);
      color: #5ac8fa;
    }
    .btn-drive-action:hover {
      background: var(--apple-blue);
      color: #ffffff;
      border-color: var(--apple-blue);
    }

    .ltr-content {
      direction: ltr;
      text-align: left;
    }

    .parent-q-title {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--apple-blue, #0a84ff);
      margin-bottom: 12px;
      border-bottom: 1px dashed var(--apple-border);
      padding-bottom: 8px;
    }
    .parent-q-desc {
      font-size: 0.98rem;
      line-height: 1.7;
      color: var(--text-primary);
      margin-bottom: 18px;
      white-space: pre-line;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .sub-question-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--apple-border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .sub-q-header {
      font-weight: 700;
      font-size: 0.95rem;
      margin-bottom: 12px;
      color: var(--text-primary);
      line-height: 1.6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .multi-hint {
      font-size: 0.82rem;
      color: #5ac8fa;
      margin-bottom: 8px;
      font-weight: 600;
    }
    .verify-note {
      margin-top: 10px;
      padding: 8px 12px;
      background: rgba(255, 159, 10, 0.1);
      border-right: 3px solid #ff9f0a;
      border-radius: 6px;
      font-size: 0.85rem;
      color: #ff9f0a;
      line-height: 1.6;
      direction: rtl;
      text-align: right;
    }
    .fig-box {
      margin: 10px 0 14px;
      text-align: center;
    }
    .fig-box img {
      max-width: 100%;
      height: auto;
      border-radius: 10px;
      border: 1px solid var(--apple-border);
      background: #fff;
    }

    .options-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin: 12px 0;
    }
    .options-container.locked {
      pointer-events: none;
    }

    .option-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--apple-border);
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
      user-select: none;
    }
    .option-item:hover {
      background: rgba(255, 255, 255, 0.08);
    }
    .option-item.selected {
      background: rgba(10, 132, 255, 0.15);
      border-color: #0a84ff;
    }
    .option-item.correct {
      background: rgba(48, 209, 88, 0.18) !important;
      border-color: #30d158 !important;
      color: #fff;
    }
    .option-item.wrong {
      background: rgba(255, 69, 58, 0.18) !important;
      border-color: #ff453a !important;
      color: #fff;
    }
    .option-item.missed {
      background: rgba(255, 214, 10, 0.16) !important;
      border-color: #ffd60a !important;
      color: #fff;
    }
    .opt-indicator {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 2px solid var(--apple-border-strong);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .option-item.checkbox .opt-indicator {
      border-radius: 4px;
    }
    .option-item.selected .opt-indicator {
      border-color: #0a84ff;
      background: #0a84ff;
    }
    .option-item.correct .opt-indicator {
      border-color: #30d158;
      background: #30d158;
    }
    .option-item.wrong .opt-indicator {
      border-color: #ff453a;
      background: #ff453a;
    }
    .option-item.missed .opt-indicator {
      border-color: #ffd60a;
      background: #ffd60a;
    }

    .answer-input-row {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-top: 12px;
      flex-wrap: wrap;
    }
    .user-ans-input {
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--apple-border-strong);
      color: var(--text-primary);
      padding: 9px 14px;
      border-radius: 10px;
      font-size: 0.95rem;
      outline: none;
      min-width: 200px;
      font-family: 'JetBrains Mono', monospace;
      direction: ltr;
      text-align: left;
    }
    .user-ans-input:focus {
      border-color: var(--apple-blue, #0a84ff);
    }
    .user-ans-input.correct {
      border-color: #30d158 !important;
      background: rgba(48, 209, 88, 0.15) !important;
    }
    .user-ans-input.wrong {
      border-color: #ff453a !important;
      background: rgba(255, 69, 58, 0.15) !important;
    }

    .btn-reset-q {
      display: none;
      background: rgba(255, 69, 58, 0.15);
      color: #ff453a;
      border: 1px solid rgba(255, 69, 58, 0.4);
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.85rem;
      transition: all 0.2s;
    }
    .btn-reset-q:hover {
      background: #ff453a;
      color: #fff;
    }

    .q-image-container {
      display: none;
      margin: 12px 0;
      text-align: center;
    }
    .q-image-container.show {
      display: block;
    }
    .q-original-img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      border: 1px solid var(--apple-border);
      background: #fff;
    }
  </style>

            exp: "نبضات User 1 (الحمراء) بتقع في: الـframe الأول → slot 2، الـframe الثاني → slot 2، الـframe الثالث → slot 3. ونفس النمط بيتكرر بالضبط في الـframes 4، 5، 6 للبت الثاني، وهذا بيأكد إن الكود هو (2, 2, 3).",
            note: "تم استخراج مواقع النبضات من صورة الامتحان بتحليل البكسلات وليس بالتخمين.",
            img: ""
          },
          {
            id: "q7_e",
            type: "fill",
            text: "e) What is the bit stream of User 2?",
            acceptedAnswers: ["10", "1, 0", "1 0", "1,0"],
            dispAnswer: "10",
            exp: "كود User 2 هو (4, 4, 2). بالمرجع: نبضات User 1 بفترة البت '0' موجودة بالنصف الأيمن من الـslot، وبفترة البت '1' بالنصف الأيسر. نبضات User 2 بالفترة الأولى بالنصف الأيسر → bit = 1، وبالفترة الثانية بالنصف الأيمن → bit = 0. إذاً بت ستريم User 2 = \"10\".",
            img: ""
          },
          {
            id: "q7_f",
            type: "fill",
            text: "f) What is the bit duration? (nano-second)",
            acceptedAnswers: ["288", "288ns", "288 ns", "288 nano"],
            dispAnswer: "288 nano-second",
            exp: "النبضة = 12 ns، وبالـPPM الثنائي كل slot بيحتوي موقعين محتملين للنبضة → slot = 2 × 12 = 24 ns. الـframe = 4 slots = 96 ns. مدة البت = 3 frames × 96 = 288 ns.",
            note: "إذا أستاذك بيعتبر الـslot = نبضة واحدة (12 ns) فبتصير مدة البت = 144 ns. راجع طريقة الحساب المعتمدة بالسلايدات.",
            img: ""
          }
        ]
      },
      {
        title: "Question 8",
        context: "Which of the following statements is correct regarding spread spectrum transmission? (check all that apply)",
        subQuestions: [
          {
            id: "q8",
            type: "multi",
            text: "Select all that apply:",
            opts: [
              "The spreading process of the signal applied before the modulation process",
              "It prevents eavesdropping and jamming on the signal",
              "The bandwidth used is usually much larger than needed to allow for redundancy",
              "It provides better power efficiency and performance than baseband transmission",
              "The spectral efficiency is much better than baseband transmission"
            ],
            ans: [0, 1, 2],
            dispAnswer: "الخيارات 1 و 2 و 3",
            exp: "الـspreading بينطبق على الإشارة في الـbaseband قبل عملية الـmodulation، وبيعطي مناعة ضد التنصت والتشويش (LPI / anti-jamming)، وبيستخدم عرض حزمة أكبر بكثير من المطلوب عشان الـredundancy. أما الكفاءة الطيفية (spectral efficiency) فهي أسوأ مش أفضل، وهذا بالضبط ثمن الـspread spectrum.",
            note: "الورقة الأصلية ما فيها علامات مؤشرة لهذا السؤال؛ الإجابة مبنية على تعريفات الـspread spectrum القياسية.",
            img: ""
          }
        ]
      },
      {
        title: "Question 9: CDMA Decoding",
        context: "Users A and B are transmitting data to a receiver using Code Division Multiple Access (CDMA). The code words are C_A = (0, 0, 0, 0) and C_B = (0, 0, 1, 1). The data bits and chip sequences are encoded using Bipolar Non-Return-to-Zero scheme (i.e.; 1 is encoded as 1 and 0 in encoded as -1).\nIf the receiver gets the chip sequence [0, 0, 2, 2 ; 2, 2, 0, 0], then the data bits sent by each user are:",
        subQuestions: [
          {
            id: "q9_a",
            type: "fill",
            text: "User A: (اكتبها هيك: 0, 0 أو 00)",
            acceptedAnswers: ["0, 0", "00", "0,0", "0 0"],
            dispAnswer: "0 , 0",
            exp: "C_A بالـbipolar = [−1, −1, −1, −1]. البت الأول: [0,0,2,2]·C_A = 0+0−2−2 = −4 → /4 = −1 → bit = 0. البت الثاني: [2,2,0,0]·C_A = −2−2+0+0 = −4 → bit = 0.",
            img: ""
          },
          {
            id: "q9_b",
            type: "fill",
            text: "User B: (اكتبها هيك: 1, 0 أو 10)",
            acceptedAnswers: ["1, 0", "10", "1,0", "1 0"],
            dispAnswer: "1 , 0",
            exp: "C_B بالـbipolar = [−1, −1, 1, 1]. البت الأول: [0,0,2,2]·C_B = 0+0+2+2 = +4 → /4 = +1 → bit = 1. البت الثاني: [2,2,0,0]·C_B = −2−2+0+0 = −4 → bit = 0.",
            note: "للتأكد: مجموع الإشارتين المرسلتين فعلاً بيعطي [0,0,2,2 ; 2,2,0,0] بالضبط، فالحل متسق مع المعطيات.",
            img: ""
          }
        ]
      }
    ];

    let userScores = {};
    let selections = {};

    function initQuiz() {
      const driveBtn = document.getElementById('drive-link-btn');
      if (driveBtn) {
        if (originalDriveLink && originalDriveLink.trim() !== "") {
          driveBtn.href = originalDriveLink;
          driveBtn.style.display = "inline-flex";
        } else {
          driveBtn.style.display = "none";
        }
      }

      const list = document.getElementById('quiz-list');
      list.innerHTML = '';

      examSections.forEach((section) => {
        const card = document.createElement('div');
        card.className = 'q-card';

        let subQuestionsHtml = '';
        section.subQuestions.forEach((sub) => {
          const hasImage = sub.img && sub.img.trim() !== "";
          const imageContainerHtml = hasImage ? `
            <div class="q-image-container" id="img-box-${sub.id}">
              <img class="q-original-img"
                   id="img-${sub.id}"
                   data-src="${sub.img}"
                   alt="Question Image ${sub.id}"
                   onerror="handleImageFallback(this)" />
            </div>
          ` : '';

          const imageButtonHtml = hasImage ? `
            <button class="btn-action" onclick="toggleOriginalImage('${sub.id}')">
              <span>📷</span> عرض صورة السؤال الأصلية
            </button>
          ` : '';

          const noteHtml = sub.note ? `<div class="verify-note">📌 ${sub.note}</div>` : '';

          let interactionHtml = '';

          if (sub.type === "fill") {
            interactionHtml = `
              <div class="answer-input-row" id="row-${sub.id}">
                <input type="text"
                       class="user-ans-input"
                       id="input-${sub.id}"
                       placeholder="Type answer..."
                       onkeydown="if(event.key==='Enter') checkFillAnswer('${sub.id}')" />
                <button class="btn" id="btn-check-${sub.id}" onclick="checkFillAnswer('${sub.id}')">تحقق</button>
                <button class="btn-reset-q" id="reset-btn-${sub.id}" onclick="resetSubQuestion('${sub.id}')">إعادة السؤال ↻</button>
                ${imageButtonHtml}
                <button class="btn-action" onclick="toggleSolution('${sub.id}')">
                  <span>💡</span> عرض الحل
                </button>
              </div>
            `;
          } else if (sub.type === "single") {
            const optsHtml = sub.opts.map((opt, i) => `
              <div class="option-item" id="opt-${sub.id}-${i}" onclick="selectSingleOption('${sub.id}', ${i})">
                <div class="opt-indicator"></div>
                <div>${opt}</div>
              </div>
            `).join('');

            interactionHtml = `
              <div class="options-container" id="opts-box-${sub.id}">${optsHtml}</div>
              <div class="answer-input-row">
                <button class="btn-reset-q" id="reset-btn-${sub.id}" onclick="resetSubQuestion('${sub.id}')">إعادة السؤال ↻</button>
                ${imageButtonHtml}
                <button class="btn-action" onclick="toggleSolution('${sub.id}')">
                  <span>💡</span> عرض الحل
                </button>
              </div>
            `;
          } else if (sub.type === "multi") {
            const optsHtml = sub.opts.map((opt, i) => `
              <div class="option-item checkbox" id="opt-${sub.id}-${i}" onclick="toggleMultiOption('${sub.id}', ${i})">
                <div class="opt-indicator"></div>
                <div>${opt}</div>
              </div>
            `).join('');

            interactionHtml = `
              <div class="multi-hint">اختر كل الإجابات الصحيحة (${sub.ans.length} إجابات)</div>
              <div class="options-container" id="opts-box-${sub.id}">${optsHtml}</div>
              <div class="answer-input-row">
                <button class="btn" id="btn-check-${sub.id}" onclick="checkMultiAnswer('${sub.id}')">تحقق من الاختيارات</button>
                <button class="btn-reset-q" id="reset-btn-${sub.id}" onclick="resetSubQuestion('${sub.id}')">إعادة السؤال ↻</button>
                ${imageButtonHtml}
                <button class="btn-action" onclick="toggleSolution('${sub.id}')">
                  <span>💡</span> عرض الحل
                </button>
              </div>
            `;
          }

          subQuestionsHtml += `
            <div class="sub-question-card ltr-content" id="card-${sub.id}">
              <div class="sub-q-header">${sub.text}</div>
              ${imageContainerHtml}
              ${interactionHtml}
              <div class="solution-box" id="sol-${sub.id}">
                <div><strong>الإجابة النموذجية:</strong> ${sub.dispAnswer}</div>
                <div style="margin-top: 6px; font-size: 0.9rem; line-height: 1.6;">${sub.exp}</div>
                ${noteHtml}
              </div>
            </div>
          `;
        });

        const figureHtml = section.figure ? `<div class="fig-box"><img src="${THSS_FIG}" alt="THSS diagram" /></div>` : '';

        card.innerHTML = `
          <div class="ltr-content">
            <div class="parent-q-title">${section.title}</div>
            ${figureHtml}
            <div class="parent-q-desc">${section.context}</div>
          </div>
          <div class="sub-list">${subQuestionsHtml}</div>
        `;

        list.appendChild(card);
      });

      calculateScore();
    }

    function findSubQuestion(subId) {
      for (const sec of examSections) {
        const found = sec.subQuestions.find(s => s.id === subId);
        if (found) return found;
      }
      return null;
    }

    function normalize(str) {
      return str.toLowerCase().replace(/[()\s\-_.]/g, '').replace(/،/g, ',');
    }

    function checkFillAnswer(subId) {
      const sub = findSubQuestion(subId);
      if (!sub) return;

      const inputEl = document.getElementById(`input-${subId}`);
      const checkBtn = document.getElementById(`btn-check-${subId}`);
      const resetBtn = document.getElementById(`reset-btn-${subId}`);
      if (!inputEl) return;

      const rawVal = inputEl.value.trim();
      if (rawVal === "") return;

      const userNorm = normalize(rawVal);
      const isCorrect = sub.acceptedAnswers.some(ans => normalize(ans) === userNorm);

      if (isCorrect) {
        inputEl.className = 'user-ans-input correct';
        userScores[subId] = true;
      } else {
        inputEl.className = 'user-ans-input wrong';
        delete userScores[subId];
      }

      inputEl.disabled = true;
      if (checkBtn) checkBtn.style.display = 'none';
      if (resetBtn) resetBtn.style.display = 'inline-flex';

      calculateScore();
    }

    function selectSingleOption(subId, optIdx) {
      const sub = findSubQuestion(subId);
      const optsBox = document.getElementById(`opts-box-${subId}`);
      const resetBtn = document.getElementById(`reset-btn-${subId}`);
      if (!sub || !optsBox) return;

      optsBox.classList.add('locked');

      const picked = document.getElementById(`opt-${subId}-${optIdx}`);
      if (optIdx === sub.ans) {
        if (picked) picked.classList.add('correct');
        userScores[subId] = true;
      } else {
        if (picked) picked.classList.add('wrong');
        const correctEl = document.getElementById(`opt-${subId}-${sub.ans}`);
        if (correctEl) correctEl.classList.add('missed');
        delete userScores[subId];
      }

      if (resetBtn) resetBtn.style.display = 'inline-flex';

      calculateScore();
    }

    function toggleMultiOption(subId, optIdx) {
      if (!selections[subId]) selections[subId] = new Set();
      const s = selections[subId];

      const itemEl = document.getElementById(`opt-${subId}-${optIdx}`);
      if (s.has(optIdx)) {
        s.delete(optIdx);
        if (itemEl) itemEl.classList.remove('selected');
      } else {
        s.add(optIdx);
        if (itemEl) itemEl.classList.add('selected');
      }
    }

    function checkMultiAnswer(subId) {
      const sub = findSubQuestion(subId);
      const optsBox = document.getElementById(`opts-box-${subId}`);
      const checkBtn = document.getElementById(`btn-check-${subId}`);
      const resetBtn = document.getElementById(`reset-btn-${subId}`);
      if (!sub || !optsBox) return;

      const chosen = selections[subId] || new Set();
      if (chosen.size === 0) return;

      optsBox.classList.add('locked');

      const targetAns = new Set(sub.ans);
      const isIdentical = chosen.size === targetAns.size && [...chosen].every(x => targetAns.has(x));

      // كل خيار مختار: أخضر إذا صح، أحمر إذا غلط
      chosen.forEach(idx => {
        const itemEl = document.getElementById(`opt-${subId}-${idx}`);
        if (itemEl) {
          itemEl.className = 'option-item checkbox ' + (targetAns.has(idx) ? 'correct' : 'wrong');
        }
      });
      // الإجابات الصحيحة اللي المستخدم ما اختارها: أصفر
      targetAns.forEach(idx => {
        if (!chosen.has(idx)) {
          const itemEl = document.getElementById(`opt-${subId}-${idx}`);
          if (itemEl) itemEl.className = 'option-item checkbox missed';
        }
      });

      if (isIdentical) {
        userScores[subId] = true;
      } else {
        delete userScores[subId];
      }

      if (checkBtn) checkBtn.style.display = 'none';
      if (resetBtn) resetBtn.style.display = 'inline-flex';

      calculateScore();
    }

    function resetSubQuestion(subId) {
      const sub = findSubQuestion(subId);
      if (!sub) return;

      delete userScores[subId];

      const optsBox = document.getElementById(`opts-box-${subId}`);
      if (optsBox) {
        optsBox.classList.remove('locked');
      }

      if (sub.type === "single" || sub.type === "multi") {
        sub.opts.forEach((_, i) => {
          const el = document.getElementById(`opt-${subId}-${i}`);
          if (el) {
            el.className = sub.type === "multi" ? 'option-item checkbox' : 'option-item';
          }
        });
        if (selections[subId]) {
          selections[subId].clear();
        }
      }

      if (sub.type === "fill") {
        const inputEl = document.getElementById(`input-${subId}`);
        if (inputEl) {
          inputEl.disabled = false;
          inputEl.value = "";
          inputEl.className = 'user-ans-input';
        }
      }

      const checkBtn = document.getElementById(`btn-check-${subId}`);
      if (checkBtn) checkBtn.style.display = 'inline-flex';

      const resetBtn = document.getElementById(`reset-btn-${subId}`);
      if (resetBtn) resetBtn.style.display = 'none';

      const sol = document.getElementById(`sol-${subId}`);
      if (sol) sol.classList.remove('show');

      calculateScore();
    }

    function toggleOriginalImage(subId) {
      const imgBox = document.getElementById(`img-box-${subId}`);
      const imgEl = document.getElementById(`img-${subId}`);

      if (imgEl && !imgEl.src && imgEl.dataset.src) {
        imgEl.src = imgEl.dataset.src;
      }

      if (imgBox) {
        imgBox.classList.toggle('show');
      }
    }

    function handleImageFallback(imgEl) {
      if (!imgEl.dataset.retried) {
        imgEl.dataset.retried = "1";
        if (imgEl.src.endsWith('.jpg')) {
          imgEl.src = imgEl.src.replace('.jpg', '.png');
        } else if (imgEl.src.endsWith('.png')) {
          imgEl.src = imgEl.src.replace('.png', '.jpg');
        }
      }
    }

    function calculateScore() {
      let total = 0;
      let score = 0;
      examSections.forEach(sec => {
        sec.subQuestions.forEach(sub => {
          total++;
          if (userScores[sub.id]) score++;
        });
      });

      const pct = total > 0 ? Math.round((score / total) * 100) : 0;
      const scoreEl = document.getElementById('score');
      if (scoreEl) {
        scoreEl.innerText = `${score} / ${total} (${pct}%)`;
      }
    }

    function toggleSolution(subId) {
      const sol = document.getElementById(`sol-${subId}`);
      if (sol) sol.classList.toggle('show');
    }

    let allShown = false;
    function toggleAllSolutions() {
      allShown = !allShown;
      examSections.forEach(sec => {
        sec.subQuestions.forEach(sub => {
          const sol = document.getElementById(`sol-${sub.id}`);
          if (sol) {
            if (allShown) sol.classList.add('show');
            else sol.classList.remove('show');
          }
        });
      });
    }

    function resetQuiz() {
      userScores = {};
      selections = {};
      initQuiz();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    initQuiz();
  </script>
  <script src="../transition.js"></script>
</body>
