  <style>
    .bottom-nav-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      margin-top: 36px;
      padding-top: 24px;
      border-top: 1px solid var(--apple-border);
    }
    .btn-bottom-action {
      background: var(--apple-surface);
      border: 1px solid var(--apple-border-strong);
      color: var(--text-primary);
      padding: 12px 26px;
      border-radius: 99px;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.95rem;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      backdrop-filter: blur(20px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      transition: all 0.25s var(--ease-apple);
    }
    .btn-bottom-action:hover {
      background: var(--apple-surface-hover);
      border-color: rgba(255, 255, 255, 0.25);
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
    }
    .btn-bottom-action:active {
      transform: scale(0.96);
    }
    .btn-drive-action {
      background: linear-gradient(135deg, rgba(10, 132, 255, 0.15) 0%, rgba(48, 209, 88, 0.15) 100%);
      border-color: rgba(10, 132, 255, 0.4);
      color: #5ac8fa;
    }
    .btn-drive-action:hover {
      background: var(--apple-blue);
      color: #ffffff;
      border-color: var(--apple-blue);
    }

    .parent-q-title {
      font-size: 1.18rem;
      font-weight: 800;
      color: var(--apple-blue, #0a84ff);
      margin-bottom: 8px;
      border-bottom: 1px dashed var(--apple-border);
      padding-bottom: 8px;
    }
    .parent-q-desc {
      font-size: 0.98rem;
      line-height: 1.7;
      color: var(--text-secondary);
      margin-bottom: 18px;
    }
    .sub-question-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--apple-border);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 18px;
      text-align: right;
      direction: rtl;
    }
    .sub-q-header {
      font-weight: 700;
      font-size: 1.02rem;
      margin-bottom: 14px;
      color: var(--text-primary);
      line-height: 1.7;
    }

    .options-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin: 14px 0;
    }
    .options-container.locked {
      pointer-events: none;
    }

    .option-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 16px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--apple-border);
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
      user-select: none;
      font-size: 0.98rem;
    }
    .option-item:hover {
      background: rgba(255, 255, 255, 0.08);
    }
    .option-item.selected {
      border-color: var(--apple-blue);
      background: rgba(10, 132, 255, 0.12);
    }
    .option-item.correct {
      background: rgba(48, 209, 88, 0.18) !important;
      border-color: #30d158 !important;
      color: #fff;
    }
    .option-item.wrong {
      background: rgba(255, 69, 58, 0.18) !important;
      border-color: #ff453a !important;
      color: #fff;
    }
    .opt-letter {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 0.85rem;
      flex-shrink: 0;
    }

    .answer-input-row {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    .btn-reset-q {
      display: none;
      background: rgba(255, 69, 58, 0.15);
      color: #ff453a;
      border: 1px solid rgba(255, 69, 58, 0.4);
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.85rem;
      transition: all 0.2s;
    }
    .btn-reset-q:hover {
      background: #ff453a;
      color: #fff;
    }
    .solution-box {
      display: none;
      margin-top: 14px;
      padding: 14px 16px;
      background: rgba(10, 132, 255, 0.08);
      border: 1px solid rgba(10, 132, 255, 0.25);
      border-radius: 10px;
    }
    .solution-box.show {
      display: block;
    }
  </style>
</head>

  <!-- زر التبليغ العائم -->
  <button class="btn-bug-float" id="openReportBtn" aria-label="الإبلاغ عن خطأ أو مشكلة">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <rect width="8" height="14" x="8" y="6" rx="4"></rect>
      <path d="m19 7-3 2"></path>
      <path d="m5 7 3 2"></path>
      <path d="m19 19-3-2"></path>
      <path d="m5 19 3-2"></path>
      <path d="M20 13h-4"></path>
      <path d="M4 13h4"></path>
      <path d="m10 4 1 2"></path>
      <path d="m14 4-1 2"></path>
    </svg>
    <span>إبلاغ عن خطأ</span>
  </button>

  <!-- نافذة التبليغ المنبثقة -->
  <div class="report-modal-overlay" id="reportOverlay" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="report-modal">
      <div class="report-modal-header">
        <h3>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          إبلاغ عن خطأ أو ملاحظة
        </h3>
        <button class="btn-close-modal" id="closeReportBtn" aria-label="إغلاق">✕</button>
      </div>

      <form class="report-form" id="bugReportForm">
        <div class="form-group">
          <label for="issue-type">نوع المشكلة</label>
          <select id="issue-type" required>
            <option value="سؤال أو إجابة خاطئة">خطأ في سؤال أو إجابة</option>
            <option value="خلل في التصميم أو الموقع">مشكلة في عرض الصفحة أو الموقع</option>
            <option value="اقتراح أو أخرى">اقتراح / أخرى</option>
          </select>
        </div>

        <div class="form-group">
          <label for="issue-desc">وصف المشكلة <span style="color:var(--apple-red)">*</span></label>
          <textarea id="issue-desc" placeholder="حدد السؤال أو المشكلة بالتفصيل..." required></textarea>
        </div>

        <div class="form-group">
          <label for="user-contact">وسيلة تواصل (اختياري)</label>
          <input type="text" id="user-contact" placeholder="إيميلك أو حسابك للمتابعة">
        </div>

        <button type="submit" class="btn-submit-report" id="submitReportBtn">إرسال البلاغ</button>
        <div class="report-status" id="reportStatus"></div>
      </form>
    </div>
  </div>

  <script>
    // ضع رابط الدرايف هنا ليظهر الزر تلقائياً
    const originalDriveLink = "";

    const letters = ['أ', 'ب', 'ج', 'د'];

    const examSections = [
      {
        title: "القسم الأول: مفاهيم الاتصال والتواصل وعناصره وأنواعه",
        context: "أسئلة السنوات الخاصة بالفرق بين الاتصال والتواصل، عناصر العملية، المعوقات، والأنواع:",
        subQuestions: [
          {
            id: "ar_1",
            type: "single",
            text: "1) نقل المعلومات أو الرسائل من شخص لآخر بهدف التأثير في سلوكه يُعدّ تعريفاً لـ:",
            opts: ["الاتصال", "التواصل", "الكتابة"],
            ans: 0,
            dispAnswer: "أ. الاتصال",
            exp: "الاتصال هو نقل الرسائل والمعلومات من طرف لآخر للتأثير فيه، بينما التواصل يتضمن التفاعل ومشاركة المعاني."
          },
          {
            id: "ar_2",
            type: "single",
            text: "2) عملية إنشاء المعاني ومشاركة الآخرين فيها والتفاعل معها هي:",
            opts: ["الاتصال", "التواصل", "الكتابة"],
            ans: 1,
            dispAnswer: "ب. التواصل",
            exp: "التواصل عملية تفاعلية تشاركية أوسع من مجرد النقل، وترتكز على تبادل الأفكار وبناء المعاني المشتركة."
          },
          {
            id: "ar_3",
            type: "single",
            text: "3) التواصل يقتصر على طرف واحد بالتعبير:",
            opts: ["صح", "خطأ"],
            ans: 1,
            dispAnswer: "ب. خطأ",
            exp: "التواصل لا يقتصر على طرف واحد، بل يشترط وجود طرفين فأكثر وحدوث تفاعل وتغذية راجعة بينهما."
          },
          {
            id: "ar_4",
            type: "single",
            text: "4) الاتصال جزء من عملية التواصل:",
            opts: ["صح", "خطأ"],
            ans: 0,
            dispAnswer: "أ. صح",
            exp: "التواصل مفهوم أشمل وأعم، والاتصال يمثل جانباً وأداة لنقل المعلومات ضمن هذه العملية التشاركية."
          },
          {
            id: "ar_5",
            type: "single",
            text: "5) مما يلي ليست من مهام المرسل:",
            opts: ["تحديد المعنى المراد إرساله", "الاستجابة للرسالة", "التفاعل مع تجاوب المستقبل"],
            ans: 1,
            dispAnswer: "ب. الاستجابة للرسالة",
            exp: "الاستجابة للرسالة هي مهمة المستقبل بعد فك الرموز، وليست من مهام المرسل الأصلية."
          },
          {
            id: "ar_6",
            type: "single",
            text: "6) مما يلي ليست من مكونات الرسالة:",
            opts: ["الكلمات والقواعد اللغوية", "حركات الجسم والصوت", "الانطباع الذي يعطيه المرسل عن نفسه", "التغذية الراجعة"],
            ans: 3,
            dispAnswer: "د. التغذية الراجعة",
            exp: "التغذية الراجعة عنصر مستقل بذاته في عملية الاتصال والتواصل، وليست جزءاً داخلياً من بنية الرسالة."
          },
          {
            id: "ar_7",
            type: "single",
            text: "7) القناة التي تنتقل من خلالها الرسالة كالحواس الخمس هي:",
            opts: ["وسيلة الاتصال", "التغذية الراجعة", "الرسالة"],
            ans: 0,
            dispAnswer: "أ. وسيلة الاتصال",
            exp: "وسيلة أو قناة الاتصال هي الأداة أو الحاسة التي تعبر من خلالها الرسالة من المرسل إلى المستقبل."
          },
          {
            id: "ar_8",
            type: "single",
            text: "8) التشويش النفسي هو عدم فهم المعنى المقصود من الرسالة:",
            opts: ["صح", "خطأ"],
            ans: 1,
            dispAnswer: "ب. خطأ",
            exp: "عدم فهم المعنى المقصود هو تشويش دلالي (Semantic Noise)، أما التشويش النفسي فيتعلق بمشاعر القلق والغضب والتحيز."
          },
          {
            id: "ar_9",
            type: "single",
            text: "9) من معوقات مهارة الاتصال والتواصل المتمثلة باستخدام المرسل لغة أخرى مع المستقبل غير لغة الأم:",
            opts: ["التشويش", "الوسيلة غير الملائمة", "ضعف الخبرة المشتركة"],
            ans: 2,
            dispAnswer: "ج. ضعف الخبرة المشتركة",
            exp: "اختلاف اللغة وعدم فهم دلالاتها يرجع إلى غياب أو ضعف مجال الخبرة والمخزون المشترك بين الطرفين."
          },
          {
            id: "ar_10",
            type: "single",
            text: "10) أي مما يلي مثال على التشويش المادي:",
            opts: ["الحالة المزاجية للمرسل", "الكلمة تحمل أكثر من معنى", "الضوضاء"],
            ans: 2,
            dispAnswer: "ج. الضوضاء",
            exp: "الضوضاء والأصوات البيئية العالية تُمثل تشويشاً مادياً (فيزيائياً) يعيق وصول الصوت أو الرسالة."
          },
          {
            id: "ar_11",
            type: "single",
            text: "11) من أساليب التغذية الراجعة هي أن تكون ردة الفعل مؤجلة (متزامنة):",
            opts: ["صح", "خطأ"],
            ans: 1,
            dispAnswer: "ب. خطأ",
            exp: "ردة الفعل المؤجلة تكون غير متزامنة، أما المتزامنة فهي الفورية والمباشرة."
          },
          {
            id: "ar_12",
            type: "single",
            text: "12) من مميزات الاتصال الذاتي:",
            opts: ["تعدد طرفي الاتصال", "لا يتضمن السرية", "وحدة طرفي الاتصال"],
            ans: 2,
            dispAnswer: "ج. وحدة طرفي الاتصال",
            exp: "في الاتصال الذاتي يكون المرسل والمستقبل شخصاً واحداً (حديث النفس)."
          },
          {
            id: "ar_13",
            type: "single",
            text: "13) عملية التفكير التي يقوم بها الإنسان كاستعادة الذكريات تمثل:",
            opts: ["الاتصال الجماهيري", "الاتصال الذاتي", "الاتصال الشخصي"],
            ans: 1,
            dispAnswer: "ب. الاتصال الذاتي",
            exp: "التفكير، التأمل، ومراجعة الذات واستعادة الذكريات كلها من أشكال الاتصال الذاتي الداخلي."
          },
          {
            id: "ar_14",
            type: "single",
            text: "14) وجود نسق فكري واحد بين المتصلين من مميزات الاتصال:",
            opts: ["الاتصال العام", "الاتصال الجمعي", "الاتصال الشخصي"],
            ans: 1,
            dispAnswer: "ب. الاتصال الجمعي",
            exp: "الاتصال الجمعي (كالندوات أو خطب الجمعة أو المحاضرات التخصصية) يجمع أفراداً يربطهم نسق فكري وثقافي موحد."
          },
          {
            id: "ar_15",
            type: "single",
            text: "15) أحد أنواع الاتصال التي تكون فيه التغذية الراجعة فورية ومباشرة:",
            opts: ["الاتصال الجمعي", "الاتصال الشخصي", "الاتصال الذاتي"],
            ans: 1,
            dispAnswer: "ب. الاتصال الشخصي",
            exp: "الاتصال الشخصي المباشر وجهاً لوجه يتميز بالاستجابة اللحظية والفورية للتغذية الراجعة."
          },
          {
            id: "ar_16",
            type: "single",
            text: "16) من أساليب الاتصال اللغوي اللفظي هي اللغة المنطوقة وهي التي يتجاوز تأثيرها حدود الزمن:",
            opts: ["صح", "خطأ"],
            ans: 1,
            dispAnswer: "ب. خطأ",
            exp: "اللغة المكتوبة هي التي تتجاوز حدود الزمان والمكان بالتخليد والتدوين، بينما المنطوقة تزول بزوال الصوت."
          },
          {
            id: "ar_17",
            type: "single",
            text: "17) واحدة مما يلي من الأمثلة على الاتصال الجمعي:",
            opts: ["المحاضرات العلمية", "تعزيز النفس", "نقد الذات"],
            ans: 0,
            dispAnswer: "أ. المحاضرات العلمية",
            exp: "المحاضرات والدروس في قاعات العلم مثال بارز على الاتصال الجمعي."
          },
          {
            id: "ar_18",
            type: "single",
            text: "18) من خصائص الاتصال غير اللفظي:",
            opts: ["يعتمد على حاسة السمع فقط", "غير خاضع لقواعد اللغة", "يعتمد على الثروة اللغوية"],
            ans: 1,
            dispAnswer: "ب. غير خاضع لقواعد اللغة",
            exp: "الاتصال غير اللفظي (لغة الجسد والإشارات وتعبيرات الوجه) لا يتقيد بقواعد النحو والصرف."
          }
        ]
      },
      {
        title: "القسم الثاني: مهارتا الاستماع والقراءة",
        context: "أسئلة مهارات الاستقبال اللغوي؛ التمييز بين السماع والاستماع، أنواع الاستماع، وأنواع وخصائص القراءة:",
        subQuestions: [
          {
            id: "ar_19",
            type: "single",
            text: "19) المقصود بالاستماع هو:",
            opts: ["مجرد سماع الأصوات دون تركيز", "عملية فيزيائية قد تكون مقصودة أو غير مقصودة", "الانتباه وحسن الإصغاء وفهم مدلول الكلام المسموع"],
            ans: 2,
            dispAnswer: "ج. الانتباه وحسن الإصغاء وفهم مدلول الكلام المسموع",
            exp: "الاستماع نشاط مقصود وواعٍ يتجاوز استقبال الأصوات إلى إدراك المعنى وتحليله."
          },
          {
            id: "ar_20",
            type: "single",
            text: "20) أحد أنواع الاستماع الذي نجده في أحاديثنا العامة وما نصغي إليه في وسائل الإعلام هو:",
            opts: ["الاستماع المحروس", "الاستماع الهامشي", "الاستماع التحليلي"],
            ans: 1,
            dispAnswer: "ب. الاستماع الهامشي",
            exp: "الاستماع الهامشي يكون عابراً على هامش الوعي دون تركيز تفصيلي كما في خلفيات الأخبار والأحاديث اليومية العادية."
          },
          {
            id: "ar_21",
            type: "single",
            text: "21) أحد أنواع الاستماع الذي يتطلب مؤهلات فكرية وعقلية لتحليل أبعاد الرسالة هو:",
            opts: ["الاستماع التحليلي", "الاستماع الاستمتاعي", "الاستماع المحروس"],
            ans: 0,
            dispAnswer: "أ. الاستماع التحليلي",
            exp: "الاستماع التحليلي يتطلب نضجاً فكرياً لتفكيك الحجج وتقويم صحة الأفكار ونقدها."
          },
          {
            id: "ar_22",

    let userScores = {};

    function initQuiz() {
      const driveBtn = document.getElementById('drive-link-btn');
      if (driveBtn) {
        if (originalDriveLink && originalDriveLink.trim() !== "") {
          driveBtn.href = originalDriveLink;
          driveBtn.style.display = "inline-flex";
        } else {
          driveBtn.style.display = "none";
        }
      }

      const list = document.getElementById('quiz-list');
      list.innerHTML = '';

      examSections.forEach((section) => {
        const card = document.createElement('div');
        card.className = 'q-card';

        let subQuestionsHtml = '';
        section.subQuestions.forEach((sub) => {
          const optsHtml = sub.opts.map((opt, i) => `
            <div class="option-item" id="opt-${sub.id}-${i}" onclick="selectSingleOption('${sub.id}', ${i})">
              <div class="opt-letter">${letters[i]}</div>
              <div>${opt}</div>
            </div>
          `).join('');

          const interactionHtml = `
            <div class="options-container" id="opts-box-${sub.id}">${optsHtml}</div>
            <div class="answer-input-row">
              <button class="btn-reset-q" id="reset-btn-${sub.id}" onclick="resetSubQuestion('${sub.id}')">إعادة السؤال ↻</button>
              <button class="btn-action" onclick="toggleSolution('${sub.id}')">
                <span>💡</span> عرض الحل
              </button>
            </div>
          `;

          subQuestionsHtml += `
            <div class="sub-question-card" id="card-${sub.id}">
              <div class="sub-q-header">${sub.text}</div>
              ${interactionHtml}
              <div class="solution-box" id="sol-${sub.id}">
                <div><strong>الإجابة الصحيحة:</strong></div>
                <div style="margin-top: 6px; font-size: 0.98rem; font-weight: bold; line-height: 1.6; color: #5ac8fa;">${sub.dispAnswer}</div>
                <div style="margin-top: 6px; font-size: 0.90rem; line-height: 1.6; color: var(--text-secondary);">${sub.exp}</div>
              </div>
            </div>
          `;
        });

        card.innerHTML = `
          <div>
            <div class="parent-q-title">${section.title}</div>
            <div class="parent-q-desc">${section.context}</div>
          </div>
          <div class="sub-list">${subQuestionsHtml}</div>
        `;

        list.appendChild(card);
      });

      calculateScore();
      setupReportModal();
    }

    function findSubQuestion(subId) {
      for (const sec of examSections) {
        const found = sec.subQuestions.find(s => s.id === subId);
        if (found) return found;
      }
      return null;
    }

    function selectSingleOption(subId, optIdx) {
      const sub = findSubQuestion(subId);
      const optsBox = document.getElementById(`opts-box-${subId}`);
      const resetBtn = document.getElementById(`reset-btn-${subId}`);
      if (!sub || !optsBox) return;

      optsBox.classList.add('locked');

      const picked = document.getElementById(`opt-${subId}-${optIdx}`);
      if (optIdx === sub.ans) {
        if (picked) picked.classList.add('correct');
        userScores[subId] = true;
      } else {
        if (picked) picked.classList.add('wrong');
        const correctOpt = document.getElementById(`opt-${subId}-${sub.ans}`);
        if (correctOpt) correctOpt.classList.add('correct');
        delete userScores[subId];
      }

      if (resetBtn) resetBtn.style.display = 'inline-flex';
      calculateScore();
    }

    function resetSubQuestion(subId) {
      delete userScores[subId];

      const optsBox = document.getElementById(`opts-box-${subId}`);
      if (optsBox) optsBox.classList.remove('locked');

      const sub = findSubQuestion(subId);
      if (sub && sub.opts) {
        sub.opts.forEach((_, i) => {
          const el = document.getElementById(`opt-${subId}-${i}`);
          if (el) el.className = 'option-item';
        });
      }

      const resetBtn = document.getElementById(`reset-btn-${subId}`);
      const sol = document.getElementById(`sol-${subId}`);

      if (resetBtn) resetBtn.style.display = 'none';
      if (sol) sol.classList.remove('show');

      calculateScore();
    }

    function calculateScore() {
      let total = 0;
      let score = 0;
      examSections.forEach(sec => {
        sec.subQuestions.forEach(sub => {
          total++;
          if (userScores[sub.id]) score++;
        });
      });

      const pct = total > 0 ? Math.round((score / total) * 100) : 0;
      const scoreEl = document.getElementById('score');
      if (scoreEl) {
        scoreEl.innerText = `${score} / ${total} (${pct}%)`;
      }
    }

    function toggleSolution(subId) {
      const sol = document.getElementById(`sol-${subId}`);
      if (sol) sol.classList.toggle('show');
    }

    let allShown = false;
    function toggleAllSolutions() {
      allShown = !allShown;
      examSections.forEach(sec => {
        sec.subQuestions.forEach(sub => {
          const sol = document.getElementById(`sol-${sub.id}`);
          if (sol) {
            if (allShown) sol.classList.add('show');
            else sol.classList.remove('show');
          }
        });
      });
    }

    function resetQuiz() {
      userScores = {};
      initQuiz();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function setupReportModal() {
      const openBtn = document.getElementById('openReportBtn');
      const closeBtn = document.getElementById('closeReportBtn');
      const overlay = document.getElementById('reportOverlay');
      const form = document.getElementById('bugReportForm');
      const status = document.getElementById('reportStatus');

      if (!openBtn || !overlay) return;

      openBtn.onclick = () => {
        overlay.classList.add('active');
        overlay.setAttribute('aria-hidden', 'false');
      };

      const closeModal = () => {
        overlay.classList.remove('active');
        overlay.setAttribute('aria-hidden', 'true');
        if (status) status.innerText = '';
      };

      if (closeBtn) closeBtn.onclick = closeModal;

      overlay.onclick = (e) => {
        if (e.target === overlay) closeModal();
      };

      if (form) {
        form.onsubmit = (e) => {
          e.preventDefault();
          const submitBtn = document.getElementById('submitReportBtn');
          if (submitBtn) submitBtn.disabled = true;
          if (status) {
            status.style.color = '#30d158';
            status.innerText = 'تم إرسال البلاغ بنجاح، شكراً لمساعدتك!';
          }
          setTimeout(() => {
            closeModal();
            form.reset();
            if (submitBtn) submitBtn.disabled = false;
          }, 1500);
        };
      }
    }

    initQuiz();
  </script>
