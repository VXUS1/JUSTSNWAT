  <style>
    .bottom-nav-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      margin-top: 36px;
      padding-top: 24px;
      border-top: 1px solid var(--apple-border);
    }
    .btn-bottom-action {
      background: var(--apple-surface);
      border: 1px solid var(--apple-border-strong);
      color: var(--text-primary);
      padding: 12px 26px;
      border-radius: 99px;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.95rem;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      backdrop-filter: blur(20px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      transition: all 0.25s var(--ease-apple);
    }
    .btn-bottom-action:hover {
      background: var(--apple-surface-hover);
      border-color: rgba(255, 255, 255, 0.25);
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
    }
    .btn-bottom-action:active {
      transform: scale(0.96);
    }
    .btn-drive-action {
      background: linear-gradient(135deg, rgba(10, 132, 255, 0.15) 0%, rgba(48, 209, 88, 0.15) 100%);
      border-color: rgba(10, 132, 255, 0.4);
      color: #5ac8fa;
    }
    .btn-drive-action:hover {
      background: var(--apple-blue);
      color: #ffffff;
      border-color: var(--apple-blue);
    }

    .parent-q-title {
      font-size: 1.18rem;
      font-weight: 800;
      color: var(--apple-blue, #0a84ff);
      margin-bottom: 8px;
      border-bottom: 1px dashed var(--apple-border);
      padding-bottom: 8px;
    }
    .parent-q-desc {
      font-size: 0.98rem;
      line-height: 1.7;
      color: var(--text-secondary);
      margin-bottom: 18px;
    }
    .sub-question-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--apple-border);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 18px;
      text-align: right;
      direction: rtl;
    }
    .sub-q-header {
      font-weight: 700;
      font-size: 1.02rem;
      margin-bottom: 14px;
      color: var(--text-primary);
      line-height: 1.7;
    }

    .options-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin: 14px 0;
    }
    .options-container.locked {
      pointer-events: none;
    }

    .option-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 16px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--apple-border);
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
      user-select: none;
      font-size: 0.98rem;
    }
    .option-item:hover {
      background: rgba(255, 255, 255, 0.08);
    }
    .option-item.selected {
      border-color: var(--apple-blue);
      background: rgba(10, 132, 255, 0.12);
    }
    .option-item.correct {
      background: rgba(48, 209, 88, 0.18) !important;
      border-color: #30d158 !important;
      color: #fff;
    }
    .option-item.wrong {
      background: rgba(255, 69, 58, 0.18) !important;
      border-color: #ff453a !important;
      color: #fff;
    }
    .opt-letter {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 0.85rem;
      flex-shrink: 0;
    }

    .answer-input-row {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    .btn-reset-q {
      display: none;
      background: rgba(255, 69, 58, 0.15);
      color: #ff453a;
      border: 1px solid rgba(255, 69, 58, 0.4);
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.85rem;
      transition: all 0.2s;
    }
    .btn-reset-q:hover {
      background: #ff453a;
      color: #fff;
    }
    .solution-box {
      display: none;
      margin-top: 14px;
      padding: 14px 16px;
      background: rgba(10, 132, 255, 0.08);
      border: 1px solid rgba(10, 132, 255, 0.25);
      border-radius: 10px;
    }
    .solution-box.show {
      display: block;
    }
  </style>
</head>

  <!-- زر التبليغ العائم -->
  <button class="btn-bug-float" id="openReportBtn" aria-label="الإبلاغ عن خطأ أو مشكلة">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <rect width="8" height="14" x="8" y="6" rx="4"></rect>
      <path d="m19 7-3 2"></path>
      <path d="m5 7 3 2"></path>

      <path d="m5 19 3-2"></path>
      <path d="M20 13h-4"></path>

  <!-- نافذة التبليغ المنبثقة -->
  <div class="report-modal-overlay" id="reportOverlay" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="report-modal">
      <div class="report-modal-header">
        <h3>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          إبلاغ عن خطأ أو ملاحظة
        </h3>
        <button class="btn-close-modal" id="closeReportBtn" aria-label="إغلاق">✕</button>
      </div>

      <form class="report-form" id="bugReportForm">
        <div class="form-group">
          <label for="issue-type">نوع المشكلة</label>
          <select id="issue-type" required>
            <option value="سؤال أو إجابة خاطئة">خطأ في سؤال أو إجابة</option>
            <option value="خلل في التصميم أو الموقع">مشكلة في عرض الصفحة أو الموقع</option>
            <option value="اقتراح أو أخرى">اقتراح / أخرى</option>
          </select>
        </div>

        <div class="form-group">
          <label for="issue-desc">وصف المشكلة <span style="color:var(--apple-red)">*</span></label>
          <textarea id="issue-desc" placeholder="حدد السؤال أو المشكلة بالتفصيل..." required></textarea>
        </div>

        <div class="form-group">
          <label for="user-contact">وسيلة تواصل (اختياري)</label>
          <input type="text" id="user-contact" placeholder="إيميلك أو حسابك للمتابعة">
        </div>

        <button type="submit" class="btn-submit-report" id="submitReportBtn">إرسال البلاغ</button>
        <div class="report-status" id="reportStatus"></div>
      </form>
    </div>
  </div>

  <script>
    const originalDriveLink = "";

    const letters = ['أ', 'ب', 'ج', 'د'];

    const examSections = [
      {
        title: "القسم الأول: مهارات الكتابة، التعبير الوظيفي، والفنون النثرية والأدبية",
        context: "أسئلة مهارات الكتابة، الفروق بين التعبير الوظيفي والإبداعي، وأشكال النثر الأدبي:",
        subQuestions: [
          {
            id: "f_1",
            type: "single",
            text: "1) تمثل الكتابة لغة نصية عبر استخدام رسومات (حروف) ويمكن بها توثيق النطق ونقل الفكر إلى رموز يمكن قراءتها:",
            opts: ["صح", "خطأ"],
            ans: 0,
            dispAnswer: "أ. صح",
            exp: "الكتابة نظام ترميزي بصري يوثق الأصوات المنطوقة وينقل الأفكار عبر الزمان والمكان."
          },
          {
            id: "f_2",
            type: "single",
            text: "2) أي مما يلي لا يعبّر عن أهمية مهارة الكتابة:",
            opts: [
              "تعد الكتابة سبباً في تقارب الشعوب واختلاط مشاعرهم",
              "الكتابة ليست وسيلة لاتصال الفرد بالآخرين وتضعف الروابط الفكرية بين الأفراد",
              "الكتابة كالسحر في النفس تصل إلى أعماق قلبه وعقله"
            ],
            ans: 1,
            dispAnswer: "ب. الكتابة ليست وسيلة لاتصال الفرد بالآخرين وتضعف الروابط الفكرية بين الأفراد",
            exp: "الكتابة في حقيقتها وسيلة اتصال فعالة توثق الروابط الفكرية والإنسانية بين الأفراد والشعوب."
          },
          {
            id: "f_3",
            type: "single",
            text: "3) يهتم التعبير الوظيفي بتنظيم شؤون الناس ويؤدي وظائف حياتية:",
            opts: ["صح", "خطأ"],
            ans: 0,
            dispAnswer: "أ. صح",
            exp: "التعبير الوظيفي يقضي الحاجات اليومية والإدارية والعملية كالمراسلات والتقارير."
          },
          {
            id: "f_4",
            type: "single",
            text: "4) تعتمد الكتابة الوظيفية على العاطفة والتأثير:",
            opts: ["صح", "خطأ"],
            ans: 1,
            dispAnswer: "ب. خطأ",
            exp: "الكتابة الإبداعية هي التي تعتمد على العاطفة والخيال، أما الوظيفية فتقوم على الوضوح والموضوعية والإيجاز."
          },
          {
            id: "f_5",
            type: "single",
            text: "5) قطعة نثرية محدودة في الطول والموضوع تُكتب بأسلوب لغوي صحيح ومنظم:",
            opts: ["القصة", "الخاطرة", "المقالة الأدبية"],
            ans: 2,
            dispAnswer: "ج. المقالة الأدبية",
            exp: "المقالة فن نثري يعالج فكرة محددة بأسلوب شائق وسليم وبطول معتدل."
          },
          {
            id: "f_6",
            type: "single",
            text: "6) من الخصائص الفنية للمقالة الأدبية:",
            opts: ["الإيجاز وتكثيف المعنى", "الاهتمام بوضوح الفكرة", "ترابط الموضوع وتماسكه", "جميع ما ذكر صحيح"],
            ans: 3,
            dispAnswer: "د. جميع ما ذكر صحيح",
            exp: "تجمع المقالة الأدبية بين وضوح الفكرة وتسلسل الأفكار والترابط والتكثيف."
          },
          {
            id: "f_7",
            type: "single",
            text: "7) من أقدم الفنون الأدبية النثرية في التراث الإنساني والعربي:",
            opts: ["فن القصة", "فن كتابة المسرحية", "فن الرواية"],
            ans: 0,
            dispAnswer: "أ. فن القصة",
            exp: "فن القصة والحكاية أقدم الفنون النثرية التعبيرية للإنسان مقارنة بالرواية والمسرح بشكلهما الحديث."
          },
          {
            id: "f_8",
            type: "single",
            text: "8) فن القصة من أشكال الأدب النثري التي استخدمت بشكل واسع من قبل الكتّاب والأدباء العرب:",
            opts: ["صح", "خطأ"],
            ans: 0,
            dispAnswer: "أ. صح",
            exp: "يزخر التراث العربي بالقصص والحكايات مثل المقامات وحكايات الأمثال وألف ليلة وليلة."
          },
          {
            id: "f_9",
            type: "single",
            text: "9) أحد أكبر أنواع القصص من حيث الحجم وتعدد الشخصيات وتنوع الأحداث وتطورها:",
            opts: ["المسرحية", "الرواية", "المقالة"],
            ans: 1,
            dispAnswer: "ب. الرواية",
            exp: "الرواية تمتاز باتساع نسيجها السردي، وتعدد خيوط الأحداث، وتطور الشخصيات عبر أزمنة ممتدة."
          },
          {
            id: "f_10",
            type: "single",
            text: "10) تتصف الخاطرة بقصرها وإيجازها وكثرة الصور الفنية والمحسنات البديعية:",
            opts: ["صح", "خطأ"],
            ans: 0,
            dispAnswer: "أ. صح",
            exp: "الخاطرة ومضة وجدانية سريعة تتميز بلغة شعرية مكثفة وصور فنية عاطفية."
          },
          {
            id: "f_11",
            type: "single",
            text: "11) فن الشعر هو كلام موزون مقفى يدل على معنى ويتصف بالإبداع والخيال:",
            opts: ["صح", "خطأ"],
            ans: 0,
            dispAnswer: "أ. صح",
            exp: "هذا هو التعريف الكلاسيكي الدقيق للشعر العربي (الكلام الموزون المقفى الدال على معنى)."
          },
          {
            id: "f_12",
            type: "single",
            text: "12) عبارات تمثل خلاصة تجارب الحياة لم تخصص لها قصائد مستقلة وإنما كانت مبثوثة بعفوية في التراث والشعر:",
            opts: ["الرواية", "القصة", "الحِكَم والأمثال العربية"],
            ans: 2,
            dispAnswer: "ج. الحِكَم والأمثال العربية",
            exp: "الأمثال والحكم نتاج تجارب الشعوب وخبراتها المكثفة المركزة."
          },
          {
            id: "f_13",
            type: "single",
            text: "13) أي مما يلي لا تدل على التعبير الوظيفي:",
            opts: ["طلب التوظيف", "الاستدعاء", "كتابة القصص", "السيرة الذاتية"],
            ans: 2,
            dispAnswer: "ج. كتابة القصص",
            exp: "كتابة القصص عمل إبداعي أدبي خيالي، أما الطلب والاستدعاء والسيرة الذاتية فوظيفية."
          },
          {
            id: "f_14",
            type: "single",
            text: "14) الفن الأدبي الذي يشبه القصيدة النثرية في تدفق المشاعر ولغته المكثفة:",
            opts: ["المقالة", "الرواية", "الخاطرة"],
            ans: 2,
            dispAnswer: "ج. الخاطرة",
            exp: "الخاطرة تقترب من الشعر النثري لغلبة الذاتية والموسيقى الداخلية والصور البيانية."
          }
        ]
      },
      {
        title: "القسم الثاني: قصيدة (بانت سعاد) لكعب بن زهير",
        context: "أسئلة التحليل الأدبي، الإعراب، البلاغة، والمعاني في بردة كعب بن زهير:",
        subQuestions: [
          {
            id: "f_15",
            type: "single",
            text: "15) يُعدّ الشاعر كعب بن زهير شاعراً:",
            opts: ["عباسياً", "جاهلياً مخضرماً", "نبطياً"],
            ans: 1,
            dispAnswer: "ب. جاهلياً مخضرماً",
            exp: "كعب بن زهير شاعر مخضرم؛ عاش شطراً طويلاً من حياته في الجاهلية ثم أدرك الإسلام وأسلم بين يدي النبي ﷺ."
          },
          {
            id: "f_16",
            type: "single",
            text: "16) عند انتشار الدعوة الإسلامية سلك كعب طريقاً مشابهاً لطريقة أخيه بُجير الذي أسلم مبكراً:",
            opts: ["صح", "خطأ"],
            ans: 1,
            dispAnswer: "ب. خطأ",
            exp: "تأخر كعب في إسلامه وعاتب أخاه بجيراً وهجا المسلمين، قبل أن يتوب ويأتي مسلماً ومعتذراً."
          },
          {
            id: "f_17",
            type: "single",
            text: "17) عند إسلام كعب بن زهير كساه الرسول ﷺ بردته، واشتراها لاحقاً من ورثته الصحابي:",
            opts: ["عثمان بن عفان", "معاوية بن أبي سفيان", "عمر بن الخطاب"],
            ans: 1,
            dispAnswer: "ب. معاوية بن أبي سفيان",
            exp: "اشترى معاوية رضي الله عنه بردة النبي ﷺ من أبناء كعب بمبلغ كبير وتوارثها الخلفاء."
          },
          {
            id: "f_18",
            type: "single",
            text: "18) معنى كلمة «وَلَعٌ» في قول كعب (فَجْعٌ وَوَلَعٌ وَإِخْلَافٌ وَتَبْدِيلُ):",
            opts: ["المصيبة", "الحب الشديد", "الكذب والتلوّن"],
            ans: 2,
            dispAnswer: "ج. الكذب والتلوّن",
            exp: "الولع في هذا السياق يراد به الكذب وعدم الصدق في القول والوعد."
          },
          {
            id: "f_19",
            type: "single",
            text: "19) افتتح الشاعر كعب بن زهير قصيدته الشهيرة (بانت سعاد) بـ:",
            opts: ["مدح الرسول ﷺ والاعتذار منه مباشرة", "تصوير حالته النفسية وخوفه من القتل", "مقطع غزلي تقليدي يقف فيه على فراق محبوبته"],
            ans: 2,
            dispAnswer: "ج. مقطع غزلي تقليدي يقف فيه على فراق محبوبته",
            exp: "افتتحها على سنن القصيدة العربية القديمة بالغزل وبكاء الفراق: «بَانَتْ سُعَادُ فَقَلْبِي اليَوْمَ مَتْبُولُ»."
          },
          {
            id: "f_20",
            type: "single",
            text: "20) إعراب كلمة «مَتْبُولُ» في: «بَانَتْ سُعَادُ فَقَلْبِي اليَوْمَ مَتْبُولُ»:",
            opts: ["مبتدأ مرفوع", "خبر المبتدأ مرفوع", "نعت مرفوع"],
            ans: 1,
            dispAnswer: "ب. خبر المبتدأ مرفوع",
            exp: "«قلبي»: مبتدأ مرفوع بضمة مقدرة، و«متبولُ»: خبر المبتدأ مرفوع وعلامة رفعه الضمة."
          },
          {
            id: "f_21",
            type: "single",
            text: "21) قول الشاعر في وصفها «غَضِيضُ الطَّرْفِ» يُعدّ كناية عن:",

            dispAnswer: "ج. المقابلة التامة مع السجع المتوازن",
            exp: "تقابل جملتي (ذليل وإن كثرت آماله) مع (قليل وإن جمّ ماله) لفظاً ومعنى وسجعاً."
          },
          {
            id: "f_86",
            type: "single",
            text: "86) الجملة التي اعتبر فيها الكاتب وصيته تجارة ربح وفوز لأولاده:",
            opts: [
              "فَاعْلَمُوا يَا بَنِيَّ بِوَصِيَّةٍ مِنْ نَاصِحٍ جَاهِدٍ",
              "هَذِهِ وَصِيَّتِي الَّتِي أَصْدَرْتُهَا، وَتِجَارَتِي الَّتِي لِرِبْحِكُمْ أَدَرْتُهَا",
              "فَيَا فَوْزَ وَاعِيهَا"
            ],
            ans: 1,
            dispAnswer: "ب. هَذِهِ وَصِيَّتِي الَّتِي أَصْدَرْتُهَا، وَتِجَارَتِي الَّتِي لِرِبْحِكُمْ أَدَرْتُهَا",
            exp: "استعار لفظ التجارة وإدارتها لربحهم للدلالة على القيمة الثمينة للنصيحة الروحية."
          },
          {
            id: "f_87",
            type: "single",
            text: "87) في أسلوب التحذير، المخاطَب الذي يوجَّه إليه التحذير ليتجنب الشر يُسمى:",
            opts: ["المُحَذِّر (بكسر الذال)", "المُحَذَّر (بفتح الذال)", "المُحَذَّر منه"],
            ans: 1,
            dispAnswer: "ب. المُحَذَّر (بفتح الذال)",
            exp: "المُحذِّر (اسم فاعل) هو صاحب التحذير، والمُحذَّر (اسم مفعول) هو الشخص المخاطب."
          },
          {
            id: "f_88",
            type: "single",
            text: "88) الغرض والسر البلاغي من صيغة التصغير في نداء الوالد لولده: ﴿يَا بُنَيَّ﴾:",
            opts: ["التقليل والتحقير", "إظهار المودة الخالصة والتحبب والشفقة والرحمة", "إبراز صغر السن فقط"],
            ans: 1,
            dispAnswer: "ب. إظهار المودة الخالصة والتحبب والشفقة والرحمة",
            exp: "التصغير هنا خرج لغرض التودد والتحبب ولفت قلب الابن للاستجابة للنصح الرشيد."
          }
        ]
      }
    ];

    let userScores = {};

    function initQuiz() {
      const driveBtn = document.getElementById('drive-link-btn');
      if (driveBtn) {
        if (originalDriveLink && originalDriveLink.trim() !== "") {
          driveBtn.href = originalDriveLink;
          driveBtn.style.display = "inline-flex";
        } else {
          driveBtn.style.display = "none";
        }
      }

      const list = document.getElementById('quiz-list');
      list.innerHTML = '';

      examSections.forEach((section) => {
        const card = document.createElement('div');
        card.className = 'q-card';

        let subQuestionsHtml = '';
        section.subQuestions.forEach((sub) => {
          const optsHtml = sub.opts.map((opt, i) => `
            <div class="option-item" id="opt-${sub.id}-${i}" onclick="selectSingleOption('${sub.id}', ${i})">
              <div class="opt-letter">${letters[i]}</div>
              <div>${opt}</div>
            </div>
          `).join('');

          const interactionHtml = `
            <div class="options-container" id="opts-box-${sub.id}">${optsHtml}</div>
            <div class="answer-input-row">
              <button class="btn-reset-q" id="reset-btn-${sub.id}" onclick="resetSubQuestion('${sub.id}')">إعادة السؤال ↻</button>
              <button class="btn-action" onclick="toggleSolution('${sub.id}')">
                <span>💡</span> عرض الحل
              </button>
            </div>
          `;

          subQuestionsHtml += `
            <div class="sub-question-card" id="card-${sub.id}">
              <div class="sub-q-header">${sub.text}</div>
              ${interactionHtml}
              <div class="solution-box" id="sol-${sub.id}">
                <div><strong>الإجابة الصحيحة:</strong></div>
                <div style="margin-top: 6px; font-size: 0.98rem; font-weight: bold; line-height: 1.6; color: #5ac8fa;">${sub.dispAnswer}</div>
                <div style="margin-top: 6px; font-size: 0.90rem; line-height: 1.6; color: var(--text-secondary);">${sub.exp}</div>
              </div>
            </div>
          `;
        });

        card.innerHTML = `
          <div>
            <div class="parent-q-title">${section.title}</div>
            <div class="parent-q-desc">${section.context}</div>
          </div>
          <div class="sub-list">${subQuestionsHtml}</div>
        `;

        list.appendChild(card);
      });

      calculateScore();
      setupReportModal();
    }

    function findSubQuestion(subId) {
      for (const sec of examSections) {
        const found = sec.subQuestions.find(s => s.id === subId);
        if (found) return found;
      }
      return null;
    }

    function selectSingleOption(subId, optIdx) {
      const sub = findSubQuestion(subId);
      const optsBox = document.getElementById(`opts-box-${subId}`);
      const resetBtn = document.getElementById(`reset-btn-${subId}`);
      if (!sub || !optsBox) return;

      optsBox.classList.add('locked');

      const picked = document.getElementById(`opt-${subId}-${optIdx}`);
      if (optIdx === sub.ans) {
        if (picked) picked.classList.add('correct');
        userScores[subId] = true;
      } else {
        if (picked) picked.classList.add('wrong');
        const correctOpt = document.getElementById(`opt-${subId}-${sub.ans}`);
        if (correctOpt) correctOpt.classList.add('correct');
        delete userScores[subId];
      }

      if (resetBtn) resetBtn.style.display = 'inline-flex';
      calculateScore();
    }

    function resetSubQuestion(subId) {
      delete userScores[subId];

      const optsBox = document.getElementById(`opts-box-${subId}`);
      if (optsBox) optsBox.classList.remove('locked');

      const sub = findSubQuestion(subId);
      if (sub && sub.opts) {
        sub.opts.forEach((_, i) => {
          const el = document.getElementById(`opt-${subId}-${i}`);
          if (el) el.className = 'option-item';
        });
      }

      const resetBtn = document.getElementById(`reset-btn-${subId}`);
      const sol = document.getElementById(`sol-${subId}`);

      if (resetBtn) resetBtn.style.display = 'none';
      if (sol) sol.classList.remove('show');

      calculateScore();
    }

    function calculateScore() {
      let total = 0;
      let score = 0;
      examSections.forEach(sec => {
        sec.subQuestions.forEach(sub => {
          total++;
          if (userScores[sub.id]) score++;
        });
      });

      const pct = total > 0 ? Math.round((score / total) * 100) : 0;
      const scoreEl = document.getElementById('score');
      if (scoreEl) {
        scoreEl.innerText = `${score} / ${total} (${pct}%)`;
      }
    }

    function toggleSolution(subId) {
      const sol = document.getElementById(`sol-${subId}`);
      if (sol) sol.classList.toggle('show');
    }

    let allShown = false;
    function toggleAllSolutions() {
      allShown = !allShown;
      examSections.forEach(sec => {
        sec.subQuestions.forEach(sub => {
          const sol = document.getElementById(`sol-${sub.id}`);
          if (sol) {
            if (allShown) sol.classList.add('show');
            else sol.classList.remove('show');
          }
        });
      });
    }

    function resetQuiz() {
      userScores = {};
      initQuiz();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function setupReportModal() {
      const openBtn = document.getElementById('openReportBtn');
      const closeBtn = document.getElementById('closeReportBtn');
      const overlay = document.getElementById('reportOverlay');
      const form = document.getElementById('bugReportForm');
      const status = document.getElementById('reportStatus');

      if (!openBtn || !overlay) return;

      openBtn.onclick = () => {
        overlay.classList.add('active');
        overlay.setAttribute('aria-hidden', 'false');
      };

      const closeModal = () => {
        overlay.classList.remove('active');
        overlay.setAttribute('aria-hidden', 'true');
        if (status) status.innerText = '';
      };

      if (closeBtn) closeBtn.onclick = closeModal;

      overlay.onclick = (e) => {
        if (e.target === overlay) closeModal();
      };

      if (form) {
        form.onsubmit = (e) => {
          e.preventDefault();
          const submitBtn = document.getElementById('submitReportBtn');
          if (submitBtn) submitBtn.disabled = true;
          if (status) {
            status.style.color = '#30d158';
            status.innerText = 'تم إرسال البلاغ بنجاح، شكراً لمساعدتك!';
          }
          setTimeout(() => {
            closeModal();
            form.reset();
            if (submitBtn) submitBtn.disabled = false;
          }, 1500);
        };
      }
    }

    initQuiz();
  </script>
  <script src="../transition.js"></script>
</body>
