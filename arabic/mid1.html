  <style>
    .bottom-nav-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      margin-top: 36px;
      padding-top: 24px;
      border-top: 1px solid var(--apple-border);
    }
    .btn-bottom-action {
      background: var(--apple-surface);
      border: 1px solid var(--apple-border-strong);
      color: var(--text-primary);
      padding: 12px 26px;
      border-radius: 99px;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.95rem;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      backdrop-filter: blur(20px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      transition: all 0.25s var(--ease-apple);
    }
    .btn-bottom-action:hover {
      background: var(--apple-surface-hover);
      border-color: rgba(255, 255, 255, 0.25);
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
    }
    .btn-bottom-action:active {
      transform: scale(0.96);
    }
    .btn-drive-action {
      background: linear-gradient(135deg, rgba(10, 132, 255, 0.15) 0%, rgba(48, 209, 88, 0.15) 100%);
      border-color: rgba(10, 132, 255, 0.4);
      color: #5ac8fa;
    }
    .btn-drive-action:hover {
      background: var(--apple-blue);
      color: #ffffff;
      border-color: var(--apple-blue);
    }

    .parent-q-title {
      font-size: 1.18rem;
      font-weight: 800;
      color: var(--apple-blue, #0a84ff);
      margin-bottom: 8px;
      border-bottom: 1px dashed var(--apple-border);
      padding-bottom: 8px;
    }
    .parent-q-desc {
      font-size: 0.98rem;
      line-height: 1.7;
      color: var(--text-secondary);
      margin-bottom: 18px;
    }
    .sub-question-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--apple-border);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 18px;
      text-align: right;
      direction: rtl;
    }
    .sub-q-header {
      font-weight: 700;
      font-size: 1.02rem;
      margin-bottom: 14px;
      color: var(--text-primary);
      line-height: 1.7;
    }

    .options-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin: 14px 0;
    }
    .options-container.locked {
      pointer-events: none;
    }

    .option-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 16px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--apple-border);
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
      user-select: none;
      font-size: 0.98rem;
    }
    .option-item:hover {
      background: rgba(255, 255, 255, 0.08);
    }
    .option-item.selected {
      border-color: var(--apple-blue);
      background: rgba(10, 132, 255, 0.12);
    }
    .option-item.correct {
      background: rgba(48, 209, 88, 0.18) !important;
      border-color: #30d158 !important;
      color: #fff;
    }
    .option-item.wrong {
      background: rgba(255, 69, 58, 0.18) !important;
      border-color: #ff453a !important;
      color: #fff;
    }
    .opt-letter {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 0.85rem;
      flex-shrink: 0;
    }

    .answer-input-row {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    .btn-reset-q {
      display: none;
      background: rgba(255, 69, 58, 0.15);
      color: #ff453a;
      border: 1px solid rgba(255, 69, 58, 0.4);
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.85rem;
      transition: all 0.2s;
    }
    .btn-reset-q:hover {
      background: #ff453a;
      color: #fff;
    }
    .solution-box {
      display: none;
      margin-top: 14px;
      padding: 14px 16px;
      background: rgba(10, 132, 255, 0.08);
      border: 1px solid rgba(10, 132, 255, 0.25);
      border-radius: 10px;
    }
    .solution-box.show {
      display: block;
    }
  </style>
</head>

  <!-- زر التبليغ العائم -->
  <button class="btn-bug-float" id="openReportBtn" aria-label="الإبلاغ عن خطأ أو مشكلة">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <rect width="8" height="14" x="8" y="6" rx="4"></rect>
      <path d="m19 7-3 2"></path>
      <path d="m5 7 3 2"></path>
      <path d="m19 19-3-2"></path>

  <!-- نافذة التبليغ المنبثقة -->
  <div class="report-modal-overlay" id="reportOverlay" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="report-modal">
      <div class="report-modal-header">
        <h3>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          إبلاغ عن خطأ أو ملاحظة
        </h3>
        <button class="btn-close-modal" id="closeReportBtn" aria-label="إغلاق">✕</button>
      </div>

      <form class="report-form" id="bugReportForm">
        <div class="form-group">
          <label for="issue-type">نوع المشكلة</label>
          <select id="issue-type" required>
            <option value="سؤال أو إجابة خاطئة">خطأ في سؤال أو إجابة</option>
            <option value="خلل في التصميم أو الموقع">مشكلة في عرض الصفحة أو الموقع</option>
            <option value="اقتراح أو أخرى">اقتراح / أخرى</option>
          </select>
        </div>

        <div class="form-group">
          <label for="issue-desc">وصف المشكلة <span style="color:var(--apple-red)">*</span></label>
          <textarea id="issue-desc" placeholder="حدد السؤال أو المشكلة بالتفصيل..." required></textarea>
        </div>

        <div class="form-group">
          <label for="user-contact">وسيلة تواصل (اختياري)</label>
          <input type="text" id="user-contact" placeholder="إيميلك أو حسابك للمتابعة">
        </div>

        <button type="submit" class="btn-submit-report" id="submitReportBtn">إرسال البلاغ</button>
        <div class="report-status" id="reportStatus"></div>
      </form>
    </div>
  </div>

  <script>
    // ضع رابط الدرايف هنا ليظهر الزر تلقائياً
    const originalDriveLink = "";

    const letters = ['أ', 'ب', 'ج', 'د'];

    const examSections = [
      {
        title: "القسم الأول: مهارات الاتصال والتواصل (المفاهيم، العناصر، المعوقات، والأنواع)",
        context: "أسئلة السنوات السابقة المتعلقة بمفهوم الاتصال والتواصل، عناصره، التشويش والمعوقات، والاتصال اللفظي وغير اللفظي:",
        subQuestions: [
          {
            id: "ar_1",
            type: "single",
            text: "1) يُعدّ المستقبل من عناصر الاتصال والتواصل، ومن أبرز مهامه:",
            opts: ["إرسال الرسالة", "فك الرموز وتحليلها إلى معانٍ", "وضع المعاني في رموز لفظية أو غير لفظية", "تحديد المعنى المراد إيصاله"],
            ans: 1,
            dispAnswer: "ب. فك الرموز وتحليلها إلى معانٍ",
            exp: "المستقبل هو متلقي الرسالة، ودوره الأساسي يتمثل في فك الرموز (Decoding) وتحليلها لاستنباط المعاني وفهم قصد المرسل."
          },
          {
            id: "ar_2",
            type: "single",
            text: "2) واحدة من الجمل التالية لا تنطبق على مهارة الاتصال والتواصل:",
            opts: ["عملية عشوائية في طرح الأفكار", "عملية نقل المعلومات المنظمة", "عملية بناء المعاني", "عملية محددة لتنظيم الأفكار"],
            ans: 0,
            dispAnswer: "أ. عملية عشوائية في طرح الأفكار",
            exp: "الاتصال والتواصل عملية إنسانية هادفة ومقصودة ومنظمة تسعى لتحقيق غايات محددة، وليست عملية عشوائية أبداً."
          },
          {
            id: "ar_3",
            type: "single",
            text: "3) من معوقات مهارة الاتصال والتواصل:",
            opts: ["سهولة فك رموز الرسالة", "فاعلية الاستجابة", "وجود نسق فكري واحد بين المتصلين", "التشويش النفسي"],
            ans: 3,
            dispAnswer: "د. التشويش النفسي",
            exp: "التشويش النفسي (كالخوف، التوتر، التحيز، والقلق) يعيق استقبال الرسالة بالشكل السليم ويفسد فهمها."
          },
          {
            id: "ar_4",
            type: "single",
            text: "4) الاتصال الذي يتطلب وجود نسق فكري وقيمي وثقافي واحد بين المتصلين هو الاتصال:",
            opts: ["الجمعي", "الجماهيري", "الشخصي", "الثقافي"],
            ans: 3,
            dispAnswer: "د. الثقافي",
            exp: "الاتصال الثقافي يقوم بالدرجة الأولى على وجود مرجعية فكرية وقيم وأنساق معرفية مشتركة بين أطراف الاتصال لضمان التفاهم."
          },
          {
            id: "ar_5",
            type: "single",
            text: "5) مفهوم التواصل المتعارف عليه بين الدارسين والباحثين هو:",
            opts: ["عملية إنشاء المعاني", "مشاركة الآخرين الأفكار والمعارف", "تبادل الخبرات والتوجيهات بين طرفين فأكثر", "كل ما ذكر صحيح"],
            ans: 3,
            dispAnswer: "د. كل ما ذكر صحيح",
            exp: "التواصل مصطلح تفاعلي شامل يتضمن توليد المعاني، ومشاركة الرؤى، وتبادل الخبرات والمعارف المشتركة."
          },
          {
            id: "ar_6",
            type: "single",
            text: "6) يمكن وصف العملية التواصلية بأنها عملية:",
            opts: ["جزئية محدودة", "لا يشترط فيها تبادل المعلومات بين الطرفين", "شمولية وأكثر عمومية", "ذات طرف واحد فقط"],
            ans: 2,
            dispAnswer: "ج. شمولية وأكثر عمومية",
            exp: "التواصل مفهوم شمولي عام يتسع ليشمل التفاعل النفسي والاجتماعي وتبادل المعاني والتغذية الراجعة، بخلاف النقل الإخباري البسيط."
          },
          {
            id: "ar_7",
            type: "single",
            text: "7) من خصائص الاتصال اللفظي أنه:",
            opts: ["يعتمد على الإيجاز في التعبير", "يتمتع بالمصداقية المطلقة دائماً", "يعتمد على الثروة والحصيلة اللغوية", "عالمي الفهم مهما اختلفت الثقافات"],
            ans: 2,
            dispAnswer: "ج. يعتمد على الثروة والحصيلة اللغوية",
            exp: "الاتصال اللفظي (منطوقاً ومكتوباً) وسيلته الألفاظ والكلمات، وبالتالي يعتمد مباشرة على المخزون اللغوي والقدرة التعبيرية للمتصل."
          },
          {
            id: "ar_8",
            type: "single",
            text: "8) تمتاز مهارة الاتصال بواحدة مما يلي:",
            opts: ["إرسال المعلومات واستقبالها والتفاعل معها", "نقل المعلومات بين المرسل والمستقبل باتجاه واحد فقط", "تقتصر على طرف واحد في التعبير", "انعدام وجود التغذية الراجعة"],
            ans: 0,
            dispAnswer: "أ. إرسال المعلومات واستقبالها والتفاعل معها",
            exp: "الاتصال الفعال عملية دائرية تفاعلية تتضمن بث الرسالة واستقبالها والتفاعل المشترك عبر التغذية الراجعة."
          },
          {
            id: "ar_9",
            type: "single",
            text: "9) من معيقات الاتصال والتواصل عدم فهم المعنى المقصود، ويندرج هذا العائق تحت:",
            opts: ["التشويش الدلالي", "التشويش المادي", "التشويش النفسي", "الوسيلة غير الملائمة"],
            ans: 0,
            dispAnswer: "أ. التشويش الدلالي",
            exp: "التشويش الدلالي (Semantic Noise) يحدث بسبب غموض الكلمات، واختلاف دلالات الألفاظ ومصطلحاتها بين المرسل والمستقبل."
          },
          {
            id: "ar_10",
            type: "single",
            text: "10) العنصر الذي يعطي انطباعاً حقيقياً ومباشراً عن المرسل وحالته النفسية وفكره هو:",
            opts: ["المستقبل", "التغذية الراجعة", "الرسالة", "قناة الاتصال"],
            ans: 2,
            dispAnswer: "ج. الرسالة",
            exp: "محتوى الرسالة، وانتقاء ألفاظها، ونبرتها وطريقة صياغتها هي المرآة التي تعكس حالة المرسل، وعلمه، وأهدافه."
          },
          {
            id: "ar_11",
            type: "single",
            text: "11) الاتصال الذي يتسم بأنه غير خاضع لقواعد اللغة النحوية ويقوم على الإيجاز في التعبير هو:",
            opts: ["الاتصال غير اللفظي", "الاتصال اللفظي", "الاتصال الجمعي", "الاتصال الجماهيري"],
            ans: 0,
            dispAnswer: "أ. الاتصال غير اللفظي",
            exp: "الاتصال غير اللفظي (لغة الجسد، الإيماءات، التواصل البصري) لا يتقيد بقواعد الصرف والنحو، ويتميز بالاختصار وسرعة إيصال الشعور."
          }
        ]
      },
      {
        title: "القسم الثاني: مهارتا الاستماع والقراءة (الأنواع، المستويات، والخصائص)",
        context: "أسئلة الامتحانات حول مستويات القراءة (التحصيلية، الصامتة، التصفحية)، وأنواع الاستماع والسماع وأهدافهما:",
        subQuestions: [
          {
            id: "ar_12",
            type: "single",
            text: "12) القراءة التي يشترط فيها التريث والتأني لفهم ما يُقرأ إجمالاً وتفصيلاً هي القراءة:",
            opts: ["التحصيلية", "الاستكشافية", "الجهرية", "النقدية"],
            ans: 0,
            dispAnswer: "أ. التحصيلية",
            exp: "القراءة التحصيلية تهدف للدراسة واستيعاب المعارف والمعلومات، وتتطلب التريث والتدقيق والربط بين الكليات والجزئيات."
          },
          {
            id: "ar_13",
            type: "single",
            text: "13) الاستماع الذي يتمثل في عدم التركيز على هدف بعينه يُعرف بالاستماع:",
            opts: ["الهامشي", "التحليلي", "الاستمتاعي", "اليقظ"],
            ans: 0,
            dispAnswer: "أ. الهامشي",
            exp: "الاستماع الهامشي (Marginal Listening) استماع عابر على هامش النشاط الذهني دون نية مسبقة للتركيز أو التحليل."
          },
          {
            id: "ar_14",
            type: "single",
            text: "14) زيادة الرغبة في التأمل وتذوق المقروء تُعدّ من أبرز مزايا القراءة:",
            opts: ["السريعة", "الصامتة", "الاستماعية", "الجهرية"],
            ans: 1,
            dispAnswer: "ب. الصامتة",
            exp: "القراءة الصامتة تحرر ذهن القارئ من الانشغال بمخارج الحروف، مما يمنحه فرصة ذهنية أعمق للتأمل الداخلي والتذوق الأدبي."
          },
          {
            id: "ar_15",
            type: "single",
            text: "15) الاستماع الذي يمارسه بعض الأشخاص ليبدي عناية بالمادة المسموعة كالمحاضرات والندوات هو:",
            opts: ["التحليلي النقدي", "المحترس أو اليقظ", "الهامشي", "الاستمتاعي"],
            ans: 1,
            dispAnswer: "ب. المحترس أو اليقظ",
            exp: "الاستماع اليقظ/المحترس (Attentive Listening) يقوم على الانتباه المباشر لمتابعة تسلسل الأفكار والاحتراس من تفويت الشروحات."
          },
          {
            id: "ar_16",
            type: "single",
            text: "16) واحدة من العمليات الآتية تُعدّ عملية أولية بسيطة في القراءة:",
            opts: ["تعلم الحروف ونطقها الصحيح", "فهم المعاني العميقة", "التفكير النقدي واستخلاص النتائج", "استرجاع المفردات من الذاكرة"],
            ans: 0,
            dispAnswer: "أ. تعلم الحروف ونطقها الصحيح",
            exp: "التعرف البصري على شكل الحرف وربطه بالصوت اللغوي يمثل القاعدة الأولية البسيطة لتعلم القراءة، وتليها العمليات الذهنية المعقدة."
          },
          {
            id: "ar_17",
            type: "single",
            text: "17) العمليات المسؤولة عن تذكر واستدعاء الحروف في العملية القرائية هي العمليات:",
            opts: ["الإدراكية", "الثانوية", "الدلالية الكلية", "الأولية البسيطة"],
            ans: 0,
            dispAnswer: "أ. الإدراكية",
            exp: "العمليات الإدراكية (Perceptual processes) تتكفل بتمييز الأشكال المكتوبة وتخزينها في الذاكرة واستدعائها فور رؤية الكلمة."
          },
          {

    let userScores = {};

    function initQuiz() {
      // التحقق من رابط ملف الدرايف وإظهار الزر إذا وُجد
      const driveBtn = document.getElementById('drive-link-btn');
      if (driveBtn) {
        if (originalDriveLink && originalDriveLink.trim() !== "") {
          driveBtn.href = originalDriveLink;
          driveBtn.style.display = "inline-flex";
        } else {
          driveBtn.style.display = "none";
        }
      }

      const list = document.getElementById('quiz-list');
      list.innerHTML = '';

      examSections.forEach((section) => {
        const card = document.createElement('div');
        card.className = 'q-card';

        let subQuestionsHtml = '';
        section.subQuestions.forEach((sub) => {
          const optsHtml = sub.opts.map((opt, i) => `
            <div class="option-item" id="opt-${sub.id}-${i}" onclick="selectSingleOption('${sub.id}', ${i})">
              <div class="opt-letter">${letters[i]}</div>
              <div>${opt}</div>
            </div>
          `).join('');

          const interactionHtml = `
            <div class="options-container" id="opts-box-${sub.id}">${optsHtml}</div>
            <div class="answer-input-row">
              <button class="btn-reset-q" id="reset-btn-${sub.id}" onclick="resetSubQuestion('${sub.id}')">إعادة السؤال ↻</button>
              <button class="btn-action" onclick="toggleSolution('${sub.id}')">
                <span>💡</span> عرض الحل
              </button>
            </div>
          `;

          subQuestionsHtml += `
            <div class="sub-question-card" id="card-${sub.id}">
              <div class="sub-q-header">${sub.text}</div>
              ${interactionHtml}
              <div class="solution-box" id="sol-${sub.id}">
                <div><strong>الإجابة النموذجية (Final Answer):</strong></div>
                <div style="margin-top: 6px; font-size: 0.98rem; font-weight: bold; line-height: 1.6; color: #5ac8fa;">${sub.dispAnswer}</div>
                <div style="margin-top: 6px; font-size: 0.90rem; line-height: 1.6; color: var(--text-secondary);">${sub.exp}</div>
              </div>
            </div>
          `;
        });

        card.innerHTML = `
          <div>
            <div class="parent-q-title">${section.title}</div>
            <div class="parent-q-desc">${section.context}</div>
          </div>
          <div class="sub-list">${subQuestionsHtml}</div>
        `;

        list.appendChild(card);
      });

      calculateScore();
      setupReportModal();
    }

    function findSubQuestion(subId) {
      for (const sec of examSections) {
        const found = sec.subQuestions.find(s => s.id === subId);
        if (found) return found;
      }
      return null;
    }

    function selectSingleOption(subId, optIdx) {
      const sub = findSubQuestion(subId);
      const optsBox = document.getElementById(`opts-box-${subId}`);
      const resetBtn = document.getElementById(`reset-btn-${subId}`);
      if (!sub || !optsBox) return;

      optsBox.classList.add('locked');

      const picked = document.getElementById(`opt-${subId}-${optIdx}`);
      if (optIdx === sub.ans) {
        if (picked) picked.classList.add('correct');
        userScores[subId] = true;
      } else {
        if (picked) picked.classList.add('wrong');
        const correctOpt = document.getElementById(`opt-${subId}-${sub.ans}`);
        if (correctOpt) correctOpt.classList.add('correct');
        delete userScores[subId];
      }

      if (resetBtn) resetBtn.style.display = 'inline-flex';
      calculateScore();
    }

    function resetSubQuestion(subId) {
      delete userScores[subId];

      const optsBox = document.getElementById(`opts-box-${subId}`);
      if (optsBox) optsBox.classList.remove('locked');

      const sub = findSubQuestion(subId);
      if (sub && sub.opts) {
        sub.opts.forEach((_, i) => {
          const el = document.getElementById(`opt-${subId}-${i}`);
          if (el) el.className = 'option-item';
        });
      }

      const resetBtn = document.getElementById(`reset-btn-${subId}`);
      const sol = document.getElementById(`sol-${subId}`);

      if (resetBtn) resetBtn.style.display = 'none';
      if (sol) sol.classList.remove('show');

      calculateScore();
    }

    function calculateScore() {
      let total = 0;
      let score = 0;
      examSections.forEach(sec => {
        sec.subQuestions.forEach(sub => {
          total++;
          if (userScores[sub.id]) score++;
        });
      });

      const pct = total > 0 ? Math.round((score / total) * 100) : 0;
      const scoreEl = document.getElementById('score');
      if (scoreEl) {
        scoreEl.innerText = `${score} / ${total} (${pct}%)`;
      }
    }

    function toggleSolution(subId) {
      const sol = document.getElementById(`sol-${subId}`);
      if (sol) sol.classList.toggle('show');
    }

    let allShown = false;
    function toggleAllSolutions() {
      allShown = !allShown;
      examSections.forEach(sec => {
        sec.subQuestions.forEach(sub => {
          const sol = document.getElementById(`sol-${sub.id}`);
          if (sol) {
            if (allShown) sol.classList.add('show');
            else sol.classList.remove('show');
          }
        });
      });
    }

    function resetQuiz() {
      userScores = {};
      initQuiz();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function setupReportModal() {
      const openBtn = document.getElementById('openReportBtn');
      const closeBtn = document.getElementById('closeReportBtn');
      const overlay = document.getElementById('reportOverlay');
      const form = document.getElementById('bugReportForm');
      const status = document.getElementById('reportStatus');

      if (!openBtn || !overlay) return;

      openBtn.onclick = () => {
        overlay.classList.add('active');
        overlay.setAttribute('aria-hidden', 'false');
      };

      const closeModal = () => {
        overlay.classList.remove('active');
        overlay.setAttribute('aria-hidden', 'true');
        if (status) status.innerText = '';
      };

      if (closeBtn) closeBtn.onclick = closeModal;

      overlay.onclick = (e) => {
        if (e.target === overlay) closeModal();
      };

      if (form) {
        form.onsubmit = (e) => {
          e.preventDefault();
          const submitBtn = document.getElementById('submitReportBtn');
          if (submitBtn) submitBtn.disabled = true;
          if (status) {
            status.style.color = '#30d158';
            status.innerText = 'تم إرسال البلاغ بنجاح، شكراً لمساعدتك!';
          }
          setTimeout(() => {
            closeModal();
            form.reset();
            if (submitBtn) submitBtn.disabled = false;
          }, 1500);
        };
      }
    }
