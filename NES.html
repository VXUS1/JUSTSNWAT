<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>خطة هندسة وأمن شبكات الحاسوب | NES Plan Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-base: #050608;
      --apple-surface: rgba(18, 22, 34, 0.82);
      --apple-surface-hover: rgba(26, 32, 48, 0.95);
      --apple-border: rgba(255, 255, 255, 0.08);
      --apple-border-strong: rgba(255, 255, 255, 0.16);
      
      --apple-red: #ff453a;
      --apple-blue: #0a84ff;
      --apple-green: #30d158;
      --apple-amber: #f59e0b;
      --apple-pink: #ec4899;
      
      --text-primary: #f5f5f7;
      --text-secondary: #8e95a5;
      --ease-apple: cubic-bezier(0.16, 1, 0.3, 1);
      --radius: 16px;
    }

    body.dark-mode {
      --bg-color: var(--bg-base);
      --viewport-bg: radial-gradient(circle at center, #101625 0%, #050608 100%);
      --panel-bg: rgba(14, 18, 28, 0.88);
      --card-bg: rgba(22, 28, 44, 0.96);
      --border-color: var(--apple-border);
      --border-strong: var(--apple-border-strong);
      --text-main: var(--text-primary);
      --text-muted: var(--text-secondary);
      --node-solid-fill: #0d121d;
      --node-text: #f1f5f9;
      --link-color: #334155;
      --glow-intensity: 12px;
      --modal-bg: rgba(14, 18, 28, 0.96);
      --btn-bg: rgba(255, 255, 255, 0.06);

      --c-completed-bg: rgba(48, 209, 88, 0.14);
      --c-completed-text: #30d158;
      --c-current-bg: rgba(10, 132, 255, 0.16);
      --c-current-text: #7dd3fc;
      --c-next-bg: rgba(245, 158, 11, 0.15);
      --c-next-text: #fde68a;
      --c-summer-bg: rgba(236, 72, 153, 0.15);
      --c-summer-text: #fbcfe8;
      --c-next-year-bg: #581c87;
      --c-next-year-text: #ffffff;
      --c-term-2028-bg: #164e63;
      --c-term-2028-text: #ffffff;

      --grid-dot-color: rgba(10, 132, 255, 0.08);
      --accent: #0a84ff;
      --accent-soft: rgba(10, 132, 255, 0.2);
    }

    body.light-mode {
      --bg-color: #f5f5f7;
      --viewport-bg: radial-gradient(circle at center, #ffffff 0%, #e2e8f0 100%);
      --panel-bg: rgba(255, 255, 255, 0.9);
      --card-bg: #ffffff;
      --border-color: rgba(0, 0, 0, 0.08);
      --border-strong: rgba(0, 0, 0, 0.15);
      --text-main: #1d1d1f;
      --text-muted: #6e6e73;
      --node-solid-fill: #ffffff;
      --node-text: #1d1d1f;
      --link-color: #cbd5e1;
      --glow-intensity: 6px;
      --modal-bg: #ffffff;
      --btn-bg: #f1f5f9;

      --c-completed-bg: #d1fae5;
      --c-completed-text: #065f46;
      --c-current-bg: #dbeafe;
      --c-current-text: #1e40af;
      --c-next-bg: #fef3c7;
      --c-next-text: #92400e;
      --c-summer-bg: #fce7f3;
      --c-summer-text: #9d174d;
      --c-next-year-bg: #ede9fe;
      --c-next-year-text: #5b21b6;
      --c-term-2028-bg: #cffafe;
      --c-term-2028-text: #155e75;

      --grid-dot-color: rgba(10, 132, 255, 0.1);
      --accent: #0071e3;
      --accent-soft: rgba(0, 113, 227, 0.12);
    }

    * { box-sizing: border-box; user-select: none; -webkit-touch-callout: none; }
    
    body[dir="rtl"], body[dir="rtl"] * {
      font-family: 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, sans-serif;
    }
    body[dir="ltr"], body[dir="ltr"] * {
      font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    #pctText, #completedHours, #totalHours, #completedCourses, #totalCourses,
    #count-completed, #count-current, #count-next, #count-summer, #count-next-year, #count-term-2028,
    .node-credits {
      font-family: 'IBM Plex Mono', 'Consolas', monospace !important;
      letter-spacing: 0.01em;
    }

    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: var(--bg-color); color: var(--text-main); transition: background-color 0.3s; touch-action: none; position: relative; }

    .ambient-glow {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 800px;
      height: 800px;
      background: radial-gradient(circle, rgba(10, 132, 255, 0.08) 0%, rgba(255, 69, 58, 0.03) 45%, transparent 70%);
      pointer-events: none;
      z-index: 1;
      filter: blur(80px);
    }

    #dashboard {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 100;
      background: var(--panel-bg);
      backdrop-filter: blur(14px);
      border-radius: 18px;
      padding: 14px 20px 16px;
      box-shadow: 0 10px 34px rgba(0,0,0,0.28);
      border: 1px solid var(--border-color);
      border-top: 1px solid var(--accent-soft);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .dash-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }
    .dash-header h2 {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .dash-header h2::before {
      content: "";
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--apple-green);
      box-shadow: 0 0 10px var(--apple-green);
      flex-shrink: 0;
      animation: pulse-dot 2.4s ease-in-out infinite;
    }
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.55; transform: scale(0.8); }
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .toggle-btn {
      background: var(--btn-bg);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 6px 13px;
      border-radius: 20px;
      font-size: 0.78rem;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }
    .toggle-btn:hover { border-color: var(--accent); color: var(--accent); }

    .home-return-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 40px;
      padding: 8px 15px;
      border: 1px solid rgba(10, 132, 255, 0.42);
      border-radius: 22px;
      background: linear-gradient(135deg, #1674d1, #0a84ff);
      box-shadow: 0 5px 16px rgba(10, 132, 255, 0.24);
      color: #ffffff;
      font: inherit;
      font-size: 0.9rem;
      font-weight: 700;
      text-decoration: none;
      white-space: nowrap;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }
    .home-return-btn:hover {
      background: linear-gradient(135deg, #0c65bb, #0878e8);
      box-shadow: 0 7px 20px rgba(10, 132, 255, 0.32);
      transform: translateY(-1px);
    }
    .home-return-btn:focus-visible {
      outline: 3px solid rgba(10, 132, 255, 0.35);
      outline-offset: 3px;
    }

    .home-transition {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: grid;
      place-items: center;
      background: rgba(5, 8, 14, 0.62);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.28s ease, visibility 0.28s ease;
    }
    body.light-mode .home-transition { background: rgba(226, 235, 246, 0.78); }
    .home-transition.is-active { opacity: 1; visibility: visible; }
    .home-transition-content {
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 18px 22px;
      border: 1px solid var(--border-strong);
      border-radius: 16px;
      background: var(--panel-bg);
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.2);
      color: var(--text-main);
      font-weight: 700;
      transform: translateY(8px) scale(0.98);
      transition: transform 0.28s ease;
    }
    .home-transition.is-active .home-transition-content { transform: translateY(0) scale(1); }
    .home-transition-spinner {
      width: 24px;
      height: 24px;
      flex: none;
      border: 3px solid var(--accent-soft);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: home-spin 0.72s linear infinite;
    }
    @keyframes home-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .home-return-btn, .home-transition, .home-transition-content { transition: none; }
      .home-transition-spinner { animation-duration: 1.8s; }
    }

    .collapse-btn {
      display: none;
      width: 30px;
      height: 30px;
      align-items: center;
      justify-content: center;
      background: var(--btn-bg);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      border-radius: 50%;
      font-size: 0.75rem;
      cursor: pointer;
      flex-shrink: 0;
    }

    .stats-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      font-size: 0.76rem;
      align-items: center;
      overflow: hidden;
      max-height: 200px;
      opacity: 1;
      transition: max-height 0.25s ease, opacity 0.2s ease, margin 0.25s ease;
    }
    #dashboard.collapsed .stats-row {
      max-height: 0;
      opacity: 0;
      pointer-events: none;
    }
    .stat-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      background: var(--btn-bg);
      border: 1px solid var(--border-color);
      padding: 4px 10px;
      border-radius: 999px;
    }
    .badge-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex-shrink: 0; }

    .progress-bar-bg {
      width: 100%;
      height: 8px;
      background: var(--border-color);
      border-radius: 6px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #10b981, #0a84ff);
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.8);
      transition: width 0.4s ease;
    }

    #viewport {
      width: 100vw;
      height: 100vh;
      cursor: grab;
      overflow: hidden;
      background-color: var(--bg-color);
      background-image: var(--viewport-bg), radial-gradient(var(--grid-dot-color) 1.5px, transparent 1.5px);
      background-size: 100% 100%, 28px 28px;
      background-position: 0 0, 0 0;
      position: relative;
      z-index: 10;
    }
    #viewport:active { cursor: grabbing; }

    svg#canvas { width: 100%; height: 100%; display: block; }

    .link-solid { stroke: var(--link-color); stroke-width: 2.2; fill: none; transition: stroke 0.2s; }
    .link-dashed { stroke: var(--link-color); stroke-width: 2.2; stroke-dasharray: 6,6; fill: none; transition: stroke 0.2s; }

    .node-group { cursor: pointer; transition: transform 0.15s ease; transform-box: fill-box; transform-origin: center; }

    @media (hover: hover) and (pointer: fine) {
      .node-group:hover { transform: scale(1.045); }
      .node-group:hover .node-circle { stroke-width: 4.5px; }
      .node-group:hover .node-mask { filter: brightness(1.1); }
    }

    .node-mask {
      fill: var(--node-solid-fill);
      stroke: none;
      transition: fill 0.25s ease, filter 0.15s ease;
    }

    .node-circle {
      fill: transparent;
      stroke-width: 3px;
      transition: all 0.2s ease;
    }
    .status-ring {
      fill: none;
      stroke-width: 0px;
      transition: all 0.3s ease;
      pointer-events: none;
    }

    .node-text {
      font-size: 11.5px;
      font-weight: 600;
      text-anchor: middle;
      dominant-baseline: central;
      fill: var(--node-text);
      pointer-events: none;
      transition: fill 0.25s ease;
    }
    .node-credits {
      font-size: 10.5px;
      font-weight: 600;
      text-anchor: middle;
      dominant-baseline: central;
      fill: var(--accent);
      pointer-events: none;
    }

    .ext-text { font-size: 10.5px; font-weight: 500; text-anchor: middle; fill: var(--text-muted); pointer-events: none; }
    
    .status-completed .status-ring { stroke: var(--apple-green); stroke-width: 5px; filter: drop-shadow(0 0 var(--glow-intensity) var(--apple-green)); }
    .status-completed .node-mask { fill: var(--c-completed-bg); }
    .status-completed .node-text { fill: var(--c-completed-text) !important; }

    .status-current .status-ring { stroke: var(--apple-blue); stroke-width: 5px; animation: pulse-current-ring 2.6s ease-in-out infinite; }
    .status-current .node-mask { fill: var(--c-current-bg); }
    .status-current .node-text { fill: var(--c-current-text); }
    @keyframes pulse-current-ring {
      0%, 100% { filter: drop-shadow(0 0 var(--glow-intensity) var(--apple-blue)); }
      50% { filter: drop-shadow(0 0 calc(var(--glow-intensity) * 1.8) var(--apple-blue)); }
    }

    .status-next .status-ring { stroke: var(--apple-amber); stroke-width: 5px; filter: drop-shadow(0 0 var(--glow-intensity) var(--apple-amber)); }
    .status-next .node-mask { fill: var(--c-next-bg); }
    .status-next .node-text { fill: var(--c-next-text); }

    .status-summer .status-ring { stroke: var(--apple-pink); stroke-width: 5px; filter: drop-shadow(0 0 var(--glow-intensity) var(--apple-pink)); }
    .status-summer .node-mask { fill: var(--c-summer-bg); }
    .status-summer .node-text { fill: var(--c-summer-text); }

    .status-next-year .status-ring { stroke: #a855f7; stroke-width: 5px; filter: drop-shadow(0 0 var(--glow-intensity) #a855f7); }
    .status-next-year .node-mask { fill: var(--c-next-year-bg); }
    .status-next-year .node-text { fill: var(--c-next-year-text); }

    .status-term-2028 .status-ring { stroke: #06b6d4; stroke-width: 5px; filter: drop-shadow(0 0 var(--glow-intensity) #06b6d4); }
    .status-term-2028 .node-mask { fill: var(--c-term-2028-bg); }
    .status-term-2028 .node-text { fill: var(--c-term-2028-text); }

    #actionModal {
      position: absolute;
      display: none;
      opacity: 0;
      transform: scale(0.95) translateY(4px);
      transition: opacity 0.15s ease, transform 0.15s ease;
      z-index: 200;
      background: var(--modal-bg);
      border-radius: 16px;
      box-shadow: 0 20px 46px rgba(0,0,0,0.5);
      border: 1px solid var(--border-color);
      padding: 16px;
      padding-top: 18px;
      width: 260px;
      overflow: hidden;
    }
    #actionModal.show { opacity: 1; transform: scale(1) translateY(0); }
    #actionModal::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--apple-blue), var(--apple-green));
    }
    #actionModal h4 { margin: 0 0 12px 0; font-size: 0.92rem; color: var(--accent); text-align: center; font-weight: 700; }
    .btn-status {
      display: block;
      width: 100%;
      text-align: inherit;
      padding: 9px 13px;
      margin-bottom: 6px;
      border: 1px solid transparent;
      border-radius: 9px;
      font-size: 0.83rem;
      cursor: pointer;
      font-weight: 600;
      transition: transform 0.1s, filter 0.15s;
    }
    .btn-status:hover { filter: brightness(1.15); }
    .btn-status:active { transform: scale(0.98); }
    .btn-completed { background: rgba(48, 209, 88, 0.16); color: #30d158; border-color: rgba(48, 209, 88, 0.4); }
    .btn-current { background: rgba(10, 132, 255, 0.16); color: #0a84ff; border-color: rgba(10, 132, 255, 0.4); }
    .btn-next { background: rgba(245, 158, 11, 0.16); color: #f59e0b; border-color: rgba(245, 158, 11, 0.4); }
    .btn-summer { background: rgba(236, 72, 153, 0.16); color: #ec4899; border-color: rgba(236, 72, 153, 0.4); }
    .btn-next-year { background: rgba(168, 85, 247, 0.2); color: #a855f7; border-color: #a855f7; }
    .btn-term-2028 { background: rgba(6, 182, 212, 0.2); color: #06b6d4; border-color: #06b6d4; }
    .btn-reset { background: var(--btn-bg); color: var(--text-muted); }

    .legend-box {
      position: absolute;
      bottom: 16px;
      right: 16px;
      background: var(--panel-bg);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border-color);
      border-bottom: 1px solid var(--accent-soft);
      padding: 10px 16px;
      border-radius: 14px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.25);
      font-size: 0.74rem;
      display: flex;
      flex-direction: column;
      gap: 7px;
      z-index: 100;
    }
    body[dir="ltr"] .legend-box { right: auto; left: 16px; }
    .legend-item { display: flex; align-items: center; gap: 8px; color: var(--text-muted); font-weight: 500; }

    .zoom-controls {
      position: absolute;
      bottom: 16px;
      left: 16px;
      z-index: 100;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    body[dir="ltr"] .zoom-controls { left: auto; right: 16px; }
    .zoom-btn {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: var(--panel-bg);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      font-size: 1.25rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(0,0,0,0.25);
      line-height: 1;
      padding: 0;
    }
    .zoom-btn:active { transform: scale(0.92); }
    .zoom-btn.fit-btn { font-size: 0.95rem; color: var(--accent); }

    @media (max-width: 768px) {
      .ambient-glow { display: none; }
      #dashboard, .zoom-btn, .home-transition {
        -webkit-backdrop-filter: none;
        backdrop-filter: none;
      }
      .status-completed .status-ring,
      .status-current .status-ring,
      .status-next .status-ring,
      .status-summer .status-ring,
      .status-next-year .status-ring,
      .status-term-2028 .status-ring {
        animation: none;
        filter: none;
      }

      #dashboard { padding: 10px 14px; border-radius: 14px; gap: 8px; }
      .dash-header h2 { font-size: 0.92rem; }
      .stats-row { font-size: 0.7rem; gap: 6px; }
      .stat-badge { padding: 3px 8px; }
      .legend-box { display: none; }
      .collapse-btn { display: flex; }
      .zoom-btn { width: 40px; height: 40px; }
      #actionModal {
        position: fixed;
        top: 50% !important;
        left: 50% !important;
        transform: translate(-50%, -50%) scale(0.95);
        width: 85vw;
        max-width: 320px;
      }
      #actionModal.show { transform: translate(-50%, -50%) scale(1); }
    }
  </style>
</head>
<body class="dark-mode" dir="rtl">

  <div class="ambient-glow"></div>
  <div class="home-transition" id="homeTransition" aria-hidden="true">
    <div class="home-transition-content" role="status" aria-live="polite">
      <span class="home-transition-spinner" aria-hidden="true"></span>
      <span id="homeTransitionLabel">جارٍ العودة للرئيسية...</span>
    </div>
  </div>

  <div id="dashboard">
    <div class="dash-header">
      <h2 id="lblTitle">خطة هندسة وأمن شبكات الحاسوب (2022)</h2>
      <div class="header-controls">
        <button class="collapse-btn" onclick="toggleCollapse()" id="collapseBtn" aria-label="Toggle details">▾</button>
        <button class="toggle-btn" onclick="toggleTheme()" id="themeBtn">☀️ White</button>
        <a class="home-return-btn" href="index.html" id="homeReturnBtn" onclick="goHomeWithLoading(event)" aria-label="العودة إلى الصفحة الرئيسية">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m3 10 9-7 9 7"></path><path d="M5 9v11h14V9"></path><path d="M9 20v-6h6v6"></path>
          </svg>
          <span id="homeReturnLabel">الرئيسية</span>
        </a>
        <button class="toggle-btn" onclick="toggleLang()" id="langBtn">🌐 English</button>
      </div>
      <div style="font-size: 0.82rem; color: var(--text-muted);">
        <span id="lblProgress">الإنجاز:</span> 
        <strong id="pctText" style="color: var(--accent);">0%</strong> 
        (<strong id="completedHours">0</strong> / <span id="totalHours">160</span> <span id="lblHoursUnit">ساعة</span>)
        - <span id="completedCourses">0</span> / <span id="totalCourses">0</span> <span id="lblCoursesUnit">مادة</span>
      </div>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-fill" id="progressBar"></div>
    </div>

      { from: 'net_sec',   to: 'net_sec_lab', type: D, s: 'r', e: 'l' },
      { from: 'net_sec_lab', to: 'eth_hack',  type: D, s: 'r', e: 'l' },
      { from: 'net_sec',   to: 'net_protect', type: D, s: 'b', e: 't', m: 1015 },
      { from: 'net_sec',   to: 'dig_foren',   type: D, s: 'b', e: 't', m: 1015 },
      { from: 'net_proto', to: 'net_mgmt',    type: D, s: 'b', e: 't', m: 1015 },
      { from: 'net_proto', to: 'multimedia',  type: D, s: 'b', e: 't', m: 1015 },
      { from: 'wireless',  to: 'iot',         type: D, s: 'b', e: 't', m: 1015 },
      { from: 'wireless',  to: 'wire_lab',    type: D, s: 'b', e: 'r',
        pts: [[620, 1015], [472, 1015], [472, 1090]] },
      { from: 'net_lab',   to: 'wire_lab',    type: D, s: 'b', e: 't', m: 1015 },
      { from: 'proj1',     to: 'proj2',       type: D, s: 'l', e: 'r' }
    ];

    // خطوط جاية من برّا (زي الصورة: حاسوب استدراكي / رياضيات متقطعة / يونكس)
    const extLinks = [
      { to: 'prog1',    e: 'l', type: D, pts: [[378, 88], [378, 170]] },
      { to: 'prob',     e: 'l', type: D, pts: [[700, 655], [700, 690]] },
      { to: 'net_prog', e: 'l', type: D, pts: [[220, 880], [220, 950]] }
    ];

    const linkLabels = [
      { x: 378,  y: 74,  ar: 'حاسوب استدراكي', en: 'Remedial Computer' },
      { x: 435,  y: 104, ar: 'سابق أو متزامن', en: 'Prereq / Co-req' },
      { x: 1020, y: 414, ar: 'سابق أو متزامن', en: 'Prereq / Co-req' },
      { x: 1022, y: 712, ar: 'سابق أو متزامن', en: 'Prereq / Co-req' },
      { x: 700,  y: 648, ar: 'رياضيات متقطعة', en: 'Discrete Math' },
      { x: 175,  y: 893, ar: 'نظام اليونكس',   en: 'Unix System' }
    ];

    function anchorPt(n, side, d) {
      return side === 'r' ? [n.x + d, n.y] : side === 'l' ? [n.x - d, n.y]
           : side === 't' ? [n.x, n.y - d] : [n.x, n.y + d];
    }

    function routeLink(l) {
      if (l.exact && l.pts) return l.pts;
      const P = l.from ? [anchorPt(nodesMap[l.from], l.s, 48)] : [];
      const E = anchorPt(nodesMap[l.to], l.e, ringRadius + 5);
      if (l.pts) {
        P.push(...l.pts);
      } else {
        const A = P[0], vs = l.s === 't' || l.s === 'b', ve = l.e === 't' || l.e === 'b';
        if (vs && ve) {
          if (A[0] !== E[0]) { const m = l.m ?? (A[1] + E[1]) / 2; P.push([A[0], m], [E[0], m]); }
        } else if (!vs && !ve) {
          if (A[1] !== E[1]) { const m = l.m ?? (A[0] + E[0]) / 2; P.push([m, A[1]], [m, E[1]]); }
        } else if (vs) P.push([A[0], E[1]]);
        else P.push([E[0], A[1]]);
      }
      P.push(E);
      return P.filter((p, i) => i === 0 || p[0] !== P[i - 1][0] || p[1] !== P[i - 1][1]);
    }

    // خط بزوايا مدوّرة زي الصورة
    function roundedPath(P, r = 10) {
      let d = `M${P[0][0]} ${P[0][1]}`;
      for (let i = 1; i < P.length - 1; i++) {
        const [p0, p1, p2] = [P[i - 1], P[i], P[i + 1]];
        const l1 = Math.hypot(p1[0] - p0[0], p1[1] - p0[1]);
        const l2 = Math.hypot(p2[0] - p1[0], p2[1] - p1[1]);
        const k = Math.min(r, l1 / 2, l2 / 2);
        d += ` L${p1[0] + (p0[0] - p1[0]) / l1 * k} ${p1[1] + (p0[1] - p1[1]) / l1 * k}` +
             ` Q${p1[0]} ${p1[1]} ${p1[0] + (p2[0] - p1[0]) / l2 * k} ${p1[1] + (p2[1] - p1[1]) / l2 * k}`;
      }
      const L = P[P.length - 1];
      return d + ` L${L[0]} ${L[1]}`;
    }

    function drawLink(l) {
      if (!nodesMap[l.to] || (l.from && !nodesMap[l.from])) return;
      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('d', roundedPath(routeLink(l)));
      path.setAttribute('class', l.type === 'dashed' ? 'link-dashed' : 'link-solid');
      path.setAttribute('marker-end', l.type === 'dashed' ? 'url(#arrow-dashed)' : 'url(#arrow-solid)');
      scene.appendChild(path);
    }

    function drawLinkLabels() {
      linkLabels.forEach(b => {
        const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        t.setAttribute('x', b.x);
        t.setAttribute('y', b.y);
        t.setAttribute('class', 'ext-text');
        t.textContent = currentLang === 'ar' ? b.ar : b.en;
        scene.appendChild(t);
      });
    }

    let userState = JSON.parse(localStorage.getItem('study_graph_state_v5') || '{}');
    let activeCourseId = null;

    const scene = document.getElementById('scene');
    const nodesMap = {};
    nodes.forEach(n => nodesMap[n.id] = n);

    function isMobileDevice() {
      return (window.innerWidth <= 768) || ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
    }

    function applyLangUI() {
      const t = translations[currentLang];
      document.documentElement.lang = currentLang;
      document.body.setAttribute('dir', currentLang === 'ar' ? 'rtl' : 'ltr');

      document.getElementById('lblTitle').innerText = t.title;
      document.getElementById('themeBtn').innerText = currentTheme === 'dark' ? t.themeBtnLight : t.themeBtnDark;
      document.getElementById('homeReturnLabel').innerText = t.homeBtn;
      document.getElementById('homeTransitionLabel').innerText = t.homeLoading;
      document.getElementById('langBtn').innerText = t.langBtn;
      document.getElementById('lblProgress').innerText = t.progress;
      document.getElementById('lblHoursUnit').innerText = t.hoursUnit;
      document.getElementById('lblCoursesUnit').innerText = t.coursesUnit;
      document.getElementById('lblStatusCompleted').innerText = t.stCompleted;
      document.getElementById('lblStatusCurrent').innerText = t.stCurrent;
      document.getElementById('lblStatusNext').innerText = t.stNext;
      document.getElementById('lblStatusSummer').innerText = t.stSummer;
      document.getElementById('lblStatusNextYear').innerText = t.stNextYear;
      document.getElementById('lblStatusTerm2028').innerText = t.stTerm2028;
      
      document.getElementById('lblControlsHint').innerText = isMobileDevice() ? t.hintMobile : t.hintPC;

      document.getElementById('lblLegendTitle').innerText = t.legTitle;
      document.getElementById('lblPrereqPass').innerText = t.legPass;
      document.getElementById('lblPrereqStudy').innerText = t.legStudy;

      document.getElementById('btnMCompleted').innerText = t.mComp;
      document.getElementById('btnMCurrent').innerText = t.mCurr;
      document.getElementById('btnMNext').innerText = t.mNext;
      document.getElementById('btnMSummer').innerText = t.mSumm;
      document.getElementById('btnMNextYear').innerText = t.mNY;
      document.getElementById('btnMTerm2028').innerText = t.mTerm28;
      document.getElementById('btnMReset').innerText = t.mReset;
    }

    function toggleTheme() {
      currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
      document.body.className = `${currentTheme}-mode`;
      localStorage.setItem('study_theme', currentTheme);
      applyLangUI();
    }

    function toggleLang() {
      currentLang = currentLang === 'ar' ? 'en' : 'ar';
      localStorage.setItem('study_lang', currentLang);
      applyLangUI();
      renderDiagram();
    }

    function goHomeWithLoading(event) {
      event.preventDefault();
      const overlay = document.getElementById('homeTransition');
      overlay.classList.add('is-active');
      overlay.setAttribute('aria-hidden', 'false');
      window.setTimeout(() => { window.location.href = 'index.html'; }, 420);
    }

    function renderDiagram() {
      scene.innerHTML = '';

      links.concat(extLinks).forEach(drawLink);
      drawLinkLabels();

      const t = translations[currentLang];
      nodes.forEach(n => {
        const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
        g.setAttribute("class", `node-group status-${userState[n.id] || 'none'}`);
        g.setAttribute("id", `node-${n.id}`);

        let pressTimer = null;
        let isLongPress = false;

        const startPress = (clientX, clientY) => {
          isLongPress = false;
          pressTimer = setTimeout(() => {
            isLongPress = true;
            if (navigator.vibrate) navigator.vibrate(40);
            openModal(clientX, clientY, n);
          }, 450);
        };

        const cancelPress = () => {
          if (pressTimer) clearTimeout(pressTimer);
        };

        g.addEventListener('touchstart', (e) => {
          if (e.touches.length === 1) {
            const touch = e.touches[0];
            startPress(touch.clientX, touch.clientY);
          }
        }, { passive: true });

        g.addEventListener('touchmove', cancelPress, { passive: true });

        g.addEventListener('touchend', (e) => {
          cancelPress();
          if (!isLongPress && e.changedTouches.length === 1) {
            toggleComplete(n.id);
          }
        });

        g.onclick = (e) => {
          e.stopPropagation();
          toggleComplete(n.id);
        };

        g.oncontextmenu = (e) => {
          e.preventDefault();
          e.stopPropagation();
          openModal(e.clientX, e.clientY, n);
        };

        const ring = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        ring.setAttribute("cx", n.x);
        ring.setAttribute("cy", n.y);
        ring.setAttribute("r", ringRadius);
        ring.setAttribute("class", "status-ring");
        g.appendChild(ring);

        const mask = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        mask.setAttribute("cx", n.x);
        mask.setAttribute("cy", n.y);
        mask.setAttribute("r", nodeRadius);
        mask.setAttribute("class", "node-mask");
        g.appendChild(mask);

        const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        circle.setAttribute("cx", n.x);
        circle.setAttribute("cy", n.y);
        circle.setAttribute("r", nodeRadius);
        circle.setAttribute("class", "node-circle");
        circle.setAttribute("stroke", n.stroke);
        g.appendChild(circle);

        const nameText = currentLang === 'ar' ? n.name_ar : n.name_en;
        const lines = nameText.split('\n');
        const lineHeight = 12.5;
        const startY = n.y - ((lines.length) * lineHeight) / 2;

        lines.forEach((txt, idx) => {
          const textEl = document.createElementNS("http://www.w3.org/2000/svg", "text");
          textEl.setAttribute("x", n.x);
          textEl.setAttribute("y", startY + (idx * lineHeight));
          textEl.setAttribute("class", "node-text");
          textEl.textContent = txt;
          g.appendChild(textEl);
        });

        const crEl = document.createElementNS("http://www.w3.org/2000/svg", "text");
        crEl.setAttribute("x", n.x);
        crEl.setAttribute("y", n.y + 28);
        crEl.setAttribute("class", "node-credits");
        crEl.textContent = `${n.cr} ${t.crSuffix}`;
        g.appendChild(crEl);

        scene.appendChild(g);
      });

      updateStats();
    }

    function toggleComplete(courseId) {
      const currentStatus = userState[courseId];
      const newStatus = (currentStatus === 'completed') ? 'none' : 'completed';
      activeCourseId = courseId;
      setCourseStatus(newStatus);
    }

    const modal = document.getElementById('actionModal');
    function openModal(clientX, clientY, node) {
      activeCourseId = node.id;
      const title = currentLang === 'ar' ? node.name_ar.replace(/\n/g, ' ') : node.name_en.replace(/\n/g, ' ');
      document.getElementById('modalCourseTitle').textContent = `${title} (${node.cr} ${translations[currentLang].crSuffix})`;

      modal.style.display = 'block';
      modal.classList.remove('show');

      if (window.innerWidth > 768) {
        let left = clientX + 10;
        let top = clientY + 10;
        if (left + 270 > window.innerWidth) left = clientX - 270;
        if (top + 340 > window.innerHeight) top = clientY - 340;
        modal.style.left = left + 'px';
        modal.style.top = top + 'px';
      }

      requestAnimationFrame(() => modal.classList.add('show'));
    }

    function hideModal() {
      modal.classList.remove('show');
      modal.style.display = 'none';
    }

    window.onclick = function(e) {
      if (!e.target.closest('#actionModal')) {
        hideModal();
      }
    };

    window.addEventListener('touchstart', (e) => {
      if (!e.target.closest('#actionModal') && !e.target.closest('.node-group')) {
        hideModal();
      }
    }, { passive: true });

    function setCourseStatus(status) {
      if (!activeCourseId) return;
      if (status === 'none') {
        delete userState[activeCourseId];
      } else {
        userState[activeCourseId] = status;
      }
      localStorage.setItem('study_graph_state_v5', JSON.stringify(userState));

      const nodeEl = document.getElementById(`node-${activeCourseId}`);
      if (nodeEl) {
        nodeEl.setAttribute('class', `node-group status-${status}`);
      }

      updateStats();
      hideModal();
    }

    function updateStats() {
      const counts = { completed: 0, current: 0, next: 0, summer: 0, nextYear: 0, term2028: 0 };
      const hours = { completed: 0, current: 0, next: 0, summer: 0, nextYear: 0, term2028: 0 };
      const totalDegreeHours = 160;

      nodes.forEach(n => {
        const s = userState[n.id];
        if (s && counts[s] !== undefined) {
          counts[s]++;
          hours[s] += n.cr;
        } else if (s === 'next-year') {
          counts.nextYear++;
          hours.nextYear += n.cr;
        } else if (s === 'term-2028') {
          counts.term2028++;
          hours.term2028 += n.cr;
        }
      });

      const t = translations[currentLang];
      document.getElementById('totalCourses').innerText = nodes.length;
      document.getElementById('completedCourses').innerText = counts.completed;
      document.getElementById('totalHours').innerText = totalDegreeHours;
      document.getElementById('completedHours').innerText = hours.completed;

      document.getElementById('count-completed').innerText = `${hours.completed} ${t.crSuffix} (${counts.completed})`;
      document.getElementById('count-current').innerText = `${hours.current} ${t.crSuffix} (${counts.current})`;
      document.getElementById('count-next').innerText = `${hours.next} ${t.crSuffix} (${counts.next})`;
      document.getElementById('count-summer').innerText = `${hours.summer} ${t.crSuffix} (${counts.summer})`;
      document.getElementById('count-next-year').innerText = `${hours.nextYear} ${t.crSuffix} (${counts.nextYear})`;
      document.getElementById('count-term-2028').innerText = `${hours.term2028} ${t.crSuffix} (${counts.term2028})`;

      const pct = Math.round((hours.completed / totalDegreeHours) * 100);
      document.getElementById('pctText').innerText = pct + '%';
      document.getElementById('progressBar').style.width = pct + '%';
    }

    let isPanning = false;
    let startX = 0, startY = 0;
    let currentX = 15, currentY = 100, scale = 0.65;
    let initialPinchDist = null;
    let initialPinchScale = 1;
    let pinchAnchorScreen = null;
    let pinchAnchorScene = null;
    const MIN_SCALE = 0.15, MAX_SCALE = 2.5;
    let fitTimeout = null;
    let transformFrame = null;

    function applyTransform() {
      scene.setAttribute("transform", `translate(${currentX}, ${currentY}) scale(${scale})`);
    }

    function scheduleTransform() {
      if (transformFrame !== null) return;
      transformFrame = requestAnimationFrame(() => {
        transformFrame = null;
        applyTransform();
      });
    }

    function animatedTransform() {
      scene.style.transition = 'transform 0.32s cubic-bezier(0.22,1,0.36,1)';
      applyTransform();
      clearTimeout(fitTimeout);
      fitTimeout = setTimeout(() => { scene.style.transition = ''; }, 340);
    }

    function zoomAround(screenX, screenY, newScale) {
      newScale = Math.min(Math.max(MIN_SCALE, newScale), MAX_SCALE);
      const sceneX = (screenX - currentX) / scale;
      const sceneY = (screenY - currentY) / scale;
      currentX = screenX - sceneX * newScale;
      currentY = screenY - sceneY * newScale;
      scale = newScale;
    }

    function zoomStep(dir) {
      const vw = viewport.clientWidth, vh = viewport.clientHeight;
      zoomAround(vw / 2, vh / 2, scale * (dir > 0 ? 1.28 : 0.78));
      animatedTransform();
    }

    function getGraphBounds() {
      let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
      nodes.forEach(n => {
        minX = Math.min(minX, n.x - ringRadius - 6);
        maxX = Math.max(maxX, n.x + ringRadius + 6);
        minY = Math.min(minY, n.y - ringRadius - 20);
        maxY = Math.max(maxY, n.y + ringRadius + 34);
      });
      return { minX, maxX, minY, maxY };
    }

    function centerOn(targetX, targetY, targetScale, animate) {
      const vw = viewport.clientWidth, vh = viewport.clientHeight;
      const headerH = document.getElementById('dashboard').getBoundingClientRect().height;
      const availTop = headerH + 16;
      const availH = Math.max(120, vh - availTop - 16);
      scale = Math.min(Math.max(MIN_SCALE, targetScale), MAX_SCALE);
      currentX = vw / 2 - targetX * scale;
      currentY = availTop + availH / 2 - targetY * scale;
      if (animate) animatedTransform(); else applyTransform();
    }

    function fitToScreen(animate) {
      const b = getGraphBounds();
      const graphW = b.maxX - b.minX;
      const graphH = b.maxY - b.minY;
      const vw = viewport.clientWidth, vh = viewport.clientHeight;
      const headerH = document.getElementById('dashboard').getBoundingClientRect().height;
      const pad = 20;
      const availW = Math.max(100, vw - pad * 2);
      const availH = Math.max(100, vh - headerH - pad * 2 - 12);
      const fitScale = Math.min(availW / graphW, availH / graphH);
      const midX = (b.minX + b.maxX) / 2;
      const midY = (b.minY + b.maxY) / 2;
      centerOn(midX, midY, fitScale, animate);
    }

    function mobileFocusScale() {
      const vw = viewport.clientWidth;
      return Math.min(1.05, Math.max(0.55, vw / 480));
    }

    function initialMobileView() {
      const activeNodes = nodes.filter(n => userState[n.id] === 'current');
      let tx, ty;
      if (activeNodes.length) {
        tx = activeNodes.reduce((s, n) => s + n.x, 0) / activeNodes.length;
        ty = activeNodes.reduce((s, n) => s + n.y, 0) / activeNodes.length;
      } else {
        tx = 700; ty = 170;
      }
      centerOn(tx, ty, mobileFocusScale(), false);
    }

    function toggleCollapse() {
      const dash = document.getElementById('dashboard');
      dash.classList.toggle('collapsed');
      document.getElementById('collapseBtn').textContent = dash.classList.contains('collapsed') ? '▾' : '▴';
    }

    const viewport = document.getElementById('viewport');

    viewport.addEventListener('mousedown', (e) => {
      if (e.target.closest('.node-group') || e.button !== 0) return;
      isPanning = true;
      startX = e.clientX - currentX;
      startY = e.clientY - currentY;
    });

    window.addEventListener('mousemove', (e) => {
      if (!isPanning) return;
      currentX = e.clientX - startX;
      currentY = e.clientY - startY;
      applyTransform();
    });

    window.addEventListener('mouseup', () => { isPanning = false; });

    viewport.addEventListener('wheel', (e) => {
      e.preventDefault();
      const rect = viewport.getBoundingClientRect();
      const zoomFactor = e.deltaY < 0 ? 1.08 : 0.92;
      zoomAround(e.clientX - rect.left, e.clientY - rect.top, scale * zoomFactor);
      applyTransform();
    }, { passive: false });

    viewport.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1 && !e.target.closest('.node-group')) {
        isPanning = true;
        startX = e.touches[0].clientX - currentX;
        startY = e.touches[0].clientY - currentY;
      } else if (e.touches.length === 2) {
        isPanning = false;
        const rect = viewport.getBoundingClientRect();
        const t0 = e.touches[0], t1 = e.touches[1];
        initialPinchDist = Math.hypot(t0.clientX - t1.clientX, t0.clientY - t1.clientY);
        initialPinchScale = scale;
        const midX = (t0.clientX + t1.clientX) / 2 - rect.left;
        const midY = (t0.clientY + t1.clientY) / 2 - rect.top;
        pinchAnchorScreen = { x: midX, y: midY };
        pinchAnchorScene = { x: (midX - currentX) / scale, y: (midY - currentY) / scale };
      }
    }, { passive: false });

    viewport.addEventListener('touchmove', (e) => {
      if (isPanning && e.touches.length === 1) {
        currentX = e.touches[0].clientX - startX;
        currentY = e.touches[0].clientY - startY;
        scheduleTransform();
      } else if (e.touches.length === 2 && initialPinchDist) {
        e.preventDefault();
        const dist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        const factor = dist / initialPinchDist;
        const newScale = Math.min(Math.max(MIN_SCALE, initialPinchScale * factor), MAX_SCALE);
        currentX = pinchAnchorScreen.x - pinchAnchorScene.x * newScale;
        currentY = pinchAnchorScreen.y - pinchAnchorScene.y * newScale;
        scale = newScale;
        scheduleTransform();
      }
    }, { passive: false });

    viewport.addEventListener('touchend', (e) => {
      if (e.touches.length < 2) initialPinchDist = null;
      if (e.touches.length === 0) isPanning = false;
    });

    window.addEventListener('resize', () => {
      applyLangUI();
    });

    document.body.className = `${currentTheme}-mode`;
    if (isMobileDevice()) {
      document.getElementById('dashboard').classList.add('collapsed');
      document.getElementById('collapseBtn').textContent = '▾';
    }
    applyLangUI();
    renderDiagram();
    if (isMobileDevice()) {
      initialMobileView();
    } else {
      currentX = 15; currentY = 100; scale = 0.65;
      applyTransform();
    }
  </script>
</body>
