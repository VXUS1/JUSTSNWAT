<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="بنك أسئلة السنوات سابقة لطلاب التكنو - امتحانات وحلول.">
<meta name="keywords" content="سنوات, أسئلة, شبكات, NES415, NES441, التكنو, JUST">
<meta name="google" content="notranslate">

<title>JUSTSNWAT | بنك أسئلة السنوات السابقة</title>
<link rel="icon" type="image/png" href="favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<!-- Three.js Library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root {
  --bg-base: #050608;
  --apple-surface: rgba(18, 22, 34, 0.75);
  --apple-surface-hover: rgba(26, 32, 48, 0.9);
  --apple-border: rgba(255, 255, 255, 0.08);
  --apple-border-strong: rgba(255, 255, 255, 0.16);
  --apple-red: #ff453a;
  --apple-blue: #0a84ff;
  --apple-green: #30d158;
  --apple-gold: #ffd700;
  --text-primary: #f5f5f7;
  --text-secondary: #8e95a5;
  --ease-apple: cubic-bezier(0.16, 1, 0.3, 1);
  --radius: 16px;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  padding: 0;
}

body {
  background-color: var(--bg-base) !important;
  color: var(--text-primary) !important;
  font-family: -apple-system, BlinkMacSystemFont, 'Cairo', sans-serif;
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  letter-spacing: -0.01em;
  overflow-x: hidden;
  position: relative;
}

button, input, textarea, select {
  font: inherit;
  color: inherit;
}

a {
  color: inherit;
  text-decoration: none;
}

.wrap {
  max-width: 940px;
  margin: 0 auto;
  padding: 6px 20px 80px;
  flex: 1;
  width: 100%;
  position: relative;
  z-index: 10;
}

/* ---------- Header & Navbar ---------- */
.masthead {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  padding: 14px clamp(20px, 5vw, 64px);
  background: linear-gradient(180deg, rgba(14, 18, 28, 0.94) 0%, rgba(6, 7, 10, 0.88) 100%);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border-bottom: 1px solid var(--apple-border);
  position: sticky;
  top: 0;
  z-index: 80;
  transition: border-color 0.3s var(--ease-apple);
}

.masthead::before {
  content: "";
  position: absolute;
  width: 22%;
  min-width: 180px;
  height: 2px;
  top: 0;
  right: 8%;
  background: linear-gradient(90deg, transparent, #0a84ff, transparent);
  box-shadow: 0 0 22px rgba(10, 132, 255, 0.7);
}

.masthead.scrolled {
  border-bottom-color: var(--apple-border-strong);
  box-shadow: 0 14px 34px rgba(0,0,0,0.46);
}

.nav-right-side {
  display: flex;
  align-items: center;
  gap: 22px;
}

.brand-line {
  display: inline-flex;
  align-items: center;
  gap: 12px;
}

.brand-mark {
  width: 34px;
  height: 34px;
  display: grid;
  place-items: center;
  border: 1px solid rgba(255, 255, 255, 0.22);
  border-radius: 10px;
  background: linear-gradient(145deg, var(--apple-red), #9f1239 68%);
  box-shadow: 0 7px 22px rgba(255, 69, 58, 0.25);
}

.brand-mark span {
  width: 12px;
  height: 12px;
  border: 2px solid rgba(255, 255, 255, 0.92);
  border-radius: 50%;
  box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.12);
}

.brand {
  font-size: clamp(1.45rem, 3.5vw, 1.9rem);
  font-weight: 900;
  letter-spacing: 2px;
  color: #ffffff;
}

/* قائمة الأقسام المنسدلة */
.dept-dropdown {
  position: relative;
}

.dept-dropdown-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid var(--apple-border-strong);
  color: #f5f5f7;
  padding: 7px 16px;
  border-radius: 999px;
  font-size: 13.5px;
  font-weight: 700;
  cursor: pointer;
  backdrop-filter: blur(16px);
  transition: all 0.25s var(--ease-apple);
}

.dept-dropdown-btn:hover,
.dept-dropdown.open .dept-dropdown-btn {
  background: rgba(255, 255, 255, 0.12);
  border-color: var(--apple-blue);
  box-shadow: 0 0 16px rgba(10, 132, 255, 0.25);
}

.dept-dropdown-btn svg {
  transition: transform 0.25s var(--ease-apple);
}

.dept-dropdown.open .dept-dropdown-btn svg {
  transform: rotate(180deg);
}

.dept-dropdown-menu {
  position: absolute;
  top: calc(100% + 8px);
  right: 0;
  min-width: 290px;
  background: rgba(14, 18, 28, 0.96);
  border: 1px solid var(--apple-border-strong);
  border-radius: 18px;
  padding: 8px;
  box-shadow: 0 20px 48px rgba(0, 0, 0, 0.65);
  backdrop-filter: blur(28px);
  -webkit-backdrop-filter: blur(28px);
  opacity: 0;
  visibility: hidden;
  transform: translateY(8px) scale(0.96);
  transition: all 0.22s var(--ease-apple);
  z-index: 100;
}

.dept-dropdown.open .dept-dropdown-menu {
  opacity: 1;
  visibility: visible;
  transform: translateY(0) scale(1);
}

.dept-menu-item {
  display: flex;
  flex-direction: column;
  gap: 3px;
  padding: 11px 13px;
  border-radius: 12px;
  background: transparent;
  transition: all 0.2s var(--ease-apple);
  cursor: pointer;
}

.dept-menu-item:hover {
  background: rgba(255, 255, 255, 0.08);
  transform: translateX(-3px);
}

.dept-menu-title {
  font-size: 14px;
  font-weight: 800;
  color: #ffffff;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.dept-menu-tag {
  font-size: 11px;
  font-family: 'JetBrains Mono', monospace;
  background: rgba(10, 132, 255, 0.18);
  color: #7dd3fc;
  padding: 2px 7px;
  border-radius: 6px;
  font-weight: 700;
}

.dept-menu-sub {
  font-size: 12px;
  color: var(--text-secondary);
}

.dept-menu-all {
  margin-top: 4px;
  border-top: 1px solid var(--apple-border);
  padding-top: 9px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 800;
  color: var(--apple-blue);
  text-decoration: none;
  padding-bottom: 4px;
}
.dept-menu-all:hover {
  text-decoration: underline;
}

/* ---------- Title & Hero ---------- */
.landing-hero {
  text-align: center;
  padding-top: 2px;
  position: relative;
  z-index: 20;
}

.landing-subtitle {
  margin: -8px auto 22px;
  color: rgba(226, 234, 238, 0.72);
  font-size: clamp(13px, 1.8vw, 15px);
  font-weight: 600;
  text-align: center;
}

.landing-title-clean {
  font-size: clamp(2.8rem, 6.5vw, 4.4rem);
  font-weight: 900;
  letter-spacing: -0.02em;
  margin: 0 0 16px;
  display: inline-block;
  background: linear-gradient(110deg, #ffffff 15%, #93c5fd 45%, #ffffff 55%, #dbeafe 75%, #ffffff 100%);
  background-size: 250% auto;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: titleShimmer 5s ease-in-out infinite, titleFloat 4s ease-in-out infinite;
  text-shadow: 0 10px 30px rgba(0, 0, 0, 0.85);
}

@keyframes titleShimmer {
  0% { background-position: 250% center; }
  100% { background-position: -250% center; }
}

@keyframes titleFloat {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-4px); }
}

/* شريط البحث */
.lux-search-container {
  position: relative;
  width: 100%;
  max-width: 650px;
  margin: 0 auto;
  z-index: 45;
}

.lux-search-box {
  position: relative;
  display: flex;
  align-items: center;
  background: rgba(16, 20, 30, 0.88);
  border: 1px solid rgba(255, 255, 255, 0.14);
  border-radius: 999px;
  padding: 5px 14px 5px 20px;
  backdrop-filter: blur(28px);
  -webkit-backdrop-filter: blur(28px);
  box-shadow: 0 14px 40px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.1);
  transition: all 0.35s var(--ease-apple);
}

.lux-search-box::before {
  content: "";
  position: absolute;
  inset: -2px;
  border-radius: 999px;
  background: linear-gradient(90deg, rgba(10, 132, 255, 0), rgba(10, 132, 255, 0.5), rgba(255, 69, 58, 0.4), rgba(10, 132, 255, 0));
  z-index: -1;
  opacity: 0;
  transition: opacity 0.4s var(--ease-apple);
  filter: blur(8px);
}

.lux-search-container.is-focused .lux-search-box {
  border-color: rgba(10, 132, 255, 0.9);
  background: rgba(20, 25, 38, 0.96);
  transform: scale(1.02) translateY(-2px);
  box-shadow: 0 20px 50px rgba(10, 132, 255, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.2);
}

.lux-search-container.is-focused .lux-search-box::before {
  opacity: 1;
}

.lux-search-icon {
  color: var(--apple-blue);
  display: grid;
  place-items: center;
  flex: none;
  margin-left: 12px;
  transition: transform 0.3s var(--ease-apple);
}

.lux-search-container.is-focused .lux-search-icon {
  transform: scale(1.15) rotate(-10deg);
  color: #ffffff;
}

.lux-search-input {
  width: 100%;
  background: transparent;
  border: none;
  color: #ffffff;
  font-size: 16px;
  font-weight: 600;
  outline: none;
  caret-color: var(--apple-blue);
  padding: 10px 0;
}

.lux-search-input::placeholder {
  color: #8b95a8;
  font-weight: 500;
}

.lux-results-dropdown {
  position: absolute;
  top: calc(100% + 10px);
  left: 0;
  right: 0;
  background: rgba(14, 18, 28, 0.96);
  border: 1px solid var(--apple-border-strong);
  border-radius: 20px;
  padding: 10px;
  box-shadow: 0 24px 60px rgba(0, 0, 0, 0.75);
  backdrop-filter: blur(35px);
  -webkit-backdrop-filter: blur(35px);
  max-height: 380px;
  overflow-y: auto;
  opacity: 0;
  visibility: hidden;
  transform: translateY(10px) scale(0.98);
  transition: all 0.25s var(--ease-apple);
  z-index: 50;
  text-align: start;
}

.lux-search-container.is-focused .lux-results-dropdown {
  opacity: 1;
  visibility: visible;
  transform: translateY(0) scale(1);
}

.lux-result-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 13px 16px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s var(--ease-apple);
  border: 1px solid transparent;
}

.lux-result-item:hover {
  background: rgba(255, 255, 255, 0.08);
  border-color: rgba(255, 255, 255, 0.12);
  transform: translateX(-4px);
}

.lux-result-titles {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.lux-result-en {
  font-size: 15.5px;
  font-weight: 800;
  color: #ffffff;
  font-family: 'JetBrains Mono', monospace;
}

.lux-result-ar {
  font-size: 12.5px;
  color: var(--text-secondary);
}

.lux-result-badges {
  display: flex;
  align-items: center;
  gap: 8px;
}

.lux-code-badge {
  font-size: 12px;
  font-family: 'JetBrains Mono', monospace;
  background: rgba(10, 132, 255, 0.18);
  color: #7dd3fc;
  padding: 3px 8px;
  border-radius: 6px;
  font-weight: 700;
}

.lux-count-badge {
  font-size: 11.5px;
  color: #cbd5e1;
  background: rgba(255, 255, 255, 0.06);
  padding: 3px 8px;
  border-radius: 6px;
  font-weight: 600;
}

.lux-no-results {
  padding: 24px;
  text-align: center;
  color: var(--text-secondary);
  font-size: 14.5px;
}

/* ---------- Apple-like route transitions ---------- */
#app.route-leave {
  animation: routeLeave 0.16s var(--ease-apple) both;
  pointer-events: none;
}

#app.route-enter {
  animation: routeEnter 0.46s var(--ease-apple) both;
}

#app.route-enter > * {
  animation: routeContentIn 0.42s var(--ease-apple) both;
}

@keyframes routeLeave {
  to { opacity: 0; transform: translateY(-10px) scale(0.992); filter: blur(3px); }
}

@keyframes routeEnter {
  from { opacity: 0; transform: translateY(12px) scale(0.992); filter: blur(3px); }
  to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
}

@keyframes routeContentIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

@media (prefers-reduced-motion: reduce) {
  #app.route-leave,
  #app.route-enter,
  #app.route-enter > * {
    animation: none;
  }
}

/* =========================================================
   الكرة ثلاثية الأبعاد (Cyber Particle Globe)
   ========================================================= */
.glass-globe-section {
  position: relative;
  width: 100%;
  height: 470px;
  margin: 6px auto 0;
  display: flex;
  justify-content: center;
  align-items: center;
  cursor: grab;
  touch-action: none;
  overflow: hidden;
}

.glass-globe-section:active {
  cursor: grabbing;
}

#globe-canvas {
  width: 100%;
  height: 100%;
  display: block;
}

.globe-tagline {
  margin: -12px 0 34px;
  color: rgba(226, 234, 238, 0.72);
  font-size: clamp(15px, 2vw, 18px);
  font-weight: 700;
  letter-spacing: 0;
  text-align: center;
  direction: ltr;
  unicode-bidi: isolate;
  text-shadow: 0 0 18px rgba(226, 234, 238, 0.12);
}

/* =========================================================
   تصميم بطاقات الأقسام (Department Showcase Cards)
   ========================================================= */
.departments-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 20px;
  margin-top: 14px;
}

.dept-showcase-card {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  background: linear-gradient(180deg, rgba(24, 30, 48, 0.75) 0%, rgba(13, 17, 28, 0.88) 100%);
  border: 1px solid var(--apple-border-strong);
  border-radius: 24px;
  padding: 32px 20px 24px;
  cursor: pointer;
  overflow: hidden;
  backdrop-filter: blur(28px);
  -webkit-backdrop-filter: blur(28px);
  box-shadow: 0 14px 40px rgba(0, 0, 0, 0.45);
  transition: all 0.35s var(--ease-apple);
}

.dept-showcase-card::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 3px;
  background: var(--dept-accent, var(--apple-blue));
  opacity: 0.8;
  box-shadow: 0 0 20px var(--dept-accent, var(--apple-blue));
}

.dept-showcase-card:hover {
  transform: translateY(-8px);
  border-color: rgba(255, 255, 255, 0.3);
  box-shadow: 0 24px 50px rgba(0, 0, 0, 0.65), 0 0 35px var(--dept-glow, rgba(10, 132, 255, 0.25));
}

.dept-orb {
  width: 108px;
  height: 108px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, rgba(42, 94, 150, 0.95), rgba(18, 48, 85, 0.98) 75%);
  border: 3px solid #38bdf8;
  box-shadow: 0 0 24px rgba(56, 189, 248, 0.4), inset 0 2px 6px rgba(255, 255, 255, 0.35);
  display: grid;
  place-items: center;
  margin-bottom: 20px;
  transition: transform 0.4s var(--ease-apple), box-shadow 0.4s var(--ease-apple);
}

.dept-showcase-card:hover .dept-orb {
  transform: scale(1.08);
  box-shadow: 0 0 34px rgba(56, 189, 248, 0.65), inset 0 2px 8px rgba(255, 255, 255, 0.5);
}

.dept-showcase-card.card-cpe .dept-orb {
  background: radial-gradient(circle at 35% 30%, rgba(29, 99, 156, 0.95), rgba(16, 50, 88, 0.98) 75%);
  border-color: #00d2ff;
  box-shadow: 0 0 24px rgba(0, 210, 255, 0.4), inset 0 2px 6px rgba(255, 255, 255, 0.35);
}

.dept-showcase-card.card-cs .dept-orb {
  background: radial-gradient(circle at 35% 30%, rgba(31, 95, 148, 0.95), rgba(15, 45, 80, 0.98) 75%);
  border-color: #38bdf8;
  box-shadow: 0 0 24px rgba(56, 189, 248, 0.4), inset 0 2px 6px rgba(255, 255, 255, 0.35);
}

.dept-orb-svg {
  width: 62px;
  height: 62px;
  display: block;
}

.dept-title-box {
  margin-bottom: 8px;
}

/* الإنجليزي بارز وكبير، والعربي تحته أصغر */
.dept-title-box h3 {
  margin: 0 0 3px;
  font-size: 18.5px;
  font-weight: 800;
  color: #ffffff;
  font-family: 'JetBrains Mono', monospace;
  line-height: 1.3;
}

.dept-title-box .dept-ar-sub {
  font-size: 13.5px;
  color: #93c5fd;
  font-weight: 600;
}

.dept-showcase-desc {
  font-size: 13px;
  color: var(--text-secondary);
  margin: 0 0 16px;
  line-height: 1.5;
  min-height: 40px;
}

.dept-card-footer {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-top: 1px solid rgba(255, 255, 255, 0.08);
  padding-top: 14px;
  margin-top: auto;
}

.dept-btn-enter {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  color: #7dd3fc;
  font-size: 13px;
  font-weight: 800;
  transition: gap 0.2s ease;
}

.dept-showcase-card:hover .dept-btn-enter {
  gap: 9px;
  color: #ffffff;
}

/* =========================================================
   Department View & Subject View
   ========================================================= */
.dept-header {
  margin: 8px 0 24px;
}

.dept-header h2 {
  font-size: clamp(24px, 4.5vw, 34px);
  font-weight: 900;
  color: #ffffff;
  margin: 6px 0 2px;
  font-family: 'JetBrains Mono', monospace;
  letter-spacing: -0.02em;
}

.dept-header .dept-ar-head {
  color: var(--apple-blue);
  font-size: 16px;
  font-weight: 700;
  margin: 0 0 8px;
}

.dept-header p {
  color: var(--text-secondary);
  font-size: 15px;
  margin: 0;
}

.bar {
  display: flex;
  gap: 12px;
  align-items: center;
  position: sticky;
  top: 110px;
  z-index: 40;
  padding: 8px 0;
  margin-bottom: 24px;
  background: linear-gradient(to bottom, rgba(5, 6, 8, 0.96) 0%, rgba(5, 6, 8, 0.8) 78%, transparent 100%);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
}

.search {
  position: relative;
  width: 100%;
  background: var(--apple-surface);
  border: 1px solid var(--apple-border-strong);
  border-radius: 999px;
  padding: 14px 48px 14px 20px;
  color: var(--text-primary);
  caret-color: var(--apple-blue);
  font-size: 15px;
  box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
  transition: all 0.25s var(--ease-apple);
}

.bar::before {
  content: "⌕";
  position: absolute;
  right: 18px;
  top: 50%;
  z-index: 1;
  color: var(--apple-blue);
  font-family: Georgia, serif;
  font-size: 24px;
  line-height: 1;
  transform: translateY(-55%) rotate(-15deg);
  pointer-events: none;
}

.search:focus {
  outline: none;
  border-color: rgba(10, 132, 255, 0.85);
  box-shadow: 0 0 0 4px rgba(10, 132, 255, 0.15), 0 16px 36px rgba(10, 132, 255, 0.2);
}

.search::placeholder {
  color: #9aa8bb;
}

.subject-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 16px;
}

.subject-card {
  position: relative;
  isolation: isolate;
  aspect-ratio: 1.25 / 1;
  min-height: 165px;
  align-items: flex-end;
  overflow: hidden;
  padding: 22px;
  border-inline-start: 1px solid var(--apple-border);
  background: var(--subject-bg, linear-gradient(135deg, rgba(37, 48, 71, 0.82), rgba(17, 24, 39, 0.9)));
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border-radius: 18px;
  cursor: pointer;
  transition: all 0.3s var(--ease-apple);
}

.subject-card:hover {
  border-color: rgba(255, 255, 255, 0.32);
  border-inline-start-color: var(--apple-blue);
  transform: translateY(-5px);
}

.subject-card .main {
  position: relative;
  z-index: 1;
  width: 100%;
}

/* الإنجليزي بارز وكبير، والعربي تحته أصغر */
.subject-card .en-title-main {
  font-size: clamp(17px, 2.1vw, 20px);
  font-weight: 800;
  line-height: 1.3;
  color: #ffffff;
  font-family: 'JetBrains Mono', monospace;
  text-shadow: 0 2px 14px rgba(0, 0, 0, 0.6);
  margin-bottom: 3px;
  letter-spacing: -0.02em;
}

.subject-card .ar-title-sub {

    function normalizeArabic(text) {
      if (!text) return "";
      return String(text)
        .trim()
        .toLowerCase()
        .replace(/[إأآٱ]/g, "ا")
        .replace(/[ة]/g, "ه")
        .replace(/[ى]/g, "ي")
        .replace(/[ؤ]/g, "و")
        .replace(/[ئ]/g, "ي")
        .replace(/[\u064B-\u065F\u0670]/g, "")
        .replace(/\u0640/g, "")
        .replace(/[\s\-_]+/g, " ");
    }

    function searchSubjects(query, deptFilter) {
      var pool = deptFilter ? allSubjects.filter(function(s) { return s.dept === deptFilter; }) : allSubjects;
      var normQ = normalizeArabic(query);
      if (!normQ) return pool;

      return pool.filter(function (s) {
        var normAr = normalizeArabic(s.arName);
        var normEn = normalizeArabic(s.name);
        var normCode = normalizeArabic(s.code);
        return normAr.indexOf(normQ) > -1 || normEn.indexOf(normQ) > -1 || normCode.indexOf(normQ) > -1;
      });
    }

        deptDropdown.classList.toggle("open");
        var isOpen = deptDropdown.classList.contains("open");
        deptDropdownBtn.setAttribute("aria-expanded", isOpen);
      });

      document.addEventListener("click", function (e) {
        if (!deptDropdown.contains(e.target)) {
          deptDropdown.classList.remove("open");
          deptDropdownBtn.setAttribute("aria-expanded", "false");
        }
      });
    }

    function esc(s) {
      return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
      });
    }

    function safeUrl(u) {
      var t = String(u || "").trim();
      if (!t) return "";
      if (t.endsWith(".html") || t.startsWith("#") || t.startsWith("/") || t.startsWith("./")) return t;
      if (!/^https?:\/\//i.test(t)) t = "https://" + t;
      try { var p = new URL(t); return (p.protocol === "http:" || p.protocol === "https:") ? p.href : ""; }
      catch (e) { return ""; }
    }

    function parseHash() {
      var h = location.hash || "";
      if (h === "#/depts") return { type: "departments_list" };

      var mSubject = /^#\/s\/(.+)$/.exec(h);
      if (mSubject) return { type: "subject", id: decodeURIComponent(mSubject[1]) };

      var mDept = /^#\/dept\/(.+)$/.exec(h);
      if (mDept) return { type: "dept", id: decodeURIComponent(mDept[1]) };

      return { type: "home" };
    }

    function render(animate) {
      var route = parseHash();
      if (deptDropdown) deptDropdown.classList.remove("open");

      if (route.type === "subject") {
        renderSubject(route.id);
      } else if (route.type === "dept") {
        renderDepartment(route.id);
      } else if (route.type === "departments_list") {
        renderDepartmentsList();
      } else {
        renderHome();
      }

      if (animate) {
        app.classList.remove("route-leave");
        void app.offsetWidth;
        app.classList.add("route-enter");
        window.setTimeout(function () { app.classList.remove("route-enter"); }, 720);
      }
    }

    window.addEventListener("hashchange", function () {
      clearTimeout(routeTimer);
      app.classList.remove("route-enter");
      app.classList.add("route-leave");

    /* =======================================================
       4. محرك الكرة الأرضية التقنية (Three.js)
       ======================================================= */
    var globeAnimId = null;

    function initWeEvolveGlobe() {
      var container = document.getElementById("globe-canvas-wrap");
      var canvas = document.getElementById("globe-canvas");

      if (!container || !canvas || typeof THREE === "undefined") return;
      if (globeAnimId) cancelAnimationFrame(globeAnimId);

      var scene = new THREE.Scene();
      var camera = new THREE.PerspectiveCamera(42, container.clientWidth / container.clientHeight, 0.1, 1000);
      camera.position.set(0, 0, 238);

      var renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
      renderer.setSize(container.clientWidth, container.clientHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

      var globeGroup = new THREE.Group();
      scene.add(globeGroup);

      var GLOBE_RADIUS = 72;

      var coreGeo = new THREE.SphereGeometry(GLOBE_RADIUS * 0.99, 48, 48);
      var coreMat = new THREE.MeshBasicMaterial({
        color: 0x0b1219,
        transparent: true,
        opacity: 0.52,
        depthWrite: false
      });
      globeGroup.add(new THREE.Mesh(coreGeo, coreMat));

      var silverRim = new THREE.ShaderMaterial({
        vertexShader: `
          varying vec3 vNormal;
          varying vec3 vPosition;
          void main() {
            vNormal = normalize(normalMatrix * normal);
            vPosition = (modelViewMatrix * vec4(position, 1.0)).xyz;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          varying vec3 vNormal;
          varying vec3 vPosition;
          void main() {
            vec3 viewDirection = normalize(-vPosition);
            float rim = pow(1.0 - abs(dot(viewDirection, vNormal)), 3.0);
            gl_FragColor = vec4(vec3(0.72, 0.78, 0.82) * rim, rim * 0.3);
          }
        `,
        transparent: true,
        blending: THREE.AdditiveBlending,
        side: THREE.BackSide,
        depthWrite: false
      });
      globeGroup.add(new THREE.Mesh(new THREE.SphereGeometry(GLOBE_RADIUS * 1.025, 48, 48), silverRim));

      var continentMaterial = new THREE.LineBasicMaterial({
        color: 0xe2ad45,
        transparent: true,
        opacity: 0.86,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });

      function addLandOutline(ring) {
        if (!ring || ring.length < 3) return;
        var outline = ring.map(function (point) {
          return latLonToVector3(point[1], point[0], GLOBE_RADIUS * 1.006);
        });
        globeGroup.add(new THREE.Line(
          new THREE.BufferGeometry().setFromPoints(outline),
          continentMaterial
        ));
      }

      fetch("https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_110m_land.geojson")
        .then(function (response) { return response.json(); })
        .then(function (landData) {
          landData.features.forEach(function (feature) {
            var geometry = feature.geometry || {};
            if (geometry.type === "Polygon") {
              geometry.coordinates.forEach(addLandOutline);
            } else if (geometry.type === "MultiPolygon") {
              geometry.coordinates.forEach(function (polygon) {
                polygon.forEach(addLandOutline);
              });
            }
          });
        })
        .catch(function () {});

      function latLonToVector3(lat, lon, r) {
        var phi = (90 - lat) * (Math.PI / 180);
        var theta = (lon + 180) * (Math.PI / 180);
        return new THREE.Vector3(
          -(r * Math.sin(phi) * Math.cos(theta)),
          r * Math.cos(phi),
          r * Math.sin(phi) * Math.sin(theta)
        );
      }

      var hubList = [
        { lat: 31.95, lon: 35.91 },  // الأردن
        { lat: 51.50, lon: -0.12 },  // لندن
        { lat: 40.71, lon: -74.00 }, // نيويورك
        { lat: 35.67, lon: 139.65 }, // طوكيو
        { lat: 25.20, lon: 55.27 },  // دبي
        { lat: -33.86, lon: 151.20 } // سيدني
      ];

      hubList.forEach(function (h) {
        var pos = latLonToVector3(h.lat, h.lon, GLOBE_RADIUS * 1.01);
        var markerGeo = new THREE.RingGeometry(1.2, 2.0, 16);
        var markerMat = new THREE.MeshBasicMaterial({ color: 0x00f0ff, side: THREE.DoubleSide });
        var markerMesh = new THREE.Mesh(markerGeo, markerMat);
        markerMesh.position.copy(pos);
        markerMesh.lookAt(0, 0, 0);
        globeGroup.add(markerMesh);
      });

      var pulseItems = [];
      for (var i = 0; i < hubList.length; i++) {
        var pStart = hubList[i];
        var pEnd = hubList[(i + 1) % hubList.length];

        var v1 = latLonToVector3(pStart.lat, pStart.lon, GLOBE_RADIUS);
        var v2 = latLonToVector3(pEnd.lat, pEnd.lon, GLOBE_RADIUS);
        var mid = new THREE.Vector3().addVectors(v1, v2).multiplyScalar(0.5);
        var d = v1.distanceTo(v2);
        mid.normalize().multiplyScalar(GLOBE_RADIUS + d * 0.28);

        var curve = new THREE.QuadraticBezierCurve3(v1, mid, v2);
        var curvePoints = curve.getPoints(45);
        var curveGeo = new THREE.BufferGeometry().setFromPoints(curvePoints);
        var curveMat = new THREE.LineBasicMaterial({
          color: 0x00d2ff,
          transparent: true,
          opacity: 0.38
        });
        globeGroup.add(new THREE.Line(curveGeo, curveMat));

        var pGeo = new THREE.SphereGeometry(1.2, 8, 8);
        var pMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        var pMesh = new THREE.Mesh(pGeo, pMat);
        globeGroup.add(pMesh);
        pulseItems.push({ mesh: pMesh, curve: curve, t: Math.random() });
      }

      globeGroup.rotation.y = 2.45;
      globeGroup.rotation.x = 0.24;

      var isDragging = false;
      var lastX = 0, lastY = 0;
      var spinSpeedX = 0, spinSpeedY = 0;

      container.addEventListener("pointerdown", function (e) {
        isDragging = true;
        lastX = e.clientX;
        lastY = e.clientY;
        spinSpeedX = 0;
        spinSpeedY = 0;
      });

      window.addEventListener("pointermove", function (e) {
        if (!isDragging) return;
        var dx = e.clientX - lastX;
        var dy = e.clientY - lastY;
        lastX = e.clientX;
        lastY = e.clientY;

        spinSpeedX = dx * 0.0018;
        spinSpeedY = dy * 0.0018;
        globeGroup.rotation.y += spinSpeedX;
        globeGroup.rotation.x += spinSpeedY;
        globeGroup.rotation.x = Math.max(-0.85, Math.min(0.85, globeGroup.rotation.x));
      });

      window.addEventListener("pointerup", function () { isDragging = false; });

      window.addEventListener("resize", function () {
        camera.aspect = container.clientWidth / container.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(container.clientWidth, container.clientHeight);
      });

      function animate() {
        globeAnimId = requestAnimationFrame(animate);

        pulseItems.forEach(function (p) {
          p.t += 0.0018;
          if (p.t > 1) p.t = 0;
          var pt = p.curve.getPoint(p.t);
          p.mesh.position.copy(pt);
        });

        if (!isDragging) {
          spinSpeedX *= 0.9;
          spinSpeedY *= 0.9;
          globeGroup.rotation.y += spinSpeedX + 0.00045;
          globeGroup.rotation.x += spinSpeedY;
          globeGroup.rotation.x = Math.max(-0.85, Math.min(0.85, globeGroup.rotation.x));
        }

        renderer.render(scene, camera);
      }
      animate();
    }

          desc: "شبكات، اتصالات لاسلكية، وتشفير وأمن معلومات.",
          icon: iconNesSvg,
          accent: "#38bdf8",
          glow: "rgba(56, 189, 248, 0.35)",
          cls: "card-nes"
        },
        { 
          id: "cpe", 
          name: "Computer Engineering", 
          arName: "هندسة الحاسوب", 
          tag: "CPE", 
          desc: "معمارية وبنية الحاسوب، عتاد، ونظم تشغيل.",
          icon: iconCpeSvg,
          accent: "#00d2ff",
          glow: "rgba(0, 210, 255, 0.35)",
          cls: "card-cpe"
        },
        { 
          id: "cs",  
          name: "Computer Science", 
          arName: "علوم الحاسوب", 
          tag: "CS",  
          desc: "تراكيب بيانات وخوارزميات، برمجيات، ونظم تشغيل.",
          icon: iconCsSvg,
          accent: "#38bdf8",
          glow: "rgba(56, 189, 248, 0.35)",
          cls: "card-cs"
        }
      ];

      var cardsHtml = deptsData.map(function(d) {
        var count = allSubjects.filter(function(s) { return s.dept === d.id; }).length;
        return '' +
          '<div class="dept-showcase-card ' + d.cls + '" style="--dept-accent:' + d.accent + '; --dept-glow:' + d.glow + ';" role="button" tabindex="0" onclick="location.hash=\'#/dept/' + esc(d.id) + '\'">' +
            '<div class="dept-orb">' +
              d.icon +
            '</div>' +
            '<div class="dept-title-box">' +
              '<h3>' + esc(d.name) + '</h3>' +
              '<div class="dept-ar-sub">' + esc(d.arName) + '</div>' +
            '</div>' +
            '<p class="dept-showcase-desc">' + esc(d.desc) + '</p>' +
            '<div class="dept-card-footer">' +
              '<span class="lux-code-badge">' + esc(d.tag) + ' • ' + count + ' مواد</span>' +
              '<span class="dept-btn-enter">دخول القسم ' + iconChev() + '</span>' +
            '</div>' +
          '</div>';
      }).join("");

      app.innerHTML =
        '<div style="padding-top: 10px;">' +
          '<a href="#/" class="back">' + iconBack() + ' رجوع للرئيسية</a>' +
          '<div class="dept-header" style="margin-bottom: 22px;">' +
            '<h2>الأقسام والتخصصات الأكاديمية</h2>' +
            '<p>اختر التخصص لاستعراض المواد ونماذج الأسئلة والامتحانات المحلولة.</p>' +
          '</div>' +
          '<div class="departments-grid">' +
            cardsHtml +
          '</div>' +
        '</div>';
    }

    /* =======================================================
       6. صفحة القسم
       ======================================================= */
    var deptSearch = "";
    function renderDepartment(deptId) {
      var meta = deptMeta[deptId] || { name: deptId.toUpperCase(), arName: "القسم الأكاديمي", tag: deptId.toUpperCase(), desc: "تصفح المواد المتاحة." };
      var matches = searchSubjects(deptSearch, deptId);

      var body = "";
      if (!matches.length) {
        body = '<div class="empty"><strong>لا توجد نتائج مطابقة</strong>تأكد من كتابة اسم المادة أو رمزها بالشكل الصحيح.</div>';
      } else {
        body = '<div class="subject-grid">' + matches.map(function (s) {
          var examList = exams[s.id] || [];
          var count = examList.length;
          var countLabel = count === 0 ? "لا توجد أسئلة حالياً" : count + (count === 1 ? " نموذج اختبار" : " نماذج اختبارات");
          return '' +
            '<div class="row subject-card subject-' + esc(s.id) + '" role="button" tabindex="0" data-open="' + esc(s.id) + '">' +
              '<div class="main">' +
                '<div class="en-title-main">' + esc(s.name) + '</div>' +
                '<div class="ar-title-sub">' + esc(s.arName) + '</div>' +
                '<div class="meta">' +
                  (s.code ? '<span class="code">' + esc(s.code) + '</span>' : '') +
                  '<span class="subject-count">' + esc(countLabel) + '</span>' +
                '</div>' +
              '</div>' +
              '<span class="chev" aria-hidden="true">' + iconChev() + '</span>' +
            '</div>';
        }).join("") + '</div>';
      }

      app.innerHTML =
        '<div style="padding-top: 10px;">' +
          '<a href="#/depts" class="back">' + iconBack() + ' رجوع للأقسام</a>' +
          '<div class="dept-header">' +
            '<h2>' + esc(meta.name) + ' (' + esc(meta.tag) + ')</h2>' +
            '<div class="dept-ar-head">' + esc(meta.arName) + '</div>' +
            '<p>' + esc(meta.desc) + '</p>' +
          '</div>' +
          '<div class="bar">' +
            '<input class="search" id="deptQuery" type="search" placeholder="ابحث في مواد القسم بالإنجليزي أو بالعربي..." value="' + esc(deptSearch) + '">' +
          '</div>' +
          body +
          '<p class="hint">اضغط على أي مادة لعرض ملفات الاختبارات والحلول.</p>' +
        '</div>';

      var qInput = document.getElementById("deptQuery");
      if (qInput) {
        qInput.addEventListener("input", function () {
          deptSearch = this.value;
          var pos = this.selectionStart;
          renderDepartment(deptId);
          var reFocus = document.getElementById("deptQuery");
          if (reFocus) {
            reFocus.focus();
            try { reFocus.setSelectionRange(pos, pos); } catch (e) {}
          }
        });
      }
    }

    /* =======================================================
       7. صفحة المادة والاختبارات
       ======================================================= */
    function renderSubject(subjectId) {
      var s = allSubjects.find(function (item) { return item.id === subjectId; });

      if (!s) {
        app.innerHTML = '<div style="padding-top: 20px;">' +
          '<a href="#/depts" class="back">' + iconBack() + ' رجوع للأقسام</a>' +
          '<div class="empty"><strong>المادة غير موجودة</strong>الرجاء العودة لقائمة الأقسام.</div>' +
        '</div>';
        return;
      }

      var deptUrl = "#/dept/" + s.dept;
      var deptName = deptMeta[s.dept] ? deptMeta[s.dept].name : "القسم";
      var subjectExams = exams[subjectId] || [];
      var body = "";

      if (!subjectExams.length) {
        body = '<div class="empty"><strong>لا توجد أسئلة بعد</strong>لم تتم إضافة نماذج لهذه المادة حتى الآن.</div>';
      } else {
        body = '<div style="display:flex; flex-direction:column; gap:12px;">' + subjectExams.map(function (x) {
          var url = safeUrl(x.link);
          var isLocalQuiz = url && (url.endsWith(".html") || url.indexOf("quiz") > -1);
          var linkButtonHtml = "";
          if (isLocalQuiz) {
            linkButtonHtml = '<a class="btn-quiz" href="' + esc(url) + '">' + iconFlash() + ' بدء الاختبار</a>';
          } else if (url) {
            linkButtonHtml = '<a class="filelink" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + iconLink() + ' فتح الملف ↗</a>';
          }

          return '' +
            '<div class="row exam">' +
              '<div class="main">' +
                '<div class="name">' + esc(x.title) + '</div>' +
                (x.note ? '<div class="note">' + esc(x.note) + '</div>' : '') +
                linkButtonHtml +
              '</div>' +
            '</div>';
        }).join("") + '</div>';
      }

      app.innerHTML =
        '<div style="padding-top: 10px;">' +
          '<a href="' + deptUrl + '" class="back">' + iconBack() + ' رجوع لقسم ' + esc(deptName) + '</a>' +
          '<div class="subject-head">' +
            '<h2>' + esc(s.name) + '</h2>' +
            '<div class="ar-subtitle">' + esc(s.arName) + '</div>' +
            (s.code ? '<div class="sub">رمز المادة: ' + esc(s.code) + '</div>' : '') +
          '</div>' +
          body +
        '</div>';
    }

    function iconChev() { return '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>'; }
    function iconBack() { return '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>'; }
    function iconLink() { return '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg>'; }
    function iconFlash() { return '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>'; }

    app.addEventListener("click", function (e) {
      var t = e.target.closest("[data-open]");
      if (t) location.hash = "#/s/" + encodeURIComponent(t.getAttribute("data-open"));
    });

    document.addEventListener("click", function (e) {
      var quizLink = e.target.closest("a.btn-quiz");
      if (!quizLink || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;

      e.preventDefault();
      var overlay = document.createElement("div");
      overlay.id = "quiz-loading-overlay";
      overlay.innerHTML = '<span class="quiz-loading-mark" aria-hidden="true"></span>';
      document.body.appendChild(overlay);

      requestAnimationFrame(function () {
        overlay.classList.add("is-active");
      });

      window.setTimeout(function () {
        window.location.href = quizLink.href;
      }, 450);
    });

    render();

    /* =======================================================
       8. ديسكورد وبلاغات الأخطاء
       ======================================================= */
    var openBtn = document.getElementById("openReportBtn");
    var closeBtn = document.getElementById("closeReportBtn");
    var overlay = document.getElementById("reportOverlay");
    var form = document.getElementById("bugReportForm");
    var statusDiv = document.getElementById("reportStatus");
    var submitBtn = document.getElementById("submitReportBtn");

    function openModal() {
      overlay.classList.add("active");
      overlay.setAttribute("aria-hidden", "false");
      statusDiv.className = "report-status";
      statusDiv.style.display = "none";
    }

    function closeModal() {
      overlay.classList.remove("active");
      overlay.setAttribute("aria-hidden", "true");
    }

    if (openBtn) openBtn.addEventListener("click", openModal);
    if (closeBtn) closeBtn.addEventListener("click", closeModal);
    if (overlay) {
      overlay.addEventListener("click", function (e) {
        if (e.target === overlay) closeModal();
      });
    }

    if (form) {
      var WORKER_ENDPOINT = "https://justsnwat-reporter.abdalserhan20.workers.dev/";

      form.addEventListener("submit", function (e) {
        e.preventDefault();

        var fileInput = document.getElementById("issue-file");
        var file = fileInput && fileInput.files ? fileInput.files[0] : null;

        if (file && file.size > 8 * 1024 * 1024) {
          statusDiv.className = "report-status error";
          statusDiv.style.display = "block";
          statusDiv.textContent = "حجم الصورة كبير جداً، الحد الأقصى هو 8 ميجابايت.";
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = "جارِ الإرسال...";
        statusDiv.style.display = "none";

        var formData = new FormData();
        formData.append("issueType", document.getElementById("issue-type").value);
        formData.append("issueDesc", document.getElementById("issue-desc").value);
        formData.append("userContact", document.getElementById("user-contact").value.trim() || "غير محدد");
        formData.append("currentUrl", window.location.href);

        if (file) {
          formData.append("imageFile", file);
        }

        fetch(WORKER_ENDPOINT, {
          method: "POST",
          body: formData
        })
        .then(function (res) {
          if (!res.ok) throw new Error();
          return res.json();
        })
        .then(function (data) {
          if (data.success) {
            statusDiv.className = "report-status success";
            statusDiv.style.display = "block";
            statusDiv.textContent = "تم إرسال البلاغ بنجاح، شكراً لك!";
            form.reset();

            setTimeout(function () {
              closeModal();
              submitBtn.disabled = false;
              submitBtn.textContent = "إرسال البلاغ";
            }, 2000);
          } else {
            throw new Error(data.error || "Server error");
          }
        })
        .catch(function () {
          statusDiv.className = "report-status error";
          statusDiv.style.display = "block";
          statusDiv.textContent = "حدث خطأ أثناء الإرسال، تأكد من اتصالك بالإنترنت.";
          submitBtn.disabled = false;
          submitBtn.textContent = "إرسال البلاغ";
        });
      });
    }

  })();
  </script>
</body>
</html>
