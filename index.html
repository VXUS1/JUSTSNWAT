<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JUSTSNWAT | بنك أسئلة وسنوات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg-base: #07090e;
  --apple-surface: rgba(22, 28, 42, 0.68);
  --apple-surface-hover: rgba(30, 39, 58, 0.85);
  --apple-border: rgba(255, 255, 255, 0.08);
  --apple-border-strong: rgba(255, 255, 255, 0.16);
  --apple-red: #ff453a;
  --apple-blue: #0a84ff;
  --apple-green: #30d158;
  --text-primary: #f5f5f7;
  --text-secondary: #86868b;
  --ease-apple: cubic-bezier(0.16, 1, 0.3, 1);
  --radius: 16px;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  padding: 0;
}

body {
  background-color: var(--bg-base) !important;
  color: var(--text-primary) !important;
  font-family: -apple-system, BlinkMacSystemFont, 'Cairo', sans-serif;
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  letter-spacing: -0.01em;
}

button, input, textarea, select {
  font: inherit;
  color: inherit;
}

a {
  color: inherit;
}

.wrap {
  max-width: 900px;
  margin: 0 auto;
  padding: 24px 20px 80px;
  flex: 1;
  width: 100%;
}

/* ---------- Header ---------- */
.masthead {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 28px;
  padding: 20px clamp(20px, 6vw, 72px);
  background:
    radial-gradient(circle at 88% -30%, rgba(10, 132, 255, 0.2), transparent 36%),
    radial-gradient(circle at 12% -35%, rgba(255, 69, 58, 0.12), transparent 32%),
    linear-gradient(180deg, rgba(18, 24, 38, 0.96), rgba(7, 9, 14, 0.94));
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--apple-border);
  position: sticky;
  top: 0;
  z-index: 50;
  overflow: hidden;
  transition: border-color 0.3s var(--ease-apple);
}

.masthead::before,
.masthead::after {
  content: "";
  position: absolute;
  pointer-events: none;
}

.masthead::before {
  width: 22%;
  min-width: 180px;
  height: 2px;
  top: 0;
  right: 8%;
  background: linear-gradient(90deg, transparent, #0a84ff, transparent);
  box-shadow: 0 0 22px rgba(10, 132, 255, 0.7);
}

.masthead::after {
  width: 28%;
  height: 1px;
  bottom: -1px;
  left: 6%;
  background: linear-gradient(90deg, transparent, var(--apple-red));
  box-shadow: 0 0 16px rgba(255, 69, 58, 0.8);
}

.masthead.scrolled {
  border-bottom-color: var(--apple-border-strong);
  box-shadow: 0 14px 34px rgba(0,0,0,0.46);
}

.masthead > * {
  position: relative;
  z-index: 1;
}

.brand-line {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  flex: none;
  animation: headerReveal 0.7s var(--ease-apple) both;
}

.brand-mark {
  width: 34px;
  height: 34px;
  display: grid;
  place-items: center;
  border: 1px solid rgba(255, 255, 255, 0.22);
  border-radius: 10px;
  background: linear-gradient(145deg, var(--apple-red), #9f1239 68%);
  box-shadow: 0 7px 22px rgba(255, 69, 58, 0.25);
}

.brand-mark span {
  width: 12px;
  height: 12px;
  border: 2px solid rgba(255, 255, 255, 0.92);
  border-radius: 50%;
  box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.12);
}

.brand {
  font-size: clamp(1.8rem, 4vw, 2.35rem);
  font-weight: 900;
  letter-spacing: 2px;
  color: #ffffff;
  display: inline-block;
  position: relative;
  text-decoration: none;
  text-shadow: 0 0 24px rgba(255, 255, 255, 0.14);
}

.brand::after {
  content: "";
  position: absolute;
  bottom: -5px;
  left: 10%;
  width: 80%;
  height: 3px;
  background: var(--apple-red);
  border-radius: 99px;
  box-shadow: 0 0 12px rgba(255, 69, 58, 0.7);
}

.sub-brand {
  display: flex;
  align-items: center;
  gap: 9px;
  max-width: 380px;
  color: #aeb9ca;
  font-size: 0.88rem;
  line-height: 1.5;
  font-weight: 500;
  animation: headerReveal 0.7s 0.1s var(--ease-apple) both;
}

.sub-brand::before {
  content: "";
  width: 7px;
  height: 7px;
  flex: none;
  border-radius: 50%;
  background: var(--apple-green);
  box-shadow: 0 0 12px rgba(48, 209, 88, 0.8);
}

@keyframes headerReveal {
  from { opacity: 0; transform: translateY(-10px); }
  to { opacity: 1; transform: translateY(0); }
}

@media (prefers-reduced-motion: reduce) {
  .brand-line,
  .sub-brand {
    animation: none;
  }
}

@media (max-width: 600px) {
  .masthead {
    flex-direction: column;
    justify-content: center;
    gap: 12px;
    padding: 18px 20px 20px;
  }

  .sub-brand {
    justify-content: center;
    text-align: center;
  }
}

/* ---------- Footer ---------- */
footer {
  background: rgba(10, 14, 22, 0.85);
  border-top: 1px solid var(--apple-border);
  padding: 22px 22px;
  margin-top: auto;
  text-align: left;
  backdrop-filter: blur(15px);
}

footer p {
  margin: 4px;
  color: var(--text-secondary);
  font-size: 14px;
  font-weight: 700;
}

/* ---------- Search Bar ---------- */
.bar {
  display: flex;
  gap: 12px;
  align-items: center;
  position: sticky;
  top: 128px;
  z-index: 40;
  padding: 10px 0;
  margin-top: -10px;
  margin-bottom: 24px;
  background: linear-gradient(to bottom, rgba(7, 9, 14, 0.96) 0%, rgba(7, 9, 14, 0.84) 78%, transparent 100%);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
}

.search {
  position: relative;
  width: 100%;
  background:
    linear-gradient(110deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.025) 46%, rgba(10, 132, 255, 0.09)),
    rgba(22, 28, 42, 0.8);
  border: 1px solid rgba(255, 255, 255, 0.14);
  border-radius: 16px;
  padding: 14px 48px 14px 20px;
  color: var(--text-primary);
  caret-color: var(--apple-blue);
  font-size: 15px;
  box-shadow: 0 12px 30px rgba(0, 0, 0, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.08);
  transition: border-color 0.25s var(--ease-apple), box-shadow 0.25s var(--ease-apple), transform 0.25s var(--ease-apple);
}

.bar::before {
  content: "⌕";
  position: absolute;
  right: 17px;
  top: 50%;
  z-index: 1;
  color: #7dd3fc;
  font-family: Georgia, serif;
  font-size: 25px;
  line-height: 1;
  transform: translateY(-55%) rotate(-15deg);
  pointer-events: none;
}

.search:focus {
  outline: none;
  border-color: rgba(10, 132, 255, 0.8);
  box-shadow: 0 0 0 4px rgba(10, 132, 255, 0.13), 0 16px 36px rgba(10, 132, 255, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.12);
  transform: translateY(-1px);
}

.search::placeholder {
  color: #9aa8bb;
}

@media (max-width: 600px) {
  .bar {
    top: 112px;
  }
}

/* ---------- Lists & Rows ---------- */
.list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

#app.page-enter {
  animation: pageEnter 0.55s var(--ease-apple) both;
}

#app.page-leave {
  animation: pageLeave 0.2s ease-in both;
  pointer-events: none;
}

#app.page-enter .subject-head,
#app.page-enter > .back,
#app.page-enter > .list > .row {
  animation: contentReveal 0.45s var(--ease-apple) both;
}

#app.page-enter > .list > .row:nth-child(2) { animation-delay: 0.06s; }
#app.page-enter > .list > .row:nth-child(3) { animation-delay: 0.12s; }
#app.page-enter > .list > .row:nth-child(4) { animation-delay: 0.18s; }

@keyframes pageEnter {
  from { opacity: 0; transform: translateY(18px) scale(0.985); filter: blur(5px); }
  to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
}

@keyframes pageLeave {
  from { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
  to { opacity: 0; transform: translateY(-14px) scale(0.985); filter: blur(4px); }
}

@keyframes contentReveal {
  from { opacity: 0; transform: translateX(-16px); }
  to { opacity: 1; transform: translateX(0); }
}

@media (prefers-reduced-motion: reduce) {
  #app.page-enter,
  #app.page-leave,
  #app.page-enter .subject-head,
  #app.page-enter > .back,
  #app.page-enter > .list > .row {
    animation: none;
  }

  .page-transition {
    transition: none;
  }
}

.page-transition {
  position: fixed;
  inset: 0;
  z-index: 999;
  display: grid;
  place-items: center;
  background: var(--bg-base);
  opacity: 1;
  pointer-events: none;
  transition: opacity 0.42s var(--ease-apple);
}

.page-transition.is-ready {
  opacity: 0;
}

.page-transition.is-leaving {
  opacity: 1;
}

.page-transition-mark {
  width: 46px;
  height: 46px;
  display: grid;
  place-items: center;
  border: 1px solid rgba(255, 255, 255, 0.22);
  border-radius: 14px;
  background: linear-gradient(145deg, var(--apple-red), #9f1239 68%);
  box-shadow: 0 0 34px rgba(255, 69, 58, 0.3);
  transform: scale(0.9);
  transition: transform 0.42s var(--ease-apple);
}

.page-transition.is-ready .page-transition-mark {
  transform: scale(1);
}

.page-transition-mark::after {
  content: "";
  width: 14px;
  height: 14px;
  border: 2px solid rgba(255, 255, 255, 0.92);
  border-radius: 50%;
  box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.12);
}

.subject-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 16px;
}

.subject-card {
  position: relative;
  isolation: isolate;
  aspect-ratio: 1.28 / 1;
  min-height: 156px;
  align-items: flex-end;
  overflow: hidden;
  padding: 22px;
  border-inline-start: 1px solid var(--apple-border);
  background: var(--subject-bg, linear-gradient(135deg, #253047, #111827));
}

.subject-card::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  background:
    linear-gradient(145deg, rgba(255, 255, 255, 0.16), transparent 38%),
    radial-gradient(circle at 85% 15%, rgba(255, 255, 255, 0.22), transparent 30%);
  opacity: 0.8;
  transition: transform 0.45s var(--ease-apple), opacity 0.3s ease;
}

.subject-card::after {
  content: "";
  position: absolute;
  inset: auto -15% -35% 25%;
  height: 70%;
  z-index: -1;
  border-radius: 50%;
  border: 1px solid rgba(255, 255, 255, 0.15);
  transform: rotate(-18deg);
  box-shadow: 0 0 0 18px rgba(255, 255, 255, 0.03), 0 0 0 36px rgba(255, 255, 255, 0.025);
}

.subject-card:hover {
  border-color: rgba(255, 255, 255, 0.32);
  border-inline-start-color: rgba(255, 255, 255, 0.75);
  transform: translateY(-5px);
}

.subject-card:hover::before {
  transform: scale(1.12) rotate(3deg);
  opacity: 1;
}

.row.subject-card {
  background: var(--subject-bg, linear-gradient(135deg, #253047, #111827));
  border-inline-start-color: rgba(255, 255, 255, 0.12);
}

.row.subject-card:hover {
  background: var(--subject-bg, linear-gradient(135deg, #253047, #111827));
  border-inline-start-color: rgba(255, 255, 255, 0.75);
}

.subject-card .main {
  position: relative;
  z-index: 1;
}

.subject-card .name {
  font-size: clamp(19px, 2.5vw, 25px);
  line-height: 1.25;
  text-shadow: 0 2px 14px rgba(0, 0, 0, 0.4);
}

.subject-card .meta {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 7px;
  color: rgba(255, 255, 255, 0.76);
}

.subject-card .subject-count {
  display: block;
  width: 100%;
  margin-top: 5px;
  color: #ffffff;
  font-size: 16px;
  font-weight: 800;
  line-height: 1.35;
  text-shadow: 0 2px 12px rgba(0, 0, 0, 0.35);
}

.subject-card .code {
  background: rgba(0, 0, 0, 0.24);
  color: rgba(255, 255, 255, 0.9);
}

.subject-network-protocols { --subject-bg: linear-gradient(135deg, #075985, #172554 72%); }
.subject-wireless { --subject-bg: linear-gradient(135deg, #0f766e, #164e63 72%); }
.subject-network-security { --subject-bg: linear-gradient(135deg, #9f1239, #3f0d27 72%); }
.subject-network-programming { --subject-bg: linear-gradient(135deg, #7c3aed, #312e81 72%); }
.subject-cryptography { --subject-bg: linear-gradient(135deg, #b45309, #451a03 72%); }
.subject-unix { --subject-bg: linear-gradient(135deg, #3f6212, #1c1917 72%); }

.row {
  display: flex;
  align-items: center;
  gap: 14px;
  width: 100%;
  text-align: start;
  background: var(--apple-surface);
  border: 1px solid var(--apple-border);
  border-inline-start: 4px solid transparent;
  border-radius: 18px;
  padding: 18px 22px;
  cursor: pointer;
  backdrop-filter: blur(25px);
  -webkit-backdrop-filter: blur(25px);
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
  transition: all 0.3s var(--ease-apple);
}

.row:hover {
  background: var(--apple-surface-hover);
  border-color: var(--apple-border-strong);
  border-inline-start-color: var(--apple-red);
  transform: translateX(-4px);
}

.row .main {
  flex: 1;
  min-width: 0;
}

.row .name {
  font-weight: 700;
  font-size: 17.5px;
  color: #ffffff;
  overflow-wrap: anywhere;
}

.row .meta {
  color: var(--text-secondary);
  font-size: 14px;
  margin-top: 3px;
}

.row .code {
  direction: ltr;
  unicode-bidi: isolate;
  display: inline-block;
  font-family: 'JetBrains Mono', monospace;
  background: rgba(255, 255, 255, 0.08);
  padding: 2px 8px;
  border-radius: 6px;
  font-size: 13px;
}

.chev {
  color: var(--text-secondary);
  flex: none;
  transition: transform 0.2s var(--ease-apple);
}

.row:hover .chev {
  transform: translateX(-3px);
  color: #ffffff;
}

.exam {
  align-items: flex-start;
  cursor: default;
}

.exam:hover {
  border-inline-start-color: transparent;
  background: var(--apple-surface);
  transform: none;
}

.exam .note {
  color: #cbd5e1;
  font-size: 14px;
  margin-top: 4px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.filelink {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-top: 10px;
  font-size: 14px;
  color: var(--apple-blue);
  text-decoration: none;
  font-weight: 600;
  transition: all 0.2s var(--ease-apple);
}

.filelink:hover {
  text-decoration: underline;
  transform: translateX(-3px);
}

/* Quiz Button */
.btn-quiz {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  margin-top: 10px;
  background: linear-gradient(135deg, rgba(255, 69, 58, 0.14) 0%, rgba(10, 132, 255, 0.14) 100%);
  border: 1px solid var(--apple-red);
  color: #ff9b94;
  padding: 8px 18px;
  border-radius: 99px;
  font-size: 14px;
  font-weight: 700;
  text-decoration: none;
  transition: all 0.25s var(--ease-apple);
}

.btn-quiz:hover {
  background: var(--apple-red);
  color: #ffffff;
  transform: translateY(-1px) scale(1.02);
  box-shadow: 0 4px 18px rgba(255, 69, 58, 0.35);
}

.btn-quiz:active {
  transform: scale(0.96);
}

/* ---------- Navigation Header ---------- */
.back {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: none;
  border: 0;
  padding: 8px 0;
  color: var(--text-secondary);
  cursor: pointer;
  font-size: 15px;
  font-weight: 600;
  transition: all 0.2s var(--ease-apple);
}

.back:hover {
  color: #ffffff;
  transform: translateX(4px);
}

.subject-head {
  margin: 6px 0 24px;
}

.subject-head h2 {
  margin: 6px 0 4px;
  font-size: clamp(24px, 5vw, 30px);
  font-weight: 800;
  color: #ffffff;
  letter-spacing: -0.02em;
}

.subject-head .sub {
  color: var(--text-secondary);
  font-size: 14.5px;
  direction: ltr;
  unicode-bidi: isolate;
  text-align: start;
  font-family: 'JetBrains Mono', monospace;
}

/* ---------- State indicators ---------- */
.empty {
  border: 1px dashed var(--apple-border);
  border-radius: 18px;
  padding: 36px 20px;
  text-align: center;
  color: var(--text-secondary);
  background: var(--apple-surface);
  backdrop-filter: blur(20px);
}

.empty strong {
  display: block;
  color: #ffffff;
  font-size: 18px;
  margin-bottom: 6px;
}

.hint {
  color: var(--text-secondary);
  font-size: 13.5px;
  margin-top: 16px;
  text-align: center;
}

@media (max-width: 480px) {
  .row { padding: 14px; }
  .row .name { font-size: 16px; }

  .subject-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
  }

  .subject-card {
    aspect-ratio: 1.18 / 1;
    min-height: 128px;
    padding: 16px;
  }

  .subject-card .name {
    font-size: 18px;
  }

  .subject-card .subject-count {
    font-size: 15px;
  }
}

@media (min-width: 481px) and (max-width: 720px) {
  .subject-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

/* =======================================================
   ---------- زر ونموذج البلاغات (Netlify Forms) ----------
   ======================================================= */
.btn-bug-float {
  position: fixed;
  bottom: 56px;
  right: 24px;
  z-index: 99;
  display: inline-flex;
  align-items: center;
  gap: 9px;
  background: rgba(22, 28, 42, 0.82);
  color: var(--text-primary);
  border: 1px solid var(--apple-border-strong);
  padding: 10px 18px;
  border-radius: 999px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
  transition: all 0.28s var(--ease-apple);
}

.btn-bug-float svg {
  color: var(--apple-red);
  transition: transform 0.3s var(--ease-apple);
}

.btn-bug-float:hover {
  background: rgba(30, 39, 58, 0.95);
  border-color: rgba(255, 69, 58, 0.5);
  transform: translateY(-3px) scale(1.02);
  box-shadow: 0 12px 36px rgba(255, 69, 58, 0.22);
}

.btn-bug-float:hover svg {
  transform: rotate(-15deg);
}

.btn-bug-float:active {
  transform: scale(0.96);
}

/* Modal Overlay */
.report-modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(4, 6, 10, 0.72);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 18px;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.3s var(--ease-apple), visibility 0.3s ease;
}

.report-modal-overlay.active {
  opacity: 1;
  visibility: visible;
}

.report-modal {
  background: linear-gradient(180deg, rgba(24, 31, 48, 0.95) 0%, rgba(13, 17, 28, 0.97) 100%);
  border: 1px solid var(--apple-border-strong);
  border-radius: 22px;
  width: 100%;
  max-width: 480px;
  padding: 26px 24px;
  box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
  transform: translateY(20px) scale(0.97);
  transition: all 0.3s var(--ease-apple);
  position: relative;
  overflow: hidden;
}

.report-modal-overlay.active .report-modal {
  transform: translateY(0) scale(1);
}

.report-modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
}

.report-modal-header h3 {
  margin: 0;
  font-size: 1.25rem;
  font-weight: 800;
  color: #ffffff;
  display: flex;
  align-items: center;
  gap: 8px;
}

.report-modal-header h3 svg {
  color: var(--apple-red);
}

.btn-close-modal {
  background: rgba(255, 255, 255, 0.08);
  border: none;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  cursor: pointer;
  color: var(--text-secondary);
  transition: all 0.2s var(--ease-apple);
}

.btn-close-modal:hover {
  background: rgba(255, 69, 58, 0.2);
  color: var(--apple-red);
}

.report-form {
  display: flex;
  flex-direction: column;

  var currentId = null;

  var app = document.getElementById("app");
  var transitionTimer = null;

  var pageTransition = document.getElementById("pageTransition");
  requestAnimationFrame(function () { pageTransition.classList.add("is-ready"); });

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function safeUrl(u) {
    var t = String(u || "").trim();
    if (!t) return "";
    if (t.endsWith(".html") || t.startsWith("#") || t.startsWith("/") || t.startsWith("./")) return t;
    if (!/^https?:\/\//i.test(t)) t = "https://" + t;
    try { var p = new URL(t); return (p.protocol === "http:" || p.protocol === "https:") ? p.href : ""; }
    catch (e) { return ""; }
  }

  /* ============ التنقل ============ */
  function readHash() {
    var m = /^#\/s\/(.+)$/.exec(location.hash || "");
    return m ? decodeURIComponent(m[1]) : null;
  }

  function go(id) {
    var nextHash = id ? "#/s/" + encodeURIComponent(id) : "#/";
    if (location.hash === nextHash) return;

    clearTimeout(transitionTimer);
    app.classList.remove("page-enter");
    app.classList.add("page-leave");
    transitionTimer = setTimeout(function () {
      location.hash = nextHash;
    }, 180);
  }

  window.addEventListener("hashchange", function () {
    currentId = readHash();
    window.scrollTo(0, 0);
    render(true);
  });

  /* ============ العرض ============ */
  function render(animate) {
    if (currentId) renderSubject(); else renderHome();
    if (!animate) return;

    app.classList.remove("page-leave");
    void app.offsetWidth;
    app.classList.add("page-enter");
    setTimeout(function () { app.classList.remove("page-enter"); }, 650);
  }

  function renderHome() {
    var q = search.trim().toLowerCase();
    var list = subjects.filter(function (s) {
      if (!q) return true;
      return (s.name || "").toLowerCase().indexOf(q) > -1 || (s.code || "").toLowerCase().indexOf(q) > -1;
    });

    var body = "";
    if (!list.length) {
      body = '<div class="empty"><strong>لا توجد نتائج</strong>لم نتمكن من العثور على مادة مطابقة.</div>';
    } else {
      body = '<div class="subject-grid">' + list.map(function (s) {
        var examList = exams[s.id] || [];
        var count = examList.length;
        var meta = [];
        if (s.code) meta.push('<span class="code">' + esc(s.code) + "</span>");
        var countLabel = count === 0 ? "لا توجد أسئلة حالياً" : count + (count === 1 ? " نموذج اختبار" : " نماذج اختبارات");
        meta.push('<span class="subject-count">' + esc(countLabel) + "</span>");
        return '' +
          '<div class="row subject-card subject-' + esc(s.id) + '" role="button" tabindex="0" data-open="' + esc(s.id) + '">' +
            '<div class="main">' +
              '<div class="name">' + esc(s.name) + "</div>" +
              '<div class="meta">' + meta.join("  ") + "</div>" +
            "</div>" +
            '<span class="chev" aria-hidden="true">' + iconChev() + "</span>" +
          "</div>";
      }).join("") + "</div>";
    }

    app.innerHTML =
      '<div class="bar">' +
        '<input class="search" id="q" type="search" placeholder="ابحث عن مادة…" value="' + esc(search) + '">' +
      "</div>" + body +
      '<p class="hint">اضغط على المادة للانتقال إلى نماذج الامتحانات.</p>';

    var qInput = document.getElementById("q");
    if (qInput) {
      qInput.addEventListener("input", function () { 
        search = this.value; 
        var pos = this.selectionStart; 
        renderHome(); 
        var reFocus = document.getElementById("q"); 
        reFocus.focus(); 
        try { reFocus.setSelectionRange(pos, pos); } catch (e) {} 
      });
    }
  }

  function renderSubject() {
    var s = subjects.find(function (item) { return item.id === currentId; });

    if (!s) {
      app.innerHTML = '<button class="back" id="back">' + iconBack() + " رجوع للمواد</button>" +
        '<div class="empty"><strong>المادة غير موجودة</strong>الرجاء العودة للقائمة الرئيسية.</div>';
      document.getElementById("back").addEventListener("click", function () { go(null); });

    }

    var subjectExams = exams[currentId] || [];
    var body = "";

  function iconBack() { return '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>'; }
  function iconLink() { return '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg>'; }
  function iconFlash() { return '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>'; }

      var targetUrl = examLink.href;
      clearTimeout(transitionTimer);
      app.classList.remove("page-enter");
      app.classList.add("page-leave");
      pageTransition.classList.remove("is-ready");
      pageTransition.classList.add("is-leaving");
      transitionTimer = setTimeout(function () {
        window.location.href = targetUrl;
      }, 400);
      return;
    }

    var t = e.target.closest("[data-open]");
    if (t) go(t.getAttribute("data-open"));
  });

  app.addEventListener("keydown", function (e) {
    if (e.key !== "Enter" && e.key !== " ") return;
    var t = e.target.closest("[data-open]");
    if (!t) return;
    e.preventDefault();
    go(t.getAttribute("data-open"));

  /* ============ تشغيل نافذة ونموذج Netlify ============ */

  var statusDiv = document.getElementById("reportStatus");

  function openModal() {

    if (pageInput) {
      var currentContext = currentId ? "مادة: " + currentId + " | " : "الرئيسية | ";
      pageInput.value = currentContext + window.location.href;
    }
  }

  function closeModal() {
    overlay.classList.remove("active");
    overlay.setAttribute("aria-hidden", "true");
  }

  if (openBtn) openBtn.addEventListener("click", openModal);
  if (closeBtn) closeBtn.addEventListener("click", closeModal);

  if (overlay) {
    overlay.addEventListener("click", function (e) {
      if (e.target === overlay) closeModal();
    });
  }

  window.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && overlay && overlay.classList.contains("active")) {
      closeModal();
    }
  });

  // إرسال البلاغ بدون مغادرة الصفحة (متوافق 100% مع Netlify للنماذج النصية)
  if (form) {
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      submitBtn.disabled = true;
      submitBtn.textContent = "جارِ الإرسال...";
      statusDiv.style.display = "none";

      var formData = new FormData(form);

      // تحويل البيانات للصيغة التي يقبلها Netlify للنماذج النصية
      fetch("/", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: new URLSearchParams(formData).toString()
      })
      .then(function (response) {
        if (response.ok) {
          statusDiv.className = "report-status success";
          statusDiv.textContent = "تم إرسال البلاغ بنجاح، شكراً لمساعدتك!";
          form.reset();
          setTimeout(function () {
            closeModal();
            submitBtn.disabled = false;
            submitBtn.textContent = "إرسال البلاغ";
          }, 2000);
        } else {
          throw new Error("Form submission failed");
        }
      })
      .catch(function () {
        statusDiv.className = "report-status error";
        statusDiv.textContent = "حدث خطأ أثناء الإرسال، تأكد من اتصالك بالإنترنت.";
        submitBtn.disabled = false;
        submitBtn.textContent = "إرسال البلاغ";
      });
    });
  }

})();
</script>
</body>
</html>
