<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="بنك أسئلة وسنوات سابقة لطلاب هندسة الشبكات والجامعة - امتحانات وحلول لمواد NES.">
<meta name="keywords" content="سنوات, أسئلة, شبكات, NES415, NES441, التكنو, JUST">
<meta name="google" content="notranslate">
<title>JUSTSNWAT | بنك أسئلة وسنوات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<!-- Three.js Library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root {
  --bg-base: #050608;
  --apple-surface: rgba(18, 22, 34, 0.75);
  --apple-surface-hover: rgba(26, 32, 48, 0.9);
  --apple-border: rgba(255, 255, 255, 0.08);
  --apple-border-strong: rgba(255, 255, 255, 0.16);
  --apple-red: #ff453a;
  --apple-blue: #0a84ff;
  --apple-green: #30d158;
  --apple-gold: #ffd700;
  --text-primary: #f5f5f7;
  --text-secondary: #8e95a5;
  --ease-apple: cubic-bezier(0.16, 1, 0.3, 1);
  --radius: 16px;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  padding: 0;
}

body {
  background-color: var(--bg-base) !important;
  color: var(--text-primary) !important;
  font-family: -apple-system, BlinkMacSystemFont, 'Cairo', sans-serif;
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  letter-spacing: -0.01em;
  overflow-x: hidden;
  position: relative;
}

button, input, textarea, select {
  font: inherit;
  color: inherit;
}

a {
  color: inherit;
  text-decoration: none;
}

.wrap {
  max-width: 940px;
  margin: 0 auto;
  padding: 6px 20px 80px;
  flex: 1;
  width: 100%;
  position: relative;
  z-index: 10;
}

/* ---------- Header & Navbar ---------- */
.masthead {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  padding: 14px clamp(20px, 5vw, 64px);
  background: linear-gradient(180deg, rgba(14, 18, 28, 0.94) 0%, rgba(6, 7, 10, 0.88) 100%);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border-bottom: 1px solid var(--apple-border);
  position: sticky;
  top: 0;
  z-index: 80;
  transition: border-color 0.3s var(--ease-apple);
}

.masthead::before {
  content: "";
  position: absolute;
  width: 22%;
  min-width: 180px;
  height: 2px;
  top: 0;
  right: 8%;
  background: linear-gradient(90deg, transparent, #0a84ff, transparent);
  box-shadow: 0 0 22px rgba(10, 132, 255, 0.7);
}

.masthead.scrolled {
  border-bottom-color: var(--apple-border-strong);
  box-shadow: 0 14px 34px rgba(0,0,0,0.46);
}

.nav-right-side {
  display: flex;
  align-items: center;
  gap: 22px;
}

.brand-line {
  display: inline-flex;
  align-items: center;
  gap: 12px;
}

.brand-mark {
  width: 34px;
  height: 34px;
  display: grid;
  place-items: center;
  border: 1px solid rgba(255, 255, 255, 0.22);
  border-radius: 10px;
  background: linear-gradient(145deg, var(--apple-red), #9f1239 68%);
  box-shadow: 0 7px 22px rgba(255, 69, 58, 0.25);
}

.brand-mark span {
  width: 12px;
  height: 12px;
  border: 2px solid rgba(255, 255, 255, 0.92);
  border-radius: 50%;
  box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.12);
}

.brand {
  font-size: clamp(1.45rem, 3.5vw, 1.9rem);
  font-weight: 900;
  letter-spacing: 2px;
  color: #ffffff;
}

/* قائمة الأقسام المنسدلة */
.dept-dropdown {
  position: relative;
}

.dept-dropdown-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid var(--apple-border-strong);
  color: #f5f5f7;
  padding: 7px 16px;
  border-radius: 999px;
  font-size: 13.5px;
  font-weight: 700;
  cursor: pointer;
  backdrop-filter: blur(16px);
  transition: all 0.25s var(--ease-apple);
}

.dept-dropdown-btn:hover,
.dept-dropdown.open .dept-dropdown-btn {
  background: rgba(255, 255, 255, 0.12);
  border-color: var(--apple-blue);
  box-shadow: 0 0 16px rgba(10, 132, 255, 0.25);
}

.dept-dropdown-btn svg {
  transition: transform 0.25s var(--ease-apple);
}

.dept-dropdown.open .dept-dropdown-btn svg {
  transform: rotate(180deg);
}

.dept-dropdown-menu {
  position: absolute;
  top: calc(100% + 8px);
  right: 0;
  min-width: 290px;
  background: rgba(14, 18, 28, 0.96);
  border: 1px solid var(--apple-border-strong);
  border-radius: 18px;
  padding: 8px;
  box-shadow: 0 20px 48px rgba(0, 0, 0, 0.65);
  backdrop-filter: blur(28px);
  -webkit-backdrop-filter: blur(28px);
  opacity: 0;
  visibility: hidden;
  transform: translateY(8px) scale(0.96);
  transition: all 0.22s var(--ease-apple);
  z-index: 100;
}

.dept-dropdown.open .dept-dropdown-menu {
  opacity: 1;
  visibility: visible;
  transform: translateY(0) scale(1);
}

.dept-menu-item {
  display: flex;
  flex-direction: column;
  gap: 3px;
  padding: 11px 13px;
  border-radius: 12px;
  background: transparent;
  transition: all 0.2s var(--ease-apple);
  cursor: pointer;
}

.dept-menu-item:hover {
  background: rgba(255, 255, 255, 0.08);
  transform: translateX(-3px);
}

.dept-menu-title {
  font-size: 14px;
  font-weight: 800;
  color: #ffffff;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.dept-menu-tag {
  font-size: 11px;
  font-family: 'JetBrains Mono', monospace;
  background: rgba(10, 132, 255, 0.18);
  color: #7dd3fc;
  padding: 2px 7px;
  border-radius: 6px;
  font-weight: 700;
}

.dept-menu-sub {
  font-size: 12px;
  color: var(--text-secondary);
}

.sub-brand {
  display: flex;
  align-items: center;
  gap: 8px;
  color: #aeb9ca;
  font-size: 0.86rem;
  font-weight: 500;
}

.sub-brand::before {
  content: "";
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--apple-green);
  box-shadow: 0 0 12px rgba(48, 209, 88, 0.8);
}

/* ---------- Title & Hero ---------- */
.landing-hero {
  text-align: center;
  padding-top: 2px;
  position: relative;
  z-index: 20;
}

.landing-subtitle {
  margin: -8px auto 22px;
  color: rgba(226, 234, 238, 0.72);
  font-size: clamp(13px, 1.8vw, 15px);
  font-weight: 600;
  text-align: center;
}

.landing-title-clean {
  font-size: clamp(2.8rem, 6.5vw, 4.4rem);
  font-weight: 900;
  letter-spacing: -0.02em;
  margin: 0 0 16px;
  display: inline-block;
  background: linear-gradient(110deg, #ffffff 15%, #93c5fd 45%, #ffffff 55%, #dbeafe 75%, #ffffff 100%);
  background-size: 250% auto;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: titleShimmer 5s ease-in-out infinite, titleFloat 4s ease-in-out infinite;
  text-shadow: 0 10px 30px rgba(0, 0, 0, 0.85);
}

@keyframes titleShimmer {
  0% { background-position: 250% center; }
  100% { background-position: -250% center; }
}

@keyframes titleFloat {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-4px); }
}

/* شريط البحث */
.lux-search-container {
  position: relative;
  width: 100%;
  max-width: 650px;
  margin: 0 auto;
  z-index: 45;
}

.lux-search-box {
  position: relative;
  display: flex;
  align-items: center;
  background: rgba(16, 20, 30, 0.88);
  border: 1px solid rgba(255, 255, 255, 0.14);
  border-radius: 999px;
  padding: 5px 14px 5px 20px;
  backdrop-filter: blur(28px);
  -webkit-backdrop-filter: blur(28px);
  box-shadow: 0 14px 40px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.1);
  transition: all 0.35s var(--ease-apple);
}

.lux-search-box::before {
  content: "";
  position: absolute;
  inset: -2px;
  border-radius: 999px;
  background: linear-gradient(90deg, rgba(10, 132, 255, 0), rgba(10, 132, 255, 0.5), rgba(255, 69, 58, 0.4), rgba(10, 132, 255, 0));
  z-index: -1;
  opacity: 0;
  transition: opacity 0.4s var(--ease-apple);
  filter: blur(8px);
}

.lux-search-container.is-focused .lux-search-box {
  border-color: rgba(10, 132, 255, 0.9);
  background: rgba(20, 25, 38, 0.96);
  transform: scale(1.02) translateY(-2px);
  box-shadow: 0 20px 50px rgba(10, 132, 255, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.2);
}

.lux-search-container.is-focused .lux-search-box::before {
  opacity: 1;
}

.lux-search-icon {
  color: var(--apple-blue);
  display: grid;
  place-items: center;
  flex: none;
  margin-left: 12px;
  transition: transform 0.3s var(--ease-apple);
}

.lux-search-container.is-focused .lux-search-icon {
  transform: scale(1.15) rotate(-10deg);
  color: #ffffff;
}

.lux-search-input {
  width: 100%;
  background: transparent;
  border: none;
  color: #ffffff;
  font-size: 16px;
  font-weight: 600;
  outline: none;
  caret-color: var(--apple-blue);
  padding: 10px 0;
}

.lux-search-input::placeholder {
  color: #8b95a8;
  font-weight: 500;
}

.lux-results-dropdown {
  position: absolute;
  top: calc(100% + 10px);
  left: 0;
  right: 0;
  background: rgba(14, 18, 28, 0.96);
  border: 1px solid var(--apple-border-strong);
  border-radius: 20px;
  padding: 10px;
  box-shadow: 0 24px 60px rgba(0, 0, 0, 0.75);
  backdrop-filter: blur(35px);
  -webkit-backdrop-filter: blur(35px);
  max-height: 380px;
  overflow-y: auto;
  opacity: 0;
  visibility: hidden;
  transform: translateY(10px) scale(0.98);
  transition: all 0.25s var(--ease-apple);
  z-index: 50;
  text-align: start;
}

.lux-search-container.is-focused .lux-results-dropdown {
  opacity: 1;
  visibility: visible;
  transform: translateY(0) scale(1);
}

.lux-result-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 13px 16px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s var(--ease-apple);
  border: 1px solid transparent;
}

.lux-result-item:hover {
  background: rgba(255, 255, 255, 0.08);
  border-color: rgba(255, 255, 255, 0.12);
  transform: translateX(-4px);
}

.lux-result-titles {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.lux-result-ar {
  font-size: 15.5px;
  font-weight: 800;
  color: #ffffff;
}

.lux-result-en {
  font-size: 12.5px;
  color: var(--text-secondary);
  font-family: 'JetBrains Mono', monospace;
}

.lux-result-badges {
  display: flex;
  align-items: center;
  gap: 8px;
}

.lux-code-badge {
  font-size: 12px;
  font-family: 'JetBrains Mono', monospace;
  background: rgba(10, 132, 255, 0.18);
  color: #7dd3fc;
  padding: 3px 8px;
  border-radius: 6px;
  font-weight: 700;
}

.lux-count-badge {
  font-size: 11.5px;
  color: #cbd5e1;
  background: rgba(255, 255, 255, 0.06);
  padding: 3px 8px;
  border-radius: 6px;
  font-weight: 600;
}

.lux-no-results {
  padding: 24px;
  text-align: center;
  color: var(--text-secondary);
  font-size: 14.5px;
}

/* ---------- Apple-like route transitions ---------- */
#app.route-leave {
  animation: routeLeave 0.16s var(--ease-apple) both;
  pointer-events: none;
}

#app.route-enter {
  animation: routeEnter 0.46s var(--ease-apple) both;
}

#app.route-enter > * {
  animation: routeContentIn 0.42s var(--ease-apple) both;
}

#app.route-enter .subject-grid > .subject-card:nth-child(1) { animation-delay: 0.04s; }
#app.route-enter .subject-grid > .subject-card:nth-child(2) { animation-delay: 0.08s; }
#app.route-enter .subject-grid > .subject-card:nth-child(3) { animation-delay: 0.12s; }
#app.route-enter .subject-grid > .subject-card:nth-child(4) { animation-delay: 0.16s; }
#app.route-enter .subject-grid > .subject-card:nth-child(5) { animation-delay: 0.20s; }
#app.route-enter .subject-grid > .subject-card:nth-child(6) { animation-delay: 0.24s; }

@keyframes routeLeave {
  to { opacity: 0; transform: translateY(-10px) scale(0.992); filter: blur(3px); }
}

@keyframes routeEnter {
  from { opacity: 0; transform: translateY(12px) scale(0.992); filter: blur(3px); }
  to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
}

@keyframes routeContentIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

@media (prefers-reduced-motion: reduce) {
  #app.route-leave,
  #app.route-enter,
  #app.route-enter > * {
    animation: none;
  }
}

/* =========================================================
   الكرة ثلاثية الأبعاد (Cyber Particle Globe)
   ========================================================= */
.glass-globe-section {
  position: relative;
  width: 100%;
  height: 470px;
  margin: 6px auto 0;
  display: flex;
  justify-content: center;
  align-items: center;
  cursor: grab;
  touch-action: none;
  overflow: hidden;
}

.glass-globe-section:active {
  cursor: grabbing;
}

#globe-canvas {
  width: 100%;
  height: 100%;
  display: block;
}

.globe-tagline {
  margin: -12px 0 34px;
  color: rgba(226, 234, 238, 0.72);
  font-size: clamp(15px, 2vw, 18px);
  font-weight: 700;
  letter-spacing: 0;
  text-align: center;
  direction: ltr;
  unicode-bidi: isolate;
  text-shadow: 0 0 18px rgba(226, 234, 238, 0.12);
}

/* =========================================================
   Department View & Subject View
   ========================================================= */
.dept-header {
  margin: 8px 0 24px;
}

.dept-header h2 {
  font-size: clamp(24px, 4.5vw, 34px);
  font-weight: 900;
  color: #ffffff;
  margin: 6px 0 6px;
  letter-spacing: -0.02em;
}

.dept-header p {
  color: var(--text-secondary);
  font-size: 15px;
  margin: 0;
}

.bar {
  display: flex;
  gap: 12px;
  align-items: center;
  position: sticky;
  top: 110px;
  z-index: 40;
  padding: 8px 0;
  margin-bottom: 24px;
  background: linear-gradient(to bottom, rgba(5, 6, 8, 0.96) 0%, rgba(5, 6, 8, 0.8) 78%, transparent 100%);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
}

.search {
  position: relative;
  width: 100%;
  background: var(--apple-surface);
  border: 1px solid var(--apple-border-strong);
  border-radius: 999px;
  padding: 14px 48px 14px 20px;
  color: var(--text-primary);
  caret-color: var(--apple-blue);
  font-size: 15px;
  box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
  transition: all 0.25s var(--ease-apple);
}

.bar::before {
  content: "⌕";
  position: absolute;
  right: 18px;
  top: 50%;
  z-index: 1;
  color: var(--apple-blue);
  font-family: Georgia, serif;
  font-size: 24px;
  line-height: 1;
  transform: translateY(-55%) rotate(-15deg);
  pointer-events: none;
}

.search:focus {
  outline: none;
  border-color: rgba(10, 132, 255, 0.85);
  box-shadow: 0 0 0 4px rgba(10, 132, 255, 0.15), 0 16px 36px rgba(10, 132, 255, 0.2);
}

.search::placeholder {
  color: #9aa8bb;
}

.subject-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 16px;
}

.subject-card {
  position: relative;
  isolation: isolate;
  aspect-ratio: 1.25 / 1;
  min-height: 165px;
  align-items: flex-end;
  overflow: hidden;
  padding: 22px;
  border-inline-start: 1px solid var(--apple-border);
  background: var(--subject-bg, linear-gradient(135deg, rgba(37, 48, 71, 0.82), rgba(17, 24, 39, 0.9)));
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border-radius: 18px;
  cursor: pointer;
  transition: all 0.3s var(--ease-apple);
}

.subject-card:hover {
  border-color: rgba(255, 255, 255, 0.32);
  border-inline-start-color: var(--apple-blue);
  transform: translateY(-5px);
}

.subject-card .main {
  position: relative;
  z-index: 1;
  width: 100%;
}

.subject-card .ar-title {
  font-size: clamp(17px, 2.2vw, 21px);
  font-weight: 900;
  line-height: 1.3;
  color: #ffffff;
  text-shadow: 0 2px 14px rgba(0, 0, 0, 0.6);
  margin-bottom: 2px;
}

.subject-card .en-title {
  font-size: 13px;
  color: rgba(255, 255, 255, 0.72);
  font-family: 'JetBrains Mono', monospace;
  font-weight: 500;
}

.subject-card .meta {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 7px;
  color: rgba(255, 255, 255, 0.76);
  margin-top: 8px;
}

.subject-card .subject-count {
  display: block;
  width: 100%;
  margin-top: 5px;
  color: #ffffff;
  font-size: 13.5px;
  font-weight: 800;
}

.subject-card .code {
  background: rgba(0, 0, 0, 0.28);
  color: rgba(255, 255, 255, 0.95);
  padding: 2px 8px;
  border-radius: 6px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
}

.subject-network-protocols { --subject-bg: linear-gradient(135deg, rgba(7, 89, 133, 0.88), rgba(23, 37, 84, 0.92) 72%); }
.subject-wireless { --subject-bg: linear-gradient(135deg, rgba(15, 118, 110, 0.88), rgba(22, 78, 99, 0.92) 72%); }
.subject-network-security { --subject-bg: linear-gradient(135deg, rgba(159, 18, 57, 0.88), rgba(63, 13, 39, 0.92) 72%); }
.subject-network-programming { --subject-bg: linear-gradient(135deg, rgba(124, 58, 237, 0.88), rgba(49, 46, 129, 0.92) 72%); }
.subject-cryptography { --subject-bg: linear-gradient(135deg, rgba(180, 83, 9, 0.88), rgba(69, 26, 3, 0.92) 72%); }
.subject-unix { --subject-bg: linear-gradient(135deg, rgba(63, 98, 18, 0.88), rgba(28, 25, 23, 0.92) 72%); }
.subject-computer-networks { --subject-bg: linear-gradient(135deg, rgba(30, 64, 175, 0.88), rgba(15, 23, 42, 0.92) 72%); }
.subject-archi { --subject-bg: linear-gradient(135deg, rgba(190, 24, 93, 0.88), rgba(24, 24, 27, 0.92) 72%); }
.subject-os, .subject-os2 { --subject-bg: linear-gradient(135deg, rgba(75, 85, 99, 0.88), rgba(17, 24, 39, 0.92) 72%); }
.subject-data-structures { --subject-bg: linear-gradient(135deg, rgba(13, 148, 136, 0.88), rgba(15, 23, 42, 0.92) 72%); }

.row {
  display: flex;
  align-items: center;
  gap: 14px;
  width: 100%;
  text-align: start;
  background: var(--apple-surface);
  border: 1px solid var(--apple-border);
  border-inline-start: 4px solid transparent;
  border-radius: 18px;
  padding: 18px 22px;
  cursor: pointer;
  backdrop-filter: blur(25px);
  -webkit-backdrop-filter: blur(25px);
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
  transition: all 0.3s var(--ease-apple);
}

.row:hover {
  background: var(--apple-surface-hover);
  border-color: var(--apple-border-strong);
  border-inline-start-color: var(--apple-blue);
  transform: translateX(-4px);
}

.row .main { flex: 1; min-width: 0; }
.row .name { font-weight: 700; font-size: 17.5px; color: #ffffff; }
.row .meta { color: var(--text-secondary); font-size: 14px; margin-top: 3px; }
.chev { color: var(--text-secondary); flex: none; }

.exam { align-items: flex-start; cursor: default; }
.exam:hover { border-inline-start-color: transparent; background: var(--apple-surface); transform: none; }
.exam .note { color: #cbd5e1; font-size: 14px; margin-top: 4px; }

.btn-quiz {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  margin-top: 10px;
  background: linear-gradient(135deg, rgba(255, 69, 58, 0.18) 0%, rgba(10, 132, 255, 0.18) 100%);
  border: 1px solid var(--apple-red);
  color: #ff9b94;
  padding: 8px 18px;
  border-radius: 99px;
  font-size: 14px;
  font-weight: 700;
  text-decoration: none;
  transition: all 0.25s var(--ease-apple);
}

.btn-quiz:hover {
  background: var(--apple-red);
  color: #ffffff;
  transform: translateY(-1px) scale(1.02);

    function normalizeArabic(text) {
      if (!text) return "";
      return String(text)
        .trim()
        .toLowerCase()
        .replace(/[إأآٱ]/g, "ا")
        .replace(/[ة]/g, "ه")
        .replace(/[ى]/g, "ي")
        .replace(/[ؤ]/g, "و")
        .replace(/[ئ]/g, "ي")
        .replace(/[\u064B-\u065F\u0670]/g, "")
        .replace(/\u0640/g, "")
        .replace(/[\s\-_]+/g, " ");
    }

    function searchSubjects(query, deptFilter) {
      var pool = deptFilter ? allSubjects.filter(function(s) { return s.dept === deptFilter; }) : allSubjects;
      var normQ = normalizeArabic(query);
      if (!normQ) return pool;

      return pool.filter(function (s) {
        var normAr = normalizeArabic(s.arName);
        var normEn = normalizeArabic(s.name);
        var normCode = normalizeArabic(s.code);
        return normAr.indexOf(normQ) > -1 || normEn.indexOf(normQ) > -1 || normCode.indexOf(normQ) > -1;
      });
    }

    var app = document.getElementById("app");

        deptDropdown.classList.toggle("open");
        var isOpen = deptDropdown.classList.contains("open");
        deptDropdownBtn.setAttribute("aria-expanded", isOpen);
      });

      document.addEventListener("click", function (e) {
        if (!deptDropdown.contains(e.target)) {
          deptDropdown.classList.remove("open");
          deptDropdownBtn.setAttribute("aria-expanded", "false");
        }
      });
    }

    function esc(s) {
      return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
      });
    }

    function safeUrl(u) {
      var t = String(u || "").trim();
      if (!t) return "";
      if (t.endsWith(".html") || t.startsWith("#") || t.startsWith("/") || t.startsWith("./")) return t;
      if (!/^https?:\/\//i.test(t)) t = "https://" + t;
      try { var p = new URL(t); return (p.protocol === "http:" || p.protocol === "https:") ? p.href : ""; }
      catch (e) { return ""; }
    }

    function parseHash() {
      var h = location.hash || "";
      var mSubject = /^#\/s\/(.+)$/.exec(h);
      if (mSubject) return { type: "subject", id: decodeURIComponent(mSubject[1]) };

      var mDept = /^#\/dept\/(.+)$/.exec(h);
      if (mDept) return { type: "dept", id: decodeURIComponent(mDept[1]) };

      return { type: "home" };
    }

    function render(animate) {
      var route = parseHash();
      if (deptDropdown) deptDropdown.classList.remove("open");

      if (route.type === "subject") {
        renderSubject(route.id);
      } else if (route.type === "dept") {
        renderDepartment(route.id);
      } else {
        renderHome();
      }

      if (animate) {
        app.classList.remove("route-leave");
        void app.offsetWidth;
        app.classList.add("route-enter");
        window.setTimeout(function () { app.classList.remove("route-enter"); }, 720);
      }
    }

    window.addEventListener("hashchange", function () {
      clearTimeout(routeTimer);
      app.classList.remove("route-enter");
      app.classList.add("route-leave");
      routeTimer = window.setTimeout(function () {
        window.scrollTo(0, 0);
        render(true);
      }, 150);
    });

       3. الصفحة الرئيسية

    function renderHome() {
      app.innerHTML =
        '<div class="landing-hero">' +

          '<p class="landing-subtitle">بنك أسئلة السنوات السابقة — كل مادة وأسئلتها بمكان واحد.</p>' +

          '<div class="lux-search-container" id="luxSearchWrap">' +
            '<div class="lux-search-box">' +
              '<span class="lux-search-icon">' +
                '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">' +
                  '<circle cx="11" cy="11" r="8"></circle>' +
                  '<line x1="21" y1="21" x2="16.65" y2="16.65"></line>' +
                '</svg>' +
              '</span>' +
              '<input type="search" class="lux-search-input" id="luxSearchInput" placeholder="ابحث عن أي مادة (مثال: بروتوكولات، أمن، معمارية، NES415)..." autocomplete="off">' +
            '</div>' +
            '<div class="lux-results-dropdown" id="luxResultsDropdown"></div>' +
          '</div>' +

          '<div class="glass-globe-section" id="globe-canvas-wrap">' +
            '<canvas id="globe-canvas"></canvas>' +
          '</div>' +
          '<p class="globe-tagline">Learn Practice Get Ready.</p>' +
        '</div>';

      setupLuxSearch();
      initWeEvolveGlobe();
    }

    function setupLuxSearch() {
      var wrap = document.getElementById("luxSearchWrap");
      var input = document.getElementById("luxSearchInput");
      var dropdown = document.getElementById("luxResultsDropdown");

      if (!wrap || !input || !dropdown) return;

      function updateResults(q) {
        var matches = searchSubjects(q, null);
        if (!matches.length) {
          dropdown.innerHTML = '<div class="lux-no-results">لم نجد مادة مطابقة... جرب البحث برمز المادة أو جزء من اسمها.</div>';
          return;
        }

        dropdown.innerHTML = matches.map(function (s) {
          var count = (exams[s.id] || []).length;
          var countText = count === 0 ? "قريباً" : count + " نماذج";
          return '' +
            '<div class="lux-result-item" data-open="' + esc(s.id) + '">' +
              '<div class="lux-result-titles">' +
                '<div class="lux-result-ar">' + esc(s.arName) + '</div>' +
                '<div class="lux-result-en">' + esc(s.name) + '</div>' +
              '</div>' +
              '<div class="lux-result-badges">' +
                '<span class="lux-code-badge">' + esc(s.code) + '</span>' +
                '<span class="lux-count-badge">' + esc(countText) + '</span>' +
              '</div>' +
            '</div>';
        }).join("");
      }

      input.addEventListener("focus", function () {
        wrap.classList.add("is-focused");
        updateResults(this.value);
      });

      input.addEventListener("input", function () {
        updateResults(this.value);
      });

      document.addEventListener("click", function (e) {
        if (!wrap.contains(e.target)) {
          wrap.classList.remove("is-focused");
        }
      });

      window.addEventListener("keydown", function (e) {
        if ((e.ctrlKey && e.key.toLowerCase() === "k") || (e.key === "/" && document.activeElement !== input)) {
          e.preventDefault();
          input.focus();
        }
        if (e.key === "Escape") {
          input.blur();
          wrap.classList.remove("is-focused");
        }
      });
    }

    /* =======================================================
       4. محرك الكرة الأرضية التقنية (weevolveit.com replica)
       ======================================================= */
    var globeAnimId = null;

    function initWeEvolveGlobe() {
      var container = document.getElementById("globe-canvas-wrap");
      var canvas = document.getElementById("globe-canvas");

      if (!container || !canvas || typeof THREE === "undefined") return;
      if (globeAnimId) cancelAnimationFrame(globeAnimId);

      var scene = new THREE.Scene();
      var camera = new THREE.PerspectiveCamera(42, container.clientWidth / container.clientHeight, 0.1, 1000);
      camera.position.set(0, 0, 238);

      var renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
      renderer.setSize(container.clientWidth, container.clientHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

      var globeGroup = new THREE.Group();
      scene.add(globeGroup);

      var GLOBE_RADIUS = 72;

      // أ. سطح زجاجي شفاف يحافظ على عمق الكرة بدون إطار مضيء
      var coreGeo = new THREE.SphereGeometry(GLOBE_RADIUS * 0.99, 48, 48);
      var coreMat = new THREE.MeshBasicMaterial({
        color: 0x0b1219,
        transparent: true,
        opacity: 0.52,
        depthWrite: false
      });
      globeGroup.add(new THREE.Mesh(coreGeo, coreMat));

      var silverRim = new THREE.ShaderMaterial({
        vertexShader: `
          varying vec3 vNormal;
          varying vec3 vPosition;
          void main() {
            vNormal = normalize(normalMatrix * normal);
            vPosition = (modelViewMatrix * vec4(position, 1.0)).xyz;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          varying vec3 vNormal;
          varying vec3 vPosition;
          void main() {
            vec3 viewDirection = normalize(-vPosition);
            float rim = pow(1.0 - abs(dot(viewDirection, vNormal)), 3.0);
            gl_FragColor = vec4(vec3(0.72, 0.78, 0.82) * rim, rim * 0.3);
          }
        `,
        transparent: true,
        blending: THREE.AdditiveBlending,
        side: THREE.BackSide,
        depthWrite: false
      });
      globeGroup.add(new THREE.Mesh(new THREE.SphereGeometry(GLOBE_RADIUS * 1.025, 48, 48), silverRim));

      // ب. حدود اليابسة الحقيقية بخطوط ذهبية نظيفة
      var continentMaterial = new THREE.LineBasicMaterial({
        color: 0xe2ad45,
        transparent: true,
        opacity: 0.86,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });

      function addLandOutline(ring) {
        if (!ring || ring.length < 3) return;
        var outline = ring.map(function (point) {
          return latLonToVector3(point[1], point[0], GLOBE_RADIUS * 1.006);
        });
        globeGroup.add(new THREE.Line(
          new THREE.BufferGeometry().setFromPoints(outline),
          continentMaterial
        ));
      }

      fetch("https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_110m_land.geojson")
        .then(function (response) { return response.json(); })
        .then(function (landData) {
          landData.features.forEach(function (feature) {
            var geometry = feature.geometry || {};
            if (geometry.type === "Polygon") {
              geometry.coordinates.forEach(addLandOutline);
            } else if (geometry.type === "MultiPolygon") {
              geometry.coordinates.forEach(function (polygon) {
                polygon.forEach(addLandOutline);
              });
            }
          });
        })
        .catch(function () {
          // Keep the glass globe and network arcs visible if the map data is unavailable.
        });

      // ج. مسارات الربط ثلاثية الأبعاد (Network Cyber Arcs)
      function latLonToVector3(lat, lon, r) {
        var phi = (90 - lat) * (Math.PI / 180);
        var theta = (lon + 180) * (Math.PI / 180);
        return new THREE.Vector3(
          -(r * Math.sin(phi) * Math.cos(theta)),
          r * Math.cos(phi),
          r * Math.sin(phi) * Math.sin(theta)
        );
      }

      var hubList = [
        { lat: 31.95, lon: 35.91 },  // الأردن
        { lat: 51.50, lon: -0.12 },  // لندن
        { lat: 40.71, lon: -74.00 }, // نيويورك
        { lat: 35.67, lon: 139.65 }, // طوكيو
        { lat: 25.20, lon: 55.27 },  // دبي
        { lat: -33.86, lon: 151.20 } // سيدني
      ];

      // علامات متوهجة فوق العواصم
      hubList.forEach(function (h) {
        var pos = latLonToVector3(h.lat, h.lon, GLOBE_RADIUS * 1.01);
        var markerGeo = new THREE.RingGeometry(1.2, 2.0, 16);
        var markerMat = new THREE.MeshBasicMaterial({ color: 0x00f0ff, side: THREE.DoubleSide });
        var markerMesh = new THREE.Mesh(markerGeo, markerMat);
        markerMesh.position.copy(pos);
        markerMesh.lookAt(0, 0, 0);
        globeGroup.add(markerMesh);
      });

      var pulseItems = [];
      for (var i = 0; i < hubList.length; i++) {
        var pStart = hubList[i];
        var pEnd = hubList[(i + 1) % hubList.length];

        var v1 = latLonToVector3(pStart.lat, pStart.lon, GLOBE_RADIUS);
        var v2 = latLonToVector3(pEnd.lat, pEnd.lon, GLOBE_RADIUS);
        var mid = new THREE.Vector3().addVectors(v1, v2).multiplyScalar(0.5);
        var d = v1.distanceTo(v2);
        mid.normalize().multiplyScalar(GLOBE_RADIUS + d * 0.28);

        var curve = new THREE.QuadraticBezierCurve3(v1, mid, v2);
        var curvePoints = curve.getPoints(45);
        var curveGeo = new THREE.BufferGeometry().setFromPoints(curvePoints);
        var curveMat = new THREE.LineBasicMaterial({
          color: 0x00d2ff,
          transparent: true,
          opacity: 0.38
        });
        globeGroup.add(new THREE.Line(curveGeo, curveMat));

        // وميض البيانات السريع
        var pGeo = new THREE.SphereGeometry(1.2, 8, 8);
        var pMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        var pMesh = new THREE.Mesh(pGeo, pMat);
        globeGroup.add(pMesh);
        pulseItems.push({ mesh: pMesh, curve: curve, t: Math.random() });
      }

      globeGroup.rotation.y = 2.45;
      globeGroup.rotation.x = 0.24;

      // هـ. التفاعل والسحب السلس (Smooth Inertia Drag)
      var isDragging = false;
      var lastX = 0, lastY = 0;
      var spinSpeedX = 0, spinSpeedY = 0;

      container.addEventListener("pointerdown", function (e) {
        isDragging = true;
        lastX = e.clientX;
        lastY = e.clientY;
        spinSpeedX = 0;
        spinSpeedY = 0;
      });

      window.addEventListener("pointermove", function (e) {
        if (!isDragging) return;
        var dx = e.clientX - lastX;
        var dy = e.clientY - lastY;
        lastX = e.clientX;
        lastY = e.clientY;

        spinSpeedX = dx * 0.0018;
        spinSpeedY = dy * 0.0018;
        globeGroup.rotation.y += spinSpeedX;
        globeGroup.rotation.x += spinSpeedY;
        globeGroup.rotation.x = Math.max(-0.85, Math.min(0.85, globeGroup.rotation.x));
      });

      window.addEventListener("pointerup", function () { isDragging = false; });

      window.addEventListener("resize", function () {
        camera.aspect = container.clientWidth / container.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(container.clientWidth, container.clientHeight);
      });

      function animate() {
        globeAnimId = requestAnimationFrame(animate);

        pulseItems.forEach(function (p) {
          p.t += 0.0018;
          if (p.t > 1) p.t = 0;
          var pt = p.curve.getPoint(p.t);
          p.mesh.position.copy(pt);
        });

        if (!isDragging) {
          spinSpeedX *= 0.9;
          spinSpeedY *= 0.9;
          globeGroup.rotation.y += spinSpeedX + 0.00045;
          globeGroup.rotation.x += spinSpeedY;
          globeGroup.rotation.x = Math.max(-0.85, Math.min(0.85, globeGroup.rotation.x));
        }

        renderer.render(scene, camera);
      }
      animate();
    }

    /* =======================================================
       5. صفحة القسم
       ======================================================= */
    var deptSearch = "";
    function renderDepartment(deptId) {
      var meta = deptMeta[deptId] || { name: "القسم الأكاديمي", tag: deptId.toUpperCase(), desc: "تصفح المواد المتاحة." };
      var matches = searchSubjects(deptSearch, deptId);

      var body = "";
      if (!matches.length) {
        body = '<div class="empty"><strong>لا توجد نتائج مطابقة</strong>تأكد من كتابة اسم المادة أو رمزها بالشكل الصحيح.</div>';
      } else {
        body = '<div class="subject-grid">' + matches.map(function (s) {
          var examList = exams[s.id] || [];
          var count = examList.length;
          var countLabel = count === 0 ? "لا توجد أسئلة حالياً" : count + (count === 1 ? " نموذج اختبار" : " نماذج اختبارات");
          return '' +
            '<div class="row subject-card subject-' + esc(s.id) + '" role="button" tabindex="0" data-open="' + esc(s.id) + '">' +
              '<div class="main">' +
                '<div class="ar-title">' + esc(s.arName) + '</div>' +
                '<div class="en-title">' + esc(s.name) + '</div>' +
                '<div class="meta">' +
                  (s.code ? '<span class="code">' + esc(s.code) + '</span>' : '') +
                  '<span class="subject-count">' + esc(countLabel) + '</span>' +
                '</div>' +
              '</div>' +
              '<span class="chev" aria-hidden="true">' + iconChev() + '</span>' +
            '</div>';
        }).join("") + '</div>';
      }

      app.innerHTML =
        '<div style="padding-top: 10px;">' +
          '<a href="#/" class="back">' + iconBack() + ' رجوع للرئيسية</a>' +
          '<div class="dept-header">' +
            '<h2>قسم ' + esc(meta.name) + ' (' + esc(meta.tag) + ')</h2>' +
            '<p>' + esc(meta.desc) + '</p>' +
          '</div>' +
          '<div class="bar">' +
            '<input class="search" id="deptQuery" type="search" placeholder="ابحث في مواد القسم بالعربي أو الإنجليزي..." value="' + esc(deptSearch) + '">' +
          '</div>' +
          body +
          '<p class="hint">اضغط على أي مادة لعرض ملفات الاختبارات والحلول.</p>' +
        '</div>';

      var qInput = document.getElementById("deptQuery");
      if (qInput) {
        qInput.addEventListener("input", function () {
          deptSearch = this.value;
          var pos = this.selectionStart;
          renderDepartment(deptId);
          var reFocus = document.getElementById("deptQuery");
          if (reFocus) {
            reFocus.focus();
            try { reFocus.setSelectionRange(pos, pos); } catch (e) {}
          }
        });
      }
    }

    /* =======================================================
       6. صفحة المادة والاختبارات
       ======================================================= */
    function renderSubject(subjectId) {
      var s = allSubjects.find(function (item) { return item.id === subjectId; });

      if (!s) {
        app.innerHTML = '<div style="padding-top: 20px;">' +
          '<a href="#/" class="back">' + iconBack() + ' رجوع للرئيسية</a>' +
          '<div class="empty"><strong>المادة غير موجودة</strong>الرجاء العودة للقائمة الرئيسية.</div>' +
        '</div>';
        return;
      }

      var deptUrl = "#/dept/" + s.dept;
      var deptName = deptMeta[s.dept] ? deptMeta[s.dept].name : "القسم";
      var subjectExams = exams[subjectId] || [];
      var body = "";

      if (!subjectExams.length) {
        body = '<div class="empty"><strong>لا توجد أسئلة بعد</strong>لم تتم إضافة نماذج لهذه المادة حتى الآن.</div>';
      } else {
        body = '<div style="display:flex; flex-direction:column; gap:12px;">' + subjectExams.map(function (x) {
          var url = safeUrl(x.link);
          var isLocalQuiz = url && (url.endsWith(".html") || url.indexOf("quiz") > -1);
          var linkButtonHtml = "";
          if (isLocalQuiz) {
            linkButtonHtml = '<a class="btn-quiz" href="' + esc(url) + '">' + iconFlash() + ' بدء الاختبار</a>';
          } else if (url) {
            linkButtonHtml = '<a class="filelink" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + iconLink() + ' فتح الملف ↗</a>';
          }

          return '' +
            '<div class="row exam">' +
              '<div class="main">' +
                '<div class="name">' + esc(x.title) + '</div>' +
                (x.note ? '<div class="note">' + esc(x.note) + '</div>' : '') +
                linkButtonHtml +
              '</div>' +
            '</div>';
        }).join("") + '</div>';
      }

      app.innerHTML =
        '<div style="padding-top: 10px;">' +
          '<a href="' + deptUrl + '" class="back">' + iconBack() + ' رجوع لقسم ' + esc(deptName) + '</a>' +
          '<div class="subject-head">' +
            '<h2>' + esc(s.arName) + '</h2>' +
            '<div class="en-subtitle">' + esc(s.name) + '</div>' +
            (s.code ? '<div class="sub">رمز المادة: ' + esc(s.code) + '</div>' : '') +
          '</div>' +
          body +
        '</div>';
    }

    function iconChev() { return '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>'; }
    function iconBack() { return '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>'; }
    function iconLink() { return '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg>'; }
    function iconFlash() { return '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>'; }

    app.addEventListener("click", function (e) {
      var t = e.target.closest("[data-open]");
      if (t) location.hash = "#/s/" + encodeURIComponent(t.getAttribute("data-open"));
    });

    render();

    /* =======================================================
       7. ديسكورد وبلاغات الأخطاء
       ======================================================= */
    var openBtn = document.getElementById("openReportBtn");
    var closeBtn = document.getElementById("closeReportBtn");
    var overlay = document.getElementById("reportOverlay");
    var form = document.getElementById("bugReportForm");
    var statusDiv = document.getElementById("reportStatus");
    var submitBtn = document.getElementById("submitReportBtn");

    function openModal() {
      overlay.classList.add("active");
      overlay.setAttribute("aria-hidden", "false");
      statusDiv.className = "report-status";
      statusDiv.style.display = "none";
    }

    function closeModal() {
      overlay.classList.remove("active");
      overlay.setAttribute("aria-hidden", "true");
    }

    if (openBtn) openBtn.addEventListener("click", openModal);
    if (closeBtn) closeBtn.addEventListener("click", closeModal);
    if (overlay) {
      overlay.addEventListener("click", function (e) {
        if (e.target === overlay) closeModal();
      });
    }

    if (form) {
      // ضع هنا رابط الـ Worker الذي نسخته من كلاود فلاير
var WORKER_ENDPOINT = "https://justsnwat-reporter.abdalserhan20.workers.dev/";

form.addEventListener("submit", function (e) {
  e.preventDefault();
  submitBtn.disabled = true;
  submitBtn.textContent = "جارِ الإرسال...";
  statusDiv.style.display = "none";

  var payload = {
    issueType: document.getElementById("issue-type").value,
    issueDesc: document.getElementById("issue-desc").value,
    userContact: document.getElementById("user-contact").value.trim() || "غير محدد",
    currentUrl: window.location.href
  };

  fetch(WORKER_ENDPOINT, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  })
  .then(function (res) {
    if (!res.ok) throw new Error();
    return res.json();
  })
  .then(function () {
    statusDiv.className = "report-status success";
    statusDiv.textContent = "تم إرسال البلاغ بنجاح لديسكورد، شكراً لك!";
    form.reset();
    setTimeout(function () {
      closeModal();
      submitBtn.disabled = false;
      submitBtn.textContent = "إرسال البلاغ";
    }, 2000);
  })
  .catch(function () {
    statusDiv.className = "report-status error";
    statusDiv.textContent = "حدث خطأ أثناء الإرسال، تأكد من اتصالك بالإنترنت.";
    submitBtn.disabled = false;
    submitBtn.textContent = "إرسال البلاغ";
  });
});
    }

  })();
  </script>
