  <script>
    const originalDriveLink = "https://drive.google.com/file/d/14B37tp2rjNsHfVXp8I8OOKpKXXgbfy91/view";

    function escapeHtml(text) {
      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    const examSections = [
      {
        title: "CPE 352: First Exam (April 5th, 2023) — Form A Key",
        context: "Jordan University of Science and Technology — Department of Computer Engineering:",
        subQuestions: [
          {
            id: "q1",
            type: "input",
            text: "[Q1 (1pt)] If computer A runs a program in 30 seconds and computer B runs the same program in 80 seconds, how much faster is A than B?",
            img: "",
            unit: "times faster",
            validate: (input) => {
              const num = parseFloat(input.trim().replace(/[^0-9.]/g, ''));
              return Math.abs(num - 2.67) < 0.05 || Math.abs(num - 2.6666666) < 0.05;
            },
            dispAnswer: "2.6666666 (or 2.67)",
            exp: "نسبة التسريع (<bdi>Performance</bdi>): <bdi>Speedup = Execution Time_B / Execution Time_A = 80 / 30 = 2.6666666 ≈ 2.67</bdi> (بدون كتابة وحدة)."
          },
          {
            id: "q2",
            type: "table_q2",
            text: `[Q2 (1pt)] The following table shows the number of instructions and the CPI for each instruction type when running a program on a computer:
<div class="table-container ltr-content" style="max-width:440px;">
  <table class="exam-table">
    <thead>
      <tr>
        <th>Type</th>
        <th>Arithmetic</th>
        <th>Store</th>
        <th>Load</th>
        <th>Branch</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td style="font-weight:bold; color:var(--apple-blue);">IC</td>
        <td>10</td>
        <td>4</td>
        <td>8</td>
        <td>3</td>
      </tr>
      <tr>
        <td style="font-weight:bold; color:var(--apple-blue);">CPI</td>
        <td>2</td>
        <td>3</td>
        <td>3</td>
        <td>4</td>
      </tr>
    </tbody>
  </table>
</div>
The average CPI for this program is:`,
            img: "",
            dispAnswer: "2.72",
            exp: "حساب المتوسط: <bdi>Total Cycles = (10 × 2) + (4 × 3) + (8 × 3) + (3 × 4) = 20 + 12 + 24 + 12 = 68</bdi>.<br><bdi>Total IC = 10 + 4 + 8 + 3 = 25</bdi>.<br><bdi>Average CPI = 68 / 25 = 2.72</bdi>."
          },
          {
            id: "q3",
            type: "input",
            text: "<strong>[Q3 (1pt)]</strong> A CPU runs a program in 7 seconds. If the program has 7 × 10^9 instructions with CPI_ave = 2 then the clock frequency of this processor is:",
            img: "",
            unit: "GHz",
            validate: (input) => {
              const num = parseFloat(input.trim().replace(/[^0-9.]/g, ''));
              return Math.abs(num - 2) < 0.1 || Math.abs(num - 2000) < 5;
            },
            dispAnswer: "2 GHz (or 2)",
            exp: "معادلة التردد: <bdi>Clock Rate = (Instruction Count × CPI) / CPU Time = (7 × 10^9 × 2) / 7 = 2 × 10^9 Hz = 2 GHz</bdi>."
          },
          {
            id: "q4",
            type: "table_q4",
            text: "[Q4 (2pt)] A 2GHz processor executes a program in 10 seconds. If the average CPI is 2 then:",
            img: "",
            dispAnswer: "Number of cycles = 20 G (20 × 10^9)\nNumber of instructions = 10 G (10 × 10^9)",
            exp: "• عدد الدورات: <bdi>Cycles = CPU Time × Clock Rate = 10 × 2 GHz = 20 G cycles</bdi>.<br>• عدد التعليمات: <bdi>IC = Cycles / CPI = 20 G / 2 = 10 G instructions</bdi>."
          },
          {
            id: "q5",
            type: "input",
            text: "<strong>[Q5 (1pt)]</strong> Our favorite program runs in 8 seconds on computer A, which has a 2.5 GHz clock. We are trying to help a computer designer build a computer, B, which will run this program in 5 seconds. The designer has determined that a substantial increase in the clock rate is possible, but this increase will affect the rest of the CPU design, causing computer B to require 1.2 times as many clock cycles as computer A for this program. What clock rate should we tell the designer to target?",
            img: "",
            unit: "GHz",
            validate: (input) => {
              const num = parseFloat(input.trim().replace(/[^0-9.]/g, ''));
              return Math.abs(num - 4.8) < 0.1 || Math.abs(num - 4800) < 10;
            },
            dispAnswer: "4.8 GHz",
            exp: "• دورات الحاسوب A: <bdi>Cycles_A = 8 × 2.5 GHz = 20 G</bdi>.<br>• دورات الحاسوب B: <bdi>Cycles_B = 1.2 × 20 G = 24 G</bdi>.<br>• التردد المطلوب للحاسوب B: <bdi>Clock_B = Cycles_B / Time_B = 24 G / 5 = 4.8 GHz</bdi>."
          },
          {
            id: "q6",
            type: "input",
            text: "<strong>[Q6 (1pt)]</strong> Suppose we have two implementations of the same instruction set architecture. Computer A has a clock cycle time of 10 ns and a CPI of 2.0 for some program, and computer B has a clock cycle time of 20 ns and a CPI of 1 for the same program. Which computer is faster for this program and by how much?",
            img: "",
            unit: "",
            validate: (input) => {
              const v = input.toLowerCase().trim();
              return v.includes("same") || v.includes("equal") || v.includes("both");
            },
            dispAnswer: "Both have the same performance",
            exp: "• زمن التنفيذ للحاسوب A: <bdi>Time_A = IC × 2.0 × 10 ns = 20 × IC ns</bdi>.<br>• زمن التنفيذ للحاسوب B: <bdi>Time_B = IC × 1.0 × 20 ns = 20 × IC ns</bdi>.<br>كلا الحاسوبين يمتلكان نفس الأداء تماماً (<bdi>Same performance</bdi>)."
          },
          {
            id: "q7",
            type: "table_q7",
            text: "[Q7 (5pts)] Write single MIPS instruction that is equivalent to the given statement below:",
            img: "",
            dispAnswer: `1. Set $t2 to 1 if $t1 is less than 0  ->  slt $t2, $t1, $zero
2. If $t2 is 0 then go to label DONE otherwise continue  ->  beq $t2, $zero, DONE
3. Subtract 1 from $t1  ->  addi $t1, $t1, -1
4. Add 2 to $s2  ->  addi $s2, $s2, 2
5. Go to label exit  ->  j exit`,
            exp: "ترجمة العمليات إلى تعليمات MIPS أساسية مفردة."
          },
          {
            id: "q8",
            type: "table_q8",
            text: "[Q8 (1pt)] Consider the following C code and its compiled MIPS code. What is the value of the constant X?",
            img: "",
            dispAnswer: "16",
            exp: "الإزاحة المباشرة في تعليمة التحميل هي <bdi>64</bdi> بايت. وبما أن كل عنصر صحيح (<bdi>int</bdi>) حجمه 4 بايت، فإن المؤشر: <bdi>X = 64 / 4 = 16</bdi>."
          },
          {
            id: "q9",
            type: "input",
            text: "<strong>[Q9 (1pt)]</strong> Binary code of an arithmetic MIPS instruction is: <code>XXXX XX10 0011 0010 0100 0000 0010 0000</code><br>The index or number for the rt register in decimal is:",
            img: "",
            unit: "",
            validate: (input) => {
              const v = input.trim();
              return v === "18" || v === "10010";
            },
            dispAnswer: "18",
            exp: "توزيع حقول تعليمة <bdi>R-type</bdi>:<br>• <bdi>op = 6 bits (XXXXXX)</bdi><br>• <bdi>rs = 5 bits (10001)</bdi><br>• <bdi>rt = 5 bits (10010)</bdi> = 18 بالترميز العشري.<br>• <bdi>rd = 5 bits (01000)</bdi><br>• <bdi>shamt = 5 bits (00000)</bdi><br>• <bdi>funct = 6 bits (100000)</bdi>."
          },
          {
            id: "q10",
            type: "input",
            text: "<strong>[Q10 (1pt)]</strong> Binary code of an immediate MIPS instruction is: <code>XXXX XX10 0011 0010 1111 1111 1111 1100</code><br>The decimal value of the immediate data is:",
            img: "",
            unit: "",
            validate: (input) => {
              const v = input.trim();
              return v === "-4";
            },
            dispAnswer: "-4",
            exp: "حقل القيمة الفورية (<bdi>Immediate</bdi>) هو آخر 16 بت: <bdi>1111 1111 1111 1100</bdi>.<br>بما أن البت الأيسر 1، فالعدد سالب في نظام متمم الاثنين: <bdi>-(0000 0000 0000 0011 + 1) = -4</bdi>."
          },
          {
            id: "q11",
            type: "table_q11",
            text: "[Q11 (2pts)] A MIPS branch instruction is fetched from location (2016)_10, the address of the instruction to be fetched next is (2076)_10.",
            img: "",
            dispAnswer: "State whether branch is taken or not: Taken\nThe value of the offset in the instruction is: 14",
            exp: "• بما أن العنوان المنفذ بعد الفرع هو 2076 وليس العنوان التالي التسلسلي (2020)، فإن التفرع قد حدث: <bdi>Taken</bdi>.<br>• حساب الإزاحة: <bdi>Target = PC + 4 + (offset × 4)  ==>  2076 = 2020 + 4 × offset  ==>  4 × offset = 56  ==>  offset = 14</bdi>."
          },
          {
            id: "q12",
            type: "input",
            text: "<strong>[Q12 (1pt)]</strong> The PC after executing the jump instruction is (D0000004)_16. Find the value of the offset (target address field) in the jump instruction:",
            img: "",
            unit: "",
            validate: (input) => {
              const v = input.trim();
              return v === "1";
            },
            dispAnswer: "1",
            exp: "في تعليمة القفز <bdi>j</bdi>: يتشكل العنوان من <bdi>PC[31:28] || Target[25:0] || 00</bdi>.<br>العنوان <bdi>0xD0000004</bdi> يمتلك أول 4 بتات (D)، والبايتات الـ 28 السفلية هي <bdi>0x0000004</bdi>.<br>حقل الهدف في التعليمة = <bdi>4 / 4 = 1</bdi>."
          },
          {
            id: "q13",
            type: "table_q13",
            text: "[Q13 (2pts)] Use the IEEE 754 single precision floating point format (1 bit sign, 8 bit exponent, 23 bit fraction) to represent the floating number (1.0101)_2 × 2^-3:",
            img: "",
            dispAnswer: "Exponent (in binary) = 01111100\nFraction (in binary) = 01010000000000000000000",
            exp: "• الأس الفعلي: <bdi>-3</bdi>.<br>• الأس المنحاز: <bdi>-3 + 127 = 124 = (01111100)_2</bdi>.<br>• الكسر (<bdi>Fraction</bdi>): الجزء بعد الفاصلة وهو <bdi>0101</bdi> متبوعاً بأصفار حتى 23 بت."
          },
          {
            id: "q14",
            type: "input",
            text: "<strong>[Q14 (1pt)]</strong> Normalize (0.000101)_2 × 2^2 based on the IEEE 754 single precision floating point representation:",
            img: "",
            unit: "",
            validate: (input) => {
              const v = input.toLowerCase().replace(/[\s()_]/g, '');
              return v.includes("1.01") && (v.includes("2^-2") || v.includes("2^(-2)") || v.includes("*2^-2") || v.includes("x2^-2"));
            },
            dispAnswer: "(1.01)_2 × 2^-2",
            exp: "إزاحة الفاصلة 4 خانات لليمين للحصول على الصورة القياسية <bdi>1.01</bdi>:<br><bdi>0.000101_2 × 2^2 = 1.01_2 × 2^(2 - 4) = (1.01)_2 × 2^-2</bdi>."
          },
          {
            id: "q15",
            type: "input",
            text: "<strong>[Q15 (1pt)]</strong> What decimal number does the bit pattern 0xC3B00000 represent if it is a floating point number? Use the IEEE 754 standard:",
            img: "",
            unit: "",
            validate: (input) => {
              const v = input.trim();
              return v === "-352";
            },

    function toggleOriginalImage(qid) {
      const imgBox = document.getElementById(`img-box-${qid}`);
      const imgEl = document.getElementById(`img-${qid}`);

      if (imgEl && !imgEl.src && imgEl.dataset.src) {
        imgEl.src = imgEl.dataset.src;
      }

      if (imgBox) {
        imgBox.classList.toggle('show');
      }
    }

    function handleImageFallback(imgEl) {
      if (!imgEl.dataset.retried) {
        imgEl.dataset.retried = "1";
        if (imgEl.src.endsWith('.jpg')) {
          imgEl.src = imgEl.src.replace('.jpg', '.png');
        } else if (imgEl.src.endsWith('.png')) {
          imgEl.src = imgEl.src.replace('.png', '.jpg');
        }
      }
    }

    function findSubQuestion(subId) {
      for (const sec of examSections) {
        const found = sec.subQuestions.find(s => s.id === subId);
        if (found) return found;
      }
      return null;
    }

    function checkInputAnswer(subId) {
      const sub = findSubQuestion(subId);
      const inputEl = document.getElementById(`input-${subId}`);
      const resetBtn = document.getElementById(`reset-btn-${subId}`);
      const checkBtn = document.getElementById(`btn-check-${subId}`);
      if (!sub || !inputEl) return;

      const userVal = inputEl.value.trim();
      if (!userVal) {
        alert("يرجى إدخال إجابة أولاً!");
        return;
      }

      const isCorrect = sub.validate(userVal);
      inputEl.disabled = true;

      if (isCorrect) {
        inputEl.className = 'text-input-field correct';
        userScores[subId] = true;
      } else {
        inputEl.className = 'text-input-field wrong';
        delete userScores[subId];
      }

      if (checkBtn) checkBtn.style.display = 'none';
      if (resetBtn) resetBtn.style.display = 'inline-flex';

      calculateScore();
    }

      const resetBtn = document.getElementById(`reset-btn-${subId}`);

      const clean = v => v.replace(/[\s-]/g, '').toLowerCase();
      elE.disabled = elF.disabled = elD.disabled = true;

      const vE = clean(elE.value);
      const okE = vE === "00001" || vE === "1";

      const vF = clean(elF.value);
      const okF = vF.startsWith("101") || vF === "0.625";

      const vD = elD.value.trim();
      const okD = vD === "24576";

      elE.className = okE ? 'table-input correct' : 'table-input wrong';
      elF.className = okF ? 'table-input correct' : 'table-input wrong';
      elD.className = okD ? 'table-input correct' : 'table-input wrong';

      if (okE && okF && okD) userScores[subId] = true;
      else delete userScores[subId];

      if (checkBtn) checkBtn.style.display = 'none';
      if (resetBtn) resetBtn.style.display = 'inline-flex';
      calculateScore();
    }

    function resetSubQuestion(subId) {
      delete userScores[subId];

      const inputEl = document.getElementById(`input-${subId}`);
      if (inputEl) {
        inputEl.disabled = false;
        inputEl.value = '';
        inputEl.className = 'text-input-field';
        inputEl.focus();
      }

      if (subId === "q4") {
        ["q4_cycles", "q4_ic"].forEach(id => {
          const el = document.getElementById(id);
          if (el) { el.disabled = false; el.value = ''; el.className = 'table-input'; }
        });
      }

      if (subId === "q7") {
        ["q7_1", "q7_2", "q7_3", "q7_4", "q7_5"].forEach(id => {
          const el = document.getElementById(id);
          if (el) { el.disabled = false; el.value = ''; el.className = 'table-input'; }
        });
      }

      if (subId === "q11") {
        const elS = document.getElementById("q11_state");
        const elO = document.getElementById("q11_offset");
        if (elS) { elS.disabled = false; elS.value = ''; elS.className = 'table-input'; }
        if (elO) { elO.disabled = false; elO.value = ''; elO.className = 'table-input'; }
      }

      if (subId === "q13") {
        const elE = document.getElementById("q13_exp");
        const elF = document.getElementById("q13_frac");
        if (elE) { elE.disabled = false; elE.value = ''; elE.className = 'table-input'; }
        if (elF) { elF.disabled = false; elF.value = ''; elF.className = 'table-input'; }
      }

      if (subId === "q16") {
        ["q16_exp", "q16_frac", "q16_dec"].forEach(id => {
          const el = document.getElementById(id);
          if (el) { el.disabled = false; el.value = ''; el.className = 'table-input'; }
        });
      }

      const checkBtn = document.getElementById(`btn-check-${subId}`);
      const resetBtn = document.getElementById(`reset-btn-${subId}`);
      const sol = document.getElementById(`sol-${subId}`);
      const imgBox = document.getElementById(`img-box-${subId}`);

      if (checkBtn) checkBtn.style.display = 'inline-flex';
      if (resetBtn) resetBtn.style.display = 'none';
      if (sol) sol.classList.remove('show');
      if (imgBox) imgBox.classList.remove('show');

      calculateScore();
    }

    function calculateScore() {
      let total = 0;
      let score = 0;
      examSections.forEach(sec => {
        sec.subQuestions.forEach(sub => {
          total++;
          if (userScores[sub.id]) score++;
        });
      });

      const pct = total > 0 ? Math.round((score / total) * 100) : 0;
      const scoreEl = document.getElementById('score');
      if (scoreEl) {
        scoreEl.innerText = `${score} / ${total} (${pct}%)`;
      }
    }

    function toggleSolution(subId) {
      const sol = document.getElementById(`sol-${subId}`);
      if (sol) sol.classList.toggle('show');
    }

    let allShown = false;
    function toggleAllSolutions() {
      allShown = !allShown;
      examSections.forEach(sec => {
        sec.subQuestions.forEach(sub => {
          const sol = document.getElementById(`sol-${sub.id}`);
          if (sol) {
            if (allShown) sol.classList.add('show');
            else sol.classList.remove('show');
          }
        });
      });
    }

    function resetQuiz() {
      userScores = {};
      initQuiz();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function setupReportModal() {
      const openBtn = document.getElementById('openReportBtn');
      const closeBtn = document.getElementById('closeReportBtn');
      const overlay = document.getElementById('reportOverlay');
      const form = document.getElementById('bugReportForm');
      const status = document.getElementById('reportStatus');

      if (!openBtn || !overlay) return;

      openBtn.onclick = () => {
        overlay.classList.add('active');
        overlay.setAttribute('aria-hidden', 'false');
      };

      const closeModal = () => {
        overlay.classList.remove('active');
        overlay.setAttribute('aria-hidden', 'true');
        if (status) status.innerText = '';
      };

      if (closeBtn) closeBtn.onclick = closeModal;

      overlay.onclick = (e) => {
        if (e.target === overlay) closeModal();
      };

      if (form) {
        form.onsubmit = (e) => {
          e.preventDefault();
          const submitBtn = document.getElementById('submitReportBtn');
          if (submitBtn) submitBtn.disabled = true;
          if (status) {
            status.style.color = '#30d158';
            status.innerText = 'تم إرسال البلاغ بنجاح، شكراً لمساعدتك!';
          }
          setTimeout(() => {
            closeModal();
            form.reset();
            if (submitBtn) submitBtn.disabled = false;
          }, 1500);
        };
      }
    }

    initQuiz();
  </script>
  <script src="../transition.js"></script>
</body>
</html>
