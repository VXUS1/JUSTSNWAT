  <script>
    const originalDriveLink = "https://drive.google.com/file/d/1MKOV4tffK6w2N6iU1pJXvVjBuHdey3_R/view";

    function escapeHtml(text) {
      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    const letters = ['A', 'B', 'C', 'D', 'E'];

    const examSections = [
      {
        title: "Midterm Exam 2021 — Complete Questions",
        context: "Official solved exam sheet with full step-by-step verified explanations:",
        subQuestions: [
          {
            id: "q1",
            type: "single",
            text: `Q1. A CPU has a clock rate F = 5 × 10^9 Hz, what is the CPU execution time (in milliseconds) for executing a program with an average CPI of 2 and the following count per instruction type:
<div class="table-container ltr-content" style="max-width:280px;">
  <table class="exam-table">
    <thead>
      <tr><th>Class</th><th>IC (in Millions)</th></tr>
    </thead>
    <tbody>
      <tr><td>A</td><td>3</td></tr>
      <tr><td>B</td><td>2</td></tr>
      <tr><td>C</td><td>1</td></tr>
    </tbody>
  </table>
</div>`,
            img: "",
            opts: ["2.1", "2.2", "2.3", "2.4", "None of the other choices is correct."],
            ans: 3,
            dispAnswer: "D. 2.4",
            exp: "• إجمالي عدد التعليمات: <bdi>Total IC = 3 + 2 + 1 = 6 Million = 6 × 10^6</bdi>.<br>• إجمالي الدورات: <bdi>Cycles = IC × CPI = (6 × 10^6) × 2 = 12 × 10^6</bdi> دورة.<br>• زمن التنفيذ: <bdi>CPU Time = Cycles / F = (12 × 10^6) / (5 × 10^9) = 2.4 × 10^(-3) s = 2.4 ms</bdi>."
          },
          {
            id: "q2",
            type: "single",
            text: "Q2. A program consists of X% memory operations. An improved memory system reduces the execution time of this program by 30% and improves the time for memory operations by a factor of 4. What is X?",
            img: "",
            opts: ["30%", "40%", "50%", "60%", "None of the other choices is correct."],
            ans: 1,
            dispAnswer: "B. 40%",
            exp: "بتطبيق قانون أمداهل: انخفاض الزمن بنسبة 30% يعني أن الزمن الجديد أصبح 70% (<bdi>0.70</bdi>) من الزمن الأصلي.<br><bdi>(1 - f) + (f / 4) = 0.70  ==>  1 - 0.75 f = 0.70  ==>  0.75 f = 0.30  ==>  f = 0.40 = 40%</bdi>."
          },
          {
            id: "q3",
            type: "single",
            text: "Q3. A format similar to that of the IEEE 754 has a bias value of 511. How many bits are reserved for the exponent?",
            img: "",
            opts: ["7", "8", "9", "10", "None of the other choices is correct."],
            ans: 3,
            dispAnswer: "D. 10",
            exp: "معادلة الانحياز في معيار النقطة العائمة: <bdi>Bias = 2^(k - 1) - 1</bdi>.<br><bdi>511 = 2^(k - 1) - 1  ==>  2^(k - 1) = 512 = 2^9  ==>  k - 1 = 9  ==>  k = 10 bits</bdi>."
          },
          {
            id: "q4",
            type: "single",
            text: "Q4. The program that is used to measure the performance in a standard metric is usually referred to as:",
            img: "",
            opts: ["Benchmark", "Application", "Standard App", "Reference/Base", "None of the other choices is correct."],
            ans: 0,
            dispAnswer: "A. Benchmark",
            exp: "البرامج المعيارية المخصصة لقياس ومقارنة أداء المعالجات والأنظمة بدقة تُسمى برامج القياس المعياري (<bdi>Benchmark Programs</bdi> مثل مجموعة SPEC)."
          },
          {
            id: "q5",
            type: "single",
            text: "Q5. If the execution time of a given program on a given computer is 10 seconds, what is the execution time in cycles if the frequency is 1GHz?",
            img: "",
            opts: ["10^8", "10^9", "10^10", "10^11", "None of the other choices is correct."],
            ans: 2,
            dispAnswer: "C. 10^10",
            exp: "عدد دورات المعالج المطلوبة: <bdi>Cycles = CPU Time × Frequency = 10 s × 10^9 Hz = 10^10 cycles</bdi>."
          },
          {
            id: "q6",
            type: "single",
            text: "Q6. Which of the following is the codeword of the instruction (opcode 2) that is expected to jump to address C8000008?",
            img: "",
            opts: ["0x00000002", "0x08400002", "0x08400000", "0x0A00000F", "None of the other choices is correct."],
            ans: 4,
            dispAnswer: "E. None of the other choices is correct.",
            exp: "عنوان القفز في MIPS يتشكل من: <bdi>PC[31:28] || Target[25:0] << 2</bdi>.<br>للوصول إلى العنوان <bdi>0xC8000008</bdi>، فإن البتات الـ 26 السفلية تساوي: <bdi>0x8000008 / 4 = 0x2000002</bdi>.<br>وبدمج كود العملية 2 (<bdi>000010_2</bdi>) مع حقل الهدف ينتج: <bdi>0x0A000002</bdi>، وهو غير موجود في الخيارات المعطاة."
          },
          {
            id: "q7",
            type: "single",
            text: `Q7. Consider a 16-bit floating point number with the following format:
<br>• s (bit 15): 1 sign bit (1 for negative)
<br>• e (bits 14 to 8): 7-bit exponent using 2's complement representation.
<br>• f (bits 7 to 0): 8-bit fraction.
<br>The decimal equivalent is: (-1)^s × 0.f × 2^E where E is the signed number decimal equivalent of e.
<br><br>What is the decimal equivalent of <code>1, 1111100, 11000000</code> (expressed using this format)?`,
            img: "",
            opts: ["-3/16", "+3/16", "-0.75 * 2^43", "-0.75 * 2^13", "None of the other choices is correct."],
            ans: 4,
            dispAnswer: "E. None of the other choices is correct.",
            exp: "تحليل الحقول بحسب الصيغة المعطاة في السؤال:<br>• بت الإشارة: <bdi>s = 1</bdi> (سالب).<br>• حقل الأس بمتمم الاثنين: <bdi>1111100_2 = -4</bdi> (أي أن <bdi>E = -4</bdi>).<br>• الكسر: <bdi>0.f = 0.11000000_2 = 0.5 + 0.25 = 0.75 = 3/4</bdi>.<br>• القيمة العشرية: <bdi>-0.75 × 2^(-4) = -(3/4) × (1/16) = -3/64</bdi>، وهي غير موجودة ضمن الخيارات."
          },
          {
            id: "q8",
            type: "single",
            text: `Q8. Consider the following MIPS code shown at the corresponding addresses (all addresses are in decimal). The label func is at address 2100. What is the value of the beq offset in decimal?
<div class="table-container ltr-content" style="max-width:380px;">
  <table class="exam-table">
    <thead>
      <tr><th>Address</th><th>Instruction</th></tr>
    </thead>
    <tbody>
      <tr><td>2000</td><td>addi $s0, $t1, 12</td></tr>
      <tr><td>2004</td><td>or $s1, $s1, $t1</td></tr>
      <tr><td>2008</td><td>beq $s0, $s0, func</td></tr>
    </tbody>
  </table>
</div>`,
            img: "",
            opts: ["22", "8000", "17", "2080", "None of the other choices is correct."],
            ans: 0,
            dispAnswer: "A. 22",
            exp: "معادلة عنوان التفرع: <bdi>Target = (PC + 4) + (offset × 4)</bdi>.<br>عنوان التعليمة التالية: <bdi>PC + 4 = 2008 + 4 = 2012</bdi>.<br><bdi>2100 = 2012 + (offset × 4)  ==>  offset × 4 = 88  ==>  offset = 88 / 4 = 22</bdi>."
          },
          {
            id: "q9",
            type: "single",
            text: "Q9. In IEEE 754 floating point single precision, the special case of (+infinity) is when:",
            img: "",
            opts: [
              "Exponent = zero, fraction = zero, s = 1",
              "Exponent = zero, fraction = zero, s = 0",
              "Exponent = zero, fraction = all ones, s = 1",
              "Exponent = 255, fraction = zero, s = 0",
              "None of the other choices is correct."
            ],
            ans: 3,
            dispAnswer: "D. Exponent = 255, fraction = zero, s = 0",
            exp: "في معيار <bdi>IEEE 754</bdi> الدقة الأحادية، تُمثل اللانهاية الموجبة (<bdi>+infinity</bdi>) بحقل أس ممتلئ بالواحدات (<bdi>Exponent = 255</bdi>)، وحقل كسر صفري بالكامل (<bdi>Fraction = 0</bdi>)، وبت إشارة يساوي <bdi>s = 0</bdi>."
          },
          {
            id: "q10",
            type: "single",
            text: "Q10. Which of the following code segments will branch to label, if [$s0] is less than [$s2]?",
            img: "",
            opts: [
              "slt $t0, $s0,$s2 \nbeq $t0,$zero, label",
              "slt $t0, $s0,$s2 \nbne $t0,$zero, label",
              "slt $s0, $t0,$s2 \nbeq $t0,$zero, label",
              "slt $t0, $s0,$s2 \nbeq $s0,$zero, label",
              "None of the other choices is correct."
            ],
            ans: 1,
            dispAnswer: "B. slt $t0, $s0,$s2 \nbne $t0,$zero, label",
            exp: "تعليمة <bdi>slt $t0, $s0,$s2</bdi> تضع 1 في <bdi>$t0</bdi> إذا كان <bdi>$s0 < $s2</bdi>، وتضع 0 إذا لم يتحقق الشرط.<br>للتحقق من حدوث الشرط والتفرع يجب فحص هل <bdi>$t0 != 0</bdi> عبر تعليمة: <bdi>bne $t0,$zero, label</bdi>."
          },
          {
            id: "q11",
            type: "single",
            text: "Q11. If the cycle time Tc (single cycle machine) = 700 ps, Tc (pipelining) = 250 ps, CPI_avg (pipelining) = 2, the speedup of the pipelined machine over the single cycle machine is equal to:",
            img: "",
            opts: ["1.6", "1.5", "1.4", "1.3", "None of the other choices is correct."],
            ans: 2,
            dispAnswer: "C. 1.4",
            exp: "نسبة التسريع (<bdi>Speedup</bdi>):<br>• زمن التنفيذ الأحادي: <bdi>Time_single = IC × 1 × 700 ps = 700 · IC</bdi>.<br>• زمن التنفيذ بالأنابيب: <bdi>Time_pipe = IC × 2 × 250 ps = 500 · IC</bdi>.<br>• <bdi>Speedup = 700 / 500 = 1.4</bdi>."
          },
          {
            id: "q12",
            type: "single",
            text: "Q12. A program consists of 9 instructions: two of them are loads and none of them is a branch. What is the maximum number of cycles that are needed to execute this code on the 5-stage pipelined datapath, if forwarding is used? (The maximum occurs when each load instruction is followed by a dependent instruction. Also, the first instruction needs five cycles)",
            img: "",
            opts: ["12", "13", "14", "15", "None of the other choices is correct."],
            ans: 3,
            dispAnswer: "D. 15",
            exp: "في معمارية MIPS ذات الـ 5 مراحل مع استخدام التمرير السريع (<bdi>Forwarding</bdi>):<br>• الزمن الأساسي لـ 9 تعليمات بدون توقف: <bdi>5 + (9 - 1) = 13</bdi> دورة.<br>• كل تعليمة تحميل (<bdi>Load</bdi>) متبوعة بتعليمة تعتمد عليها تسبب توقفاً إجبارياً واحداً (<bdi>1 stall cycle</bdi>) لا يمكن للتمرير تجنبه.<br>• بما أنه يوجد تعليمتا تحميل متبوعتان بتعليمات معتمدة، ينتج توقفان: <bdi>13 + 2 = 15</bdi> دورة."
          },
          {
            id: "q13",

          {

    let userScores = {};

    function initQuiz() {
      const driveBtn = document.getElementById('drive-link-btn');
      if (driveBtn) {
        if (originalDriveLink && originalDriveLink.trim() !== "") {
          driveBtn.href = originalDriveLink;
          driveBtn.style.display = "inline-flex";
        } else {
          driveBtn.style.display = "none";
        }
      }

      const list = document.getElementById('quiz-list');
      list.innerHTML = '';

      examSections.forEach((section) => {
        const card = document.createElement('div');
        card.className = 'q-card';

        let subQuestionsHtml = '';
        section.subQuestions.forEach((sub) => {
          const hasImage = sub.img && sub.img.trim() !== "";

          const imageContainerHtml = hasImage ? `
            <div class="q-image-container" id="img-box-${sub.id}">
              <img class="q-original-img" 
                   id="img-${sub.id}" 
                   data-src="${sub.img}" 
                   alt="Original Question ${sub.id}" 
                   onerror="handleImageFallback(this)" />
            </div>
          ` : '';

          const imageButtonHtml = hasImage ? `
            <button class="btn-action" onclick="toggleOriginalImage('${sub.id}')">
              <span>📷</span> عرض صورة السؤال الأصلية
            </button>
          ` : '';

          const optsHtml = sub.opts.map((opt, i) => `
            <div class="option-item" id="opt-${sub.id}-${i}" onclick="selectSingleOption('${sub.id}', ${i})">
              <div class="opt-letter">${letters[i]}</div>
              <div style="white-space: pre-line;">${escapeHtml(opt)}</div>
            </div>
          `).join('');

          const interactionHtml = `
            <div class="options-container" id="opts-box-${sub.id}">${optsHtml}</div>
            <div class="answer-input-row">
              ${imageButtonHtml}
              <button class="btn-reset-q" id="reset-btn-${sub.id}" onclick="resetSubQuestion('${sub.id}')">إعادة السؤال ↻</button>
              <button class="btn-action" onclick="toggleSolution('${sub.id}')">
                <span>💡</span> عرض الحل
              </button>
            </div>
          `;

          subQuestionsHtml += `
            <div class="sub-question-card ltr-content" id="card-${sub.id}">
              <div class="sub-q-header">${sub.text}</div>
              ${imageContainerHtml}
              ${interactionHtml}
              <div class="solution-box" id="sol-${sub.id}">
                <div><strong>الإجابة النموذجية المعتمدة (Final Answer):</strong></div>
                <div style="margin-top: 6px; font-size: 0.95rem; font-weight: bold; line-height: 1.6; font-family: 'JetBrains Mono', Consolas, monospace; color: #5ac8fa;">${escapeHtml(sub.dispAnswer)}</div>
                <div style="margin-top: 6px; font-size: 0.88rem; line-height: 1.6; color: var(--text-secondary); direction: rtl; text-align: right;">${sub.exp}</div>
              </div>
            </div>
          `;
        });

        card.innerHTML = `
          <div class="ltr-content">
            <div class="parent-q-title">${section.title}</div>
            <div class="parent-q-desc">${section.context}</div>
          </div>
          <div class="sub-list">${subQuestionsHtml}</div>
        `;

        list.appendChild(card);
      });

      calculateScore();
      setupReportModal();
    }

    function toggleOriginalImage(qid) {
      const imgBox = document.getElementById(`img-box-${qid}`);
      const imgEl = document.getElementById(`img-${qid}`);

      if (imgEl && !imgEl.src && imgEl.dataset.src) {
        imgEl.src = imgEl.dataset.src;
      }

      if (imgBox) {
        imgBox.classList.toggle('show');
      }
    }

    function handleImageFallback(imgEl) {
      if (!imgEl.dataset.retried) {
        imgEl.dataset.retried = "1";
        if (imgEl.src.endsWith('.jpg')) {
          imgEl.src = imgEl.src.replace('.jpg', '.png');
        } else if (imgEl.src.endsWith('.png')) {
          imgEl.src = imgEl.src.replace('.png', '.jpg');
        }
      }
    }

    function findSubQuestion(subId) {
      for (const sec of examSections) {
        const found = sec.subQuestions.find(s => s.id === subId);
        if (found) return found;
      }
      return null;
    }

    function selectSingleOption(subId, optIdx) {
      const sub = findSubQuestion(subId);
      const optsBox = document.getElementById(`opts-box-${subId}`);
      const resetBtn = document.getElementById(`reset-btn-${subId}`);
      if (!sub || !optsBox) return;

      optsBox.classList.add('locked');

      const picked = document.getElementById(`opt-${subId}-${optIdx}`);
      if (optIdx === sub.ans) {
        if (picked) picked.classList.add('correct');
        userScores[subId] = true;
      } else {
        if (picked) picked.classList.add('wrong');
        delete userScores[subId];
      }

      if (resetBtn) resetBtn.style.display = 'inline-flex';
      calculateScore();
    }

    function resetSubQuestion(subId) {
      delete userScores[subId];

      const optsBox = document.getElementById(`opts-box-${subId}`);
      if (optsBox) {
        optsBox.classList.remove('locked');
      }

      const sub = findSubQuestion(subId);
      if (sub && sub.opts) {
        sub.opts.forEach((_, i) => {
          const el = document.getElementById(`opt-${subId}-${i}`);
          if (el) el.className = 'option-item';
        });
      }

      const resetBtn = document.getElementById(`reset-btn-${subId}`);
      const sol = document.getElementById(`sol-${subId}`);
      const imgBox = document.getElementById(`img-box-${subId}`);

      if (resetBtn) resetBtn.style.display = 'none';
      if (sol) sol.classList.remove('show');
      if (imgBox) imgBox.classList.remove('show');

      calculateScore();
    }

    function calculateScore() {
      let total = 0;
      let score = 0;
      examSections.forEach(sec => {
        sec.subQuestions.forEach(sub => {
          total++;
          if (userScores[sub.id]) score++;
        });
      });

      const pct = total > 0 ? Math.round((score / total) * 100) : 0;
      const scoreEl = document.getElementById('score');
      if (scoreEl) {
        scoreEl.innerText = `${score} / ${total} (${pct}%)`;
      }
    }

    function toggleSolution(subId) {
      const sol = document.getElementById(`sol-${subId}`);
      if (sol) sol.classList.toggle('show');
    }

    let allShown = false;
    function toggleAllSolutions() {
      allShown = !allShown;
      examSections.forEach(sec => {
        sec.subQuestions.forEach(sub => {
          const sol = document.getElementById(`sol-${sub.id}`);
          if (sol) {
            if (allShown) sol.classList.add('show');
            else sol.classList.remove('show');
          }
        });
      });
    }

    function resetQuiz() {
      userScores = {};
      initQuiz();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function setupReportModal() {
      const openBtn = document.getElementById('openReportBtn');
      const closeBtn = document.getElementById('closeReportBtn');
      const overlay = document.getElementById('reportOverlay');
      const form = document.getElementById('bugReportForm');
      const status = document.getElementById('reportStatus');

      if (!openBtn || !overlay) return;

      openBtn.onclick = () => {
        overlay.classList.add('active');
        overlay.setAttribute('aria-hidden', 'false');
      };

      const closeModal = () => {
        overlay.classList.remove('active');
        overlay.setAttribute('aria-hidden', 'true');
        if (status) status.innerText = '';
      };

      if (closeBtn) closeBtn.onclick = closeModal;

      overlay.onclick = (e) => {
        if (e.target === overlay) closeModal();
      };

      if (form) {
        form.onsubmit = (e) => {
          e.preventDefault();
          const submitBtn = document.getElementById('submitReportBtn');
          if (submitBtn) submitBtn.disabled = true;
          if (status) {
            status.style.color = '#30d158';
            status.innerText = 'تم إرسال البلاغ بنجاح، شكراً لمساعدتك!';
          }
          setTimeout(() => {
            closeModal();
            form.reset();
            if (submitBtn) submitBtn.disabled = false;
          }, 1500);
        };
      }
    }

    initQuiz();
  </script>
  <script src="../transition.js"></script>
</body>
</html>
