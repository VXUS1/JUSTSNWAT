      margin-top: 12px;

    .text-input-field {
      background: rgba(0, 0, 0, 0.35);
      border: 1.5px solid var(--apple-border-strong);
      border-radius: 8px;
      padding: 9px 14px;
      color: #fff;
      font-family: 'JetBrains Mono', Consolas, monospace;
      font-size: 0.92rem;
      outline: none;
      min-width: 240px;
      transition: all 0.2s;
    }
    .text-input-field:focus {
      border-color: var(--apple-blue);
      box-shadow: 0 0 10px rgba(10, 132, 255, 0.25);
    }
    .text-input-field.correct {
      border-color: #30d158 !important;
      background: rgba(48, 209, 88, 0.12) !important;
    }
    .text-input-field.wrong {
      border-color: #ff453a !important;

    .unit-label {
      font-family: 'JetBrains Mono', Consolas, monospace;
      font-size: 0.9rem;
      color: #8e8e93;
      user-select: none;
    }

    .btn-reset-q {
      display: none;
      background: rgba(255, 69, 58, 0.15);
      color: #ff453a;
      border: 1px solid rgba(255, 69, 58, 0.4);
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.85rem;
      transition: all 0.2s;
    }
    .btn-reset-q:hover {
      background: #ff453a;
      color: #fff;
    }
  </style>

  <script>
    const originalDriveLink = "https://drive.google.com/drive/folders/1wdBuHTcCwfTKaHpP9hG6t-rbURyg7Wzn";

    function escapeHtml(text) {
      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    const examSections = [
      {
        title: "First Exam Questions (Complete 20 Questions)",
        context: "Official solved exam sheet with evaluated parameter R values:",
        subQuestions: [
          {
            id: "q1",
            type: "input",
            text: "1. A program executes 4 × 10^9 instructions on a 3 GHz processor and finishes in 6 seconds. What is the average CPI?",
            img: "",
            unit: "",
            validate: (input) => {
              const num = parseFloat(input.trim().replace(/[^0-9.]/g, ''));
              return Math.abs(num - 4.5) < 0.05;
            },
            dispAnswer: "4.5",
            exp: "معادلة زمن التنفيذ: <bdi>CPU Time = (Instruction Count × CPI) / Clock Rate</bdi>.<br><bdi>6 = (4 × 10^9 × CPI) / (3 × 10^9) = (4/3) × CPI</bdi>.<br><bdi>CPI = 6 × (3 / 4) = 4.5</bdi>.",
            placeholder: "Enter number..."
          },
          {
            id: "q2",
            type: "input",
            text: "2. In a certain program, 40% of the execution time is due to a part that can be accelerated by a factor of 5. Using Amdahl's Law, what is the overall speedup?",
            img: "",
            unit: "",
            validate: (input) => {
              const num = parseFloat(input.trim().replace(/[^0-9.]/g, ''));
              return Math.abs(num - 1.47) < 0.02 || Math.abs(num - 1.4606) < 0.02;
            },
            dispAnswer: "≈ 1.47 (or 1.4606)",
            exp: "قانون أمداهل لتسريع النظام: <bdi>Speedup = 1 / ((1 - Fraction_enhanced) + (Fraction_enhanced / Speedup_part))</bdi>.<br><bdi>Speedup = 1 / (0.6 + (0.4 / 5)) = 1 / (0.6 + 0.08) = 1 / 0.68 ≈ 1.4706</bdi>.",
            placeholder: "Enter number..."
          },
          {
            id: "q3",
            type: "input",
            text: "3. The speedup of Machine A over machine B is 1.25 for a given benchmark, what is the execution time using machine B if Machine A runs the same benchmark in 10 seconds?",
            img: "",
            unit: "seconds",
            validate: (input) => {
              const num = parseFloat(input.trim().replace(/[^0-9.]/g, ''));
              return Math.abs(num - 12.5) < 0.1;
            },
            dispAnswer: "12.5",
            exp: "نسبة التسريع: <bdi>Speedup(A over B) = Time_B / Time_A = 1.25</bdi>.<br><bdi>Time_B = 1.25 × Time_A = 1.25 × 10 = 12.5 seconds</bdi>.",
            placeholder: "Enter number..."
          },
          {
            id: "q4",
            type: "input",
            text: "4. A processor working on a 1.5 GHz frequency executes 1.2 × 10^9 instructions in 0.8 seconds. What is its MIPS rating?",
            img: "",
            unit: "MIPS",
            validate: (input) => {
              const num = parseFloat(input.trim().replace(/[^0-9.]/g, ''));
              return Math.abs(num - 1500) < 1;
            },
            dispAnswer: "1500",
            exp: "مقياس الميبس: <bdi>MIPS = Instruction Count / (Execution Time × 10^6)</bdi>.<br><bdi>MIPS = (1.2 × 10^9) / (0.8 × 10^6) = 1.2 × 1000 / 0.8 = 1500</bdi>.",
            placeholder: "Enter number..."
          },
          {
            id: "q5",
            type: "input",
            text: "5. An instruction mix has an average CPI of 3.2 for a program with 2 × 10^9 instructions. What is the execution time of this program in billions of cycles?",
            img: "",
            unit: "billion cycles",
            validate: (input) => {
              const num = parseFloat(input.trim().replace(/[^0-9.]/g, ''));
              return Math.abs(num - 6.4) < 0.1;
            },
            dispAnswer: "6.4",
            exp: "إجمالي عدد دورات المعالج: <bdi>Cycles = Instruction Count × CPI</bdi>.<br><bdi>Cycles = (2 × 10^9) × 3.2 = 6.4 × 10^9 cycles = 6.4 billion cycles</bdi>.",
            placeholder: "Enter number..."
          },
          {
            id: "q6",
            type: "input",
            text: "6. We want an overall speedup of 2 for a program by improving a certain part by a factor of 3. According to Amdahl's Law, what fraction of the original execution time must this part represent?",
            img: "",
            unit: "",
            validate: (input) => {
              const num = parseFloat(input.trim().replace(/[^0-9.]/g, ''));
              return Math.abs(num - 0.75) < 0.02 || Math.abs(num - 75) < 1;
            },
            dispAnswer: "0.75 (or 75%)",
            exp: "بتطبيق قانون أمداهل: <bdi>2 = 1 / ((1 - f) + f / 3)</bdi>.<br><bdi>(1 - f) + f / 3 = 0.5  ==>  1 - (2/3)f = 0.5  ==>  (2/3)f = 0.5  ==>  f = 0.75</bdi>.",
            placeholder: "Enter number..."
          },
          {
            id: "q7",
            type: "input",
            text: "7. A SPEC benchmark suite reports individual ratios for a machine as: 1.5, 1.5, 2.0, 3.0, 0.75, and 1.25. What is the geometric mean SPEC ratio for this machine?",
            img: "",
            unit: "",
            validate: (input) => {
              const num = parseFloat(input.trim().replace(/[^0-9.]/g, ''));
              return Math.abs(num - 1.527) < 0.02 || Math.abs(num - 1.53) < 0.02;
            },
            dispAnswer: "≈ 1.527",
            exp: "المتوسط الهندسي لمقاييس <bdi>SPEC</bdi>:<br><bdi>GM = (1.5 × 1.5 × 2.0 × 3.0 × 0.75 × 1.25)^(1/6) = (12.65625)^(1/6) ≈ 1.527</bdi>.",
            placeholder: "Enter number..."
          },
          {
            id: "q8",
            type: "input",
            text: "8. Given lw $t0, 0xFF00($s1) and $s1 = 0x00004020, what is the effective address used by this instruction? (in hexadecimal)",
            img: "",
            unit: "",
            validate: (input) => {
              const val = input.toLowerCase().trim().replace(/^0x/, '');
              return val === "00003f20" || val === "3f20";
            },
            dispAnswer: "0x00003F20",
            exp: "يتم تمديد الإزاحة الفورية (<bdi>0xFF00</bdi>) ذات الـ 16 بت بإشارة (<bdi>Sign-extension</bdi>) لتصبح <bdi>0xFFFFFF00</bdi> (-256).<br>العنوان الفعال = <bdi>0x00004020 + 0xFFFFFF00 = 0x00003F20</bdi>.",
            placeholder: "0x..."
          },
          {
            id: "q9",
            type: "input",
            text: "9. A beq instruction is located at address 0x00400040 and has a signed offset of +6. What is the branch target address? (in hexadecimal)",
            img: "",
            unit: "",
            validate: (input) => {
              const val = input.toLowerCase().trim().replace(/^0x/, '');
              return val === "0040005c" || val === "40005c";
            },
            dispAnswer: "0x0040005C",
            exp: "عنوان القفز المشروط في معمارية <bdi>MIPS</bdi>:<br><bdi>Target = (PC + 4) + (offset × 4) = 0x00400044 + (6 × 4) = 0x00400044 + 0x18 = 0x0040005C</bdi>.",
            placeholder: "0x..."
          },
          {
            id: "q10",
            type: "input",
            text: "10. Assume $t2 = 0x00000015. After executing addi $t2, $t2, 0x8000, what is the new value in $t2 in hexadecimal?",
            img: "",
            unit: "",
            validate: (input) => {
              const val = input.toLowerCase().trim().replace(/^0x/, '');
              return val === "ffff8015";
            },
            dispAnswer: "0xFFFF8015",
            exp: "تعليمة <bdi>addi</bdi> تمدد القيمة المباشرة <bdi>0x8000</bdi> بإشارة (<bdi>Sign-extension</bdi>) لأن بت الإشارة هو 1، فتتحول إلى <bdi>0xFFFF8000</bdi>.<br><bdi>0x00000015 + 0xFFFF8000 = 0xFFFF8015</bdi>.",
            placeholder: "0x..."
          },
          {
            id: "q11",
            type: "input",
            text: "11. Write the 32-bit binary encoding (no hex) of: srl $s1, $s2, 5",
            img: "",
            unit: "",
            validate: (input) => {
              const val = input.replace(/[\s-]/g, '').trim();
              return val === "00000000000100101000100101000010";
            },
            dispAnswer: "00000000000100101000100101000010",
            exp: "ترميز صيغة <bdi>R-type</bdi> لتعليمة الإزاحة <bdi>srl</bdi>:<br>• <bdi>opcode = 000000</bdi><br>• <bdi>rs = 00000</bdi><br>• <bdi>rt = $s2 = 18 = 10010</bdi><br>• <bdi>rd = $s1 = 17 = 10001</bdi><br>• <bdi>shamt = 5 = 00101</bdi><br>• <bdi>funct = 000010</bdi>.<br>المجموع: <bdi>000000-00000-10010-10001-00101-000010</bdi>.",
            placeholder: "Enter 32-bit binary..."
          },
          {
            id: "q12",
            type: "input",
            text: "12. Consider the instruction sltiu $t0, $t0, 12. What is the final content of $t0 if its initial content is 0x80000000? (in hexadecimal)",
            img: "",
            unit: "",
            validate: (input) => {
              const val = input.toLowerCase().trim().replace(/^0x/, '');
              return val === "0" || val === "00000000" || val === "0000 0000";
            },
            dispAnswer: "0x00000000 (0)",
            exp: "تعليمة <bdi>sltiu</bdi> تجري مقارنة غير موقعة (<bdi>Unsigned</bdi>). القيمة <bdi>0x80000000</bdi> كقيمة غير موقعة هي <bdi>2^31 ≈ 2.14 × 10^9</bdi> وهي أكبر بكثير من 12، وبالتالي المقارنة (<bdi>t0 < 12</bdi>) خاطئة وتخزن 0.",
            placeholder: "0x..."
          },
          {
            id: "q13",
            type: "input",
            text: "13. Assume big-endian memory. The word at address 0x10001000 is 0xCAFEBABE. What value does lb $t1, 1($t0) load in $t1 if $t0 = 0x10001001? (in hexadecimal)",
            img: "",
            unit: "",
            validate: (input) => {
              const val = input.toLowerCase().trim().replace(/^0x/, '');
              return val === "ffffffba" || val === "ffff ffba";
            },
            dispAnswer: "0xFFFFFFBA",
            exp: "العنوان الفعال للتحميل: <bdi>0x10001001 + 1 = 0x10001002</bdi>.<br>في نظام <bdi>Big-endian</bdi>:<br>• <bdi>0x10001000 = CA</bdi><br>• <bdi>0x10001001 = FE</bdi><br>• <bdi>0x10001002 = BA</bdi><br>• <bdi>0x10001003 = BE</bdi>.<br>البايت عند العنوان 0x10001002 هو <bdi>0xBA</bdi> (1011 1010 بت الإشارة 1)، وتعليمة <bdi>lb</bdi> تمدد الإشارة إلى 32 بت فتصبح: <bdi>0xFFFFFFBA</bdi>.",
            placeholder: "0x..."
          },
          {
            id: "q14",
            type: "input",
            text: "14. Initially $t3 = 0x000000F5. After executing andi $t3, $t3, 0xAAAA, what is the value in $t3 in hexadecimal?",
            img: "",
            unit: "",
            validate: (input) => {
              const val = input.toLowerCase().trim().replace(/^0x/, '');
              return val === "000000a0" || val === "a0";
            },
            dispAnswer: "0x000000A0",
            exp: "تعليمة <bdi>andi</bdi> تمدد القيمة الفورية بأصفار (<bdi>Zero-extension</bdi>) لتصبح <bdi>0x0000AAAA</bdi>.<br><bdi>0x000000F5 & 0x0000AAAA</bdi>:<br>• <bdi>F5 = 1111 0101</bdi><br>• <bdi>AA = 1010 1010</bdi><br>• الناتج المنطقي <bdi>AND = 1010 0000 = 0xA0</bdi>، فيكون الناتج النهائي: <bdi>0x000000A0</bdi>.",
            placeholder: "0x..."
          },
          {
            id: "q15",
            type: "input",
            text: "15. The base address of the Array A (Array of 8-byte double numbers) is stored in register $s1, Write the MIPS sequence of instructions to perform A[5] = 0.",
            img: "",
            unit: "",
            validate: (input) => {
              const val = input.toLowerCase().replace(/\s/g, '');
              const hasFirst = val.includes("sw$zero,40($s1)");
              const hasSecond = val.includes("sw$zero,44($s1)");
              return hasFirst && hasSecond;
            },
            dispAnswer: "sw $zero, 40($s1)\nsw $zero, 44($s1)",
            exp: "كل عنصر في المصفوفة نوعه <bdi>double</bdi> بحجم 8 بايت. إزاحة العنصر الخامس: <bdi>5 × 8 = 40</bdi> بايت.<br>لتصفير 8 بايت باستخدام مسجلات MIPS الأساسية نكتب كلمتين متعاقبتين (4 بايت لكل منهما) بقيمة صفر:<br><bdi>sw $zero, 40($s1)</bdi><br><bdi>sw $zero, 44($s1)</bdi>.",
            placeholder: "Enter MIPS instructions..."
          },
          {
            id: "q16",
            type: "input",
            text: "16. Assume 16-bit IEEE754-like format with 7 bits for the exponent (bias=63). Represent -8.75 using this format in 16-bit binary:",
            img: "",
            unit: "",
            validate: (input) => {
              const val = input.replace(/[\s-]/g, '').trim().toLowerCase();
              return val === "1100001000011000" || val === "0xc218" || val === "c218";
            },
            dispAnswer: "1 1000010 00011000 (0xC218)",
            exp: "تحويل العدد <bdi>-8.75</bdi>:<br>• إشارة سالبة: <bdi>Sign bit = 1</bdi>.<br>• القيمة الثنائية: <bdi>8.75 = 1000.11 = 1.00011 × 2^3</bdi>.<br>• الأس المنحاز: <bdi>Exponent = 3 + 63 = 66 = 1000010_2</bdi> (7 بت).<br>• الكسر (Mantissa): يتبقى 8 بتات (<bdi>16 - 1 - 7 = 8</bdi>)، فتكون: <bdi>00011000</bdi>.<br>التمثيل الكامل: <bdi>1 1000010 00011000</bdi>.",
            placeholder: "Enter 16-bit binary..."
          },
          {
            id: "q17",
            type: "input",
            text: "17. Assume the same 16-bit format (1 sign bit, 7 exponent bits with bias=63, 8 fraction bits). What does 1-0111100-01000000 represent in decimal?",
            img: "",
            unit: "",
            validate: (input) => {
              const num = parseFloat(input.trim().replace(/[^0-9.-]/g, ''));
              return Math.abs(num - (-0.15625)) < 0.001 || Math.abs(num - (-5/32)) < 0.001;
            },
            dispAnswer: "-0.15625 (or -5/32)",
            exp: "تحليل الحقول:<br>• بت الإشارة = 1 (سالب).<br>• حقل الأس = <bdi>0111100_2 = 60</bdi>، الأس الفعلي = <bdi>60 - 63 = -3</bdi>.<br>• حقل الكسر = <bdi>01000000_2 = 0.25</bdi>، الجزء الدال الكامل = <bdi>1 + 0.25 = 1.25</bdi>.<br>القيمة العشرية: <bdi>-1.25 × 2^(-3) = -1.25 / 8 = -0.15625</bdi>.",
            placeholder: "Enter decimal number..."
          },
          {
            id: "q18",
            type: "input",
            text: "18. Using the first version of the multiplier hardware customized for 8 bit by 8 bit multiplication, what is the 16-bit binary content of the multiplicand register after 4 iterations (4 adds and 4 shifts) if its initial content is equivalent to (17)10 in decimal?",
            img: "",
            unit: "",
            validate: (input) => {
              const val = input.replace(/[\s-]/g, '').trim().toLowerCase();
              return val === "0000000100010000" || val === "0x0110" || val === "0110";
            },
            dispAnswer: "0000000100010000 (0x0110)",
            exp: "في النسخة الأولى من جهاز الضرب لمعاملات 8 بت:<br>• مسجل المضروب (<bdi>Multiplicand</bdi>) عرضه 16 بت، ويوضع المضروب الابتدائي في النصف الأيمن: <bdi>0000 0000 0001 0001</bdi>.<br>• في كل تكرار، يزاح مسجل المضروب نحو اليسار بمقدار 1 بت.<br>• بعد 4 تكرارات (4 إزاحات لليسار): <bdi>0000 0001 0001 0000</bdi>.",
            placeholder: "Enter 16-bit binary..."
          },
          {
            id: "q19",
            type: "input",
            text: "19. If the register write and register shifts are performed in one clock cycle (write on the falling edge and shift on the rising edge), what is the time required to complete the 32x32 multiplication if the clock frequency is 1 GHz?",
            img: "",
            unit: "ns",
            validate: (input) => {
              const num = parseFloat(input.trim().replace(/[^0-9.]/g, ''));
              return Math.abs(num - 32) < 0.1;
            },
            dispAnswer: "32",
            exp: "عملية ضرب 32 بت تتطلب 32 تكراراً. وبما أن الكتابة والإزاحة تُنجزان في دورة ساعة واحدة، فإن العملية تستغرق 32 دورة ساعة.<br>زمن دورة الساعة عند تردد 1 GHz هو: <bdi>T = 1 / 10^9 = 1 ns</bdi>.<br>الزمن الإجمالي: <bdi>32 × 1 ns = 32 ns</bdi>.",
            placeholder: "Enter number..."
          },
          {
            id: "q20",
            type: "input",
            text: "20. Using the second version of the divider hardware customized for 8 bit by 4 bit division, what is the final content of the remainder register if the dividend is 01100011 and the divisor is (1000)2?",
            img: "",
            unit: "",
            validate: (input) => {
              const val = input.replace(/[\s-]/g, '').trim().toLowerCase();
              return val === "0011" || val === "00000011" || val === "3" || val === "00111100";
            },
            dispAnswer: "0011 (or 00000011, decimal 3)",
            exp: "قيمة المقسوم: <bdi>01100011_2 = 99_10</bdi>.<br>قيمة المقسوم عليه: <bdi>1000_2 = 8_10</bdi>.<br>ناتج القسمة: <bdi>99 / 8 = 12</bdi> (00001100) والباقي هو <bdi>3</bdi> (0011_2).<br>في نهاية خوارزمية القسمة، يستقر باقي القسمة في مسجل الباقي بقيمة 3 ثنائياً.",
            placeholder: "Enter answer..."
          }
        ]
      }
    ];

    let userScores = {};

    function initQuiz() {
      const driveBtn = document.getElementById('drive-link-btn');
      if (driveBtn) {
        if (originalDriveLink && originalDriveLink.trim() !== "") {
          driveBtn.href = originalDriveLink;
          driveBtn.style.display = "inline-flex";
        } else {
          driveBtn.style.display = "none";
        }
      }

      const list = document.getElementById('quiz-list');
      list.innerHTML = '';

      examSections.forEach((section) => {
        const card = document.createElement('div');
        card.className = 'q-card';

        let subQuestionsHtml = '';
        section.subQuestions.forEach((sub) => {
          const unitHtml = sub.unit ? `<span class="unit-label">${sub.unit}</span>` : '';
          const hasImage = sub.img && sub.img.trim() !== "";

          const imageContainerHtml = hasImage ? `
            <div class="q-image-container" id="img-box-${sub.id}">
              <img class="q-original-img" 
                   id="img-${sub.id}" 
                   data-src="${sub.img}" 
                   alt="Original Question ${sub.id}" 
                   onerror="handleImageFallback(this)" />
            </div>
          ` : '';

          const imageButtonHtml = hasImage ? `
            <button class="btn-action" onclick="toggleOriginalImage('${sub.id}')">
              <span>📷</span> عرض صورة السؤال الأصلية
            </button>
          ` : '';

          const interactionHtml = `
            <div class="answer-input-row ltr-content">
              <input type="text" class="text-input-field" id="input-${sub.id}" placeholder="${sub.placeholder || 'Enter answer...'}" onkeydown="if(event.key==='Enter') checkInputAnswer('${sub.id}')">
              ${unitHtml}
              <button class="btn" id="btn-check-${sub.id}" onclick="checkInputAnswer('${sub.id}')">تحقق</button>
              ${imageButtonHtml}
              <button class="btn-reset-q" id="reset-btn-${sub.id}" onclick="resetSubQuestion('${sub.id}')">إعادة السؤال ↻</button>
              <button class="btn-action" onclick="toggleSolution('${sub.id}')">
                <span>💡</span> عرض الحل
              </button>
            </div>
          `;

          subQuestionsHtml += `
            <div class="sub-question-card ltr-content" id="card-${sub.id}">
              <div class="sub-q-header">${sub.text}</div>
              ${imageContainerHtml}
              ${interactionHtml}
              <div class="solution-box" id="sol-${sub.id}">
                <div><strong>الإجابة النموذجية المعتمدة (Final Answer):</strong></div>
                <div style="margin-top: 6px; font-size: 0.95rem; font-weight: bold; line-height: 1.6; font-family: 'JetBrains Mono', Consolas, monospace; color: #5ac8fa; white-space: pre-wrap;">${escapeHtml(sub.dispAnswer)} ${sub.unit ? escapeHtml(sub.unit) : ''}</div>
                <div style="margin-top: 6px; font-size: 0.88rem; line-height: 1.6; color: var(--text-secondary); direction: rtl; text-align: right; white-space: pre-wrap;">${sub.exp}</div>
              </div>
            </div>
          `;
        });

        card.innerHTML = `
          <div class="ltr-content">
            <div class="parent-q-title">${section.title}</div>
            <div class="parent-q-desc">${section.context}</div>
          </div>
          <div class="sub-list">${subQuestionsHtml}</div>
        `;

        list.appendChild(card);
      });

      calculateScore();
      setupReportModal();
    }

    function toggleOriginalImage(qid) {
      const imgBox = document.getElementById(`img-box-${qid}`);
      const imgEl = document.getElementById(`img-${qid}`);

      if (imgEl && !imgEl.src && imgEl.dataset.src) {
        imgEl.src = imgEl.dataset.src;
      }

      if (imgBox) {
        imgBox.classList.toggle('show');
      }
    }

    function handleImageFallback(imgEl) {
      if (!imgEl.dataset.retried) {
        imgEl.dataset.retried = "1";
        if (imgEl.src.endsWith('.jpg')) {
          imgEl.src = imgEl.src.replace('.jpg', '.png');
        } else if (imgEl.src.endsWith('.png')) {
          imgEl.src = imgEl.src.replace('.png', '.jpg');
        }
      }
    }

    function findSubQuestion(subId) {
      for (const sec of examSections) {
        const found = sec.subQuestions.find(s => s.id === subId);
        if (found) return found;
      }
      return null;
    }

    function checkInputAnswer(subId) {
      const sub = findSubQuestion(subId);
      const inputEl = document.getElementById(`input-${subId}`);
      const resetBtn = document.getElementById(`reset-btn-${subId}`);
      const checkBtn = document.getElementById(`btn-check-${subId}`);
      if (!sub || !inputEl) return;

      const userVal = inputEl.value.trim();
      if (!userVal) {
        alert("يرجى إدخال إجابة أولاً!");
        return;
      }

      const isCorrect = sub.validate(userVal);
      inputEl.disabled = true;

      if (isCorrect) {
        inputEl.className = 'text-input-field correct';
        userScores[subId] = true;
      } else {
        inputEl.className = 'text-input-field wrong';
        delete userScores[subId];
      }

      if (checkBtn) checkBtn.style.display = 'none';
      if (resetBtn) resetBtn.style.display = 'inline-flex';

      calculateScore();
    }

    function resetSubQuestion(subId) {
      delete userScores[subId];

      const inputEl = document.getElementById(`input-${subId}`);
      if (inputEl) {
        inputEl.disabled = false;
        inputEl.value = '';
        inputEl.className = 'text-input-field';
        inputEl.focus();
      }

      const checkBtn = document.getElementById(`btn-check-${subId}`);
      const resetBtn = document.getElementById(`reset-btn-${subId}`);
      const sol = document.getElementById(`sol-${subId}`);
      const imgBox = document.getElementById(`img-box-${subId}`);

      if (checkBtn) checkBtn.style.display = 'inline-flex';
      if (resetBtn) resetBtn.style.display = 'none';
      if (sol) sol.classList.remove('show');
      if (imgBox) imgBox.classList.remove('show');

      calculateScore();
    }

    function calculateScore() {
      let total = 0;
      let score = 0;
      examSections.forEach(sec => {
        sec.subQuestions.forEach(sub => {
          total++;
          if (userScores[sub.id]) score++;
        });
      });

      const pct = total > 0 ? Math.round((score / total) * 100) : 0;
      const scoreEl = document.getElementById('score');
      if (scoreEl) {
        scoreEl.innerText = `${score} / ${total} (${pct}%)`;
      }
    }

    function toggleSolution(subId) {
      const sol = document.getElementById(`sol-${subId}`);
      if (sol) sol.classList.toggle('show');
    }

    let allShown = false;
    function toggleAllSolutions() {
      allShown = !allShown;
      examSections.forEach(sec => {
        sec.subQuestions.forEach(sub => {
          const sol = document.getElementById(`sol-${sub.id}`);
          if (sol) {
            if (allShown) sol.classList.add('show');
            else sol.classList.remove('show');
          }
        });
      });
    }

    function resetQuiz() {
      userScores = {};
      initQuiz();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function setupReportModal() {
      const openBtn = document.getElementById('openReportBtn');
      const closeBtn = document.getElementById('closeReportBtn');
      const overlay = document.getElementById('reportOverlay');
      const form = document.getElementById('bugReportForm');
      const status = document.getElementById('reportStatus');

      if (!openBtn || !overlay) return;

      openBtn.onclick = () => {
        overlay.classList.add('active');
        overlay.setAttribute('aria-hidden', 'false');
      };

      const closeModal = () => {
        overlay.classList.remove('active');
        overlay.setAttribute('aria-hidden', 'true');
        if (status) status.innerText = '';
      };

      if (closeBtn) closeBtn.onclick = closeModal;

      overlay.onclick = (e) => {
        if (e.target === overlay) closeModal();
      };

      if (form) {
        form.onsubmit = (e) => {
          e.preventDefault();
          const submitBtn = document.getElementById('submitReportBtn');
          if (submitBtn) submitBtn.disabled = true;
          if (status) {
            status.style.color = '#30d158';
            status.innerText = 'تم إرسال البلاغ بنجاح، شكراً لمساعدتك!';
          }
          setTimeout(() => {
            closeModal();
            form.reset();
            if (submitBtn) submitBtn.disabled = false;
          }, 1500);
        };
      }
    }

    initQuiz();
  </script>
  <script src="../transition.js"></script>
</body>
</html>
