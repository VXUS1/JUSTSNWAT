<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JUSTSNWAT | Mid Skills 2020-2021 — أسئلة الميد</title>

  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">

  <style>
    .bottom-nav-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      margin-top: 36px;
      padding-top: 24px;
      border-top: 1px solid var(--apple-border);
    }
    .btn-bottom-action {
      background: var(--apple-surface);
      border: 1px solid var(--apple-border-strong);
      color: var(--text-primary);
      padding: 12px 26px;
      border-radius: 99px;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.95rem;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      backdrop-filter: blur(20px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      transition: all 0.25s var(--ease-apple);
    }
    .btn-bottom-action:hover {
      background: var(--apple-surface-hover);
      border-color: rgba(255, 255, 255, 0.25);
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
    }
    .btn-bottom-action:active {
      transform: scale(0.96);
    }
    .btn-drive-action {
      background: linear-gradient(135deg, rgba(10, 132, 255, 0.15) 0%, rgba(48, 209, 88, 0.15) 100%);
      border-color: rgba(10, 132, 255, 0.4);
      color: #5ac8fa;
    }
    .btn-drive-action:hover {
      background: var(--apple-blue);
      color: #ffffff;
      border-color: var(--apple-blue);
    }

    .ltr-content {
      direction: ltr;
      text-align: left;
    }

    .parent-q-title {
      font-size: 1.18rem;
      font-weight: 800;
      color: var(--apple-blue, #0a84ff);
      margin-bottom: 8px;
      border-bottom: 1px dashed var(--apple-border);
      padding-bottom: 8px;
    }
    .parent-q-desc {
      font-size: 0.98rem;
      line-height: 1.7;
      color: var(--text-secondary);
      margin-bottom: 18px;
    }
    .sub-question-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--apple-border);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 18px;
    }
    .sub-q-header {
      font-weight: 700;
      font-size: 1.02rem;
      margin-bottom: 14px;
      color: var(--text-primary);
      line-height: 1.7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .options-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin: 14px 0;
    }
    .options-container.locked {
      pointer-events: none;
    }

    .option-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 16px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--apple-border);
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
      user-select: none;
      font-size: 0.98rem;
    }
    .option-item:hover {
      background: rgba(255, 255, 255, 0.08);
    }
    .option-item.selected {
      border-color: var(--apple-blue);
      background: rgba(10, 132, 255, 0.12);
    }
    .option-item.correct {
      background: rgba(48, 209, 88, 0.18) !important;
      border-color: #30d158 !important;
      color: #fff;
    }
    .option-item.wrong {
      background: rgba(255, 69, 58, 0.18) !important;
      border-color: #ff453a !important;
      color: #fff;
    }
    .opt-letter {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 0.85rem;
      flex-shrink: 0;
      font-family: 'JetBrains Mono', Consolas, monospace;
    }

    .answer-input-row {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    .btn-reset-q {
      display: none;
      background: rgba(255, 69, 58, 0.15);
      color: #ff453a;
      border: 1px solid rgba(255, 69, 58, 0.4);
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.85rem;
      transition: all 0.2s;
    }
    .btn-reset-q:hover {
      background: #ff453a;
      color: #fff;
    }
    .solution-box {
      display: none;
      margin-top: 14px;
      padding: 14px 16px;
      background: rgba(10, 132, 255, 0.08);
      border: 1px solid rgba(10, 132, 255, 0.25);
      border-radius: 10px;
    }
    .solution-box.show {
      display: block;
    }
  </style>
</head>
<body>

  <header class="header">
    <a class="brand" href="../index.html">JUSTSNWAT</a>
    <div class="sub-brand">بنك أسئلة السنوات السابقة — كل مادة وأسئلتها بمكان واحد.</div>
  </header>

  <div class="container">
    <div class="nav-bar">
      <a class="back-link" href="../index.html#/s/ethics">‹ رجوع للمواد</a>
    </div>

    <div class="subject-title">مهارات الإتصال وأخلاقيات المهنة (Communication And Professional Ethics)</div>
    <div class="subject-subtitle" id="quiz-subtitle">Mid Ethics 2020–2021 — أسئلة حسب الشابتر</div>

    <div class="sticky-bar">
      <div class="score-text">النتيجة: <span class="score-val" id="score">0 / 0 (0%)</span></div>
      <div style="display: flex; gap: 10px;">
        <button class="btn btn-secondary" onclick="toggleAllSolutions()">إظهار/إخفاء الحلول</button>
        <button class="btn" onclick="resetQuiz()">إعادة البدء</button>
      </div>
    </div>

    <div id="quiz-list"></div>

    <div class="bottom-nav-bar">
      <a id="drive-link-btn" class="btn-bottom-action btn-drive-action" style="display: none;" target="_blank" rel="noopener noreferrer">
        <span>📁</span> ملف الأسئلة الأصلي ↗
      </a>
    </div>
  </div>

  <footer>
    <p>Designed By Abdallah</p>
  </footer>

  <!-- زر التبليغ العائم -->
  <button class="btn-bug-float" id="openReportBtn" aria-label="الإبلاغ عن خطأ أو مشكلة">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <rect width="8" height="14" x="8" y="6" rx="4"></rect>
      <path d="m19 7-3 2"></path>
      <path d="m5 7 3 2"></path>
      <path d="m19 19-3-2"></path>
      <path d="m5 19 3-2"></path>
      <path d="M20 13h-4"></path>
      <path d="M4 13h4"></path>
      <path d="m10 4 1 2"></path>
      <path d="m14 4-1 2"></path>
    </svg>
    <span>إبلاغ عن خطأ</span>
  </button>

  <!-- نافذة التبليغ المنبثقة -->
  <div class="report-modal-overlay" id="reportOverlay" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="report-modal">
      <div class="report-modal-header">
        <h3>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          إبلاغ عن خطأ أو ملاحظة
        </h3>
        <button class="btn-close-modal" id="closeReportBtn" aria-label="إغلاق">✕</button>
      </div>

      <form class="report-form" id="bugReportForm">
        <div class="form-group">
          <label for="issue-type">نوع المشكلة</label>
          <select id="issue-type" required>
            <option value="سؤال أو إجابة خاطئة">خطأ في سؤال أو إجابة</option>
            <option value="خلل في التصميم أو الموقع">مشكلة في عرض الصفحة أو الموقع</option>
            <option value="اقتراح أو أخرى">اقتراح / أخرى</option>
          </select>
        </div>

        <div class="form-group">
          <label for="issue-desc">وصف المشكلة <span style="color:var(--apple-red)">*</span></label>
          <textarea id="issue-desc" placeholder="حدد السؤال أو المشكلة بالتفصيل..." required></textarea>
        </div>

        <div class="form-group">
          <label for="user-contact">وسيلة تواصل (اختياري)</label>
          <input type="text" id="user-contact" placeholder="إيميلك أو حسابك للمتابعة">
        </div>

        <button type="submit" class="btn-submit-report" id="submitReportBtn">إرسال البلاغ</button>
        <div class="report-status" id="reportStatus"></div>
      </form>
    </div>
  </div>

  <script>
    const originalDriveLink = "https://drive.google.com/file/d/1AZju-x0djCui3UBZ0bfc89IkSMqCUKm2/view?usp=drive_link";

    const letters = ['A', 'B', 'C', 'D', 'E'];

    const questionGroups = [
      {
        chapter: 1,
        title: "Chapter 1: Business Communication Basics",
        context: "Questions 8, 12, and 20 from Mid Skills 2020–2021 — fundamentals, PAIBOC, and message purposes.",
        questions: [
          [8, "In PAIBOC, the letter B refers to:", ["Business", "Background", "Benefits", "Buildings"], 2, "الحرف B يشير إلى Benefits، أي الفوائد التي يوضحها الكاتب للجمهور."],
          [12, "Request or persuade, one of the basic purposes of business messages, means:", ["You want the reader to react.", "Create a good image of your organization.", "Explain or tell the reader something.", "Make people want to do business with you."], 0, "الطلب أو الإقناع يهدف إلى دفع القارئ لاتخاذ إجراء."],
          [20, "Effective business communication:", ["Decreases positive responses to requests on the first try.", "Builds a positive image of your organization.", "Increases reading time.", "Increases the time it takes disagreements to surface."], 1, "الاتصال الفعال يبني صورة إيجابية عن المؤسسة." ]
        ]
      },
      {
        chapter: 3,
        title: "Chapter 3: Audience Analysis",
        context: "Questions 4, 6, 10, 13, and 18 from Mid Skills 2020–2021 — audience types, gatekeepers, and demographic factors.",
        questions: [
          [4, "One of the following is not a message audience:", ["A watchdog audience", "A public audience", "A secondary audience", "A gatekeeper"], 1, "الجمهور الثانوي، والـwatchdog، والـgatekeeper تصنيفات معروفة لجمهور الرسائل؛ أما public audience فليس تصنيفًا مستقلًا هنا."],
          [6, "Which of the following is NOT a gatekeeper?", ["A program director who screens grant applications before forwarding them to a review board", "An HR director who screens internal applicants before referring promising ones", "A manager who chooses the best employee suggestion to submit to a company-wide competition", "An administrator who opens mail for a small business and passes it to its owner"], 2, "حارس البوابة يفلتر الرسائل أو الطلبات قبل وصولها؛ اختيار اقتراح موظف للمسابقة هو اختيار إداري، لا تمرير رسالة إلى جمهور آخر."],
          [10, "A ______ must approve the plan before it goes to the client.", ["Gatekeeper", "Manager", "Stakeholder", "Watchdog"], 0, "الشخص الذي يراجع الخطة ويوافق عليها قبل وصولها للعميل يعمل بوصفه gatekeeper."],
          [13, "The secondary audience receives the message first and routes it to other audiences.", ["No", "Yes"], 0, "هذا الوصف ينطبق على gatekeeper؛ أما الجمهور الثانوي فيتلقى الرسالة بعد الجمهور الأساسي أو يتأثر بها لاحقًا."],
          [18, "Which is an example of a demographic factor?", ["Lifestyle", "Interest", "Hobbies", "Income"], 3, "الدخل من الخصائص الديموغرافية، بينما نمط الحياة والاهتمامات والهوايات خصائص سيكوجرافية." ]
        ]
      },
      {
        chapter: 4,
        title: "Chapter 4: You-Attitude & Goodwill",
        context: "Questions 1, 2, 15, and 16 from Mid Skills 2020–2021 — reader focus, goodwill, and message organization.",
        questions: [
          [1, "Where in a message should good news appear?", ["In the middle, at the heart of the information", "In the opening paragraph, where it will be emphasized", "In the second paragraph, where readers will spend the most time", "In the conclusion, so readers will remember it"], 1, "تُذكر الأخبار الجيدة مبكرًا، غالبًا في الفقرة الافتتاحية، لتصل مباشرة إلى القارئ."],
          [2, "When you ______, you create a good image of yourself and your organization.", ["Save the reader’s time", "Build goodwill", "Make a message correct", "Make a message clear"], 1, "بناء goodwill يكوّن صورة إيجابية عن الكاتب ومؤسسته."],
          [15, "Why is the example “We’ll make every effort to ensure you get an appointment” not you-attitude?", ["It talks about the company", "It talks about the reader’s feelings", "It talks about the reader’s limitations", "It does not respect the readers"], 0, "الجملة تركز على ما ستفعله الشركة (“We’ll make every effort”) بدلًا من التركيز على ما يحتاجه القارئ أو سيحصل عليه."],
          [16, "When we have good news for the reader, we should put that information at the end of the message.", ["Yes", "No"], 1, "الأخبار الجيدة توضع عادة في بداية الرسالة، لا في نهايتها." ]
        ]
      },
      {
        chapter: 5,
        title: "Chapter 5: Positive Emphasis & Negative Messages",
        context: "Questions 5, 9, and 14 from Mid Skills 2020–2021 — positive emphasis and softening negative wording.",
        questions: [
          [5, "Which sentence creates positive emphasis?", ["Call Mercury whenever you need transistors.", "I look forward to receiving all of your future business.", "I hope that you are satisfied enough to place future orders.", "All of them"], 0, "الجملة الأولى تركز مباشرة على فائدة القارئ وما يمكنه فعله؛ الخياران الآخران يتمحوران حول المتحدث أو يضعفان الإيجابية."],
          [9, "To deemphasize a negative, put it in the ______ of a paragraph, and put the paragraph in the ______ of the message.", ["First, first", "First, last", "Last, middle", "Middle, middle"], 3, "يمكن تخفيف بروز المعلومة السلبية بوضعها في وسط الفقرة، والفقرة في وسط الرسالة."],
          [14, "Which of the following words is least negative?", ["Delay", "Cautions", "Wait", "Unsure"], 1, "كلمة Cautions (المقصود بها Cautious في صياغة السؤال المرجعي) ألطف من delay وwait وunsure." ]
        ]
      },
      {
        chapter: 9,
        title: "Chapter 9: Email Messages",
        context: "Questions 3, 7, 11, 17, and 19 from Mid Skills 2020–2021 — subject lines and To/Cc/Bcc fields.",
        questions: [
          [3, "Which of the following is a good subject line?", ["Questions About Expansion Performance Target Report Deadline Extension Request For Client Meeting", "For Your Review", "Expansion Report Extension Requested until Friday", "Important!"], 2, "العنوان الجيد محدد ويذكر الموضوع والإجراء أو الموعد المطلوب."],
          [7, "Bcc handles the largest number of recipients.", ["True", "False"], 0, "يُستخدم Bcc عادة عند إرسال الرسالة إلى قائمة كبيرة مع إخفاء عناوين المستلمين عن بعضهم."],
          [11, "You can’t write a separate email for each different idea, because email has extra cost for multiple messages.", ["Yes", "No"], 1, "يمكن إرسال رسائل منفصلة لأفكار مختلفة؛ لا توجد كلفة إضافية على الرسالة بالطريقة المذكورة."],
          [17, "Email messages are secure.", ["False", "True"], 0, "البريد الإلكتروني ليس قناة آمنة بالكامل، لذا لا ينبغي افتراض سرية الرسائل."],
          [19, "When you do not want everyone on the list to have each other’s addresses, use:", ["Bcc field", "To and Cc fields", "To field", "Cc field"], 0, "يخفي Bcc عناوين المستلمين عن بعضهم." ]
        ]
      }
    ];
    
    const examSections = questionGroups.map(group => ({
      title: group.title,
      context: group.context,
      subQuestions: group.questions.map(([number, text, opts, ans, exp]) => ({
        id: `mid2021_ch${group.chapter}_q${number}`,
        type: "single",
        text: `${number}. ${text}`,
        opts,
        ans,
        dispAnswer: `${String.fromCharCode(97 + ans)}) ${opts[ans]}`,
        exp
      }))
    }));

    let userScores = {};

    function initQuiz() {
      const driveBtn = document.getElementById('drive-link-btn');
      if (driveBtn) {
        if (originalDriveLink && originalDriveLink.trim() !== "") {
          driveBtn.href = originalDriveLink;
          driveBtn.style.display = "inline-flex";
        } else {
          driveBtn.style.display = "none";
        }
      }

      const list = document.getElementById('quiz-list');
      list.innerHTML = '';

      examSections.forEach((section) => {
        const card = document.createElement('div');
        card.className = 'q-card';

        let subQuestionsHtml = '';
        section.subQuestions.forEach((sub) => {
          const optsHtml = sub.opts.map((opt, i) => `
            <div class="option-item" id="opt-${sub.id}-${i}" onclick="selectSingleOption('${sub.id}', ${i})">
              <div class="opt-letter">${letters[i]}</div>
              <div>${opt}</div>
            </div>
          `).join('');

          const interactionHtml = `
            <div class="options-container" id="opts-box-${sub.id}">${optsHtml}</div>
            <div class="answer-input-row">
              <button class="btn-reset-q" id="reset-btn-${sub.id}" onclick="resetSubQuestion('${sub.id}')">إعادة السؤال ↻</button>
              <button class="btn-action" onclick="toggleSolution('${sub.id}')">
                <span>💡</span> عرض الحل
              </button>
            </div>
          `;

          subQuestionsHtml += `
            <div class="sub-question-card ltr-content" id="card-${sub.id}">
              <div class="sub-q-header">${sub.text}</div>
              ${interactionHtml}
              <div class="solution-box" id="sol-${sub.id}">
                <div><strong>الإجابة الصحيحة (Answer):</strong></div>
                <div style="margin-top: 6px; font-size: 0.98rem; font-weight: bold; line-height: 1.6; color: #5ac8fa; font-family: 'JetBrains Mono', monospace;">${sub.dispAnswer}</div>
                <div style="margin-top: 6px; font-size: 0.90rem; line-height: 1.6; color: var(--text-secondary); direction: rtl; text-align: right;">${sub.exp}</div>
              </div>
            </div>
          `;
        });

        card.innerHTML = `
          <div>
            <div class="parent-q-title">${section.title}</div>
            <div class="parent-q-desc">${section.context}</div>
          </div>
          <div class="sub-list">${subQuestionsHtml}</div>
        `;

        list.appendChild(card);
      });

      calculateScore();
      setupReportModal();
    }

    function findSubQuestion(subId) {
      for (const sec of examSections) {
        const found = sec.subQuestions.find(s => s.id === subId);
        if (found) return found;
      }
      return null;
    }

    function selectSingleOption(subId, optIdx) {
      const sub = findSubQuestion(subId);
      const optsBox = document.getElementById(`opts-box-${subId}`);
      const resetBtn = document.getElementById(`reset-btn-${subId}`);
      if (!sub || !optsBox) return;

      optsBox.classList.add('locked');

      const picked = document.getElementById(`opt-${subId}-${optIdx}`);
      if (optIdx === sub.ans) {
        if (picked) picked.classList.add('correct');
        userScores[subId] = true;
      } else {
        if (picked) picked.classList.add('wrong');
        delete userScores[subId];
      }

      if (resetBtn) resetBtn.style.display = 'inline-flex';
      calculateScore();
    }

    function resetSubQuestion(subId) {
      delete userScores[subId];

      const optsBox = document.getElementById(`opts-box-${subId}`);
      if (optsBox) optsBox.classList.remove('locked');

      const sub = findSubQuestion(subId);
      if (sub && sub.opts) {
        sub.opts.forEach((_, i) => {
          const el = document.getElementById(`opt-${subId}-${i}`);
          if (el) el.className = 'option-item';
        });
      }

      const resetBtn = document.getElementById(`reset-btn-${subId}`);
      const sol = document.getElementById(`sol-${subId}`);

      if (resetBtn) resetBtn.style.display = 'none';
      if (sol) sol.classList.remove('show');

      calculateScore();
    }

    function calculateScore() {
      let total = 0;
      let score = 0;
      examSections.forEach(sec => {
        sec.subQuestions.forEach(sub => {
          total++;
          if (userScores[sub.id]) score++;
        });
      });

      const pct = total > 0 ? Math.round((score / total) * 100) : 0;
      const scoreEl = document.getElementById('score');
      if (scoreEl) {
        scoreEl.innerText = `${score} / ${total} (${pct}%)`;
      }
    }

    function toggleSolution(subId) {
      const sol = document.getElementById(`sol-${subId}`);
      if (sol) sol.classList.toggle('show');
    }

    let allShown = false;
    function toggleAllSolutions() {
      allShown = !allShown;
      examSections.forEach(sec => {
        sec.subQuestions.forEach(sub => {
          const sol = document.getElementById(`sol-${sub.id}`);
          if (sol) {
            if (allShown) sol.classList.add('show');
            else sol.classList.remove('show');
          }
        });
      });
    }

    function resetQuiz() {
      userScores = {};
      initQuiz();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function setupReportModal() {
      const openBtn = document.getElementById('openReportBtn');
      const closeBtn = document.getElementById('closeReportBtn');
      const overlay = document.getElementById('reportOverlay');
      const form = document.getElementById('bugReportForm');
      const status = document.getElementById('reportStatus');

      if (!openBtn || !overlay) return;

      openBtn.onclick = () => {
        overlay.classList.add('active');
        overlay.setAttribute('aria-hidden', 'false');
      };

      const closeModal = () => {
        overlay.classList.remove('active');
        overlay.setAttribute('aria-hidden', 'true');
        if (status) status.innerText = '';
      };

      if (closeBtn) closeBtn.onclick = closeModal;

      overlay.onclick = (e) => {
        if (e.target === overlay) closeModal();
      };

      if (form) {
        form.onsubmit = (e) => {
          e.preventDefault();
          const submitBtn = document.getElementById('submitReportBtn');
          if (submitBtn) submitBtn.disabled = true;
          if (status) {
            status.style.color = '#30d158';
            status.innerText = 'تم إرسال البلاغ بنجاح، شكراً لمساعدتك!';
          }
          setTimeout(() => {
            closeModal();
            form.reset();
            if (submitBtn) submitBtn.disabled = false;
          }, 1500);
        };
      }
    }

    initQuiz();
  </script>
  <script src="../transition.js"></script>
</body>
</html>
