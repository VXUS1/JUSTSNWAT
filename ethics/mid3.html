  <style>
    .bottom-nav-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      margin-top: 36px;
      padding-top: 24px;
      border-top: 1px solid var(--apple-border);
    }
    .btn-bottom-action {
      background: var(--apple-surface);
      border: 1px solid var(--apple-border-strong);
      color: var(--text-primary);
      padding: 12px 26px;
      border-radius: 99px;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.95rem;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      backdrop-filter: blur(20px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      transition: all 0.25s var(--ease-apple);
    }
    .btn-bottom-action:hover {
      background: var(--apple-surface-hover);
      border-color: rgba(255, 255, 255, 0.25);
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
    }
    .btn-bottom-action:active {
      transform: scale(0.96);
    }
    .btn-drive-action {
      background: linear-gradient(135deg, rgba(10, 132, 255, 0.15) 0%, rgba(48, 209, 88, 0.15) 100%);
      border-color: rgba(10, 132, 255, 0.4);
      color: #5ac8fa;
    }
    .btn-drive-action:hover {
      background: var(--apple-blue);
      color: #ffffff;
      border-color: var(--apple-blue);
    }

    .ltr-content {
      direction: ltr;
      text-align: left;
    }

    .sub-q-header {
      font-weight: 700;
      font-size: 1.05rem;
      margin-bottom: 14px;
      color: var(--text-primary);
      line-height: 1.7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .options-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin: 14px 0;
    }
    .options-container.locked {
      pointer-events: none;
    }

    .option-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 16px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--apple-border);
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
      user-select: none;
      font-size: 0.98rem;
    }
    .option-item:hover {
      background: rgba(255, 255, 255, 0.08);
    }
    .option-item.selected {
      border-color: var(--apple-blue);
      background: rgba(10, 132, 255, 0.12);
    }
    .option-item.correct {
      background: rgba(48, 209, 88, 0.18) !important;
      border-color: #30d158 !important;
      color: #fff;
    }
    .option-item.wrong {
      background: rgba(255, 69, 58, 0.18) !important;
      border-color: #ff453a !important;
      color: #fff;
    }
    .opt-letter {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 0.85rem;
      flex-shrink: 0;
      font-family: 'JetBrains Mono', Consolas, monospace;
    }

    .answer-input-row {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    .btn-reset-q {
      display: none;
      background: rgba(255, 69, 58, 0.15);
      color: #ff453a;
      border: 1px solid rgba(255, 69, 58, 0.4);
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.85rem;
      transition: all 0.2s;
    }
    .btn-reset-q:hover {
      background: #ff453a;
      color: #fff;
    }
    .solution-box {
      display: none;
      margin-top: 14px;
      padding: 14px 16px;
      background: rgba(10, 132, 255, 0.08);
      border: 1px solid rgba(10, 132, 255, 0.25);
      border-radius: 10px;
    }
    .solution-box.show {
      display: block;
    }
  </style>
</head>

  <script>
    const originalDriveLink = "";

    const letters = ['A', 'B', 'C', 'D', 'E'];

    const rawQuestions = [
    [
        1,
        "What is wrong in this e-mail?<div style='margin-top: 8px; padding: 10px 14px; background: rgba(255,255,255,0.04); border: 1px solid var(--apple-border); border-radius: 8px; font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif; font-size: 0.95rem; line-height: 1.6;'><div style='color: var(--apple-blue); font-weight: 600; margin-bottom: 4px;'>staff@overlookinn.com</div><div style='font-weight: 700; margin-bottom: 8px;'>Help</div><div>so I was reeling in a thirty-pound bass on Saturrday and suddenly I remembered I wasn't going to be in the ofice on Tewsday. Your mind becomes clear when you spend the day on the b eautiful open water!<br><br>Anyway, once I pulled back up to shore, I realized I needed to change the schedules. Instead of coming in on Tewsday, I'll be gone, and I'll neeed either Nick or Mike to cover for me. You guys can do that, right? Of course you can. Well, I've got to go to the store to get another fishin pole because that bass swam away with my old one.<br><br>Thanks,<br>Jeff<br>Phone: 910-555-4641</div></div>",
        [
            "The subject line is vague.",
            "The main point is difficult to find.",
            "The body is full of spelling errors.",
            "All of the above."
        ],
        3,
        "العنوان مبهم (Help)، الفكرة ضائعة وسط تفاصيل الصيد، ويوجد أخطاء إملائية كثيرة."
    ],
    [
        2,
        "one of these make you-attitude is better for this example: \"We provide health insurance to all employees\"",
        [
            "You receive health insurance as a full-time employee.",
            "We are happy to provide health insurance to all employees.",
            "A+B",
            "None of these"
        ],
        0,
        "أسلوب You-attitude يركز على المستلم ومصلحته بدلاً من التركيز على الشركة أو مشاعر الكاتب."
    ],
    [
        3,
        "To deemphasize a negative, put it in the ______ of a paragraph, and put the paragraph in the ______ of the message.",
        [
            "Middle, middle.",
            "First, last.",
            "First, first.",
            "Last, middle."
        ],
        0,
        "تخفف السلبية بوضعها في وسط الفقرة، والفقرة في وسط الرسالة."
    ],
    [
        4,
        "One of the following is not message audience:",
        [
            "A watchdog audience.",

            "A secondary audience.",
            "A gatekeeper."

        "أنواع الجمهور الخمسة: Gatekeeper, Primary, Secondary, Auxiliary, Watchdog (لا يوجد Public audience)."
    ],
    [
        5,
        "Make sure to answer a PAIBOC questions, before you begin composing your message.",
        [
            "Yes",
            "No"
        ],
        0,
        "يجب الإجابة على أسئلة نموذج PAIBOC قبل الشروع في كتابة الرسالة."
    ],
    [
        6,
        "Which of the following is a negative subject line?",
        [
            "\"Change in Personal Leave Policy\"",
            "\"Results of Customer Service Survey\"",
            "\"Improving On-Time Performance\"",
            "\"Reduction of Travel Benefits\""
        ],

        "عنوان 'Reduction of Travel Benefits' يحمل معنى سلبياً صريحاً بتقليص المنافع."
    ],
    [

        ],
        0,
        "لا تعتذر إذا لم تكن مسؤولاً عن الخطأ تجنباً للتبعات القانونية والمهنية."
    ],
    [

    ],

        9,
        "The you-attitude is a style of communication that:",

    ],

        [

        3,
        "العنوان الجيد محدد وموجز ويوضح الموضوع والموعد المطلوب."
    ],
    [

        "One of these choices are not suitable to use Negatives:",

        ],
        2,
        "تجاهل المشكلة ليس من أسباب استخدام الكلمات السلبية."
    ],
    [
        15,
        "Which of the following is an example of nonverbal communication?",
        [
            "A phone call from an attorney to a client.",
            "An e-mail message reminding employees of an upcoming staff meeting",
            "A company logo designed to project the organization's image.",
            "An online blog where employees in different cities can share ideas."
        ],
        2,
        "الشعار (Logo) وسيلة اتصال بصرية رمزية تنقل قيم وهوية الشركة دون كلمات."
    ],
    [
        16,
        "In PAIBOC the letter B refers to:",
        [
            "Business.",
            "Benefits.",
            "Buildings.",
            "Background."
        ],
        1,
        "حرف B يرمز إلى منافع ومزايا القارئ (Reader Benefits)."
    ],
    [
        17,
        "Make sure to use 'you' in negative situations.",
        [
            "False",
            "True"
        ],
        0,
        "في المواقف السلبية يجب تجنب 'you' لتفادي توجيه اللوم المباشر للقارئ."
    ],
    [
        18,
        "In Communication Process, a person must first perceive a stimulus and then interpret what has been perceived.",
        [
            "Yes",
            "No"
        ],
        0,
        "تبدأ عملية الاتصال بإدراك واستشعار المنبه (Perceive) ثم تفسيره (Interpret)."
    ],
    [
        19,
        "“We are happy to inform you that you have been chosen to receive a Platinum VISA”. Does this sentence have good you-attitude?",
        [

            "No, since the sentence does not begin with “you”.",

        ],

        "عبارة We are happy تركز على مشاعر الكاتب التي لا تعني القارئ."
    ],
    [

        "Which of audience may be asked to comment on your message or to implement your ideas after they've been approved.",

        ],
        3,
        "الجمهور الثانوي هم من يُطلب منهم إبداء الرأي أو تنفيذ التوصيات بعد اعتمادها."
    ],
    [

        "When you do not want everyone on the list to have each other's addresses you can use:",
        [
            "To and Cc fields.",
            "Bcc field.",
            "To field.",
            "Cc field."

        1,
        "حقل Bcc يخفي عناوين المستلمين عن بعضهم البعض للحفاظ على الخصوصية."
    ],
    [
        22,
        "One of the following is an example of Demographic Factors:",
        [

            "Interest.",
            "Lifestyle.",
            "Income."
        ],

    [
        23,
        "Where in a message should good news appear?",
        [

    ],
    [

        "When you send an Email, recipients usually omit the subject line and read the body directly, then either forward, file or delete the message.",

    const questions = rawQuestions.map(([number, text, opts, ans, exp]) => ({
      id: `q${number}`,
      number,
      text: `${number}. ${text}`,
      opts,
      ans,
      dispAnswer: `${String.fromCharCode(97 + ans)}) ${opts[ans]}`,
      exp
    }));

    let userScores = {};

    function initQuiz() {
      const driveBtn = document.getElementById('drive-link-btn');
      if (driveBtn) {
        if (originalDriveLink && originalDriveLink.trim() !== "") {
          driveBtn.href = originalDriveLink;
          driveBtn.style.display = "inline-flex";
        } else {
          driveBtn.style.display = "none";
        }
      }

      const list = document.getElementById('quiz-list');
      list.innerHTML = '';

      questions.forEach((q) => {
        const card = document.createElement('div');
        card.className = 'q-card ltr-content';
        card.id = `card-${q.id}`;

        const optsHtml = q.opts.map((opt, i) => `
          <div class="option-item" id="opt-${q.id}-${i}" onclick="selectSingleOption('${q.id}', ${i})">
            <div class="opt-letter">${letters[i]}</div>
            <div>${opt}</div>
          </div>
        `).join('');

        const interactionHtml = `
          <div class="options-container" id="opts-box-${q.id}">${optsHtml}</div>
          <div class="answer-input-row">
            <button class="btn-reset-q" id="reset-btn-${q.id}" onclick="resetSubQuestion('${q.id}')">إعادة السؤال ↻</button>
            <button class="btn-action" onclick="toggleSolution('${q.id}')">
              <span>💡</span> عرض الحل
            </button>
          </div>
        `;

        card.innerHTML = `
          <div class="sub-q-header">${q.text}</div>
          ${interactionHtml}
          <div class="solution-box" id="sol-${q.id}">
            <div><strong>الإجابة الصحيحة (Answer):</strong></div>
            <div style="margin-top: 6px; font-size: 0.98rem; font-weight: bold; line-height: 1.6; color: #5ac8fa; font-family: 'JetBrains Mono', monospace;">${q.dispAnswer}</div>
            <div style="margin-top: 6px; font-size: 0.90rem; line-height: 1.6; color: var(--text-secondary); direction: rtl; text-align: right;">${q.exp}</div>
          </div>
        `;

        list.appendChild(card);
      });

      calculateScore();
      setupReportModal();
    }

    function findQuestion(subId) {
      return questions.find(q => q.id === subId) || null;
    }

    function selectSingleOption(subId, optIdx) {
      const q = findQuestion(subId);
      const optsBox = document.getElementById(`opts-box-${subId}`);
      const resetBtn = document.getElementById(`reset-btn-${subId}`);
      if (!q || !optsBox) return;

      optsBox.classList.add('locked');

      const picked = document.getElementById(`opt-${subId}-${optIdx}`);
      if (optIdx === q.ans) {
        if (picked) picked.classList.add('correct');
        userScores[subId] = true;
      } else {
        if (picked) picked.classList.add('wrong');
        const correctOpt = document.getElementById(`opt-${subId}-${q.ans}`);
        if (correctOpt) correctOpt.classList.add('correct');
        delete userScores[subId];
      }

      if (resetBtn) resetBtn.style.display = 'inline-flex';
      calculateScore();
    }

    function resetSubQuestion(subId) {
      delete userScores[subId];

      const optsBox = document.getElementById(`opts-box-${subId}`);
      if (optsBox) optsBox.classList.remove('locked');

      const q = findQuestion(subId);
      if (q && q.opts) {
        q.opts.forEach((_, i) => {
          const el = document.getElementById(`opt-${subId}-${i}`);
          if (el) el.className = 'option-item';
        });
      }

      const resetBtn = document.getElementById(`reset-btn-${subId}`);
      const sol = document.getElementById(`sol-${subId}`);

      if (resetBtn) resetBtn.style.display = 'none';
      if (sol) sol.classList.remove('show');

      calculateScore();
    }

    function calculateScore() {
      const total = questions.length;
      let score = 0;
      questions.forEach(q => {
        if (userScores[q.id]) score++;
      });

      const pct = total > 0 ? Math.round((score / total) * 100) : 0;
      const scoreEl = document.getElementById('score');
      if (scoreEl) {
        scoreEl.innerText = `${score} / ${total} (${pct}%)`;
      }
    }

    function toggleSolution(subId) {
      const sol = document.getElementById(`sol-${subId}`);
      if (sol) sol.classList.toggle('show');
    }

    let allShown = false;
    function toggleAllSolutions() {
      allShown = !allShown;
      questions.forEach(q => {
        const sol = document.getElementById(`sol-${q.id}`);
        if (sol) {
          if (allShown) sol.classList.add('show');
          else sol.classList.remove('show');
        }
      });
    }

    function resetQuiz() {
      userScores = {};
      initQuiz();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function setupReportModal() {
      const openBtn = document.getElementById('openReportBtn');
      const closeBtn = document.getElementById('closeReportBtn');
      const overlay = document.getElementById('reportOverlay');
      const form = document.getElementById('bugReportForm');
      const status = document.getElementById('reportStatus');

      if (!openBtn || !overlay) return;

      openBtn.onclick = () => {
        overlay.classList.add('active');
        overlay.setAttribute('aria-hidden', 'false');
      };

      const closeModal = () => {
        overlay.classList.remove('active');
        overlay.setAttribute('aria-hidden', 'true');
        if (status) status.innerText = '';
      };

      if (closeBtn) closeBtn.onclick = closeModal;

      overlay.onclick = (e) => {
        if (e.target === overlay) closeModal();
      };

      if (form) {
        form.onsubmit = (e) => {
          e.preventDefault();
          const submitBtn = document.getElementById('submitReportBtn');
          if (submitBtn) submitBtn.disabled = true;
          if (status) {
            status.style.color = '#30d158';
            status.innerText = 'تم إرسال البلاغ بنجاح، شكراً لمساعدتك!';
          }
          setTimeout(() => {
            closeModal();
            form.reset();
            if (submitBtn) submitBtn.disabled = false;
          }, 1500);
        };
      }
    }

    initQuiz();
  </script>
  <script src="../transition.js"></script>
</body>
</html>
